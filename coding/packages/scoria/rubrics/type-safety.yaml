# The part of the type-safety dimension (spec §11) that Tier 0 can reach.
#
# Counting type errors with tsc is Tier 1 because it needs a build, so it is not here yet.
# What this measures is only whether the code is subject to the type checker at all.
id: type-safety
status: experimental

metrics:
  # A file left as .js skips the type checker at file granularity.
  # Weighted by lines so that a handful of small config files does not dominate the score.
  - metric: source-mix.untyped_sloc_ratio
    scale: { good: 0, bad: 0.5 }
    weight: 0.3

  - metric: source-mix.untyped_file_ratio
    scale: { good: 0, bad: 0.5 }
    weight: 0.2

  # Errors from the project's own tsc, which is the only check that means anything about its types.
  # Tier 1: skipped, not zero, where the project is not installed.
  - metric: tsc.type_errors_per_kloc
    density: true
    scale: { good: 0, bad: 2 }
    weight: 0.5

confidence_from:
  - suppression-scan.source_count
