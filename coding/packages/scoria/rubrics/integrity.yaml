# spec §15. Suppression debt as a dimension of its own.
#
# Source and test are separated on evidence: of graphai's 94 `as any` occurrences, 69 were in
# test files, where mocking makes them legitimate. So source density is the primary signal and
# test carries only a small weight.
id: integrity
status: experimental

metrics:
  - metric: suppression-scan.source_per_kloc
    scale: { good: 0, bad: 5 }
    weight: 0.5

  # A suppression is not wrong in itself; an unexplained one is (spec §15.3).
  - metric: suppression-scan.unreasoned_ratio
    scale: { good: 0, bad: 1 }
    weight: 0.3

  - metric: suppression-scan.test_count
    scale: { good: 0, bad: 200 }
    weight: 0.2

# Integrity's own confidence does not depend on another dimension (spec §21.1 shows it as "—").
confidence_from: []
