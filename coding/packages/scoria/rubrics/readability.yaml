# spec §16.1. Every scale here is provisional, so the status is experimental.
#
# sloc_p95 good: 150 is the value from the spec, kept verbatim. Measured on maintained
# repositories the p95 was 261 (graphai) and 331 (mulmoterminal), which score 72-83 against this
# scale. Whether to loosen it toward the measurement is an open calibration question; the spec
# stays the single source of truth until it is settled.
id: readability
status: experimental

metrics:
  - metric: file-shape.sloc_p95
    scale: { good: 150, bad: 800 }
    weight: 0.5

  - metric: file-shape.max_file_sloc
    scale: { good: 300, bad: 2000 }
    weight: 0.3

  - metric: file-shape.god_file_count
    scale: { good: 0, bad: 20 }
    weight: 0.2

# Where suppressions are dense, readability is not high — it is unmeasured (spec §15.4).
confidence_from:
  - suppression-scan.source_count
