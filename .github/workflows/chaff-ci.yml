# chaff（text/）のゲート。scoria-ci.yml と同じ形で、対象ディレクトリだけが違う。
# paths で切っているので、coding/ だけを触る PR では走らない。
name: chaff ci

on:
  pull_request:
    paths: ["text/**", ".github/workflows/chaff-ci.yml"]
  push:
    branches: [main]
    paths: ["text/**", ".github/workflows/chaff-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: text

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: yarn install --frozen-lockfile

      - name: format:check
        run: yarn format:check

      - name: lint
        run: yarn lint

      - name: typecheck
        run: yarn typecheck

      - name: build
        run: yarn build

      - name: test
        run: yarn test

      # 公開版ではなく、いま review 中のコミットから作った dist で走らせる。
      # 自分の仕様書を自分で読ませる。動かなくなったらここで落ちる。
      - name: chaff on its own spec
        run: node packages/chaff/bin/chaff.js chaff-spec.md

      # 実際に公開した記事と社内文書にかける。作り物では通るのに実文書で壊れる、
      # という状態に気づくため。指摘の数は文章の好みの問題なので落とさない。
      # 最後まで動かなかったときだけ落とす。
      - name: chaff on real documents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          yarn --silent example > examples-report.txt 2>&1 || true
          cat examples-report.txt
          if ! grep -q 'ファイルを見て' examples-report.txt; then
            echo "::error::chaff が実文書で最後まで動きませんでした"
            exit 1
          fi
          {
            echo '## chaff on real documents'
            echo
            echo '```'
            cat examples-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
