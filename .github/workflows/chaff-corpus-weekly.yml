# 週に一度、URL で持っている文書をすべて取り直して、二つを見る。
# - 再配布できない文書（URL だけを持つもの）は、PR の CI では取得しない。取得先が落ちていると PR が赤くなるから。
#   ここで取得して corpus/expected.txt と比べ、rule の変更で結果が変わったのに expected が古いまま、を放っておかない。
# - コミット済みの文書は一時ディレクトリに取り直して、コミットした写しと比べる。上流が変わった・URL が死んだ、に気づくため。
#   写しは書き換えない。
# 取得は一時的な失敗（5xx、接続の timeout など）なら間を広げて取り直し、それでも取れなければ失敗として数える。
# 同じ取得先へは間を空けて頼み、接続の timeout は undici の既定より長くする。
# 失敗・上流の変化・結果の変化のどれかがあれば job を落とし、issue を立てる（既にあればコメントを足す）。
# 判定は scripts/corpus-health.ts（純粋な部分は scripts/corpus-health-report.ts）。手元でも yarn corpus:health で同じことができる。
name: chaff corpus (URL documents, weekly)

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: text

jobs:
  # 取得と判定。外から取ってきた文書を読む job なので、token は読み取りだけ。
  corpus:
    runs-on: ubuntu-latest
    # 取り直しの待ちが長いので余裕を持たせる。取り直しても落ちる取得先が続けば、以降は一度だけ試す（scripts/fetch-pacing.ts）。
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      status: ${{ steps.health.outputs.status }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - name: refetch URL documents and compare
        id: health
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # shell: bash は -e で走る。exit 1 で止まらずに status を残すため || で受ける。
          status=0
          yarn --silent corpus:health --report issue-body.md || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: failure() && steps.health.outputs.status == '1'
        with:
          name: issue-body
          path: text/issue-body.md
          retention-days: 7

  # issue を書くのはこの job だけ。判定の job が「見てほしいものがある」(exit 1) で落ちたときに走る。
  report:
    needs: corpus
    if: failure() && needs.corpus.outputs.status == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: issue-body
          path: text

      - name: open or update an issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="chaff corpus: weekly check found fetch failures, upstream changes or drifted results"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md
          fi
