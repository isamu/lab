# chaff のドキュメントサイト（text/site）。ルールの一覧は packages/chaff/rules から、例の出力は chaff を動かして作るので、chaff が変わっても走らせる。
name: chaff site

on:
  pull_request:
    paths: ["text/site/**", "text/packages/**", "text/scripts/rule-examples.ts", "text/scripts/guide-screens.ts", "text/scripts/guide-screens-parse.ts", "text/test/cli-run.ts", ".github/workflows/chaff-site.yml"]
  push:
    branches: [main]
    paths: ["text/site/**", "text/packages/**", "text/scripts/rule-examples.ts", "text/scripts/guide-screens.ts", "text/scripts/guide-screens-parse.ts", "text/test/cli-run.ts", ".github/workflows/chaff-site.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: text/site

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The rule reference is read with chaff's own loader (packages/chaff/src/rule-load.ts), which needs chaff's dependencies.
      - name: install chaff
        working-directory: text
        run: yarn install --frozen-lockfile

      # The reference's examples are run through chaff's command line (yarn examples), which loads the built language packages.
      - name: build chaff
        working-directory: text
        run: yarn build

      - run: yarn install --frozen-lockfile

      - name: format:check
        run: yarn format:check

      - name: typecheck
        run: yarn typecheck

      - name: build
        run: yarn build
