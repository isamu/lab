name: scoria ci

on:
  pull_request:
    paths: ["coding/**", ".github/workflows/scoria-ci.yml"]
  push:
    branches: [main]
    paths: ["coding/**", ".github/workflows/scoria-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: coding

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: yarn install --frozen-lockfile

      - name: format:check
        run: yarn format:check

      - name: lint
        run: yarn lint

      - name: typecheck
        run: yarn typecheck

      - name: build
        run: yarn build

      - name: test
        run: yarn test

      # scoria measures itself. What it asks of other repositories applies to its own code, and
      # the run uses the dist built from the commit under review rather than the published version.
      #
      # The config and baseline are committed, so this reports what moved rather than a bare score,
      # and writes the table into the run's job summary. It never fails the build.
      - name: scoria on itself
        run: node packages/scoria/bin/scoria.js .
