# Measures the whole repository with scoria — both workspaces, on every change.
#
# Separate from scoria-ci.yml, which tests scoria itself and only runs when coding/ changes. This
# one has no paths filter: a change anywhere can move the numbers, and a quality report that only
# appears for some changes is one nobody learns to expect.
#
# Each workspace is measured on its own rather than the repository root, because knip and tsc need
# a package to resolve against. Measuring from the root loses two of the five dimensions.
name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Uploading SARIF puts each finding on the Security tab and inline on a pull request's changed
  # lines, which is where the person who wrote the line is already looking.
  security-events: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: install coding
        run: yarn install --frozen-lockfile
        working-directory: coding

      - name: install text
        run: yarn install --frozen-lockfile
        working-directory: text

      # Built from the commit under review, never the published version.
      - name: build scoria
        run: yarn build
        working-directory: coding

      # The byte count is printed inside the same step on purpose: GITHUB_STEP_SUMMARY is a
      # per-step file, so checking it from a later step measures that step's own empty one. The
      # summary renders on the run page and no API exposes it, so without this a run that wrote
      # nothing would look identical to one that worked.
      # scoria reads a coverage report; it never runs the tests itself. Without this step the
      # test-coverage dimension rests on test-presence alone and says so.
      - name: coverage for coding
        run: mkdir -p coverage && yarn test:coverage
        working-directory: coding

      - name: measure coding
        run: |
          node packages/scoria/bin/scoria.js . --sarif ../scoria-coding.sarif --badge-json ../scoria-coding.json
          echo "summary bytes: $(wc -c < "$GITHUB_STEP_SUMMARY")"
        working-directory: coding

      - name: measure text
        run: |
          node ../coding/packages/scoria/bin/scoria.js . --sarif ../scoria-text.sarif --badge-json ../scoria-text.json
          echo "summary bytes: $(wc -c < "$GITHUB_STEP_SUMMARY")"
        working-directory: text

      # Each upload needs its own category, or the second replaces the first. checkout_path tells
      # GitHub which directory the paths in the file are relative to.
      - name: upload coding findings
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scoria-coding.sarif
          category: scoria-coding
          checkout_path: ${{ github.workspace }}/coding

      - name: upload text findings
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scoria-text.sarif
          category: scoria-text
          checkout_path: ${{ github.workspace }}/text

      - uses: actions/upload-artifact@v7
        with:
          name: scoria-badges
          path: |
            scoria-coding.json
            scoria-text.json

  # A separate job so `contents: write` is never held while the measurement itself runs, and never
  # on a pull request. The badges branch is orphaned: it carries two files and none of the history.
  badge:
    needs: measure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: scoria-badges
          path: badges

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: repo

      # The token goes in the push URL rather than into the checkout's git config, so no later step
      # inherits the ability to write to the repository.
      - name: publish the badge endpoints
        working-directory: repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan branch has no ref until its first commit, so it cannot be switched to by
          # name — only the fetched case needs the second switch. A refspec whose source does not
          # exist is also noisy on stderr, and means only "first run".
          if git fetch origin badges:badges 2>/dev/null; then
            git switch badges
          else
            git switch --orphan badges
          fi
          cp ../badges/scoria-coding.json ../badges/scoria-text.json .
          git add scoria-coding.json scoria-text.json
          if git diff --cached --quiet; then
            echo "badges unchanged"
            exit 0
          fi
          git commit -m "chore: scoria badges for ${GITHUB_SHA}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
