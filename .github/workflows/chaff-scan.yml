# 落とさない検査。未使用の export とコピペを、job summary と Code Scanning に出すだけ。
#
# 落とさない理由は ever-better と同じ。knip も jscpd も「この PR が何を増やしたか」を
# 言えない。base との差分を持たない検査をゲートにすると、最初の誤検知で全員が
# ignore コメントに手を伸ばすようになる。
name: chaff scan

on:
  pull_request:
    paths: ["text/**", ".github/workflows/chaff-scan.yml"]
  push:
    branches: [main]
    paths: ["text/**", ".github/workflows/chaff-scan.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: text

jobs:
  dead-code:
    name: Dead Code Scan (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: yarn install --frozen-lockfile

      # knip exits non-zero when it finds something, and this step reports rather than gates — so
      # the exit code is captured and shown, not discarded. A step that hides whether its tool ran
      # at all cannot be told from one whose tool found nothing.
      - name: Run knip
        run: |
          set -uo pipefail
          report=$(yarn --silent knip; echo "exit:$?")
          status=${report##*exit:}
          {
            echo '## knip (chaff)'
            echo
            echo '```'
            echo "${report%exit:*}"
            echo '```'
            echo
            echo "knip exited ${status}."
          } >> "$GITHUB_STEP_SUMMARY"

  duplication:
    name: Duplication Scan (jscpd)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF の upload に要る
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run jscpd
        run: |
          set -euo pipefail
          npx --yes jscpd@4 . \
            --format "typescript,javascript" \
            --ignore "**/node_modules/**,**/dist/**,**/*.d.ts" \
            --reporters console,sarif \
            --output report

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          # scoria 側と同じ category にすると互いの結果を上書きする。
          sarif_file: text/report/jscpd-sarif.json
          category: jscpd-chaff

  prose:
    name: Prose Scan (chaff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF の upload に要る
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: yarn install --frozen-lockfile

      - run: yarn build

      # 指摘の数では落とさない。文章の好みの問題なので。
      # 落ちるのは chaff が最後まで動かなかったとき（SARIF を書かずに終わったとき）だけ。
      # chaff は error の指摘でも 1 で終わるので、終了コードは捨てずに表示し、判定は SARIF で行う。
      #
      # 見るのはこの repo の文書だけ。examples/ と test/fixtures/ は検査にかける入力で、誤りをわざと
      # 含む（examples/ は chaff-ci.yml で毎回かけている）。既にあった指摘は .chaff-baseline.json に
      # 棚上げしてあり、新しく増えたものだけが出る。対象を変えたら同じ対象で baseline を取り直す:
      #   node packages/chaff/bin/chaff.js baseline "*.md" docs packages samples site/src/content
      - name: Run chaff on its own documents
        run: |
          set -uo pipefail
          status=0
          node packages/chaff/bin/chaff.js "*.md" docs packages samples site/src/content --compact --sarif report/chaff.sarif || status=$?
          echo "chaff exited ${status}."
          if [ ! -s report/chaff.sarif ]; then
            echo "::error::chaff exited ${status} without writing report/chaff.sarif"
            exit 1
          fi

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: text/report/chaff.sarif
          category: chaff-prose
