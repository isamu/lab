# chaff.yaml — how we want our writing checked
#
# ここに書くのは「既定から変えたもの」だけです。書かなければ既定で動きます。
# 空でも、このファイルが無くても chaff は動きます。
#
# 値は 4 つの言葉から選びます。数字を書く必要はありません。
#
#   strict    きびしく見る
#   normal    ふつう（既定）
#   relaxed   ゆるく見る
#   off       見ない
#
# コマンドでも変更できます。理由がコメントとして自動で残ります。
#
#   npx chaff relax bold-density --why "図の説明で太字を多用するため"
#   npx chaff off ai-tell --why "執筆者が全員人間のため"
#
# すでに理由が付いているものを変えるときは --why が必須です。
# 古い理由が新しい値に残ると、履歴が嘘になるためです。
#
# 試験中（experimental）の rule も、ここに書けば動きます。
# 名指しで有効にしたものを、試験中を理由に黙って無効にはしません。

$schema: https://chaff.dev/schema/v1.json

# この場所に置く文書の種類。パスごとに変えたい場合は by_path を使う。
genre: blog/tech

rules:
  # 太字の使いすぎ
  # 太字は読者の目を止める道具です。多用すると、どこも目立たなくなります。
  bold-density: relaxed      # 2026-09-11 図の説明で太字を多用するため / @isamu

  # AI が書いた文章によく出る言い回し
  # 人間も普通に使う表現なので、既定では弱い指摘です。
  ai-tell: off               # 2026-09-11 執筆者が全員人間のため / @isamu
