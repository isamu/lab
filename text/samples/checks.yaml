# checks.yaml — checks we added ourselves
#
# キーは英語、中身は自分の言葉で書きます。プログラムは書きません。
# chaff が文章を読んで判定します。
#
#   name         このチェックの名前
#   use_for      どの文書に使うか
#   check        見てほしいこと。ふつうの文で書く
#   look_at      文書のどこを見るか（書かないと全文を読むので遅くなります）
#   level        strict = error / normal = warning / relaxed = info
#   how_to_fix   引っかかった人に見せる直しかた
#
# 動かすには API key が要ります。無い場合はここだけ飛ばして、
# ほかの検査は普通に動きます。
#
#   npx chaff test docs/
#   npx chaff checks add        対話で 1 つ足す

checks:

  - name: 提案書にリスクが書かれている
    use_for: business/proposal
    check: |
      提案をしている文書に、次のどれかが書かれていること。
        ・その施策のリスク
        ・想定される副作用
        ・実施しなかった場合の影響
      いまの課題の説明は、リスクとしては数えない。
    level: normal
    how_to_fix: 「リスク」または「懸念」の節を足してください。

  - name: 数字には根拠がある
    use_for: business
    check: |
      効果を主張する数値（%、倍、件数、金額）について、
      算出根拠・対象期間・比較対象のいずれかが本文にあること。
    look_at: 数値と「向上」「削減」「改善」などの語が同じ文にあるところ
    level: normal
    how_to_fix: 「(2026年4-6月、対前年同期、n=120)」のように括弧で添えてください。

  - name: 依頼には期限と担当がある
    use_for: business
    check: |
      相手に何かを依頼している文について、
      誰がやるのかと、いつまでかが、その前後 2 文以内に分かること。
    look_at: 「お願いします」「ご確認ください」「ご対応ください」を含む文
    level: normal
    how_to_fix: 「◯◯さんに、11/14 までに」のように、人と日付を書いてください。

  - name: 議事録に決定事項がある
    use_for: business/meeting-notes
    check: |
      議事録に、その場で決まったことが書かれていること。
      「検討した」「共有した」だけで、決まったことが無い場合は指摘する。
      何も決まらなかったこと自体が明記されている場合は、問題ない。
    level: strict
    how_to_fix: 「決定事項」の節を足してください。決まらなかったならそう書いてください。

  - name: 社外向けに内輪の前提を持ち込んでいない
    use_for: business/press-release
    check: |
      社外の読者が、社内の事情を知らなくても読めること。
      説明なしの社内プロジェクト名、部署の略称、過去の経緯への言及を指摘する。
    level: normal
    how_to_fix: 初出で一度だけ説明を添えるか、言及ごと落としてください。
