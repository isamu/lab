# chaff.yaml — このチームの文章規範
#
# ここに書くのは「既定から変えたもの」だけです。書かなければ既定で動きます。
# このファイルを消しても chaff は動きます。
#
# 値は 4 つの言葉から選びます。数字を書く必要はありません。
#
#   strict    きびしく見る
#   normal    ふつう（既定）
#   relaxed   ゆるく見る
#   off       見ない
#
# コマンドでも変更できます。理由がコメントとして自動で残ります。
#
#   npx chaffjs relax bold-density --why "図の説明で太字を多用するため"
#   npx chaffjs explain bold-density        そのルールの意図を読む
#   npx chaffjs rules --json                AI に設定を書かせるときに渡す

# この場所に置く文書の種類（法令・規則・社内規程・通達）。ほかの種類: npx chaffjs genres
genre: legal/statute

# チームが書く固有名詞（組織名・製品名）。1 つの名前として読み、漢字の連なりに数えない。
# names:
#   - 個人情報保護委員会

# 既定から変えたものだけを書く。
rules:
  # 番号の抜け・重なり
  # 第3条の次が第5条、(a) の次が (c)、同じ第2項が二つ。番号が飛ぶか重なると、読み手は何かが消えたのか、参照がどちらを指すのかを判断できません。同じ親の中で並ぶ番号だけを比べます。枝番号（第3条の2）は並びの外として扱います。
  numbering-gap: relaxed # 2026-09-30 削除した条の番号を詰めない決まりのため / isamu
