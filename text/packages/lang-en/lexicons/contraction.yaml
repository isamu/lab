# Contractions and the long forms that say the same thing.
#
# Neither is wrong. The rule only asks whether one document writes the same word the same way.
#
# "we've" / "we have" is not listed: "we have" is mostly the main verb ("we have a plan", "we have to"), which does not
# contract, so counting it would point at "we've" in documents that contract every auxiliary "have".
id: contraction
language: en
entries:
  - pattern: "don't"
    instead_of: do not
  - pattern: "doesn't"
    instead_of: does not
  - pattern: "didn't"
    instead_of: did not
  - pattern: "can't"
    instead_of: cannot
  - pattern: "won't"
    instead_of: will not
  - pattern: "isn't"
    instead_of: is not
  - pattern: "aren't"
    instead_of: are not
  - pattern: "wasn't"
    instead_of: was not
  - pattern: "it's"
    instead_of: it is
  - pattern: "we're"
    instead_of: we are
  - pattern: "they're"
    instead_of: they are
  - pattern: "you're"
    instead_of: you are
  - pattern: "we'll"
    instead_of: we will
