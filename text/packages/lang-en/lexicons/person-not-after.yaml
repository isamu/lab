# A word right before a person-word that makes it something else: a determiner before "one" (no one can, the one we
# chose), a preposition that makes "one" the object of a phrase (devices connected to one can cause a shock), or an
# adjective that makes "one" a noun standing for a thing (the last one cannot be undone). Adjectives that are also
# adverbs at the head of a sentence (first, next, later, better) are left out: "First one must ask" is the reader.
# instead_of is the form the word guards; "to you" is still the reader.
id: person-not-after
language: en
entries:
