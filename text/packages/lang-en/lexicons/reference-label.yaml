# Words put before a document's own number (a booking or confirmation number). group is what the number is; numbers of
# different groups are never compared. reference-number-variant reads the letters and digits right after a label (only
# spaces, a colon, a comma or an opening bracket between) as a number of its group. Words that come between a label and its number ("is") go here too.
id: reference-label
language: en
entries:
  - { pattern: booking number, group: booking }
  - { pattern: booking number is, group: booking }
  - { pattern: reservation number, group: booking }
  - { pattern: reservation number is, group: booking }
  - { pattern: confirmation number, group: confirmation }
  - { pattern: confirmation number is, group: confirmation }
  - { pattern: reference number, group: reference }
  - { pattern: reference number is, group: reference }
  - { pattern: employee number, group: employee }
  - { pattern: employee number is, group: employee }
  - { pattern: employee id, group: employee }
  - { pattern: employee id is, group: employee }
  - { pattern: employee no., group: employee }
  - { pattern: student number, group: student }
  - { pattern: student number is, group: student }
  - { pattern: student id, group: student }
  - { pattern: student id is, group: student }
  - { pattern: student no., group: student }
  # A bank account's number. A transfer's other account is labelled longer (payee account number), and the longer label
  # wins, so it is never compared with the account's own.
  - { pattern: account number, group: account }
  - { pattern: account number is, group: account }
  - { pattern: account no., group: account }
  - { pattern: account no, group: account }
  - { pattern: "account #", group: account }
  - { pattern: payee account number, group: payee-account }
  - { pattern: payee account number is, group: payee-account }
  - { pattern: payee's account number, group: payee-account }
  - { pattern: payee's account number is, group: payee-account }
  - { pattern: beneficiary account number, group: payee-account }
  - { pattern: beneficiary account number is, group: payee-account }
  - { pattern: beneficiary's account number, group: payee-account }
  - { pattern: beneficiary's account number is, group: payee-account }
  - { pattern: recipient account number, group: payee-account }
  - { pattern: recipient account number is, group: payee-account }
  - { pattern: payer account number, group: payer-account }
  - { pattern: payer account number is, group: payer-account }
  - { pattern: payer's account number, group: payer-account }
  - { pattern: payer's account number is, group: payer-account }
  - { pattern: sender account number, group: payer-account }
  - { pattern: sender account number is, group: payer-account }
  # An insurance policy's number. A policyholder's own number may cover several policies, so it is not one.
  - { pattern: policy number, group: policy }
  - { pattern: policy number is, group: policy }
  - { pattern: policy no., group: policy }
  - { pattern: policy no, group: policy }
  - { pattern: "policy #", group: policy }
  - { pattern: insurance policy number, group: policy }
  - { pattern: insurance policy number is, group: policy }
  - { pattern: po number, group: order }
  - { pattern: po number is, group: order }
  - { pattern: purchase order number, group: order }
  - { pattern: purchase order number is, group: order }
  - { pattern: order number, group: order }
  - { pattern: order number is, group: order }
  - { pattern: invoice number, group: invoice }
  - { pattern: invoice number is, group: invoice }
  - { pattern: invoice no., group: invoice }
  - { pattern: invoice no, group: invoice }
  - { pattern: "invoice #", group: invoice }
  # A quote's number. A quote, an order and an invoice are different documents, so their numbers are never compared.
  # A bare "quote" is not a label: "please quote your PO number" uses it as a verb.
  - { pattern: quote number, group: quote }
  - { pattern: quote number is, group: quote }
  - { pattern: quote no., group: quote }
  - { pattern: quote no, group: quote }
  - { pattern: quotation number, group: quote }
  - { pattern: quotation number is, group: quote }
  - { pattern: estimate number, group: quote }
  - { pattern: estimate number is, group: quote }
  - { pattern: estimate no., group: quote }
  - { pattern: estimate no, group: quote }
  - { pattern: patient number, group: patient }
  - { pattern: patient number is, group: patient }
  - { pattern: patient id, group: patient }
  - { pattern: patient id is, group: patient }
  - { pattern: patient no., group: patient }
  - { pattern: contract number, group: contract }
  - { pattern: contract number is, group: contract }
  - { pattern: contract no., group: contract }
  - { pattern: agreement number, group: contract }
  - { pattern: agreement number is, group: contract }
  - { pattern: tenancy agreement number, group: contract }
  - { pattern: tenancy agreement number is, group: contract }
  # Labels of another contract's number. The longer label wins, so these are never compared with the document's own.
  - { pattern: original contract number, group: original-contract }
  - { pattern: original contract number is, group: original-contract }
  - { pattern: original agreement number, group: original-contract }
  - { pattern: original agreement number is, group: original-contract }
  - { pattern: master agreement number, group: master-contract }
  - { pattern: master agreement number is, group: master-contract }
  - { pattern: master contract number, group: master-contract }
  - { pattern: master contract number is, group: master-contract }
  - { pattern: former contract number, group: former-contract }
  - { pattern: former contract number is, group: former-contract }
  - { pattern: amended contract number, group: amended-contract }
  - { pattern: amended contract number is, group: amended-contract }
  - { pattern: amendment number, group: amended-contract }
  - { pattern: amendment number is, group: amended-contract }
  - { pattern: parent contract number, group: parent-contract }
  - { pattern: parent contract number is, group: parent-contract }
  - { pattern: parent agreement number, group: parent-contract }
  - { pattern: parent agreement number is, group: parent-contract }
  # An attendee's registration. An application number may be one application's, apart from each attendee's registration number.
  - { pattern: registration number, group: registration }
  - { pattern: registration number is, group: registration }
  - { pattern: registration no., group: registration }
  - { pattern: registration no, group: registration }
  - { pattern: application number, group: application }
  - { pattern: application number is, group: application }
  # An item's code. A table's codes are items of their own; only a code with no label is compared with them.
  - { pattern: item code, group: item }
  - { pattern: item code is, group: item }
  - { pattern: item no., group: item }
  - { pattern: item no, group: item }
  - { pattern: sku, group: item }
  - { pattern: product code, group: item }
  - { pattern: product code is, group: item }
  # A vehicle's plate. A bare "Registration" is not one: an attendee's registration is written so too.
  - { pattern: registration plate, group: vehicle }
  - { pattern: registration plate is, group: vehicle }
  - { pattern: number plate, group: vehicle }
  - { pattern: number plate is, group: vehicle }
  - { pattern: plate number, group: vehicle }
  - { pattern: plate number is, group: vehicle }
  - { pattern: licence plate, group: vehicle }
  - { pattern: licence plate is, group: vehicle }
  - { pattern: licence plate number, group: vehicle }
  - { pattern: license plate, group: vehicle }
  - { pattern: license plate is, group: vehicle }
  - { pattern: license plate number, group: vehicle }
  - { pattern: vehicle registration, group: vehicle }
  - { pattern: vehicle registration number, group: vehicle }
  - { pattern: vehicle registration number is, group: vehicle }
  # A member's number. A customer number is the shop's number for a customer and may differ from a member number.
  - { pattern: member number, group: member }
  - { pattern: member number is, group: member }
  - { pattern: membership number, group: member }
  - { pattern: membership number is, group: member }
  - { pattern: member id, group: member }
  - { pattern: member id is, group: member }
  - { pattern: member no., group: member }
  - { pattern: member no, group: member }
  - { pattern: customer number, group: customer }
  - { pattern: customer number is, group: customer }
