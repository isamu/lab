# Between a name and its value (fact-conflict, summary-fact-mismatch): "Fee: $300", "The deadline is May 3."
# A separator in letters only counts after a space. The words from the start of the sentence to it are the name.
id: fact-separator
language: en
entries:
  - pattern: ":"
  - pattern: is
  - pattern: are
  - pattern: was
  - pattern: were
  - pattern: will be
  # A decision names its value too: "The monthly fee will be set at $28."
  - pattern: will be set at
  - pattern: was set at
  - pattern: is set at
  - pattern: has been set at
