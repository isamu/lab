# Headings of the unit price column of an itemised table (line-amount-mismatch).
id: unit-price-column
language: en
entries:
  - pattern: Unit price
  - pattern: Unit price (excl. tax)
  - pattern: Unit cost
  - pattern: Price
  - pattern: Rate per unit
  - pattern: Price per unit
  # A rate is a price per a period of time, and the header does not say which (group: a unit no quantity word counts).
  - { pattern: Rate, group: unstated }
  - { pattern: Hourly rate, group: hour }
  - { pattern: Rate per hour, group: hour }
  - { pattern: Rate per mile, group: mile }
  - { pattern: Monthly, group: month }
  - { pattern: Monthly rent, group: month }
  - { pattern: Daily benefit, group: day }
  - { pattern: Per day, group: day }
  - { pattern: Daily rate, group: day }
  # The tuition per credit of a tuition invoice (times the credits gives the amount).
  - { pattern: Tuition per credit, group: credit }
  - { pattern: Fee per credit, group: credit }
  - { pattern: Per credit, group: credit }
  # The daily amount of a property tax proration (daily amount × days = proration).
  - { pattern: Daily amount, group: day }
  # A price per area. A square foot and a square metre are different units, so each is its own group.
  - { pattern: Price per sq ft, group: sqft }
  - { pattern: Price per square foot, group: sqft }
  - { pattern: Price per m², group: sqm }
  - { pattern: Price per square metre, group: sqm }
  - { pattern: Price per square meter, group: sqm }
