# Words that start a clause after a gauge's reading (fact-conflict): "The odometer read 45,210 km when the car came in."
# The clause says when the reading was taken, so the reading still ends at its unit. Used only after a fact-reading-verb.
id: fact-reading-clause
language: en
entries:
  - pattern: when
  - pattern: while
  - pattern: as
  - pattern: because
  - pattern: before
  - pattern: after
