# Pointing at a figure or a table by where it is instead of by its number (JIS Z 8301:2019 10.6 avoids "the figure
# above"). instead_of names the kind it points at, as figure-label names it (Figure, Table). Only a document that
# numbers that kind is checked. Matched in any case.
id: vague-figure-pointer
language: en
entries:
  - { pattern: the above figure, instead_of: Figure }
  - { pattern: the figure above, instead_of: Figure }
  - { pattern: the below figure, instead_of: Figure }
  - { pattern: the figure below, instead_of: Figure }
  - { pattern: the above table, instead_of: Table }
  - { pattern: the table above, instead_of: Table }
  - { pattern: the below table, instead_of: Table }
  - { pattern: the table below, instead_of: Table }
