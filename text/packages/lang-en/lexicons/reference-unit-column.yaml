# The column headings of a lab results table that only reference-unit-mismatch reads; the words both rules read are in
# lab-result-column. A bracketed part of a heading ("Result (mg/dL)", "Reference range (adult)") is left out, and the rest
# must be the whole heading.
id: reference-unit-column
language: en
entries:
  - { pattern: Measured value, group: result }
  - { pattern: Test result, group: result }
