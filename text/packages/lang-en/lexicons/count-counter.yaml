# Nouns that name what a list holds ("three steps", "two reasons"). Only a number followed by one of these (up to two
# words may stand between: "three key steps") is read as the count of the list below.
# Only nouns that name what a list holds. A plural that measures ("three years:", "two hours:", "30 seconds:") or a verb
# ending in s ("Release 2 includes:") is not an announcement, so "any plural before a colon" is not used.
