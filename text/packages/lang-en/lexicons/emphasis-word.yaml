# English function words written in capitals for emphasis (should NOT change): they have no reading as
# an acronym, so there is nothing to expand. A word that is also an acronym (OR: Oregon, operating room;
# IS: International Standard) does not belong here. Matched as written.
id: emphasis-word
language: en
entries:
  - pattern: "NOT"
  - pattern: "AND"
  - pattern: "ONLY"
