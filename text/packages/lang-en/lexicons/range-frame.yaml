# A word before the first date and a word between the two dates that together make a period: "from 1 May 2026 to
# 31 May 2026", "between 1 May 2026 and 31 May 2026". Written as "lead … joint". "to" alone is not a range-connector
# because "moved from March 10 to March 3" changes a date; date-change-word says when the frame is a change instead.
id: range-frame
language: en
entries:
  - pattern: from … to
  - pattern: between … and
