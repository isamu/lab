# Worn phrases (clichés) in English. Read by cliche. Each is a figure of speech worn down to filler: the reader has
# seen it so often that it says nothing about this document. rewrite says what to write instead. Phrases another rule
# already reads ("game-changer" in ai-tell, "needless to say" in empty-intensifier, "the bottom line is" in
# announcing-opener) are left out, so one sentence gets one finding. "State-of-the-art", "cutting-edge" and "going forward"
# are left out too: papers, notices and terms use them as plain terms (measured on the corpus).
id: cliche
language: en
entries:
  - pattern: at the end of the day
    rewrite: say the conclusion itself
  - pattern: think outside the box
    rewrite: name the new approach
  - pattern: low-hanging fruit
    rewrite: name the easy tasks
  - pattern: move the needle
    rewrite: say what changes, by how much
  - pattern: level playing field
    rewrite: say what is made equal
  - pattern: tip of the iceberg
    rewrite: say what else there is
  - pattern: in the same boat
    rewrite: say what the two share
  - pattern: back to the drawing board
    rewrite: say what is redone
  - pattern: perfect storm
