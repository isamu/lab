# Words that carry a number in a heading (Chapter 2, Step 3). Read by heading-numbering-mix to tell numbering styles
# apart. position is the side of the number the word stands on; English puts them all before.
# A word whose number names a period or an event (Week 1, Day 2, Phase 3, Session 4, Round 5) is not listed: "Week 1"
# and "Week 2" beside "Pay summary" are names, and the summary is not a week that lost its number.
id: heading-number-label
language: en
entries:
  - pattern: Chapter
    position: before
  - pattern: Section
    position: before
  - pattern: Part
    position: before
  - pattern: Step
    position: before
  - pattern: Appendix
    position: before
  - pattern: Lesson
    position: before
  - pattern: Module
    position: before
  - pattern: Unit
    position: before
  - pattern: Stage
    position: before
