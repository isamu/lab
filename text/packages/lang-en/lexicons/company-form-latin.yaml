# Company forms written after a company's name in Latin letters (SUNCALL CO., LTD., AOBA USA INC.), as the Japanese
# lexicon of the same name lists them. They are part of the name: CO, LTD and INC are not acronyms to spell out.
# Case, full or half width, and a space after the comma do not matter. Longer forms first.
id: company-form-latin
language: en
entries:
  - pattern: "Co., Ltd."
  - pattern: "Pte. Ltd."
  - pattern: "Pty. Ltd."
  - pattern: "Sdn. Bhd."
  - pattern: "S.A. de C.V."
  - pattern: "Co., Inc."
  - pattern: "Inc."
  - pattern: "Ltd."
  - pattern: "Corp."
  - pattern: "LLC"
  - pattern: "GmbH"
  - pattern: "B.V."
  - pattern: "S.A."
  - pattern: "PLC"
