# Heading labels that say nothing about the section. numbered-generic-heading points at a heading that is only one of
# these and a number ("Benefit 1", "Tip 2"). Step labels ("Step 1") are left out: in a procedure the order is the content.
id: generic-heading-label
language: en
entries:
  - pattern: Benefit
  - pattern: Advantage
  - pattern: Disadvantage
  - pattern: Point
  - pattern: Key point
  - pattern: Reason
  - pattern: Tip
  - pattern: Feature
  - pattern: Takeaway
  - pattern: Lesson
