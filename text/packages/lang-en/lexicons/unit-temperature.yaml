    weight: 1
  - pattern: "℃"
    weight: 1
  - pattern: "degrees Celsius"
    weight: 1
  - pattern: "degrees C"
    weight: 1
  - pattern: "°F"
    weight: 0.5555555555555556
  - pattern: "℉"
    weight: 0.5555555555555556
  - pattern: "degrees Fahrenheit"
    weight: 0.5555555555555556
  - pattern: "degrees F"
    weight: 0.5555555555555556
