# Units of temperature (base: degree Celsius) (unit-mismatch). weight is the factor to the base unit; the offset of a scale's zero is in unit-zero. "degrees" alone is not a unit: it is also an angle, and an oven at "350 degrees" may be Fahrenheit or Celsius.
id: unit-temperature
language: en
entries:
