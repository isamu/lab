# Words that say which way a forecast was revised (revision-direction-mismatch). group is the direction: rise or fall.
# Matched as whole words in the section that holds a table of the previous and the revised forecast. rise-verb and
# fall-verb are read only with a word of the group forecast in their sentence ("raised funds" revises nothing).
