# Counters that a total line may add up ("16 credits", "4 sessions"). total-mismatch reads a number directly followed by one
# of these as a quantity in that unit. The singular and the plural share a group, so "1 credit" and "3 credits" add up.
id: summed-counter
language: en
entries:
  - pattern: credits
    group: credit
  - pattern: credit
    group: credit
  - pattern: units
    group: unit
  - pattern: unit
    group: unit
  - pattern: sessions
    group: session
  - pattern: session
    group: session
  - pattern: packs
    group: pack
  - pattern: pack
    group: pack
  - pattern: cartons
    group: carton
  - pattern: carton
    group: carton
  - pattern: bottles
    group: bottle
  - pattern: bottle
    group: bottle
  - pattern: boxes
    group: box
  - pattern: box
    group: box
  - pattern: bags
    group: bag
  - pattern: bag
    group: bag
  # Left out: "can" ("3 can be returned"), "set" ("2 set values"), and "cases" (instances that may overlap, not containers).
  - pattern: cans
    group: can
  - pattern: jars
    group: jar
  - pattern: jar
    group: jar
  - pattern: pieces
    group: piece
  - pattern: piece
    group: piece
  - pattern: items
    group: item
  - pattern: item
    group: item
  - pattern: sets
    group: set
  - pattern: pairs
    group: pair
  - pattern: pair
    group: pair
  - pattern: tablets
    group: tablet
  - pattern: tablet
    group: tablet
