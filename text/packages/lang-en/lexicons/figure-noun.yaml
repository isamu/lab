  - pattern: grams
  - pattern: kilograms
  - pattern: miles
  - pattern: feet
  - pattern: inches
  - pattern: meters
  - pattern: metres
  - pattern: kilometers
  - pattern: kilometres
  - pattern: degrees
  - pattern: percent
  - pattern: points
