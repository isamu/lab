# Words written before a number to name one of a series (Grade 5, Room 12, No. 3): the number is a name, not a count,
# so "Grade 5 students" is not a vote on how the document writes counts. Matched as written: in lower case some of these
# are an ordinary noun before a count ("every day 3 buses leave"). Read by number-style-consistency.
