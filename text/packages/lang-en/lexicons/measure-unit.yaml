# Unit symbols written after a measured number (1.5 mM, 37 °C, 2.5 mg/kg). A decimal at the start of a line followed
# by one of these is an amount, not a dotted section number. Matched as written, and only when no letter, digit or
# hyphen follows ("2.1 mmap" and "5.2.2 min-fresh" stay section titles). Symbols that begin with a capital letter
# (Da, Pa, GB, W, V) are left out: a section title begins with a capital too, and "3.1 Da Vinci" is a title.
id: measure-unit
language: en
entries:
  - pattern: "mM"
  - pattern: "µM"
  - pattern: "μM"
  - pattern: "nM"
  - pattern: "pM"
  - pattern: "mol"
