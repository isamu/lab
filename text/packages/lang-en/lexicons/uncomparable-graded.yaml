# Uncomparable adjectives given a degree ("very unique", "more unanimous"). Read by uncomparable-graded.
# An adjective here names a state that is there or not, so a grade says nothing more. "Almost", "nearly" and "truly" are
# left out: "almost unique" and "nearly impossible" say how close, which is a real claim. rewrite is the form without the grade.
id: uncomparable-graded
language: en
entries:
