# What a chat reply leaves in a document. Weight 1: the residue itself (an AI disclaimer, a knowledge cutoff), which
# counts on its own. Weight 0.5: a courtesy people also write, which counts only when two come together.
id: assistant-residue
language: en
entries:
  - pattern: as an AI language model
    weight: 1
  - pattern: as a large language model
    weight: 1
  - pattern: as an AI assistant
    weight: 1
  - pattern: my knowledge cutoff
    weight: 1
  - pattern: as of my last knowledge update
    weight: 1
  - pattern: as of my last training update
    weight: 1
  - pattern: up to my last training update
    weight: 1
  - pattern: my training data
    weight: 1
  - pattern: I don't have access to real-time
    weight: 1
  - pattern: I cannot browse the internet
    weight: 1
  - pattern: regenerate response
    weight: 1
  - pattern: specific details are limited
    weight: 0.5
  - pattern: not widely documented
    weight: 0.5
  - pattern: based on available information
    weight: 0.5
