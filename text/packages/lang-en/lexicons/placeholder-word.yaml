# What a template writes inside the brackets of a blank: [Your Name], [Insert Date], [Company Name].
# A bracket counts when it holds one of these, alone or followed by more words.
id: placeholder-word
language: en
entries:
  - pattern: your
  - pattern: insert
  - pattern: recipient
  - pattern: name
  - pattern: company name
  - pattern: client name
  - pattern: project name
  - pattern: product name
  - pattern: date
  - pattern: describe
  - pattern: specific
  - pattern: add
  # group: marker — a value left as a note to fill it in later. It counts when it is the whole value ("TBD") or opens it
  # before a colon ("TODO: add expected output pattern"), in any case. Only the start of a value counts: "a todo app" is not one.
  - pattern: TODO
    group: marker
  - pattern: TBD
    group: marker
  - pattern: TBC
    group: marker
  - pattern: FIXME
    group: marker
