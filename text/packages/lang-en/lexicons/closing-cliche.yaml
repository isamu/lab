# A stock closing that leaves the reader nothing. The groups are explained at the top of detectors/closing-cliche.ts.
id: closing-cliche
language: en
entries:
  - pattern: in conclusion
  - pattern: to sum up
  - pattern: hope this helps
  - pattern: thanks for reading
  - pattern: happy coding
  - pattern: future self will thank you
  - pattern: future you will thank you
  # Ordinary in the body; as the last line it is the stock send-off.
  - pattern: and go from there
    group: last
  - pattern: give it a try
    group: last
  # A short line such as "Happy brewing!" or "Happy baking!" as the last paragraph.
  - pattern: Happy
    group: signoff
  # The stock last line of a letter or a proposal: it thanks or invites without saying anything. "Feel free to",
  # "happy to discuss" and "apologize for any inconvenience" are email-stock-courtesy's, which counts them stacked.
  - pattern: prompt attention to this matter
  - pattern: would welcome any feedback
  # A chirpy last wish in an email (Wishing you all a restful holiday season!, Thanks, and enjoy the long weekend!).
  # Only in emails: a blog's "enjoy the wilderness!" is its subject, not a send-off.
  - pattern: Wishing
    group: open:wish
    genres: [business/email]
  - pattern: enjoy
    group: lead:wish
    genres: [business/email]
  - pattern: "!"
    group: end:wish
    genres: [business/email]
