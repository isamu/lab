# A stock closing that leaves the reader nothing. The groups are explained at the top of detectors/closing-cliche.ts.
id: closing-cliche
language: en
entries:
  - pattern: in conclusion
  - pattern: to sum up
  - pattern: hope this helps
  - pattern: thanks for reading
  - pattern: happy coding
  - pattern: future self will thank you
  - pattern: future you will thank you
  # Ordinary in the body; as the last line it is the stock send-off.
  - pattern: and go from there
    group: last
  # A short line such as "Happy brewing!" or "Happy baking!" as the last paragraph.
  - pattern: Happy
    group: signoff
