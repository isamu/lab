# What sound a word starts with, for "a" and "an" (article-sound). By group:
#   vowel-letter       the letters a word starting with which usually takes "an"
#   letter-name-vowel  the letters whose name starts with a vowel sound, for a capital read letter by letter ("an MBA", "an X-ray")
#   letter-name-either the letters whose name is said both ways ("an HTTP" and "a HTTP": aitch and haitch)
#   consonant          word beginnings spelled with a vowel but said with a consonant ("a user", "a one-off", "a European")
#   vowel              word beginnings said with a vowel against the two groups above ("an hour", "an onerous"); checked first
#   word               capitals read as a word, not letter by letter ("a NASA probe"); the word's own sound decides.
#                      Capitals of four letters or more with a vowel that are not listed may be words, and are not reported
#   either             words and capitals said both ways, never reported ("a SQL" and "an SQL", "a historic" and "an historic")
# Word beginnings match the start of the word, in lower case; capitals match whole.
id: article-sound
language: en
entries:
  - { pattern: a, group: vowel-letter }
  - { pattern: e, group: vowel-letter }
  - { pattern: i, group: vowel-letter }
  - { pattern: o, group: vowel-letter }
  - { pattern: u, group: vowel-letter }
  - { pattern: A, group: letter-name-vowel }
  - { pattern: E, group: letter-name-vowel }
  - { pattern: F, group: letter-name-vowel }
  - { pattern: I, group: letter-name-vowel }
  - { pattern: L, group: letter-name-vowel }
  - { pattern: M, group: letter-name-vowel }
  - { pattern: N, group: letter-name-vowel }
  - { pattern: O, group: letter-name-vowel }
  - { pattern: R, group: letter-name-vowel }
  - { pattern: S, group: letter-name-vowel }
  - { pattern: X, group: letter-name-vowel }
  - { pattern: H, group: letter-name-either }
  - { pattern: one, group: consonant }
  - { pattern: once, group: consonant }
  - { pattern: eu, group: consonant }
  - { pattern: ewe, group: consonant }
