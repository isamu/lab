# Words that, between a total and the amounts after it, show the amounts may not be every item of the total: only some of
# them ("including $5,000 for design"), alternatives ("$5,000 or $6,000") or limits ("up to $5,000").
# total-mismatch does not compare such a breakdown.
id: breakdown-partial-word
language: en
entries:
  - pattern: including
  - pattern: includes
  - pattern: such as
  - pattern: among them
  - pattern: at least
  - pattern: " or "
  - pattern: either
  - pattern: up to
  # group main: words saying the amounts listed are only the main ones. Before the items listed ahead of a total
  # ("spending went mainly to $20 million for lighting and …, for a total of $190 million"), they are not compared either.
  - { pattern: mainly, group: main }
  - { pattern: chiefly, group: main }
  - { pattern: principally, group: main }
  - { pattern: primarily, group: main }
  - { pattern: mostly, group: main }
  - { pattern: largely, group: main }
