# Words that name a kind of talk. In a list of past events that dates its items, the brackets right after one of them
# (- Keynote (…EBPM training at the ministry)) hold the talk's title, the speaker's words, which the writer cannot change:
# undefined-acronym counts its acronyms but does not ask to spell them out.
id: talk-kind
language: en
entries:
  - pattern: "Talk"
  - pattern: "Keynote"
  - pattern: "Lecture"
  - pattern: "Presentation"
  - pattern: "Paper"
  - pattern: "Panel"
