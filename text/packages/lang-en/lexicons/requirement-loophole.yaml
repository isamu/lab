# Phrases that open a loophole in a requirement or leave it unverifiable (Femmer et al. 2017; the terms ISO/IEC/IEEE
# 29148 says to avoid). The reader cannot tell how much is enough to meet it.
id: requirement-loophole
language: en
entries:
