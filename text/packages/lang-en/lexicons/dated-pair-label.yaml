# Pairs of dates that must come in order. group names the pair; position before marks the word of the date that comes
# first, after the word of the date that must not be earlier. A line (or a table's first column) starting with one and a
# date with its year is compared, and an after date before the before date is reported (due-before-issue).
id: dated-pair-label
language: en
entries:
  - { pattern: "Listed on", group: listing, position: before }
  - { pattern: "Listed", group: listing, position: before }
  - { pattern: "Listing date", group: listing, position: before }
  - { pattern: "Date listed", group: listing, position: before }
  - { pattern: "Available from", group: listing, position: after }
  - { pattern: "Move-in date", group: listing, position: after }
  - { pattern: "Move-in", group: listing, position: after }
  - { pattern: "Move in", group: listing, position: after }
  # A bare "Posted" heads blog and release-note dates too, so it pairs only with an application deadline, never with
  # "Available". A bare "Closing date" is left out: a sale or a reporting period closes too.
  - { pattern: "Posted on", group: job, position: before }
  - { pattern: "Posted", group: job, position: before }
  - { pattern: "Date posted", group: job, position: before }
  - { pattern: "Application deadline", group: job, position: after }
  - { pattern: "Apply by", group: job, position: after }
  - { pattern: "Application closing date", group: job, position: after }
  # An earnings release: the earnings call and the release come after the end of the period they report. A reporting
  # period line states a period and is compared by its end (dated-span-label). A bare "Release date" is left out: a
  # product or a campaign is announced before its period ends. A bare "Conference call" is left out too: a project
  # report's calls fall inside its reporting period.
  - { pattern: "Reporting period", group: earnings, position: before }
  - { pattern: "Period covered", group: earnings, position: before }
  - { pattern: "Earnings call", group: earnings, position: after }
  - { pattern: "Earnings conference call", group: earnings, position: after }
  - { pattern: "Results briefing", group: earnings, position: after }
  - { pattern: "Earnings release date", group: earnings, position: after }
  - { pattern: "Results release date", group: earnings, position: after }
  # A medical or lab report: the results are reported after the examination or the sample. A bare "Issue date" is left
  # out: an admission ticket, a lab order or a notice is issued before the test or collection date it names.
  - { pattern: "Examination date", group: checkup-report, position: before }
  - { pattern: "Test date", group: checkup-report, position: before }
  - { pattern: "Collection date", group: checkup-report, position: before }
  - { pattern: "Date collected", group: checkup-report, position: before }
  - { pattern: "Report date", group: checkup-report, position: after }
  - { pattern: "Date reported", group: checkup-report, position: after }
  # A product warranty: the registration deadline comes after the purchase.
  - { pattern: "Purchase date", group: warranty, position: before }
  - { pattern: "Date of purchase", group: warranty, position: before }
  - { pattern: "Registration deadline", group: warranty, position: after }
  - { pattern: "Product registration deadline", group: warranty, position: after }
  - { pattern: "Register by", group: warranty, position: after }
  # A recall or exchange notice: the deadline for replacement or refund requests comes after the notice date. A bare
  # "Requests accepted until" or "Deadline for requests" is left out: a notice that a window has closed states the
  # deadline that has passed.
  - { pattern: "Notice date", group: recall, position: before }
  - { pattern: "Date of notice", group: recall, position: before }
  - { pattern: "Replacement requests accepted until", group: recall, position: after }
  - { pattern: "Refund requests accepted until", group: recall, position: after }
  - { pattern: "Exchange deadline", group: recall, position: after }
  # A loan or an installment plan: the first payment comes after the contract is signed.
  - { pattern: "Contract date", group: loan, position: before }
  - { pattern: "Agreement date", group: loan, position: before }
  - { pattern: "Date of contract", group: loan, position: before }
  - { pattern: "First payment date", group: loan, position: after }
  - { pattern: "First payment due", group: loan, position: after }
  - { pattern: "First payment due date", group: loan, position: after }
  - { pattern: "First installment due", group: loan, position: after }
  - { pattern: "First installment due date", group: loan, position: after }
  - { pattern: "First installment date", group: loan, position: after }
  # A hotel booking: check-out does not come before check-in. A same-day check-out (a day use) is not reported.
  - { pattern: "Check-in", group: stay, position: before }
  - { pattern: "Check-in date", group: stay, position: before }
  - { pattern: "Check-out", group: stay, position: after }
  - { pattern: "Check-out date", group: stay, position: after }
  # A rental: the return does not come before the pick-up. A bare "Return" is left out: an order's return window or a
  # return policy row is not the rental's drop-off.
  - { pattern: "Pick-up", group: rental, position: before }
  - { pattern: "Pick-up date", group: rental, position: before }
  - { pattern: "Drop-off", group: rental, position: after }
  - { pattern: "Drop-off date", group: rental, position: after }
  - { pattern: "Return date", group: rental, position: after }
  # Free cancellation ends before the stay or the rental starts. Check-in and Pick-up are in stay and rental too; each
  # group is compared on its own.
  - { pattern: "Free cancellation until", group: cancel, position: before }
  - { pattern: "Cancel by", group: cancel, position: before }
  - { pattern: "Check-in", group: cancel, position: after }
  - { pattern: "Check-in date", group: cancel, position: after }
  - { pattern: "Pick-up", group: cancel, position: after }
  - { pattern: "Pick-up date", group: cancel, position: after }
  # A payslip: the pay date comes after the end of the pay period. The pay period line states a period and is compared
  # by its end (dated-span-label).
  - { pattern: "Pay period", group: payroll, position: before }
  - { pattern: "Pay date", group: payroll, position: after }
  # A trip or an expense report: the return does not come before the departure. A same-day return (a day trip) is not
  # reported. "Return date" is left out: a guide's return date for forms or a passport comes before the departure.
  - { pattern: "Departure", group: trip, position: before }
  - { pattern: "Departure date", group: trip, position: before }
  - { pattern: "Return", group: trip, position: after }
  # A purchase order or a delivery note: the delivery does not come before the order. A purchase order's delivery date is
  # the one requested, and it comes after the order too. A bare "Due date" is left out: it is an invoice's payment due
  # date as well (due-date-label).
  - { pattern: "Order date", group: order, position: before }
  - { pattern: "Date of order", group: order, position: before }
  - { pattern: "Date ordered", group: order, position: before }
  - { pattern: "PO date", group: order, position: before }
  - { pattern: "Purchase order date", group: order, position: before }
  - { pattern: "Delivery date", group: order, position: after }
  - { pattern: "Requested delivery date", group: order, position: after }
  - { pattern: "Delivered on", group: order, position: after }
  - { pattern: "Date delivered", group: order, position: after }
  # An academic transcript or a certificate of graduation or completion: graduation and completion come after enrolment,
  # and the certificate is issued after them. The three are read as two pairs: enrolment with graduation or completion,
  # and graduation or completion with the issue date. The enrolment date is not paired with the issue date.
  - { pattern: "Date of enrolment", group: transcript, position: before }
  - { pattern: "Enrolment date", group: transcript, position: before }
  - { pattern: "Date of admission", group: transcript, position: before }
  - { pattern: "Date of graduation", group: transcript, position: after }
  - { pattern: "Graduation date", group: transcript, position: after }
  - { pattern: "Date of completion", group: transcript, position: after }
  - { pattern: "Date of graduation", group: transcript-issue, position: before }
  - { pattern: "Graduation date", group: transcript-issue, position: before }
  - { pattern: "Date of completion", group: transcript-issue, position: before }
  - { pattern: "Date of issue", group: transcript-issue, position: after }
  - { pattern: "Issue date", group: transcript-issue, position: after }
  # An annual earnings and tax withholding statement is issued once the tax year has ended or, for a leaver, after the
  # leaving date. "Period covered" is left out: an invoice billed in advance is issued at the start of the period it covers.
  - { pattern: "Tax year", group: tax-statement, position: before }
  - { pattern: "Leaving date", group: tax-statement, position: before }
  - { pattern: "Date of leaving", group: tax-statement, position: before }
  - { pattern: "Issue date", group: tax-statement, position: after }
  - { pattern: "Date of issue", group: tax-statement, position: after }
  # A packing list or a commercial invoice: the goods do not arrive before they are shipped. An estimated date (Estimated
  # arrival, ETA) is only ever the later side. The invoice date is left out: an invoice is dated before or after shipment.
  - { pattern: "On-board date", group: shipping, position: before }
  - { pattern: "Shipment date", group: shipping, position: before }
  - { pattern: "Arrival date", group: shipping, position: after }
  - { pattern: "Estimated arrival", group: shipping, position: after }
  - { pattern: "ETA", group: shipping, position: after }
  # An itemized medical bill or receipt is not issued before the visit it bills.
  - { pattern: "Date of visit", group: medical-visit, position: before }
  - { pattern: "Date issued", group: medical-visit, position: after }
  # A hospital stay: the discharge does not come before the admission. A same-day discharge is not reported. "Date of
  # admission" is in transcript too (a school's); each group is compared on its own.
  - { pattern: "Date of admission", group: hospital-stay, position: before }
  - { pattern: "Date of discharge", group: hospital-stay, position: after }
  # A tenancy's deposit settlement or termination papers: the move-out does not come before the move-in, and notice is
  # given before the move-out. "Move-in date" is in listing and "Notice date" in recall too; each group is compared on its
  # own. Move-in and notice are two groups: in one, a move-out date written once is compared with the first move-in only.
  # A planned date (Planned move-out date) is only ever the later side; a planned move-in date is left out.
  - { pattern: "Move-in date", group: tenancy, position: before }
  - { pattern: "Move-out date", group: tenancy, position: after }
  - { pattern: "Planned move-out date", group: tenancy, position: after }
  - { pattern: "Notice date", group: tenancy-notice, position: before }
  - { pattern: "Date of notice", group: tenancy-notice, position: before }
  - { pattern: "Move-out date", group: tenancy-notice, position: after }
  - { pattern: "Planned move-out date", group: tenancy-notice, position: after }
