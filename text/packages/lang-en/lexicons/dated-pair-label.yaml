# Pairs of dates that must come in order. group names the pair; position before marks the word of the date that comes
# first, after the word of the date that must not be earlier. A line (or a table's first column) starting with one and a
# date with its year is compared, and an after date before the before date is reported (due-before-issue).
id: dated-pair-label
language: en
entries:
  - { pattern: "Listed on", group: listing, position: before }
  - { pattern: "Listed", group: listing, position: before }
  - { pattern: "Listing date", group: listing, position: before }
  - { pattern: "Date listed", group: listing, position: before }
  - { pattern: "Available from", group: listing, position: after }
  - { pattern: "Move-in date", group: listing, position: after }
  - { pattern: "Move-in", group: listing, position: after }
  - { pattern: "Move in", group: listing, position: after }
  # A bare "Posted" heads blog and release-note dates too, so it pairs only with an application deadline, never with
  # "Available". A bare "Closing date" is left out: a sale or a reporting period closes too.
  - { pattern: "Posted on", group: job, position: before }
  - { pattern: "Posted", group: job, position: before }
  - { pattern: "Date posted", group: job, position: before }
  - { pattern: "Application deadline", group: job, position: after }
  - { pattern: "Apply by", group: job, position: after }
  - { pattern: "Application closing date", group: job, position: after }
  # An earnings release: the earnings call and the release come after the end of the period they report. A reporting
  # period line states a period and is compared by its end (dated-span-label). A bare "Release date" is left out: a
  # product or a campaign is announced before its period ends. A bare "Conference call" is left out too: a project
  # report's calls fall inside its reporting period.
  - { pattern: "Reporting period", group: earnings, position: before }
  - { pattern: "Period covered", group: earnings, position: before }
  - { pattern: "Earnings call", group: earnings, position: after }
  - { pattern: "Earnings conference call", group: earnings, position: after }
  - { pattern: "Results briefing", group: earnings, position: after }
  - { pattern: "Earnings release date", group: earnings, position: after }
  - { pattern: "Results release date", group: earnings, position: after }
  # A medical or lab report: the results are reported after the examination or the sample. A bare "Issue date" is left
  # out: an admission ticket, a lab order or a notice is issued before the test or collection date it names.
  - { pattern: "Examination date", group: checkup-report, position: before }
  - { pattern: "Test date", group: checkup-report, position: before }
  - { pattern: "Collection date", group: checkup-report, position: before }
  - { pattern: "Date collected", group: checkup-report, position: before }
  - { pattern: "Report date", group: checkup-report, position: after }
  - { pattern: "Date reported", group: checkup-report, position: after }
  # A product warranty: the registration deadline comes after the purchase.
  - { pattern: "Purchase date", group: warranty, position: before }
  - { pattern: "Date of purchase", group: warranty, position: before }
  - { pattern: "Registration deadline", group: warranty, position: after }
  - { pattern: "Product registration deadline", group: warranty, position: after }
  - { pattern: "Register by", group: warranty, position: after }
  # A loan or an installment plan: the first payment comes after the contract is signed.
  - { pattern: "Contract date", group: loan, position: before }
  - { pattern: "Agreement date", group: loan, position: before }
  - { pattern: "Date of contract", group: loan, position: before }
  - { pattern: "First payment date", group: loan, position: after }
  - { pattern: "First payment due", group: loan, position: after }
  - { pattern: "First installment due", group: loan, position: after }
  - { pattern: "First installment date", group: loan, position: after }
