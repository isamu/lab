# The column headings of a lab results table that only reference-flag-mismatch reads; the words both rules read are in
# lab-result-column. Matched as the whole heading, a unit in brackets at its end left out ("Result (mg/dL)" is Result). A
# table is read only when the result, range and flag columns are each named exactly once.
id: reference-column-heading
language: en
entries:
  - { pattern: Value, group: result }
  - { pattern: Your value, group: result }
  - { pattern: Reference, group: range }
  - { pattern: Normal values, group: range }
