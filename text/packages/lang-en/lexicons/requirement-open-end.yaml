# Words that leave a list open (Femmer et al. 2017, open-ended terms; ISO/IEC/IEEE 29148 names "but not limited to").
# In a requirement the reader cannot tell what else it covers.
id: requirement-open-end
language: en
entries:
  - pattern: etc.
  - pattern: and so on
  - pattern: and the like
  # In a contract "including, but not limited to" is a term of art: it keeps a court from narrowing the defined class to
  # the examples listed, so the class named before it decides the scope. Specifications and documentation only.
  - pattern: but not limited to
    genres: [technical, docs]
