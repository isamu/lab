# Words in everyday technical and business writing that WordNet does not list. unknown-word reads them as known, with
# their endings: function words WordNet leaves out (cannot, wherein, albeit, whilst), Latin phrases in English text
# (a priori, in forma pauperis, de minimis), the legal words of contracts (thereunder, herefrom, monies, pendency,
# cedent, telecopy), newer coinages (onboard, roadmap, phishing, vishing, ransomware, agentic, toolbar) and everyday
# words WordNet missed (amidst, ahold, barista, grift). A team adds its own words
# under names in chaff.yaml; this list is only for words any document may use.
id: extra-word
language: en
