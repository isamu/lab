# Words in everyday technical and business writing that WordNet does not list. unknown-word reads them as known, with
# their endings: function words WordNet leaves out (cannot, wherein, albeit, whilst), Latin phrases in English text
# (a priori, in forma pauperis) and newer coinages (onboard, roadmap, phishing). A team adds its own words under names in chaff.yaml; this list is only for words any document may use.
id: extra-word
language: en
