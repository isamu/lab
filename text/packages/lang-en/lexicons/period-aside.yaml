# Words that let a date stand outside the stated period. When the item, the sentence or the section heading holds one,
# date-outside-period does not compare the date: plans before or after the period ("post-trip", "the day before"),
# deadlines and bookings ("book by", "registration deadline") and earlier editions ("previous", "past").
