# What answers a denial (contrast-lead): later in the same sentence, or opening the next one.
# Group across: a subject that answers only by opening the next sentence ("They come for the table."), never inside one.
id: contrast-turn
language: en
entries:
  - pattern: it's
  - pattern: it is
  - pattern: this is
  - pattern: that's
  - pattern: they're
  - pattern: they are
  - pattern: but
  - pattern: it
    group: across
  - pattern: they
    group: across
