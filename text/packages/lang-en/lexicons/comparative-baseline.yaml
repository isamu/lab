# Words comparative-without-baseline reads: a comparison that names nothing to compare with ("The new engine is faster.").
# more: the word that makes a comparative of an adjective ("is more efficient.").
# comparative: one-word comparatives read when they close a clause after a verb ("is faster.", "runs better,").
# baseline: words that name what is compared with. One in the same sentence or the one before, and the comparison has
# its baseline.
# condition: a word before the comparative that puts it under a condition or a hypothesis ("if it looks better", "would be
# easier"); the comparison is then with the case without it.
# beyond: a word right before the comparative that says it goes past what was just named ("performed even better"); the
# baseline is what came before it. "whereas" sets one clause against another, so the other clause is the baseline.
# phrase: a set phrase ending in a comparative, set off by a comma or a colon ("or to be more precise, it"); it restates
# the words before it and compares nothing. Matched on the words up to the comparative, joined by spaces.
# pointer: a word opening the sentence that points at the example just shown ("This is much better!"); right after two
# code examples, the baseline is the first one.
# cause: a word after another word and before the comparative that sets the clause before it against the comparison
# ("Print statements work, but a real debugger is better"); that clause is the baseline.
# opener: a word opening the sentence that puts the comparison after a change or a topic it names ("As the application
# divides into services, the project can move faster"; "By pairing the data with research, …"; "As to the codes, the
# question is more fundamental"). The baseline is the state before that change, or the topic before.
# aim: a verb shortly before the comparative that makes it a change from the present ("to make results more
# predictable", "We can do better"). The baseline is the present state, as in Japanese より良くする.
# A baseline of several words ("that follows") is matched on the words joined by a space.
id: comparative-baseline
language: en
entries:
  - { pattern: more, group: more }
  - { pattern: faster, group: comparative }
  - { pattern: better, group: comparative }
  - { pattern: quicker, group: comparative }
  - { pattern: easier, group: comparative }
  - { pattern: simpler, group: comparative }
