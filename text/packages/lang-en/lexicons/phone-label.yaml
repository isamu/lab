# Words put before a phone number. group is what the number is (phone, fax, mobile); numbers of different groups are never
# compared. phone-number-variant takes the group of the nearest label before a number on its line.
id: phone-label
language: en
entries:
  - { pattern: phone, group: phone }
  - { pattern: telephone, group: phone }
  - { pattern: tel, group: phone }
  - { pattern: call, group: phone }
  - { pattern: "☎", group: phone }
  - { pattern: fax, group: fax }
  - { pattern: mobile, group: mobile }
  - { pattern: cell, group: mobile }
  - { pattern: cell phone, group: mobile }
  - { pattern: mobile phone, group: mobile }
  # A desk's name says where a number goes, not what it is, so its group is desk: the number is of the kind the label right
  # before the desk's name gives (a fax line's number is a fax number), and a phone number when there is none.
  - { pattern: line, group: desk }
  - { pattern: hotline, group: desk }
  - { pattern: helpline, group: desk }
  - { pattern: desk, group: desk }
  - { pattern: center, group: desk }
  - { pattern: centre, group: desk }
  - { pattern: care, group: desk }
  - { pattern: support, group: desk }
