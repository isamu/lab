# Unit words written after the number of a quantity in an itemised table, each with the unit it counts (group). A price
# written per a unit (per-unit-mark) is multiplied only by a quantity in the same unit (line-amount-mismatch).
id: rate-unit
language: en
entries:
  - { pattern: hour, group: hour }
  - { pattern: hours, group: hour }
  - { pattern: hr, group: hour }
  - { pattern: hrs, group: hour }
  - { pattern: h, group: hour }
  - { pattern: day, group: day }
  - { pattern: days, group: day }
  - { pattern: week, group: week }
  - { pattern: weeks, group: week }
  - { pattern: month, group: month }
  - { pattern: months, group: month }
  - { pattern: year, group: year }
  - { pattern: years, group: year }
  - { pattern: mile, group: mile }
  - { pattern: miles, group: mile }
  - { pattern: mi, group: mile }
  - { pattern: km, group: km }
  # Course credits (3 credits): a tuition per credit is multiplied only by a count of credits.
  - { pattern: credit, group: credit }
  - { pattern: credits, group: credit }
  - { pattern: credit hour, group: credit }
  - { pattern: credit hours, group: credit }
  # Area units. A square foot and a square metre are different units: a price per square foot is not multiplied by m².
  - { pattern: sq ft, group: sqft }
  - { pattern: sq. ft., group: sqft }
  - { pattern: sqft, group: sqft }
  - { pattern: ft², group: sqft }
  - { pattern: square feet, group: sqft }
  - { pattern: m², group: sqm }
  - { pattern: sq m, group: sqm }
  - { pattern: square metres, group: sqm }
  - { pattern: square meters, group: sqm }
