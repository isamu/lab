  - pattern: re-mark
  - pattern: re-serve
  - pattern: re-sort
  - pattern: re-treat
  - pattern: re-act
  - pattern: re-fuse
  - pattern: re-lay
  - pattern: re-place
  - pattern: re-sent
  - pattern: re-solve
  - pattern: co-op
  - pattern: un-ionized
