# British and American spellings of the same word (colour / color, centre / center, travelled / traveled, analyse / analyze).
# pattern is the British spelling, instead_of the American. Neither is wrong: spelling-consistency points at whichever the
# document uses less. -ise / -ize is in spelling-ize, compared on its own, since Oxford spelling writes colour and organize.
# Words with another meaning in one variety are left out: meter (a device), check (a verb), tire (a verb), program, license,
# practice, judgment (a court's), dialog and analog (in software and electronics), analyses (the plural of analysis).
id: spelling-variant
language: en
