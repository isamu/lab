# Headings of the quantity column of an itemised table. With a unit price and an amount column, quantity × unit price is compared with the amount (line-amount-mismatch).
id: quantity-column
language: en
entries:
  - pattern: Quantity
  - pattern: Qty
  - pattern: Qty.
  - pattern: Units
  # The head count or ticket count of a registration or ticket order (a price per person, per ticket, per seat).
  - pattern: Tickets
  - pattern: Attendees
  - pattern: Seats
  - pattern: Persons
  # The head count of a school trip or event budget (a cost per student or per person times the head count). The group
  # is not a rate-unit: a Rate column (a hotel's rate per night) beside it is not read as per person.
  - { pattern: Students, group: person }
  - { pattern: People, group: person }
  - { pattern: Participants, group: person }
  - { pattern: Guests, group: person }
  - { pattern: Headcount, group: person }
  - { pattern: No. of students, group: person }
  - { pattern: Hours, group: hour }
  - { pattern: Miles, group: mile }
  # The months of a rent statement (monthly × months = annual).
  - { pattern: Months, group: month }
  # The days of a benefit statement (daily benefit × days = benefit).
  - { pattern: Days, group: day }
  - { pattern: Days in hospital, group: day }
  # The credits of a tuition invoice (times the tuition per credit gives the amount).
  - { pattern: Credits, group: credit }
  - { pattern: Credit hours, group: credit }
