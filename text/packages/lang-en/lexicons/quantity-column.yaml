# Headings of the quantity column of an itemised table. With a unit price and an amount column, quantity × unit price is compared with the amount (line-amount-mismatch).
id: quantity-column
language: en
entries:
  - pattern: Quantity
  - pattern: Qty
  - pattern: Qty.
  - pattern: Units
  # The head count or ticket count of a registration or ticket order (a price per person, per ticket, per seat).
  - pattern: Tickets
  - pattern: Attendees
  - pattern: Seats
  - pattern: Persons
  - { pattern: Hours, group: hour }
  - { pattern: Miles, group: mile }
  # The months of a rent statement (monthly × months = annual).
  - { pattern: Months, group: month }
