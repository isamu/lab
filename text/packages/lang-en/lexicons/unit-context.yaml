# Units that need context (unit-mismatch). A unit named as a group is read only when its line also has one of these words. "in" is an inch only on a line about a size ("a 15.6 in display", "12 x 8 in"); elsewhere it is the preposition ("1 in 3 users", "5 in stock").
id: unit-context
language: en
entries:
  - pattern: "display"
    group: "in"
  - pattern: "screen"
    group: "in"
  - pattern: "monitor"
    group: "in"
  - pattern: "diagonal"
    group: "in"
  - pattern: "width"
    group: "in"
  - pattern: "height"
    group: "in"
  - pattern: "depth"
    group: "in"
  - pattern: "length"
    group: "in"
  - pattern: "thickness"
    group: "in"
  - pattern: "dimensions"
    group: "in"
  - pattern: "wide"
    group: "in"
  - pattern: "tall"
    group: "in"
  - pattern: "deep"
    group: "in"
  - pattern: "thick"
    group: "in"
  - pattern: "x"
    group: "in"
  - pattern: "×"
    group: "in"
