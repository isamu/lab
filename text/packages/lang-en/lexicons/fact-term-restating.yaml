# Participles written right after a one-value item's name (fact-document-term, fact-conflict) to say what the value was
# used for: "the number of dependants used for the dependant allowance" is the number of dependants. A word that narrows
# the item to a part ("the number of dependants under 17") is not here.
id: fact-term-restating
language: en
entries:
  - pattern: used
  - pattern: applied
