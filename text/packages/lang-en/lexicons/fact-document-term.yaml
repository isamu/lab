# Names of an item that has one value for the whole document (fact-conflict). A table cell's value is compared with a
# sentence's value in another section. Names with the same group are the same item. A qualified name ("part-time
# probation period") is a different name and is not compared.
id: fact-document-term
language: en
entries:
  - { pattern: probation, group: trial-period }
  - { pattern: probation period, group: trial-period }
  - { pattern: probationary period, group: trial-period }
  - { pattern: trial period, group: trial-period }
  # The age up to which one can join. A range in a table ("aged 20 to 70") and a limit in a sentence ("up to the age of
  # 70") are compared by their upper ends.
  - { pattern: age at entry, group: age-limit }
  - { pattern: entry age, group: age-limit }
  - { pattern: eligible age, group: age-limit }
  - { pattern: age limit, group: age-limit }
  - { pattern: maximum age, group: age-limit }
  - { pattern: maximum entry age, group: age-limit }
  - { pattern: maximum age at entry, group: age-limit }
  # The length of a warranty ("the warranty runs for 12 months" names it as the warranty). An extended warranty is
  # another name.
  - { pattern: warranty period, group: warranty-period }
  - { pattern: warranty term, group: warranty-period }
  - { pattern: warranty, group: warranty-period }
  # The number of dependants a tax calculation uses: one value per person in a withholding statement. A count by kind
  # ("Children under 17") is another name.
  - { pattern: number of dependants, group: dependants-count }
  - { pattern: number of dependents, group: dependants-count }
