# Marks that, right after the amount of a total phrase, start the list of every item of that total
# ("a total of $12,000: $5,000 for design and $6,000 for development", "a total of $12,000, of which ...").
# total-mismatch compares the total with the items up to the end of the sentence. "Including" is not one: it names a part.
id: total-breakdown-lead
language: en
entries:
  - pattern: ":"
  - pattern: "—"
  - pattern: "–"
  - pattern: of which
