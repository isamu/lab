# Endings that make an inflected or derived form of a dictionary word: unknown-word strips the ending (pattern) and
# puts the replacement (instead_of, empty when nothing goes back) before looking the stem up. "carried" is "carry",
# "stopped" is "stop" (a doubled last consonant is undone too), "baking" is "bake". The dictionary itself is
# dictionary.txt; this list only saves listing every inflected form there. An ending of group inflection (a plural, a
# past, a comparative) closes a word: unknown-word takes it on top of a derived word ("operationalises" is
# "operationalise" + s), never a derived ending on top of it, and never two of them ("oversers" is not "overs" + ers).
id: word-suffix
language: en
entries:
  - pattern: s
    instead_of: ""
    group: inflection
  - pattern: es
    instead_of: ""
    group: inflection
  - pattern: ies
    instead_of: "y"
    group: inflection
  # The Greek plural: "pneumoconioses" is "pneumoconiosis".
  - pattern: ses
    instead_of: "sis"
    group: inflection
  - pattern: ied
    instead_of: "y"
    group: inflection
  - pattern: ed
    instead_of: ""
    group: inflection
  - pattern: ed
    instead_of: "e"
    group: inflection
  - pattern: ing
    instead_of: ""
    group: inflection
  - pattern: ing
    instead_of: "e"
    group: inflection
  - pattern: er
    instead_of: ""
    group: inflection
  - pattern: er
    instead_of: "e"
    group: inflection
  - pattern: ers
    instead_of: ""
    group: inflection
  - pattern: ers
    instead_of: "e"
    group: inflection
  - pattern: ier
    instead_of: "y"
    group: inflection
  - pattern: iest
    instead_of: "y"
    group: inflection
  - pattern: est
    instead_of: ""
    group: inflection
  - pattern: est
    instead_of: "e"
    group: inflection
  # The adjective of a noun: "crunchy" is "crunch", "possessory" is "possessor", "stony" is "stone".
  - pattern: y
    instead_of: ""
  - pattern: y
    instead_of: "e"
  - pattern: ly
    instead_of: ""
  - pattern: ily
    instead_of: "y"
  - pattern: ness
    instead_of: ""
  - pattern: iness
    instead_of: "y"
  - pattern: ment
    instead_of: ""
  - pattern: ments
    instead_of: ""
  - pattern: able
    instead_of: ""
  - pattern: able
    instead_of: "e"
  - pattern: ability
    instead_of: "able"
  - pattern: ity
    instead_of: ""
  - pattern: ful
    instead_of: ""
  - pattern: less
    instead_of: ""
  - pattern: ize
    instead_of: ""
  - pattern: ization
    instead_of: "ize"
  - pattern: ise
    instead_of: ""
  - pattern: isation
    instead_of: "ise"
  - pattern: ation
    instead_of: "e"
  - pattern: ation
    instead_of: ""
  - pattern: ably
    instead_of: "able"
  - pattern: ibly
    instead_of: "ible"
  - pattern: men
    instead_of: "man"
    group: inflection
  # The follower of a doctrine and the doctrine: "relativist" is "relativism", "generalism" is "generalist".
  - pattern: ist
    instead_of: "ism"
  - pattern: ism
    instead_of: "ist"
  # The adjective of an -ion noun: "propositional" is "proposition".
  - pattern: ional
    instead_of: "ion"
