# Endings that make an inflected or derived form of a dictionary word: unknown-word strips the ending (pattern) and
# puts the replacement (instead_of, empty when nothing goes back) before looking the stem up. "carried" is "carry",
# "stopped" is "stop" (a doubled last consonant is undone too), "baking" is "bake". The dictionary itself is
# dictionary.txt; this list only saves listing every inflected form there.
id: word-suffix
language: en
entries:
  - pattern: s
    instead_of: ""
  - pattern: es
    instead_of: ""
  - pattern: ies
    instead_of: "y"
  - pattern: ied
    instead_of: "y"
  - pattern: ed
    instead_of: ""
  - pattern: ed
    instead_of: "e"
  - pattern: ing
    instead_of: ""
  - pattern: ing
    instead_of: "e"
  - pattern: er
    instead_of: ""
  - pattern: er
    instead_of: "e"
  - pattern: ers
    instead_of: ""
  - pattern: ers
    instead_of: "e"
  - pattern: ier
    instead_of: "y"
  - pattern: iest
    instead_of: "y"
  - pattern: est
    instead_of: ""
  - pattern: est
    instead_of: "e"
  - pattern: ly
    instead_of: ""
  - pattern: ily
    instead_of: "y"
  - pattern: ness
    instead_of: ""
  - pattern: iness
    instead_of: "y"
