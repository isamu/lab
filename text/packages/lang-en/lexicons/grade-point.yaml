# Grade words and the grade points they stand for (gpa-mismatch). group names the scale, weight is the points. A GPA is
# computed again from this list only when every scale that holds all of a document's grades gives each the same points
# (A is 3 on the S scale and 4 on the A-to-F scale, so a document with neither S nor D is not compared). A grading key
# written in the document ("A (4), B (3)") is used first. A+ is left out: schools give it 4.0 or 4.3. group: none is a
# grade with no points (Pass, W, In progress), left out of both sums.
id: grade-point
language: en
entries:
  - { pattern: A, group: a-f, weight: 4 }
  - { pattern: B, group: a-f, weight: 3 }
  - { pattern: C, group: a-f, weight: 2 }
  - { pattern: D, group: a-f, weight: 1 }
  - { pattern: F, group: a-f, weight: 0 }
  - { pattern: S, group: s-d, weight: 4 }
  - { pattern: A, group: s-d, weight: 3 }
  - { pattern: B, group: s-d, weight: 2 }
  - { pattern: C, group: s-d, weight: 1 }
  - { pattern: D, group: s-d, weight: 0 }
  - { pattern: F, group: s-d, weight: 0 }
  - { pattern: A, group: plus-minus, weight: 4 }
  - { pattern: A-, group: plus-minus, weight: 3.7 }
  - { pattern: B+, group: plus-minus, weight: 3.3 }
  - { pattern: B, group: plus-minus, weight: 3 }
  - { pattern: B-, group: plus-minus, weight: 2.7 }
  - { pattern: C+, group: plus-minus, weight: 2.3 }
  - { pattern: C, group: plus-minus, weight: 2 }
  - { pattern: C-, group: plus-minus, weight: 1.7 }
  - { pattern: D+, group: plus-minus, weight: 1.3 }
  - { pattern: D, group: plus-minus, weight: 1 }
  - { pattern: D-, group: plus-minus, weight: 0.7 }
  - { pattern: F, group: plus-minus, weight: 0 }
  - { pattern: P, group: none }
  - { pattern: Pass, group: none }
  - { pattern: CR, group: none }
  - { pattern: W, group: none }
  - { pattern: I, group: none }
  - { pattern: IP, group: none }
  - { pattern: In progress, group: none }
  - { pattern: AU, group: none }
  - { pattern: NC, group: none }
