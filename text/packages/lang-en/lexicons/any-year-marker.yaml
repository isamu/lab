# Words that make a yearless date no date of one year. date-without-year does not report a date they cover: "every year on
# April 1" is a day that comes round each year, and "for example, a request received on April 1" is a date in an example.
# A word without a group covers the rest of its sentence (not past a closing bracket), and the list a line ending in it
# introduces ("for example:"). group: example covers that and the rest of its list item. group: continues, opening a list
# item just after an example's item, carries the example on ("- If the change is instead processed on June 25, …").
# group: adjacent covers only the date just after it ("each December 31"). group: near covers a date a few characters
# after it ("the fiscal year end is December 31"). group: label covers the dates in the bracket after it ("New Year
# holidays (December 29 to January 3)").
id: any-year-marker
language: en
entries:
  - pattern: for example
    group: example
  - pattern: for instance
    group: example
  - pattern: e.g.
    group: example
  - pattern: if
    group: continues
  - pattern: every year
  - pattern: each year
  - pattern: each
    group: adjacent
  - pattern: every
    group: adjacent
  - pattern: quarter end dates
  - pattern: quarter-end dates
  - pattern: fiscal year end
    group: near
  - pattern: fiscal year-end
    group: near
  - pattern: fiscal year ends
    group: near
  - pattern: financial year end
    group: near
  - pattern: financial year ends
    group: near
  - pattern: New Year holidays
    group: label
  - pattern: year-end holidays
    group: label
