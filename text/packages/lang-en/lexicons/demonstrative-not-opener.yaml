# Openings with This, That or It that do not point back at the sentence before: the document itself ("This Agreement
# may be modified…", "This section explains…"), an "it" that stands for what follows ("It is worth noting that…"), and a
# "that" that opens a clause ("That the plan failed is clear"). An "it" before an adjective listed here is read as standing
# for what follows; one that points back there is missed, never misreported. demonstrative-opener-run does not count a
# sentence that opens with one.
id: demonstrative-not-opener
language: en
entries:
  - pattern: this agreement
  - pattern: these terms
  - pattern: this document
  - pattern: this section
  - pattern: this subsection
  - pattern: this chapter
  - pattern: this part
  - pattern: this article
