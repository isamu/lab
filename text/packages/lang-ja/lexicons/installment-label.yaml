# 分割払い・ローンの支払い内容の見出し（installment-total-mismatch）。count は支払回数、each は毎回のお支払額、first と
# last は別の額で書く初回と最終回、total はお支払総額。初回 + 毎回の額 × 残りの回数 + 最終回 がお支払総額になるかを比べる。
id: installment-label
language: ja
entries:
  - { pattern: お支払回数, group: count }
  - { pattern: お支払い回数, group: count }
  - { pattern: 支払回数, group: count }
  - { pattern: 支払い回数, group: count }
  - { pattern: ご返済回数, group: count }
  - { pattern: 返済回数, group: count }
  - { pattern: 分割回数, group: count }
  - { pattern: 毎月のお支払額, group: each }
  - { pattern: 毎月のお支払い額, group: each }
  - { pattern: 毎月のお支払金額, group: each }
  - { pattern: 月々のお支払額, group: each }
  - { pattern: 月々のお支払い額, group: each }
  - { pattern: 月々のお支払金額, group: each }
  - { pattern: 毎回のお支払額, group: each }
  - { pattern: 毎月のご返済額, group: each }
  - { pattern: 毎月の返済額, group: each }
  - { pattern: 月々のご返済額, group: each }
  - { pattern: 月々の返済額, group: each }
  - { pattern: 1回あたりのお支払額, group: each }
  - { pattern: 2回目以降, group: each }
  - { pattern: 2回目以降のお支払額, group: each }
  - { pattern: 初回, group: first }
  - { pattern: 初回お支払額, group: first }
  - { pattern: 初回のお支払額, group: first }
  - { pattern: 初回お支払金額, group: first }
  - { pattern: 初回のお支払金額, group: first }
  - { pattern: 最終回, group: last }
  - { pattern: 最終回お支払額, group: last }
  - { pattern: 最終回のお支払額, group: last }
  - { pattern: お支払総額, group: total }
  - { pattern: お支払い総額, group: total }
  - { pattern: 支払総額, group: total }
  - { pattern: 支払い総額, group: total }
  - { pattern: ご返済総額, group: total }
  - { pattern: 返済総額, group: total }
  - { pattern: 総支払額, group: total }
  # numbered は表の行や箇条書きの頭に置く分納の見出しで、{n} が何回目か（第1回、第2回）。final はその後に来る最後の回、
  # deposit は分納の一つとして並べる申込金。これらの額を足して、同じ節に書いた費用（旅行代金は1人あたり62,000円）と比べる。
  - { pattern: "第{n}回", group: numbered }
  - { pattern: "{n}回目", group: numbered }
  - { pattern: 最終回, group: final }
  - { pattern: 申込金, group: deposit }
  - { pattern: 申し込み金, group: deposit }
  - { pattern: 予約金, group: deposit }
