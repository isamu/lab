# 名前と番地のあいだに挟まる括弧書き（正規表現）。飛ばして、その前の名前を読む。
# 法令の題名に添える公布の番号と、略称（「国家行政組織法（昭和二十三年法律第百二十号）第三条」
# 「（平成十三年法律第百四十号。以下この章において「独立行政法人等情報公開法」という。）」）。
# 括弧は半角でもよい（厚生労働省法令等データベースの「保険医療養担当規則(昭和三十二年厚生省令第十五号)」）。
# 題名の後ろに略称の括弧を置いてから公布の番号を添える書き方（「使用薬剤の薬価(薬価基準)(平成二十年厚生労働省告示第六十号)」）も一つの括弧書き。長いほうを先に当てる。
# どの行も公布の番号を含む。番号を添えた名前は、種類の語が無くても文書の名前として読む（lang-ja/src/citation.ts）。
id: name-note
language: ja
entries:
  - pattern: "[（(][^（）()]{1,20}[）)][（(](?:明治|大正|昭和|平成|令和)[^（）()]{1,24}号(?:。以下[^（）()]{1,60}という。)?[）)]"
  - pattern: "[（(](?:明治|大正|昭和|平成|令和)[^（）()]{1,24}号(?:。以下[^（）()]{1,60}という。)?[）)]"
