# 合計と後ろの金額のあいだにあれば、その金額は合計の内訳のすべてとは限らないと読む語。一部だけ（「うち設計5,000円」）、
# どれか一つ（「5,000円または6,000円」）、上限（「最大5,000円」）。total-mismatch は、このときの内訳を合計と比べない。
id: breakdown-partial-word
language: ja
entries:
  - pattern: うち
  - pattern: など
  - pattern: 等
  - pattern: 含む
  - pattern: 含め
  - pattern: 少なくとも
  - pattern: または
  - pattern: 又は
  - pattern: もしくは
  - pattern: 若しくは
  - pattern: 最大
  - pattern: 上限
  # group main: 並べた金額が主なものだけだと言う語。合計の前の内訳（「主な設備投資は、A 20百万円、B 79百万円の総額190百万円」）や
  # 「主な内訳は」の前にあっても、内訳を合計と比べない。
  - { pattern: 主な, group: main }
  - { pattern: 主に, group: main }
  - { pattern: 主として, group: main }
  - { pattern: 主要な, group: main }
  - { pattern: 主たる, group: main }
