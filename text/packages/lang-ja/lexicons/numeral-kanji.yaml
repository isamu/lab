  - pattern: 一
  - pattern: 二
  - pattern: 三
  - pattern: 四
  - pattern: 五
  - pattern: 六
  - pattern: 七
  - pattern: 八
  - pattern: 九
  - pattern: 十
  - pattern: 百
  - pattern: 千
  - pattern: 万
  - pattern: 億
