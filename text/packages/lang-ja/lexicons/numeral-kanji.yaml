# 漢数字として数を書く字。これだけの並びが数え方の語の前にあれば、数を漢数字で書いたと読む。
# 「一」だけの数は数えない（一つ・一人・一回は言い回しとして漢字で書く文書が多く、書き方の選び方の票にならない）。
id: numeral-kanji
language: ja
entries:
