# 「させていただく」。1 度なら丁寧だが、重なると誰の判断なのかが消える。
# 「いただける」は可能の形（させていただけますか・させていただけない）で、別の語に解析されるので別に書く。
# 「せていただく」は五段動詞の形（読ませていただく・休ませていただく）。「させていただく」と重なっても終わる位置で一回に数える。
