# 一語として比べる語。辞書が一方の書き方だけを一語に持ち、もう一方を語と接尾語に切る語を並べる。
# 「お客様」は一語、「お客さま」は「お客」と「さま」に切られ、その「さま」が名前の後の「様」（山田 太郎 様）と比べられてしまう。
# ここに挙げた語は、切られ方にかかわらず一語として束ねるので、「お客さま」は「お客様」とだけ比べる。
# 名前や役目の後に付ける「様」（会員様、ご家族様）は接尾語のままで、ここには挙げない。
# どちらの書き方も辞書が一語に持つ語（皆様と皆さま、お疲れ様とお疲れさま）は、読みで比べられるので挙げない。
# pattern は書いたとおりの語。漢字とかなの両方の書き方を挙げ、group に語の名前（漢字の書き方）を書く。同じ group の書き方どうしを比べる。
# 読みでは束ねない: 「お父様」は「オ」「トウサマ」、「お父さま」は「オ」「チチ」「サマ」と読まれる。
id: orthographic-variant-whole-word
language: ja
entries:
  - { pattern: お客様, group: お客様 }
  - { pattern: お客さま, group: お客様 }
  - { pattern: お得意様, group: お得意様 }
  - { pattern: お得意さま, group: お得意様 }
  - { pattern: お嬢様, group: お嬢様 }
  - { pattern: お嬢さま, group: お嬢様 }
  - { pattern: お父様, group: お父様 }
  - { pattern: お父さま, group: お父様 }
  - { pattern: お互い様, group: お互い様 }
  - { pattern: お互いさま, group: お互い様 }
  - { pattern: お陰様, group: お陰様 }
  - { pattern: お陰さま, group: お陰様 }
  - { pattern: おかげさま, group: お陰様 }
  - { pattern: ご苦労様, group: ご苦労様 }
