# 定員と人数を比べない印（count-over-capacity）。group overflow は定員か人数と同じ節にあれば、定員を超える申込が書いたとおりのこと
# （キャンセル待ち、抽選）。per-session は同じ行にあれば一回・一日あたりの数（各回定員20名）。other-occasion は人数と同じ行に
# あれば別の時の人数（昨年は120名が参加）。negation は人数の後ろの句にあれば申し込んでいない人の数（45名が登録していません）。
