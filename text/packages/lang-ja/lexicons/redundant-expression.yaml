# 重言。同じ意味の語を重ねた言い回し。redundant-expression が読む。rewrite は重ねを外した形。
# 載せるのは、重ねずに言える形がはっきりしていて、ふつうの文書で重ねる理由の無いものだけ。
# 辞書が一語として載せる慣用（排気ガス、射程距離、製造メーカー）と、重ねて強める書き方として定着したもの
# （犯罪を犯す、あらかじめ予約）は載せない。動詞は原形で書けば活用した形にも当たる。
id: redundant-expression
language: ja
entries:
  - pattern: 頭痛が痛い
    rewrite: 頭が痛い、または頭痛がする
  - pattern: 一番最初
    rewrite: 最初
  - pattern: 一番最後
    rewrite: 最後
