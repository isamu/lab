# 指示語で始まっても前の文を指さない、話を切り替える決まった言い回し（それはとにかく、…）。demonstrative-opener-run は、
# これで始まる文を数えない。一語の接続詞（それでも、そこで、それにしても）は語に分かれないので、ここに入れなくても当たらない。
# 「それにもかかわらず」「そのため」は前の文を受け、「それはそうと」は「それはそうと思う」と区別できないので入れない。
# 「その上、」「その上で、」は接続詞「そのうえ」「そのうえで」の漢字書きで、かなで書けば一語に読まれて当たらない。
# 読点の無い「その上で」「その上に」は場所も指す（その上で寝ころんでいた）ので入れない。
id: demonstrative-not-opener
language: ja
entries:
  - pattern: それはとにかく
  - pattern: それはともかく
  - pattern: それはさておき
  - pattern: それはそれとして
  - pattern: その上、
  - pattern: その上で、
