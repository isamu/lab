# 「それ以外の」とだけ言う語（他の）。no-doubled-joshi は、この語の直後の「の」を入れ子の「の」と数えない。
# 「他のすべてのディレクティブの代替」の「他の」は名詞を名詞の中に入れず、「ディレクティブ」を絞るだけ。
# 「すべて」「全て」は入れない。「オブジェクトのすべてのプロパティのアクセス」「全ての世帯の1世帯当たりの」のように、入れ子の輪の一つとして
# 読むことが多い。
# 「その他」は解析器が一語に読む（申出書その他の書類）ので、「他」とは別に入れる。
id: particle-run-determiner
language: ja
entries:
  - pattern: 他
  - pattern: ほか
  - pattern: その他
