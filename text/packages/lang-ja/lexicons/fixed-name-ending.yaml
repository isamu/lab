# 法令・制度・給付の名前を閉じる語。漢字の連なりがこれで終われば、文のどこに置かれていても、
# 書き手が組み立てた句ではなく変えられない正式な名前（住民基本台帳法施行令、勤労者財産形成貯蓄制度、社会資本整備総合交付金）。
# 法律は、題の終わりの語（〜の促進に関する法律）。感謝状は、職名で始まる表彰の名前（内閣総理大臣感謝状）。
# 閉じる語は語の切れ目で始まり、前に 2 字以上の語が要る（解決方法の「法」、新制度は当たらない）。
# 書き手が自分で組み立てた句も閉じる語（会議・試験・報告書・事業・戦略・協議会・機構）は title-ending に置く。そちらは題の置き方か、
# 文書の中での繰り返しが要る（新規顧客獲得施策検討会議、業務効率化推進体制整備事業は、一度だけ文の中で使えば数える）。
id: fixed-name-ending
language: ja
entries:
  - pattern: 法
  - pattern: 施行令
  - pattern: 施行規則
  - pattern: 規則
  - pattern: 政令
  - pattern: 省令
  - pattern: 条例
  - pattern: 制度
  - pattern: 交付金
  - pattern: 補助金
  - pattern: 助成金
  - pattern: 給付金
  - pattern: 大綱
  - pattern: 白書
  - pattern: 法律
  - pattern: 感謝状
