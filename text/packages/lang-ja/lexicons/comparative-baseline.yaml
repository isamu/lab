# 比べる相手の無い比較を comparative-without-baseline が読むための語。
# marker: 程度を言う語の前に立つ比べる副詞（より良い、さらに高速）。助詞の「より」（従来より速い）は相手を言うので含まない。
# baseline: 比べる相手を言う語。同じ文か直前の文にあれば、相手は書いてある。「一方」は前の節を相手に立てる（Aは下落した一方、Bはより安定）。語に分かれて書かれていても読む（これ・まで）。「の方が」は比べる二つの一方を立てる（良い例2の方がより良い）。
# exempt: 比べる副詞の後ろで、比較でない決まった言い方を作る語（より多くの人に、より詳しくは、さらに詳しく、さらに一般に＝もっと広く言えば）と、程度でなく位置を言う語（さらに上の階層）。
# condition: 比較より前にあれば、比較を条件の下に置く語（入れるとより良くなる）。比べる相手は、その条件の無い場合。
# aim: 比べた語のすぐ後ろで、今より良くする目当てを作る語（より良い社会、より豊かな暮らし、より良いものにする、より良くする、より簡単にする）。
#   比べる相手は今の状態。「より速くなる」「より速くした」は変わったことを言うだけで目当てではないので、なると過去の形は含まない。
#   名詞の並びに「の」と続けて目当てを言うこともある（より良い多文化共生の実現）。
# cause: 比べた語より前で、比較が何の結果かを言う語（これにより互換性の確保がより困難になった、把握できるため、指導がより可能になる）。
#   比べる相手は、その原因が無かったときの状態。比べた語より後ろの「ため」は理由か目的で、intent が読む。
id: comparative-baseline
language: ja
entries:
  - { pattern: より, group: marker }
  - { pattern: さらに, group: marker }
  - { pattern: 比べ, group: baseline }
  - { pattern: 比較, group: baseline }
