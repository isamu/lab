  - { pattern: ため, group: cause }
  # intent: 比べた語より後ろで、比較を願いや目的の中に置く語（より広く進めたい、より円滑に接続させていくためには、より簡素にすべきだ）。
  #   比べる相手は今の状態。「できる」は宣伝の「より速く動かせます」と見分けがつかないので含まない。理由の「ため」（速くなったため、雨のため、方法があるため）は目的ではないので数えない。
  #   「より良い対応を目指す」「充実を図る」は名詞を目当てに立てるだけで、何より良いのかを言わない宣言なので含めない。
  - { pattern: たい, group: intent }
  - { pattern: ため, group: intent }
  - { pattern: べき, group: intent }
