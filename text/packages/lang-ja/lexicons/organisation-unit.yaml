# 組織や、組織の中の単位の名前を閉じる語（〜省・〜局・〜課、〜研究所、〜協会）。経済産業省製造産業局自動車課のように、
# これで閉じる区切りが続けば、組織の名前を上から下へ並べたもの。区切りは語の切れ目で、前に 2 字以上の語が要る（課題・外部は区切りにならない）。
# 説明会・検討会のような催しにも付く語と、普通の語の末尾にもなる社（販売会社）は入れない（個人情報保護法施行規則改正案検討会は数える）。
