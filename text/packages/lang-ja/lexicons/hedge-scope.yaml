# excessive-hedging の語のうち、書き手の確かさを下げないもの。
# 「エラーになる場合があります」は、どれだけ確かかではなく、どこで成り立つかを言っている。
# 「几帳面だと思われているかもしれません」の「と思われている」は、ほかの人がどう見ているかを言っていて、書き手の逃げではない。
# 1 つの文の重なりには数えない（「〜の場合があり、〜と考えられます」を重ねたとは言わない）。密度には数える。
id: hedge-scope
language: ja
entries:
  - pattern: 場合がある
  - pattern: と思われている
  - pattern: と考えられている
