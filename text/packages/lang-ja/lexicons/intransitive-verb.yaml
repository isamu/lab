# 動作を受ける側を主語にする受動を作らない自動詞。「市長が町へ来られ」「参加者が取り組まれ」「委員を辞任され」の
# 「れる/られる」は尊敬か可能で、隠れた動作主はいない。agentless-passive はこれを受動に数えない。
# 形態素解析の原形（基本形）で照らす。サ変名詞（参加・辞任）は「する」の直前にあるときだけ見る。
# 本動詞だけを見る。補助動詞の「連れてこられた」「持っていかれた」は受動のまま（passive-reading.ts）。
# 受け入れた限界: 自動詞にも迷惑の受身がある（「突然、家に来られて困った」）。尊敬と形で分けられず、これは指摘しなくなる。
# 迷惑の受身が尊敬と同じくらい出る動詞は入れない（「先に行かれて困った」の行く）。
# 他動詞は入れない: 「言われました」「受けられた」は、主語が言った人か言われた人かで尊敬にも受動にもなり、形で分けられない。
id: intransitive-verb
language: ja
entries:
  - pattern: 来る
  - pattern: 取り組む
  - pattern: 参加
  - pattern: 出席
  - pattern: 辞任
  - pattern: 就任
  - pattern: 退任
  - pattern: 活躍
