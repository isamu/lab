# 最上級が何と比べているかを言う語。文にあれば「最も速い」は誇張ではなく主張になる。
# 動詞は原形で書く。「に比べる」は「に比べて」「に比べると」「に比べ、」に当たる。
# 「の方が」は入れない。「担当の方が最も詳しい」の「方」は人で、比べていない。
# position: before の語は、最上級のすぐ前にあるときだけ効く。「SES との最大の分岐点」の「との」は相手を言うが、
# 「チームとの会議で最高の成果」の「との」は最上級と関わらない。
id: comparison-marker
language: ja
entries:
  - pattern: より
  - pattern: に比べる
  - pattern: と比べる
  - pattern: のうち
  - pattern: のほうが
  - pattern: との
    position: before
