# 最上級が何と比べているかを言う語。文にあれば「最も速い」は誇張ではなく主張になる。
# 動詞は原形で書く。「に比べる」は「に比べて」「に比べると」「に比べ、」に当たる。
# 「の方が」は入れない。「担当の方が最も詳しい」の「方」は人で、比べていない。
# position: before の語は、最上級のすぐ前にあるときだけ効く。「SES との最大の分岐点」の「との」は相手を言うが、
# 「チームとの会議で最高の成果」の「との」は最上級と関わらない。
# 「Ｇ７の中で最も低い」の「の中で」も、すぐ前で何の中で最もなのかを言う。
# 「県内でも」「社内でも」は「も」まで付けて範囲を強く言う形で、最上級から離れていても（雲南省内でも特に緑が豊かな景観と、
# 最も保存状態が良い都市群）その文の最上級の範囲になる。「も」の無い「内で」は文のどこにでも効くとは限らない。
# 解析器は「県内」「省内」を一語にするので、場を言う「〜内」の語ごとに挙げる。一語にならない「内」（業界内）は「内でも」で当たる。
