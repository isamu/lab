# 起点の「より」に続く語。yori-as-from が読む。
# head: 始まる・送る・来ることを言う語（4月1日より開始、担当者よりご連絡、東京より参りました）。
#   名詞の head は、object の語か「する・いたす」が続くときだけ当てる（受付を開始、開始します）。
#   「昨年より販売が増えた」の「販売」は比べられている名詞なので当てない。
# 「増える」「多い」のように比較に続く語は入れない。
id: origin-head
language: ja
entries:
  - pattern: 開始
    group: head
  - pattern: 始まる
    group: head
  - pattern: 始める
    group: head
  - pattern: 受付
    group: head
  - pattern: 実施
    group: head
  - pattern: 施行
    group: head
  - pattern: 適用
    group: head
  - pattern: 運用
    group: head
  - pattern: 販売
    group: head
  - pattern: 発売
    group: head
  - pattern: 提供
    group: head
  - pattern: 配信
    group: head
