# 数を漢数字で書いた語。number-word-figure-mismatch が「三（4）か月」「金参拾万円（30,000円）」を読む。weight はその字の値。
# group は前後の字とのつながり方: digit は足す、place（十・百・千）はその前の digit に掛ける、scale（万・億）はそこまで全体に掛ける。
# 大字（壱・弐・参・拾・萬）も同じ値で読む。lead は漢字に続けて一字の数を書くとき前に立ってよい字（金参拾万円、年五パーセント、期間三か月、第三号）。unit は数と括弧のあいだ、括弧の中の数の後ろに立ってよい語。
