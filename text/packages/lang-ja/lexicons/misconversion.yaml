# 仮名漢字変換の取り違え。pattern が誤った形、instead_of が正しい形。misconversion が読む。
# 前後の語で誤りと決まる形だけを、前後の語ごと書く。「以外と」だけでは「日本以外と比べて」と区別できないので、
# 後ろの語まで書いた「以外と簡単」だけを載せる。動詞は原形で書けば活用した形（会った・会います）にも当たる。
# 形容詞は活用した形に当たらないので、要る形を並べる（多い・多く・多かっ）。
# それ自体が誤りの四字熟語（絶対絶命）と、語にならない形（不可決）はそのまま載せる。
# 「例え〜ても」は「たとえ」の当て字として辞書に載るので、誤りとしない。
id: misconversion
language: ja
entries:
  # 意外と・意外に
  - pattern: 以外と簡単
    instead_of: 意外と簡単
  - pattern: 以外に簡単
    instead_of: 意外に簡単
  - pattern: 以外と多い
    instead_of: 意外と多い
  - pattern: 以外と多く
    instead_of: 意外と多く
  - pattern: 以外と多かっ
    instead_of: 意外と多かっ
  - pattern: 以外と少ない
    instead_of: 意外と少ない
  - pattern: 以外と少なかっ
    instead_of: 意外と少なかっ
  - pattern: 以外と難しい
