    instead_of: 意外と難しかっ
  - pattern: 以外と知られていない
    instead_of: 意外と知られていない
  - pattern: 以外と早く
    instead_of: 意外と早く
  - pattern: 以外と安い
    instead_of: 意外と安い
  - pattern: 以外と安く
    instead_of: 意外と安く
  - pattern: 以外と大変
    instead_of: 意外と大変
