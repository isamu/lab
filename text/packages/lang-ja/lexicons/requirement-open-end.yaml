# 列挙を閉じない語（Femmer ほか 2017 の open-ended terms）。要求の文にあると、ほかに何が含まれるのかを読み手が決められない。
# group: class-link と class-suffix は語ではなく、一覧のすぐ後ろで種類を名指す目印。「印刷等、二次的に利用」「印刷等の二次的利用」は、
# 「等」のすぐ後ろ（class-link）の名詞が「的」（class-suffix）で種類を名指していて、一覧はその例なので開いていない。
id: requirement-open-end
language: ja
entries:
  - pattern: 等
  - pattern: など
  - { pattern: 、, group: class-link }
  - { pattern: の, group: class-link }
  - { pattern: 的, group: class-suffix }
  # group: scope-* も語ではなく、一覧が何に属するかの目印。「ログ等を保存すること」の一覧は果たす義務の中にあって開いている。
  # 条件（訂正等を行った際に）、与える権利（消去できるものとします）、禁止や免責（転載等をしてはならない、責任を負わないものとします）
  # の中の一覧は、わざと広く取った契約の普通の書き方。「等」の後ろで最初に当たった目印が決める。条件の語は、述語のすぐ後ろにあって、
  # 一覧の節が読点で閉じる前（消去し、の前）のときだけ数える。
  - { pattern: なければならない, group: scope-duty }
  - { pattern: なければなりません, group: scope-duty }
  - { pattern: 必要がある, group: scope-duty }
  - { pattern: ものとする, group: scope-duty }
  - { pattern: できるものとする, group: scope-permission }
  - { pattern: 出来るものとする, group: scope-permission }
  - { pattern: てはならない, group: scope-prohibition }
  - { pattern: てはなりません, group: scope-prohibition }
  - { pattern: ないものとする, group: scope-prohibition }
  - { pattern: 場合, group: scope-condition }
  - { pattern: 際, group: scope-condition }
  - { pattern: とき, group: scope-condition }
