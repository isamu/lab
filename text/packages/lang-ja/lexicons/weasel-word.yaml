# 主張を名前の無い大勢や、どれとも言わない研究に預ける言い回し。weasel-word が読む。
# 「研究によると」「専門家によると」は前に出典が来ることが多い（「厚生労働省の研究によると」）ので、出典の無い形（ある・最近の・
# 多くの）だけを入れる。「と言われる」は「〜と言われるほど」「直せと言われると」のように言い伝えでない使い方が多いので、
# 「と言われている」（います・いた）だけ。「よく言われる話」「とよく言われるように」は言い回しそのものを話題にしているので入れない。
# 「一般的に」だけでは「一般的に使用されます」も当たるので入れない。
id: weasel-word
language: ja
entries:
  - pattern: と言われている
  - pattern: といわれている
  - pattern: と言われております
  - pattern: 一般的に言われる
  - pattern: 一般に言われる
  - pattern: 専門家の間では
  - pattern: 多くの専門家が
  - pattern: 多くの専門家は
  - pattern: ある専門家によると
  - pattern: ある専門家によれば
  - pattern: 一部の専門家
  - pattern: 専門家の多く
  - pattern: 多くの人が考える
  - pattern: 多くの人が思う
  - pattern: 多くの人が言う
  - pattern: 多くの人が信じる
  - pattern: 誰もが知っている
  - pattern: ある研究によると
  - pattern: ある研究によれば
  - pattern: ある研究では
  - pattern: ある調査によると
  - pattern: ある調査によれば
  - pattern: 最近の研究によると
  - pattern: 最近の研究によれば
  - pattern: 最新の研究によると
  - pattern: 最新の研究によれば
  - pattern: 多くの研究で
  - pattern: 多くの研究が
