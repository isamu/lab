  - { pattern: 年収モデル, group: example }
  - { pattern: モデル年収, group: example }
  - { pattern: 年俸, group: salary }
  - { pattern: 年俸制, group: salary }
  - { pattern: 月給, group: monthly }
  - { pattern: 月額給与, group: monthly }
  - { pattern: 月収, group: monthly }
  - { pattern: 基本給, group: monthly }
