# 求人の給与の見出し（annual-pay-mismatch）。example は年収の例（月給の12か月分と賞与の月数分を足した額と比べる）。
# 「平均年収」のような例でない年収を読まないよう、ただの「年収」は入れない。salary は年俸で、これのある文書は比べない（月給が
# 年俸の12分の1とも14分の1・16分の1ともありうるため）。monthly は月給、pay は「月額」「/月」などの語が一緒にあるときだけ
# 月給として読む見出し、bonus は賞与。
