# 返しの語（contrast-turn）が同じ文の後ろか次の文の頭に来たときだけ対比の枠になる打ち消し。
# 「単なる X ではなく」「〜ではありません。むしろ〜です。」。「単なる設定ミスです」は枠ではない。
# group closing: 同じ文が返しの語（contrast-turn の closing、です・だ）で閉じたときだけ枠になる打ち消し。
# 「問題は道具ではなく、運用です。」。読点が無い「紙ではなく画面で確認します」や、ますで閉じる文は数えない。
# 「ではなく、」は解析器が語彙表の側の「では」を接続詞に読むので、「はなく、」で書く。
# 「ではありません」と書くと、解析器が語彙表の側の「では」を接続詞に読んで当たらないので、「はありません」で書く。
id: contrast-lead
language: ja
entries:
  - pattern: 単なる
  - pattern: はありません
  - pattern: ではない
  - pattern: ではなく
  - pattern: はなく、
    group: closing
