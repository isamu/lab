  - { pattern: 上方へ修正, group: rise }
  - { pattern: 増額修正, group: rise }
  - { pattern: 引き上げ, group: rise-verb }
  - { pattern: 引上げ, group: rise-verb }
  - { pattern: 下方修正, group: fall }
  - { pattern: 下方に修正, group: fall }
  - { pattern: 下方へ修正, group: fall }
  - { pattern: 減額修正, group: fall }
