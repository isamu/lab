# 業績予想を修正した向きを言う語（revision-direction-mismatch）。group は向き: rise は上へ、fall は下へ。
# rise-verb と fall-verb は、同じ文に forecast の語（予想）があるときだけ読む（「価格を引き上げ」は予想の修正ではない）。
# 前回の予想と今回の予想を並べた表と同じ節に書いたものを読む。
