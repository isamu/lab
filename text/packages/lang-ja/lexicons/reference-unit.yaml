# 検査結果の表で、結果と基準値に書く単位と、その単位が何か（group）。group が同じなら同じ単位で、数を換算しなくても比べられる
# （mg/dL と mg/100mL、×10⁴/µL と 万/µL、×10³/µL と ×10⁹/L、µIU/mL と mIU/L、一価のイオンの mEq/L と mmol/L）。結果と基準値の group が違えば
# reference-unit-mismatch が言う。字は NFKC と小文字にそろえて当てるので、mg/dl・ｍｇ／ｄＬ・μ と µ は書き分けなくてよい。
id: reference-unit
language: ja
