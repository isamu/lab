  - { pattern: 測定値, group: result }
  - { pattern: 検査値, group: result }
  - { pattern: 結果値, group: result }
  - { pattern: 基準値, group: range }
  - { pattern: 基準範囲, group: range }
  - { pattern: 基準値範囲, group: range }
  - { pattern: 参考基準値, group: range }
  - { pattern: 参考値, group: range }
  - { pattern: 正常値, group: range }
  - { pattern: 正常範囲, group: range }
  - { pattern: 単位, group: unit }
