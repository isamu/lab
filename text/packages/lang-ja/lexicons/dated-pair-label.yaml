# 前後の決まった日付の組。group が組の名前で、position before が先に来るはずの日付の語、after が後に来るはずの日付の語。
# 行の頭（表なら最初の列）にこの語と年のある日付があり、after の日付が before の日付より前なら指す（due-before-issue）。
id: dated-pair-label
language: ja
entries:
  - { pattern: "掲載日", group: listing, position: before }
  - { pattern: "掲載開始日", group: listing, position: before }
  - { pattern: "情報公開日", group: listing, position: before }
  - { pattern: "情報登録日", group: listing, position: before }
  - { pattern: "登録日", group: listing, position: before }
  - { pattern: "入居可能日", group: listing, position: after }
  - { pattern: "入居可能時期", group: listing, position: after }
  - { pattern: "入居時期", group: listing, position: after }
  - { pattern: "入居予定日", group: listing, position: after }
  - { pattern: "入居日", group: listing, position: after }
  - { pattern: "掲載日", group: job, position: before }
  - { pattern: "掲載開始日", group: job, position: before }
  - { pattern: "募集開始日", group: job, position: before }
  - { pattern: "応募締切", group: job, position: after }
  - { pattern: "応募締切日", group: job, position: after }
  - { pattern: "応募締め切り", group: job, position: after }
  - { pattern: "応募期限", group: job, position: after }
  - { pattern: "募集締切", group: job, position: after }
  - { pattern: "募集締切日", group: job, position: after }
  # 決算の資料。決算説明会と決算発表は、報告する期間が終わってから開く。対象期間の行は期間を書くので、その終わりと比べる（dated-span-label）。
  # 「発表日」だけは入れない。キャンペーンの告知のように、期間の終わる前に出す文書の日付でもある。
  # 「説明会開催日」だけも入れない。補助金の案内の説明会は、対象期間の中に開く。
  - { pattern: "対象期間", group: earnings, position: before }
  - { pattern: "報告対象期間", group: earnings, position: before }
  - { pattern: "会計期間", group: earnings, position: before }
  - { pattern: "決算説明会", group: earnings, position: after }
  - { pattern: "決算説明会開催日", group: earnings, position: after }
  - { pattern: "決算発表日", group: earnings, position: after }
  # 健診や検査の結果。受診した日、採血した日より後に、結果を報告する。
  # 「発行日」「作成日」は入れない。受診券、検査の依頼書や案内は、受診日や採血日より前に発行し作成する。
  - { pattern: "受診日", group: checkup-report, position: before }
  - { pattern: "検査日", group: checkup-report, position: before }
  - { pattern: "採血日", group: checkup-report, position: before }
  - { pattern: "健診日", group: checkup-report, position: before }
  - { pattern: "報告日", group: checkup-report, position: after }
  # 製品の保証書。製品の登録の締切は、買った日より後に来る。
  - { pattern: "お買い上げ日", group: warranty, position: before }
  - { pattern: "購入日", group: warranty, position: before }
  - { pattern: "ご購入日", group: warranty, position: before }
  - { pattern: "登録の締切", group: warranty, position: after }
  - { pattern: "登録期限", group: warranty, position: after }
  - { pattern: "製品登録の締切", group: warranty, position: after }
  - { pattern: "ご愛用者登録の締切", group: warranty, position: after }
  # ローンや分割払いの返済予定表。初回のお支払日は、契約した日、申し込んだ日より後に来る。
  - { pattern: "ご契約日", group: loan, position: before }
  - { pattern: "契約日", group: loan, position: before }
  - { pattern: "お申込日", group: loan, position: before }
  - { pattern: "お申し込み日", group: loan, position: before }
  - { pattern: "初回お支払日", group: loan, position: after }
  - { pattern: "初回お支払い日", group: loan, position: after }
  - { pattern: "初回返済日", group: loan, position: after }
  - { pattern: "初回ご返済日", group: loan, position: after }
  - { pattern: "第1回お支払日", group: loan, position: after }
  - { pattern: "第1回返済日", group: loan, position: after }
