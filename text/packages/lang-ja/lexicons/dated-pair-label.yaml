# 前後の決まった日付の組。group が組の名前で、position before が先に来るはずの日付の語、after が後に来るはずの日付の語。
# 行の頭（表なら最初の列）にこの語と年のある日付があり、after の日付が before の日付より前なら指す（due-before-issue）。
id: dated-pair-label
language: ja
entries:
  - { pattern: "掲載日", group: listing, position: before }
  - { pattern: "掲載開始日", group: listing, position: before }
  - { pattern: "情報公開日", group: listing, position: before }
  - { pattern: "情報登録日", group: listing, position: before }
  - { pattern: "登録日", group: listing, position: before }
  - { pattern: "入居可能日", group: listing, position: after }
  - { pattern: "入居可能時期", group: listing, position: after }
  - { pattern: "入居時期", group: listing, position: after }
  - { pattern: "入居予定日", group: listing, position: after }
  - { pattern: "入居日", group: listing, position: after }
  - { pattern: "掲載日", group: job, position: before }
  - { pattern: "掲載開始日", group: job, position: before }
  - { pattern: "募集開始日", group: job, position: before }
  - { pattern: "応募締切", group: job, position: after }
  - { pattern: "応募締切日", group: job, position: after }
  - { pattern: "応募締め切り", group: job, position: after }
  - { pattern: "応募期限", group: job, position: after }
  - { pattern: "募集締切", group: job, position: after }
  - { pattern: "募集締切日", group: job, position: after }
  # 決算の資料。決算説明会と決算発表は、報告する期間が終わってから開く。対象期間の行は期間を書くので、その終わりと比べる（dated-span-label）。
  # 「発表日」だけは入れない。キャンペーンの告知のように、期間の終わる前に出す文書の日付でもある。
  # 「説明会開催日」だけも入れない。補助金の案内の説明会は、対象期間の中に開く。
  - { pattern: "対象期間", group: earnings, position: before }
  - { pattern: "報告対象期間", group: earnings, position: before }
  - { pattern: "会計期間", group: earnings, position: before }
  - { pattern: "決算説明会", group: earnings, position: after }
  - { pattern: "決算説明会開催日", group: earnings, position: after }
  - { pattern: "決算発表日", group: earnings, position: after }
  # 健診や検査の結果。受診した日、採血した日より後に、結果を報告する。
  # 「発行日」「作成日」は入れない。受診券、検査の依頼書や案内は、受診日や採血日より前に発行し作成する。
  - { pattern: "受診日", group: checkup-report, position: before }
  - { pattern: "検査日", group: checkup-report, position: before }
  - { pattern: "採血日", group: checkup-report, position: before }
  - { pattern: "健診日", group: checkup-report, position: before }
  - { pattern: "報告日", group: checkup-report, position: after }
  # 製品の保証書。製品の登録の締切は、買った日より後に来る。
  - { pattern: "お買い上げ日", group: warranty, position: before }
  - { pattern: "購入日", group: warranty, position: before }
  - { pattern: "ご購入日", group: warranty, position: before }
  - { pattern: "登録の締切", group: warranty, position: after }
  - { pattern: "登録期限", group: warranty, position: after }
  - { pattern: "製品登録の締切", group: warranty, position: after }
  - { pattern: "ご愛用者登録の締切", group: warranty, position: after }
  # 製品の回収や交換のお知らせ。交換や返金の受付期限は、お知らせを出した日より後に来る。
  # 「発表日」「公表日」は入れない。懸賞やコンテストの結果は、応募の受付締切より後に発表し公表する。
  # 「受付期限」「受付締切」「お申し込み期限」だけも入れない。受付を終えたお知らせは、過ぎた締切を書く。
  - { pattern: "お知らせ日", group: recall, position: before }
  - { pattern: "交換受付期限", group: recall, position: after }
  - { pattern: "交換の受付期限", group: recall, position: after }
  - { pattern: "無償交換の受付期限", group: recall, position: after }
  - { pattern: "返金の受付期限", group: recall, position: after }
  # ローンや分割払いの返済予定表。初回のお支払日は、契約した日より後に来る。
  # 「お申込日」は入れない。変更や借り換えの申込書では、今の返済予定より後に申し込む。
  - { pattern: "ご契約日", group: loan, position: before }
  - { pattern: "契約日", group: loan, position: before }
  - { pattern: "初回お支払日", group: loan, position: after }
  - { pattern: "初回お支払い日", group: loan, position: after }
  - { pattern: "初回返済日", group: loan, position: after }
  - { pattern: "初回ご返済日", group: loan, position: after }
  - { pattern: "第1回お支払日", group: loan, position: after }
  - { pattern: "第１回お支払日", group: loan, position: after }
  - { pattern: "第1回返済日", group: loan, position: after }
  - { pattern: "第１回返済日", group: loan, position: after }
  # 価格表やクーポン、許可証や保険の証書。有効の終わりは、始まりより前に来ない。「有効期限」は due-date-label にもあり、
  # そちらでは発行日と比べる。組ごとに比べる。
  - { pattern: "適用開始日", group: validity, position: before }
  - { pattern: "有効開始日", group: validity, position: before }
  - { pattern: "発効日", group: validity, position: before }
  - { pattern: "適用終了日", group: validity, position: after }
  - { pattern: "有効終了日", group: validity, position: after }
  - { pattern: "有効期限", group: validity, position: after }
  # 期間を二つの行に分けて書く取引明細や利用明細。期間の終わりは、始まりより前に来ない。
  - { pattern: "照会開始日", group: statement-period, position: before }
  - { pattern: "対象期間開始日", group: statement-period, position: before }
  - { pattern: "期間開始日", group: statement-period, position: before }
  - { pattern: "照会終了日", group: statement-period, position: after }
  - { pattern: "対象期間終了日", group: statement-period, position: after }
  - { pattern: "期間終了日", group: statement-period, position: after }
  # 宿泊の予約。チェックアウトはチェックインの日より前に来ない。同じ日（日帰り）は指さない。
  - { pattern: "チェックイン", group: stay, position: before }
  - { pattern: "チェックイン日", group: stay, position: before }
  - { pattern: "チェックアウト", group: stay, position: after }
  - { pattern: "チェックアウト日", group: stay, position: after }
  # レンタカーなどの貸出。返却は貸出より前に来ない。「出発日」は入れない。旅の案内では、旅券や書類の返却日が出発日より前に来る。
  - { pattern: "貸出", group: rental, position: before }
  - { pattern: "貸出日", group: rental, position: before }
  - { pattern: "貸出日時", group: rental, position: before }
  - { pattern: "返却", group: rental, position: after }
  - { pattern: "返却日", group: rental, position: after }
  - { pattern: "返却日時", group: rental, position: after }
  - { pattern: "返却予定日", group: rental, position: after }
  # 無料でキャンセルできる期限は、泊まる日や借りる日より前に来る。チェックインと貸出は stay と rental にもあるが、組ごとに比べる。
  - { pattern: "無料キャンセル期限", group: cancel, position: before }
  - { pattern: "キャンセル無料期限", group: cancel, position: before }
  - { pattern: "チェックイン", group: cancel, position: after }
  - { pattern: "チェックイン日", group: cancel, position: after }
  - { pattern: "貸出", group: cancel, position: after }
  - { pattern: "貸出日", group: cancel, position: after }
  - { pattern: "貸出日時", group: cancel, position: after }
  # 給与明細。支給日は、支給の対象になる期間が終わってから来る。期間の行は期間を書くので、その終わりと比べる（dated-span-label）。
  - { pattern: "支給対象期間", group: payroll, position: before }
  - { pattern: "計算期間", group: payroll, position: before }
  - { pattern: "対象期間", group: payroll, position: before }
  - { pattern: "支給日", group: payroll, position: after }
  # 出張の精算書や旅程。帰着は出発より前に来ない。同じ日（日帰り）は指さない。返却日とは組まない。旅券や書類の返却日は出発日より前に来る。
  - { pattern: "出発", group: trip, position: before }
  - { pattern: "出発日", group: trip, position: before }
  - { pattern: "帰着", group: trip, position: after }
  - { pattern: "帰着日", group: trip, position: after }
  # 発注書や納品書。納期と納品日は、発注した日より前に来ない。発注書の納期は希望する納品の日で、これも発注より後に来る。
  - { pattern: "発注日", group: order, position: before }
  - { pattern: "注文日", group: order, position: before }
  - { pattern: "ご注文日", group: order, position: before }
  - { pattern: "受注日", group: order, position: before }
  - { pattern: "納期", group: order, position: after }
  - { pattern: "希望納期", group: order, position: after }
  - { pattern: "納品日", group: order, position: after }
  - { pattern: "納品予定日", group: order, position: after }
  - { pattern: "納入日", group: order, position: after }
  # 成績証明書や卒業・修了の証明書。卒業と修了は入学より後に来て、証明書は卒業や修了より後に発行する。三つの順は二つの組でたどる。
  # 入学の日は卒業や修了の日とだけ組み、発行日とは組まない。発行日と組むのは、入学より後に来るはずの卒業や修了の日。
  - { pattern: "入学年月日", group: transcript, position: before }
  - { pattern: "入学日", group: transcript, position: before }
  - { pattern: "卒業年月日", group: transcript, position: after }
  - { pattern: "卒業日", group: transcript, position: after }
  - { pattern: "修了年月日", group: transcript, position: after }
  - { pattern: "修了日", group: transcript, position: after }
  - { pattern: "卒業年月日", group: transcript-issue, position: before }
  - { pattern: "卒業日", group: transcript-issue, position: before }
  - { pattern: "修了年月日", group: transcript-issue, position: before }
  - { pattern: "修了日", group: transcript-issue, position: before }
  - { pattern: "発行日", group: transcript-issue, position: after }
  - { pattern: "証明日", group: transcript-issue, position: after }
  # 年間の給与所得と源泉徴収税額の明細書。対象期間が終わってから（退職した人には退職日より後に）交付する。
  # 対象期間は earnings と payroll にもあるが、組ごとに比べる。「発行日」は入れない。前払いの請求書は対象期間の初めに発行し、
  # 退職の手続きの案内は退職日より前に発行する。
  - { pattern: "対象期間", group: tax-statement, position: before }
  - { pattern: "退職日", group: tax-statement, position: before }
  - { pattern: "交付日", group: tax-statement, position: after }
  # 船積みの書類（梱包明細書、インボイス）。到着は船積みより前に来ない。予定の日（到着予定日）は後に来る側にだけ置く。
  # 「請求日」とは組まない。インボイスの請求日は、船積みの前にも後にも来る。
  - { pattern: "船積日", group: shipping, position: before }
  - { pattern: "到着日", group: shipping, position: after }
  - { pattern: "到着予定日", group: shipping, position: after }
  # 診療明細書や領収書は、診療日より前に発行しない。発行日は transcript-issue にもあるが、組ごとに比べる。
  # 「受診日」は入れない。受診券は受診日より前に発行する（checkup-report が「発行日」を入れないのと同じ理由）。
  - { pattern: "診療日", group: medical-visit, position: before }
  - { pattern: "発行日", group: medical-visit, position: after }
  # 入院の明細や証明書。退院は入院より前に来ない。同じ日（日帰り）は指さない。
  - { pattern: "入院日", group: hospital-stay, position: before }
  - { pattern: "退院日", group: hospital-stay, position: after }
  # 賃貸借の精算書や解約の書類。退去は入居より前に来ず、解約の通知は退去より前にする。入居日は listing にもあるが、組ごとに比べる。
  # 入居と解約の通知は二つの組に分ける。一つの組だと、一度だけ書いた退去日は最初の入居日とだけ比べ、通知日を見ない。
  # 予定の日（退去予定日）は後に来る側にだけ置く。入居予定日は入れない。予定の入居日は、前の借主の退去日より後に来る。
  - { pattern: "入居日", group: tenancy, position: before }
  - { pattern: "入居開始日", group: tenancy, position: before }
  - { pattern: "退去日", group: tenancy, position: after }
  - { pattern: "退去予定日", group: tenancy, position: after }
  - { pattern: "明渡日", group: tenancy, position: after }
  - { pattern: "解約通知日", group: tenancy-notice, position: before }
  - { pattern: "解約予告日", group: tenancy-notice, position: before }
  - { pattern: "退去日", group: tenancy-notice, position: after }
  - { pattern: "退去予定日", group: tenancy-notice, position: after }
  - { pattern: "明渡日", group: tenancy-notice, position: after }
  # 車の整備記録や点検の記録。次の点検や車検は、整備した日より後に来る。「点検日」は今回の点検の日で、前に来る側にだけ置く。
  # 「前回点検日」は入れない。前の点検は今回の整備より前に来る。
  - { pattern: "整備日", group: vehicle-service, position: before }
  - { pattern: "入庫日", group: vehicle-service, position: before }
  - { pattern: "点検日", group: vehicle-service, position: before }
  - { pattern: "作業日", group: vehicle-service, position: before }
  - { pattern: "次回点検日", group: vehicle-service, position: after }
  - { pattern: "次回点検予定日", group: vehicle-service, position: after }
  - { pattern: "次回車検", group: vehicle-service, position: after }
  # 工事やリフォームの見積書、契約書、工程表。完工、竣工と引渡しは着工より後に来る。予定の日（着工予定日、完工予定日）も同じ順で比べる。
  - { pattern: "着工日", group: construction, position: before }
  - { pattern: "工事開始日", group: construction, position: before }
  - { pattern: "着工予定日", group: construction, position: before }
  - { pattern: "完工日", group: construction, position: after }
  - { pattern: "完工予定日", group: construction, position: after }
  - { pattern: "竣工日", group: construction, position: after }
  - { pattern: "竣工予定日", group: construction, position: after }
  - { pattern: "引渡日", group: construction, position: after }
  # 携帯電話や通信、サービスの契約の利用期間。終了日は開始日より前に来ない。同じ日（一日だけの利用）は指さない。
  # 「開始日」「終了日」だけは入れない。工程表や作業の記録も使う。
  - { pattern: "ご利用開始日", group: service-period, position: before }
  - { pattern: "利用開始日", group: service-period, position: before }
  - { pattern: "契約開始日", group: service-period, position: before }
  - { pattern: "サービス開始日", group: service-period, position: before }
  - { pattern: "ご利用終了日", group: service-period, position: after }
  - { pattern: "利用終了日", group: service-period, position: after }
  - { pattern: "契約終了日", group: service-period, position: after }
  - { pattern: "サービス終了日", group: service-period, position: after }
