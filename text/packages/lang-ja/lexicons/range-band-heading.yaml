# 単位を書かない数の幅（7〜11、15以上）が何を数えるかを言う列の見出し（range-band-mismatch）。group は range-band-unit と同じ意味。
# 見出しの升がこの語だけ（括弧の中を除く）のときに読む。括弧に単位を書いた見出し（体重(kg)）は単位から読む。
id: range-band-heading
language: ja
entries:
