  - { pattern: "年令", group: integer }
  - { pattern: "対象年齢", group: integer }
  - { pattern: "人数", group: integer }
  - { pattern: "点数", group: integer }
  - { pattern: "得点", group: integer }
  - { pattern: "体重", group: continuous }
  - { pattern: "身長", group: continuous }
