# 雛形の空欄の括弧に書く語。【会社名】【氏名】。括弧の中がこの語そのものか、この語で始まって空白が続くときに数える。
# 例として置く「○○」は正しい書き方なので入れない（官公庁の文書は記入例に使う）。
id: placeholder-word
language: ja
entries:
  - pattern: 氏名
  - pattern: 名前
  - pattern: 会社名
  - pattern: 企業名
  - pattern: 貴社名
  - pattern: 担当者名
  - pattern: 部署名
  - pattern: 商品名
  - pattern: 製品名
  - pattern: サービス名
  - pattern: 日付
  - pattern: 金額
  - pattern: 住所
  - pattern: 電話番号
  - pattern: メールアドレス
  - pattern: ここに
  # group: marker — 後で埋めるつもりで置いた値。値そのもの（「未定」）か、値の頭でコロンが続くとき（「TODO: 期待する出力を書く」）に数える。
  # 文の中の「日程は未定です」は、決まっていないことを書いた文なので数えない。
  - pattern: TODO
    group: marker
  - pattern: TBD
    group: marker
  - pattern: FIXME
    group: marker
  - pattern: 未定
    group: marker
  - pattern: 未記入
    group: marker
  - pattern: 要記入
    group: marker
  # group: instruction — 丸括弧の中の、書き手に向けた指示の書き出し（（ここに会社名を書く））。丸括弧は、ほかの語では空欄と数えない。
  - pattern: ここに
    group: instruction
