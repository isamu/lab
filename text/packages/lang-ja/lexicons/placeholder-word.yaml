# 雛形の空欄の括弧に書く語。【会社名】【氏名】。括弧の中がこの語そのものか、この語で始まって空白が続くときに数える。
# 例として置く「○○」は正しい書き方なので入れない（官公庁の文書は記入例に使う）。宛名・署名・金額・日付の位置の伏せ字は下の blank-* の組で数える。
id: placeholder-word
language: ja
entries:
  - pattern: 氏名
  - pattern: 名前
  - pattern: 会社名
  - pattern: 企業名
  - pattern: 貴社名
  - pattern: 担当者名
  - pattern: 部署名
  - pattern: 商品名
  - pattern: 製品名
  - pattern: サービス名
  - pattern: 日付
  - pattern: 金額
  - pattern: 住所
  - pattern: 電話番号
  - pattern: メールアドレス
  - pattern: ここに
  # group: marker — 後で埋めるつもりで置いた値。値そのもの（「未定」）か、値の頭でコロンが続くとき（「TODO: 期待する出力を書く」）に数える。
  # 文の中の「日程は未定です」は、決まっていないことを書いた文なので数えない。
  - pattern: TODO
    group: marker
  - pattern: TBD
    group: marker
  - pattern: TBC
    group: marker
  - pattern: FIXME
    group: marker
  - pattern: 未定
    group: marker
  - pattern: 未記入
    group: marker
  - pattern: 要記入
    group: marker
  # group: instruction — 丸括弧の中の、書き手に向けた指示の書き出し（（ここに会社名を書く））。丸括弧は、ほかの語では空欄と数えない。
  - pattern: ここに
    group: instruction
  # group: blank-suffix / blank-prefix / blank-unit — 伏せ字（〇〇、△△）が空欄になる位置。手紙やメールの宛名・署名・金額・日付に
  # 残った伏せ字は埋め忘れ。文の中で例に置いた「○○」（○○株式会社作成など）は数えないので、ビジネス文書の種類だけで数える。
  # 後ろに付く語（〇〇様、〇〇部）。〇〇さんは例に挙げた人（「○○さんが…」と声を掛け）にも使うので入れない。
  - pattern: 様
    group: blank-suffix
    genres: [business]
  - pattern: 殿
    group: blank-suffix
    genres: [business]
  - pattern: 御中
    group: blank-suffix
    genres: [business]
  - pattern: 株式会社
    group: blank-suffix
    genres: [business]
  - pattern: 部
    group: blank-suffix
    genres: [business]
  - pattern: 課
    group: blank-suffix
    genres: [business]
  # 所在の名前（〇〇市、〇〇区、〇〇ビル、〇〇大学）。住所や宛先に残った伏せ字。
  - pattern: 大学
    group: blank-suffix
    genres: [business]
  - pattern: ビル
    group: blank-suffix
    genres: [business]
  - pattern: 市
    group: blank-suffix
    genres: [business]
  - pattern: 区
    group: blank-suffix
    genres: [business]
  - pattern: 町
    group: blank-suffix
    genres: [business]
  - pattern: 村
    group: blank-suffix
    genres: [business]
  - pattern: 県
    group: blank-suffix
    genres: [business]
  # 前に付く語（株式会社〇〇、総務部の〇〇、署名の「営業部　〇〇」）。
  - pattern: 株式会社
    group: blank-prefix
    genres: [business]
  - pattern: 有限会社
    group: blank-prefix
    genres: [business]
  - pattern: 合同会社
    group: blank-prefix
    genres: [business]
  - pattern: 部の
    group: blank-prefix
    genres: [business]
  - pattern: 課の
    group: blank-prefix
    genres: [business]
  - pattern: 部
    group: blank-prefix
    genres: [business]
  - pattern: 課
    group: blank-prefix
    genres: [business]
  # 数の代わりの伏せ字に付く単位（月額〇万円、2026年〇月〇日、〇か月）。行頭の「○」は箇条書きの印なので数えない。
  - pattern: 万円
    group: blank-unit
    genres: [business]
  - pattern: 円
    group: blank-unit
    genres: [business]
  - pattern: か月
    group: blank-unit
    genres: [business]
  - pattern: ヶ月
    group: blank-unit
    genres: [business]
  - pattern: 月
    group: blank-unit
    genres: [business]
  - pattern: 日
    group: blank-unit
    genres: [business]
  # 番地（〇丁目〇番〇号）。
  - pattern: 丁目
    group: blank-unit
    genres: [business]
  - pattern: 番
    group: blank-unit
    genres: [business]
  - pattern: 号
    group: blank-unit
    genres: [business]
  # group: template — 見出しにあれば、その節が雛形だと言う語（「## 雛形」「# 記入例」）。
  # その見出しの下（同じ深さか浅い次の見出しまで）の空欄は雛形の役目なので数えない。
  - pattern: 雛形
    group: template
  - pattern: ひな形
    group: template
  - pattern: ひながた
    group: template
  - pattern: テンプレート
    group: template
  - pattern: 記入例
    group: template
  - pattern: 文例
    group: template
