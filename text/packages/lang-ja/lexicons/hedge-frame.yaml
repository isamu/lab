# 言い切りを包む言い方。それだけでは逃げていないが、逃げの表現と同じ文に重なると、何を言い切ったのかがさらに遠のく
# （「求められているという状況であると考えられます」「〜かと思われます」）。
# excessive-hedging が 1 つの文の重なりを数えるときにだけ使う。密度には数えない。
# 「という状況」は述語になったもの（だ・です）だけ。「という状況が続く」の状況は話題の名詞で、包んでいない。
# 「かと」は終助詞の「か」と引用の「と」の並び。「何かと」は 1 語なので当たらない。
# 「ものと」は入れない。「〜とするものと判断する」の「ものと」は判断の中身で、包んでいない。
id: hedge-frame
language: ja
entries:
  - pattern: という状況だ
  - pattern: という状況です
  - pattern: という形だ
  - pattern: という形です
  - pattern: かと
