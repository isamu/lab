# 組織の名前の前に立つ形（法人格と、国立・県立のような設置者）。漢字の連なりがこれで始まり、組織の単位（organisation-unit）で
# 閉じれば、その連なりは 1 つの組織の正式名称（国立研究開発法人産業技術総合研究所）。書き手が割れる複合語ではない。
# position: before の語（設置者）は名前の前にしか立たない。それ以外の法人格は名前の後ろにも立ち、連なりを閉じれば
# その連なりも 1 つの名前（東日本自動車販売株式会社）。
