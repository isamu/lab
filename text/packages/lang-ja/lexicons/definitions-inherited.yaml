# 別の文書の定義を引き継ぐと書く言い回し（undefined-term）。「本共同研究開発契約において定義した用語を本契約で使用する場合には
# 同契約内の定義に従う」と書いた契約は、定義の多くを向こうに置く。そのときは、定義の無い語のうち、ほかの語の書き誤りに見えるもの
# （「本学習済みモデル」の横の「本学習モデル」）だけを指す。字面どおりに照らす。
# 「本契約において定義した用語」はこの文書自身の定義を指すので、向こうの文書の定義に従うと言う語だけを並べる。
