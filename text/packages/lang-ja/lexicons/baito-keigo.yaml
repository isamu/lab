# いわゆるバイト敬語（コンビニ・ファミレス言葉）。過去形にする必要の無い「よろしかった」、物に付けた「様」、
# 「です」の代わりの「になります」、金額に付けた「から」など。
#
# 文脈で正しくもなる形は載せない。「お客様からお預かりした書類」の「から」は正しいので、金額に続く「円から」だけ。
# 「になります」は変化を言う正しい用法（来月から有料になります）があるので、「こちらになります」「お釣りになります」だけ。
id: baito-keigo
language: ja
entries:
  - pattern: でよろしかったでしょうか
    rewrite: でよろしいでしょうか
  - pattern: でよろしかったですか
    rewrite: でよろしいですか
  - pattern: よろしかったでしょうか
    rewrite: よろしいでしょうか
  - pattern: こちらになります
    rewrite: こちらです／こちらでございます
  - pattern: お釣りになります
    rewrite: お釣りです／お釣りでございます
  - pattern: 円からお預かり
    rewrite: 円をお預かり
  - pattern: お名前様
    rewrite: お名前
  - pattern: ご住所様
    rewrite: ご住所
  - pattern: お会計のほう
    rewrite: お会計
  - pattern: ご注文のほう
    rewrite: ご注文
