# 文書そのものの番号（予約番号・受付番号）の前に置く語。group は何の番号かで、違う group の番号どうしは比べない。
# reference-number-variant は、語のすぐ後ろ（間は空白と「：」「、」や開き括弧だけ）にある英数字の並びをその group の番号とする。
# 「予約番号は」のように語と番号の間に入る語も、ここに書く。
id: reference-label
language: ja
entries:
  - { pattern: 予約番号, group: booking }
  - { pattern: 予約番号は, group: booking }
  - { pattern: 予約確認番号, group: confirmation }
  - { pattern: 予約確認番号は, group: confirmation }
  - { pattern: 受付番号, group: receipt }
  - { pattern: 受付番号は, group: receipt }
  - { pattern: お問い合わせ番号, group: inquiry }
  - { pattern: お問い合わせ番号は, group: inquiry }
  - { pattern: お問合せ番号, group: inquiry }
  - { pattern: お問合せ番号は, group: inquiry }
  - { pattern: 社員番号, group: employee }
  - { pattern: 社員番号は, group: employee }
  - { pattern: 従業員番号, group: employee }
  - { pattern: 従業員番号は, group: employee }
  - { pattern: 学籍番号, group: student }
  - { pattern: 学籍番号は, group: student }
  - { pattern: 学生番号, group: student }
  - { pattern: 学生番号は, group: student }
  # 口座の番号。明細の振込の行に書く相手の口座は長い方の語（振込先口座番号）が勝つので、口座自身の「口座番号」とは比べない。
  - { pattern: 口座番号, group: account }
  - { pattern: 口座番号は, group: account }
  - { pattern: 口座No., group: account }
  - { pattern: 口座No, group: account }
  - { pattern: 振込先口座番号, group: payee-account }
  - { pattern: 振込先口座番号は, group: payee-account }
  - { pattern: 振込先の口座番号, group: payee-account }
  - { pattern: 振込先の口座番号は, group: payee-account }
  - { pattern: 振込元口座番号, group: payer-account }
  - { pattern: 振込元口座番号は, group: payer-account }
  - { pattern: 振込元の口座番号, group: payer-account }
  - { pattern: 振込元の口座番号は, group: payer-account }
  # 保険証券の番号。契約者番号は契約者その人の番号で、証券ごとの番号とは別の物になり得るので入れない。
  - { pattern: 証券番号, group: policy }
  - { pattern: 証券番号は, group: policy }
  - { pattern: 保険証券番号, group: policy }
  - { pattern: 保険証券番号は, group: policy }
  - { pattern: 証券No., group: policy }
  - { pattern: 証券No, group: policy }
  - { pattern: 発注番号, group: order }
  - { pattern: 発注番号は, group: order }
  - { pattern: 注文番号, group: order }
  - { pattern: 注文番号は, group: order }
  - { pattern: インボイス番号, group: invoice }
  - { pattern: インボイス番号は, group: invoice }
  - { pattern: 請求書番号, group: invoice }
  - { pattern: 請求書番号は, group: invoice }
  - { pattern: 請求書No., group: invoice }
  - { pattern: 請求書No, group: invoice }
  - { pattern: 患者番号, group: patient }
  - { pattern: 患者番号は, group: patient }
  - { pattern: 患者ID, group: patient }
  - { pattern: 患者IDは, group: patient }
  - { pattern: 診察券番号, group: patient }
  - { pattern: 診察券番号は, group: patient }
  - { pattern: 契約番号, group: contract }
  - { pattern: 契約番号は, group: contract }
  - { pattern: 契約No., group: contract }
  - { pattern: 契約No, group: contract }
  - { pattern: 賃貸借契約番号, group: contract }
  - { pattern: 賃貸借契約番号は, group: contract }
  # 別の契約の番号を引く語。長い方の語が勝つので、文書自身の「契約番号」とは比べない。
  - { pattern: 原契約番号, group: original-contract }
  - { pattern: 原契約番号は, group: original-contract }
  - { pattern: 基本契約番号, group: master-contract }
  - { pattern: 基本契約番号は, group: master-contract }
  - { pattern: 旧契約番号, group: former-contract }
