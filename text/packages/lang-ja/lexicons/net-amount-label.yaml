# 差し引きで決まる金額の名前（net-amount-mismatch）。group は gross（差し引く前の額）、deduction（差し引く額の合計）、net（差し引いた後の額）、
# taxable（税を計算する額。源泉徴収の明細などで gross − deduction として書かれる）。
# 同じ表か同じ節に gross・deduction・net の語が一つずつあり、それぞれに金額があるとき、net が gross − deduction と合うかを比べる。net が無ければ taxable を比べる
# （net もある節の deduction は支払いから引く額で、税の計算の控除ではないので、taxable は比べない）。表の見出しや項目がこの語だけ（単位の括弧は除く）のときに読む。
# 支払金額は請求書では値引き後に払う額にも読めるので、gross に入れない。
# 敷金精算書の 敷金・差引合計・返金額 も同じ形。敷金が見出しや文中（敷金は家賃の2か月分）に出るだけでは、三つの値がそろわないので比べない。
id: net-amount-label
language: ja
entries:
  - { pattern: 総支給額, group: gross }
  - { pattern: 総支給金額, group: gross }
  - { pattern: 支給総額, group: gross }
