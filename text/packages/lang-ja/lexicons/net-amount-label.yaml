# 差し引きで決まる金額の名前（net-amount-mismatch）。group は gross（差し引く前の額）、deduction（差し引く額の合計）、net（差し引いた後の額）。
# 同じ表か同じ節に三つの組の語が一つずつあり、それぞれに金額があるとき、net が gross − deduction と合うかを比べる。表の見出しや項目がこの語だけ（単位の括弧は除く）のときに読む。
