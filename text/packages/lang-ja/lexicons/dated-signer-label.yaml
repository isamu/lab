# 署名の行に読む役職の語。group と position は dated-pair-label と同じで、署名の行の日付を組の後の日付として読む（due-before-issue）。
# 署名の行は、日付が一つ、この語、名前だけの行（2026年4月12日　会計監査 戸川 隆）。文（「…に監査を受け、…で承認されました」）や、
