# 仕事のメールや手紙の書き出しの挨拶。本文の最初の数行のどれかに、この語のどれかがあれば挨拶があるとみなす。
# 英語の語（Dear など）は行の頭にあるときだけ数える。
# 申し込みや注文の確認メールは「このたびは…ありがとうございます」と書き出す。「このたびは」を挨拶として数える。
# 「ありがとうございます」だけは数えない。結びにも使い、本文の礼（先日は…ありがとうございました）とも区別できない。
# 同僚あてには「お疲れさま。」と短く書き出す。返事が遅れたときは、挨拶の代わりにそのお詫びで書き出す。
# 会った後のメールは、読み手が割いた時間への礼（本日はお忙しいところ…ありがとうございました）で書き出す。「お忙しいところ」だけは
# 結びの頼み（お忙しいところ恐縮ですが、ご確認ください）にも使うので、「本日は」「先日は」か「お時間」と続けて書いた形だけを数える。
