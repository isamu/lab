# 定型の結び。読者に何も残さない締め。group は detectors/closing-cliche.ts の頭を参照。
id: closing-cliche
language: ja
entries:
  - pattern: いかがでしたか
  # メールでは日程を聞き（ご都合はいかがでしょうか）、提案書では勧めを言う（導入してはいかがでしょうか）。記事でだけ定型の結び。
  - pattern: いかがでしょうか
    genres: [blog]
  - pattern: まとめると
  - pattern: 最後までお読みいただく
  # 資料を送るメールでは普通の結び（ご参考になれば幸いです）。この四つは記事でだけ数える。
  - pattern: 参考になれば幸いです
    genres: [blog]
  - pattern: ぜひ試してみてください
  - pattern: いかがでしたでしょうか
  - pattern: お役に立てれば幸いです
    genres: [blog]
  # 「参考になればうれしいです」「お役に立てればと思います」。上の語が先に当たれば、指摘はその語で言う。
  - pattern: 参考になれば
    genres: [blog]
  - pattern: お役に立てれば
    genres: [blog]
  # 読み手への願い・励ましで文書を終える。本文の途中なら普通の勧めなので、最後の段落だけ。
  - pattern: てみてほしい
    group: last
  - pattern: でみてほしい
    group: last
  - pattern: 楽しんでください
    group: last
  - pattern: お楽しみください
    group: last
  # 「まずは〜から試してみてください」。ぜひが無くても、試すよう勧めて終えるのは結びの定型。具体的な指示（並べてみてください）は当たらない。
  - pattern: 試してみてください
    group: last
  - pattern: やってみてください
    group: last
  - pattern: ましょう！
    group: last
  - pattern: ましょう!
    group: last
  # 「気軽に聞いてみてください」「お気軽にお問い合わせください」
  # メールでは問い合わせ先を言う普通の結び（お気軽にお問い合わせください）。記事でだけ数える。
  - pattern: 気軽に
    group: lead:kigaru
    genres: [blog]
  - pattern: ください
    group: end:kigaru
  # 結びの決まった請け合い（その思いに応えられるよう、しっかり考えてみます）。何をいつするかを言わずに頑張ると誓って終える。
  # 「ご要望に沿えるよう、11月7日までに再見積もりします」のように中身のある約束は、終わりの語が違うので当たらない。
  - pattern: 応えられるよう
    group: lead:pledge
  - pattern: 応えできるよう
    group: lead:pledge
  - pattern: 沿えるよう
    group: lead:pledge
  - pattern: 添えるよう
    group: lead:pledge
  - pattern: 考えてみます
    group: end:pledge
  - pattern: 努めます
    group: end:pledge
  - pattern: 努めてまいります
    group: end:pledge
  - pattern: 努めて参ります
    group: end:pledge
  - pattern: 頑張ります
    group: end:pledge
  - pattern: がんばります
    group: end:pledge
  - pattern: 精進します
    group: end:pledge
  - pattern: 精進してまいります
    group: end:pledge
  - pattern: 尽力します
    group: end:pledge
  - pattern: 尽力いたします
    group: end:pledge
  - pattern: 尽力してまいります
    group: end:pledge
