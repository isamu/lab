# 会社の名前の頭のひらがな（こもれび珈琲株式会社、株式会社みなと精機）を、前後の語から切り分ける語。name-variant が読む。
# group が使い方を決める。字面どおりに、長いものから照らす。
#   particle: 前の語に続けて書く助詞や語（当社は、弊社と、本契約における）。漢字やかなのすぐ後ろのひらがなは、この語で始まるときだけ、
#             この語の後ろを名前の頭と読む。形の語のすぐ後ろ（株式会社と、株式会社の）のひらがなが、この語で始まれば名前と読まない
#   opener:   句読点や行の頭に立つ語（また、なお）。名前の頭がこの語で始まれば名前と読まない
#   end:      名前の頭の終わりに来ない字（の、る、て）。助詞や動詞の終わりで、名前の頭がこの字で終われば名前と読まない
id: company-name-kana
language: ja
entries:
  - { pattern: における, group: particle }
  - { pattern: において, group: particle }
  - { pattern: についての, group: particle }
