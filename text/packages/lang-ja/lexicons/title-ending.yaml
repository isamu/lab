# 題の付いたもの（要綱・法令・事業・制度・試験・計画・補助金・届け出の書式）の名前を閉じる語。漢字の連なりがこれで終わり、
# 題の置き方（括弧の中身を閉じる、すぐ後ろに補いの括弧が付く、文がその連なりだけ、見出しにある）をしていれば、
# 書き手が選んだ複合語ではなく、変えられない名前（大阪市鶴見区役所公募型比較見積実施要綱、国家公務員中途採用者選考試験）。
# 閉じる語は語の切れ目で始まり、前に 2 字以上の語が要る（解決方法の「法」、本事業は当たらない）。
# 文の中で使っただけの連なり（情報処理推進機構認定試験の受験者）は、文書のどこかで題として置かれているか、
# 文書の中で同じ連なりを繰り返していなければ数える。法令・制度・給付の名前は、置き方を問わない fixed-name-ending にもある。
# 会合・会同・演習・訓練・窓口は催しや受け付けの名前（G7仙台科学技術大臣会合、自衛隊高級幹部会同、緊急災害現地対策本部運営訓練、区役所就学事務担当窓口）、
# 地震は法令や気象庁が名付けた地震の名前（日本海溝・千島海溝周辺海溝型地震）、
# 戦略・基金・審議会・協議会・機構は計画や機関の名前（保険契約者保護機構）。
