# 二字以上の名の中での字の読み（名乗り）。group がその読み（カタカナ）。品詞解析の辞書は、名をふつうの語に切って別に読むことがある
# （建太 を 建 タテ と 太 フトシ、拓実 を タクジツ）。name-variant は、空白を挟んだ姓と名の名を、この字の読みでもう一通りに読み、
# 読みが同じで一字違いの名前（健太 と 建太）を比べる。姓は読み直さない。一字の名（太 を フトシ）は読み直さない。
# 二字以上の名の中で、ほとんどこの読みになる字だけを置く。
id: given-name-char-reading
language: ja
entries:
  - { pattern: 建, group: ケン }
  - { pattern: 拓, group: タク }
  - { pattern: 太, group: タ }
  - { pattern: 花, group: カ }
  - { pattern: 実, group: ミ }
