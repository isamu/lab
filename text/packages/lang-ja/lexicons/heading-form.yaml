# 見出しの決まった形。生成した記事は、見出しをこの形で揃えがちです（「〜とは」「〜のメリット」「〜のポイント」）。
# 1 つだけなら普通の見出しで、文書の構成の数（chaff outline の構成の目印）が、見出しのうちこの形の割合を人の記事と比べます。
# position: after は見出しの終わりに立つ形、before は頭に立つ形。見出しの終わりの「？」「!」と番号は外してから照らします。
id: heading-form
language: ja
entries:
