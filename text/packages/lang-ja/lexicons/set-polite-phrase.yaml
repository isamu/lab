# 丁寧な形でしか言わない挨拶と礼の決まり文句。no-mixed-desumasu が、この語で終わる文（農業まつり、お疲れ様でした。）を、
# である調の文書の中でも指さない（数には入れる）。相手に向けた挨拶は、地の文がである調でもこの形で言う。
# 依頼（ご覧ください。）は入れない。である調の文書の中の依頼は、ですます調の少数派として今までどおり指す。
# 「お願いします」は依頼でも入れる。結びの決まり文句（承認をお願いします。よろしくお願いします。）で、である調の稟議やメモもこの形で頼む。
id: set-polite-phrase
language: ja
entries:
  - pattern: お疲れ様でした
  - pattern: お疲れさまでした
  - pattern: ご苦労様でした
  - pattern: ご苦労さまでした
  - pattern: ありがとうございました
  - pattern: ありがとうございます
  - pattern: おめでとうございます
  - pattern: お願いします
  - pattern: お願いいたします
  - pattern: お願い致します
  - pattern: お願い申し上げます
