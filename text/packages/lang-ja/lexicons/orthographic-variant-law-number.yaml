# 法令の題名のすぐ後に付ける、法令の番号の括弧（平成20年法律第83号）。正規表現。題名はその法令が決めた書き方を持つ
# （愛がん動物用飼料の安全性の確保に関する法律）ので、orthographic-variant は番号の括弧の前の題名を、間の略称の括弧
# （ペットフード安全法）ごと比べない。題名は、その前の読点、句点、括弧から始まると読む。
id: orthographic-variant-law-number
language: ja
entries:
  - pattern: "[（(](?:明治|大正|昭和|平成|令和)[元〇一二三四五六七八九十0-9０-９]+年(?:法律|政令|[^（）()、。]{1,12}?省令|[^（）()、。]{1,12}?条例)第[〇一二三四五六七八九十百千0-9０-９]+号[）)]"
