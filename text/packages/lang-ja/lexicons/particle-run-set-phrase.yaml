# 助詞を挟んで一語のように読む決まった言い回し（絶滅のおそれのある種の「おそれのある」）。no-doubled-joshi は、この中の「の」を
# 入れ子の「の」と数えない。前の語、助詞、後ろの語の辞書の形をつなげて書く。
id: particle-run-set-phrase
language: ja
entries:
  - pattern: おそれのある
  - pattern: 恐れのある
  - pattern: 虞のある
  # 「AとBとの間」の「との間」は二つの間柄を言う一続きの言い方で、「の」は名詞を名詞の中に入れない。
  - pattern: との間
  # 「AのようなB」「Aのように」の「の」は、Aを「よう」（似たもの）につなぐだけで、名詞を名詞の中に入れない。前の語を問わない。
  - pattern: のよう
