# 仕事のメールや手紙の結びの言葉。本文の最後の数行（署名の名前や連絡先の行を含む）のどれかに、この語のどれかがあれば結びがあるとみなす。
# 英語の語（Regards など）は行の頭にあるときだけ数える。
