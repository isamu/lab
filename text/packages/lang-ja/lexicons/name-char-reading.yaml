# 人の名前に使う字で、品詞解析の辞書が読みを持たない字（健汰 の 汰）。group がその字の名前での読み（カタカナ）。
# name-variant は名前の読みを字の読みからつなぎ、読みが同じで一字違いの名前（健太 と 健汰）を比べる。名前での読みが一つに
# 決まる字だけを置く（颯 は ソウ と ハヤテ、瑠 は ル と リュウ、耀 は ヨウ と アキラ があるので置かない）。読めない字のある名前は比べない。
