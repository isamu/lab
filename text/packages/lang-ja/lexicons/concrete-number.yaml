# 漢数字で書いた数（正規表現）。具体物の密度（concrete-evidence-density）は、算用数字と同じく具体的な数として数える。
# 漢数字のあとに数える単位が続くものだけ。「一緒」「三つ巴」「一般」は数ではない。
# 「一」と「万」だけの数は言い回しが多い（誰一人、一人ひとり、万人）ので数えない。「十分」（じゅうぶん）と「一時的」も数ではないので、
# 「分」は十だけの数に付けず、「時」だけの単位は置かない。決まった言い回し（二人三脚、三日坊主、百人一首、十人十色）は、続く語で外す。
id: concrete-number
language: ja
entries:
  - pattern: "(?:[〇一二三四五六七八九十百千万億]{2,}|[〇二三四五六七八九十百千億])(?:割|秒|人|名|件|円|年|か月|ヶ月|カ月|月|日|時間|回|倍|個|社|本|台|点|パーセント|％)(?!三脚|坊主|一首|十色)"
  - pattern: "(?:[〇一二三四五六七八九十百千万億]{2,}|[〇二三四五六七八九百千億])分"
