# 漢字が続いても、書き手が割れない書き方（正規表現）。漢字の続けすぎ（max-kanji-continuous）は、ここに当たる部分を数えない。
# 住所は「東京都港区新橋二丁目」のように決まった形で、ひらがなを挟んで書けない。都道府県で始まるか、丁目で終わるものだけを住所とする。
# 市区町村の名前には「市・区・町・村・郡」の字そのものを含めない。「埼玉県市町村総合事務組合」は住所ではない。
id: unsplittable
language: ja
entries:
  - pattern: "(?:北海道|東京都|京都府|大阪府|[一-鿿]{2,3}県)(?:(?![市区町村郡])[一-鿿]){1,6}?[市区町村郡](?:(?:(?![市区町村郡])[一-鿿]){1,6}?[区町村])?(?:(?:(?![市区町村郡])[一-鿿]){0,6}?[〇一二三四五六七八九十]{1,3}丁目)?"
