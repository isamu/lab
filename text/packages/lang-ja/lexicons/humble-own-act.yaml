# humble-for-others の形が、書き手自身の動作を言う言い回し。「何とも申されません」の「申される」は「申す」に可能の
# 「れる」を付けたもの（申せない）で、相手を高めた尊敬ではない。この言い回しの中の形は humble-for-others が数えない。
# 書いたとおりの字で照らす。語に分けると「何とも」の分け方が文の中と外で変わる。
# 今の打ち消しで言い切るか、「が」で続ける形だけ。「部長は何とも申されませんでした」は人のことを言う尊敬にも読めるので当たらない。
id: humble-own-act
language: ja
entries:
  - pattern: 何とも申されません。
  - pattern: 何とも申されませんが
  - pattern: 何とも申されない。
  - pattern: 何とも申されないが
  - pattern: 一概には申されません。
  - pattern: 一概には申されませんが
  - pattern: 一概には申されない。
  - pattern: 一概には申されないが
