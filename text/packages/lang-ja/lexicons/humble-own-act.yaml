# humble-for-others の形が、書き手自身の動作を言う言い回し。「何とも申されません」の「申される」は「申す」に可能の
# 「れる」を付けたもの（申せない）で、相手を高めた尊敬ではない。この言い回しの中の形は humble-for-others が数えない。
# 打ち消しで可能と決まる形だけを載せる。「部長は何も申されませんでした」は尊敬にも読めるので載せない。
