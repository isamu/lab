# 名前の頭から落とす前置き（fact-conflict、unit-mismatch）。仕様書の「本体の幅は 5.5 インチ」は、表の 幅 の行と同じ項目。英語の its に当たる、文書が説明しているもの自身を指す語だけを入れる（「箱の幅」は別の項目なので入れない）。
id: fact-label-drop
language: ja
entries:
  - pattern: "本体の"
  - pattern: "製品の"
  # 明細や月報の「今月のデータ利用量」は、その明細が書いている月の データ利用量。「先月の」「前月の」は別の月なので入れない。
  - pattern: "今月の"
  - pattern: "当月の"
  # 英語の this に当たる。「今回の入院日数」は、文書が説明している入院の 入院日数。「前回の」は別のものを指すので入れない。
  - pattern: "今回の"
