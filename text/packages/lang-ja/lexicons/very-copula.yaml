# 名詞の後ろに来て、それを形容詞にする語（便利な、便利で、静かだ、危険です、元気でした）。very-adjective が読み、助動詞のときだけ当てる（「短期間で」の助詞の「で」は当てない）。
# 形容動詞の語幹は名詞として品詞が付くので、強めの後ろの名詞がこの語に続くときだけ形容詞と見る。
# 「に」は入れない：「非常に時間に」「大変お世話に」のような、形容詞でない名詞にも続く。
id: very-copula
language: ja
entries:
  - pattern: な
  - pattern: だ
  - pattern: で
  - pattern: だっ
  - pattern: です
  - pattern: でし
  - pattern: でしょ
