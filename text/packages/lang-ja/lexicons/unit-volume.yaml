# 体積（基準はリットル）の単位（unit-mismatch）。weight は基準の単位への倍率。同じ単位を二度書けば倍率が二つで、どちらで合ってもよい。
id: unit-volume
language: ja
entries:
  - pattern: "L"
    weight: 1
  - pattern: "l"
    weight: 1
  - pattern: "mL"
    weight: 0.001
  - pattern: "ml"
    weight: 0.001
  - pattern: "リットル"
    weight: 1
  - pattern: "ミリリットル"
    weight: 0.001
  - pattern: "cc"
    weight: 0.001
  # 計量スプーンとカップは数の前に書く（大さじ1）。日本の計量カップは 200 mL。
  - pattern: "大さじ"
    weight: 0.015
    position: before
  - pattern: "小さじ"
    weight: 0.005
    position: before
  - pattern: "カップ"
    weight: 0.2
    position: before
  - pattern: "カップ"
    weight: 0.2
