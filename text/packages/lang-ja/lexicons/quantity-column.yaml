# 明細の表で数量の列の見出し。単価と金額の列と並ぶ表で、数量 × 単価を金額と比べる（line-amount-mismatch）。
id: quantity-column
language: ja
entries:
  - pattern: 数量
  - pattern: 個数
  - pattern: 数
  - pattern: 工数
  # 申込やチケットの明細の人数と枚数（1名・1枚の単価と掛けて金額になる）。
  - pattern: 人数
  - pattern: 参加人数
  - pattern: 枚数
  # 診療明細書の点数（1点の単価と掛けて金額になる）。
  - pattern: 点数
  - { pattern: 時間, group: hour }
  - pattern: 走行距離
  # 賃料の明細の月数（月額 × 月数 = 年額）。
  - { pattern: 月数, group: month }
  - { pattern: ヶ月, group: month }
  # 給付金の明細の日数（日額 × 日数 = 給付金）。
  - { pattern: 日数, group: day }
  - { pattern: 入院日数, group: day }
  - { pattern: 通院日数, group: day }
  # 授業料の明細の単位数（1単位あたりの授業料と掛けて金額になる）。見出しの「単位」だけは「単位：円」の単位でもあるので数量と読まない。
  - { pattern: 単位数, group: credit }
  - { pattern: 履修単位数, group: credit }
  # 土地の明細の面積（㎡単価 × 面積 = 価格）。何の単位かは升の単位（rate-unit）が言う。面積は日額や時給とは掛けない。
  - { pattern: 面積, group: area }
  - { pattern: 土地面積, group: area }
  - { pattern: 敷地面積, group: area }
