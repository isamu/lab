# 「れる/られる」を付けると、誰かの動作ではなく状態・決まり・文書の中身を言う動詞。agentless-passive はこれを受動に数えない。
# - 物と物との関係: 「外国人も含まれる」「対症療法に限られる」（誰かが含める動作は「含める」の受動「含められる」で、こちらは残る）
# - 決まりの中身: 「次の各号が適用される」「3 つに分類されている」「法令上定められていない」
# - 文書の中身: 「ガイドラインに記載されている」「図に示されている」
# 「た」で終わる出来事（「適用された」「定められた」「限定されました」）は誰かのした動作なので、ここにあっても受動に数える。
# 「ている」の過去（「記載されていた」）は状態のまま。サ変名詞（適用・分類）は「する」の直前にあるときだけ見る。
# 動作を報告する動詞は入れない: 確認する・検討する・決定する・見直す（「確認されていません」は誰が確認したのかを隠す）。
# 認めるも入れない。「不正アクセスは認められていません」は誰が調べたのかを隠す。
# 求める・望むも入れない。「一定の協力が求められます」は、求めているのが書き手の組織であることを隠す。
# 形態素解析の原形（基本形）で照らす。
