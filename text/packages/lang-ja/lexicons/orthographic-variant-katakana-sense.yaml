# カタカナで書いて、かなや漢字の語と別の意味にする書き方。「モノとサービス」のモノは品物で、形式名詞の「もの」とは別の語。
# orthographic-variant はここに挙げた書き方を、同じ読みのかなや漢字の書き方と別に比べる。
# 「イヤ」は、こどもが口に出して断る言葉として片仮名で書く（「イヤだ」と言っていい）。地の文の「嫌だと言えない」とは役割が違う。
# 種類の名前としてカタカナにする語（ネギ、オムツ）は、かなの書き方（ねぎ、おむつ）のゆれなので挙げない。
id: orthographic-variant-katakana-sense
language: ja
entries:
  - pattern: モノ
  - pattern: コト
  - pattern: イヤ
