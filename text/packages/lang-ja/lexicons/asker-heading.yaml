# 読み手から寄せられた問いや相談を載せる節の見出し（【相談事例等】、ご質問内容）。節の文は尋ねた人の言葉のままで、書き手の声ではない。
# 見出しの番号と括弧を外した語全体がこの語のときだけ当たる。「よくある質問」は問いと答えを抱える節、「ご質問」「お客様の声」は
# 書き手が問い合わせ先や要約を書く節のことがあるので入れない。
# no-mixed-desumasu は、この節の文の文末の調子を本文と比べない。
