# 漢字の書き方が二つの語に読め、解析器が違う語のほうを選ぶことがあるもの。group は疑わしい読み（辞書の形の読み、カタカナ）で、
# 解析器がその読みを選んだときだけ、orthographic-variant はこの書き方をその読みのかなと比べない。もう一方の読みなら比べる。
# pattern はその書き方。後ろの語を付けて書いたものは、その語が間を空けずに続くときだけ（「様を」の様は「さま」で、「よう」は「を」を取らない）。
# 「行っ」は「行く」（いって）とも「行う」（おこなって）とも読む。「沿って行っている」は「行う」で、補助動詞の「いく」ではない。
# そのため、「行く」の「行って」を「いって」と書き分けた文書のゆれも、この形では比べない。
id: orthographic-variant-two-readings
language: ja
entries:
  - pattern: 行っ
    group: イク
  - pattern: 様を
    group: ヨウ
  - pattern: 様が
    group: ヨウ
