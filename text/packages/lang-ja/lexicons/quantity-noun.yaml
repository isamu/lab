# 測る量を言う名詞（形態素 1 つ）。最上級がそのまま付いた名詞の連なりがこれで終われば（最大風速・最高気温・最大値・
# 最大駐車台数）、その語は量の名前で、何かが一番だという主張ではない。ここに無い語で終わるもの（最高品質・最高精度・
# 最高満足度）は主張として読む。度・率のように主張にも付く語は載せない。
