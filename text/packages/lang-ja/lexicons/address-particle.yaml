# 読み手に話しかける文末の終助詞（…含まれているよ。…違うんだよ。…納めているのかな？）。no-mixed-desumasu が、文の終わりの終助詞を
# つないだものがこの語で終わる常体の文を指さない（数には入れる）。ですます調の書き手が「である」に滑ったのではなく、読み手に話しかける
# 声を選んだ形で、子ども向けのページや語りかけの記事が地の文のですます調の中にわざと置く。
# 「な」だけ（わからないな。）は独り言でも書き損じでも使うので入れない。
id: address-particle
language: ja
entries:
  - pattern: よ
  - pattern: ね
  - pattern: かな
