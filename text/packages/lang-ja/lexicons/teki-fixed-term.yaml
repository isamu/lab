# 法令が定めた語と国の予算の制度の名前で、「的」が語の一部になっているもの（電磁的方法、反社会的勢力、基盤的経費、競争的研究費）。teki-overuse は、この語の中の「的」を数えない。
# 健康とウェルビーイングの定義が決めた三つ組（身体的・精神的・社会的）も、定義の言葉をそのまま引いたもので同じ。
# 書き手が選んだ形容ではなく、言い換えると別の語になるため。形態素解析が「電磁｜的｜方法」と分けるものだけを書く（知的財産、私的独占は一語に読む）。
