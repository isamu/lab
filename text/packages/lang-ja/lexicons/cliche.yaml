# 使い古された決まり文句。どの記事の題にも付けられる煽りの言い回しで、本文の書き出しにもそのまま出る。rewrite は代わりに何を書くか。
# ほかの規則が読む言い回し（closing-cliche の「いかがでしたか」、padded-intro の「近年」、announcing-opener の「重要なのは」、
# ai-tell の「深く掘り下げる」）は入れない。一文に指摘が一つになるように。
# 「結論から言うと」は人の記事にも生成した記事と同じくらいあるので入れない（announcing-opener と同じ判断）。
# 「〜まとめ」「〜な件」は普通の文（まとめました、重要な件）と分けられないので入れない。
# 「〜分でわかる」は「結果は 15 分でわかります」と分けられないので入れない。
id: cliche
language: ja
entries:
  - pattern: 今さら聞けない
    rewrite: 誰に向けた説明かを書く（「初めて使う人向けの」）
  - pattern: 今更聞けない
    rewrite: 誰に向けた説明かを書く（「初めて使う人向けの」）
  - pattern: いまさら聞けない
    rewrite: 誰に向けた説明かを書く（「初めて使う人向けの」）
  - pattern: 極意
    rewrite: 何をすればよいのかを書く
  - pattern: 徹底解説
    rewrite: 何を説明するのかを書く（「設定の手順」）
  - pattern: 知らないと損する
    rewrite: 知ると何が得かを書く
  - pattern: 知らないと損
    rewrite: 知ると何が得かを書く
