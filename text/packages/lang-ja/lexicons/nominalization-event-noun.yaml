# サ変名詞のうち、名詞に「する」を付けても「〜を実施する」「〜を行う」と同じことにならない語。nominalization はこれを数えない。
# 「〜を実施する」が「催す・開く」の意味になる語: 「研修を実施する」（研修を開く）と「研修する」（研修を受ける）、「試験を実施する」
# （試験を課す）と「試験する」（試してみる）、「授業を行う」（授業を開く）と「授業する」。
# 「する」を付けた動詞が無いか、別の意味になる語: 「施策を実施する」の「施策する」、「支援措置を実施する」の「支援措置する」。
