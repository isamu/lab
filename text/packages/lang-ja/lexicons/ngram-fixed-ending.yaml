# 項目ごとに同じ形で結ぶ書式の、文の終わりの結び。省庁の通知は法令の改正点を「〜ものとすること。」「〜こととしたこと。」と
# 並べる。会議録は議題ごとに結果を「原案のとおり決定する。」「〜について、報告があった。」と記す。諮問は審議を頼む事項ごとに
# 「〜について検討をお願いします。」「〜をどのように考えるか。」と結ぶ。画面の操作の手引きは手順ごとに「〜が表示されます。」と結ぶ。
# ngram-repetition は、文の終わりのこの結びを言い回しとして数えない。結びの前の語（講ずる、定める）は今までどおり数える。
id: ngram-fixed-ending
language: ja
entries:
  - pattern: ものとすること。
  - pattern: ものとしたこと。
  - pattern: こととすること。
  - pattern: こととしたこと。
  - pattern: 原案のとおり決定する。
  - pattern: 原案のとおり決定した。
  - pattern: 原案のとおり承認する。
  - pattern: 原案のとおり承認された。
  - pattern: について、報告があった。
  - pattern: について報告があった。
  - pattern: 検討をお願いします。
  - pattern: 審議をお願いします。
  - pattern: どのように考えるか。
  - pattern: どのように考えるべきか。
  - pattern: が表示されます。
