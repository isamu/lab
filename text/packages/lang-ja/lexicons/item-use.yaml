# 手順が物を使う形（unlisted-item-used）。助詞は名詞の後ろ（position: after）に立ち、すぐ後ろの動詞が
# その組の動詞（object-verb なら「を」の後ろ、place-verb なら「に」の後ろ、instrument-verb なら「で」の後ろ）のときだけ読む。
# 動詞は原形で照らす。negation は動詞のすぐ後ろに来て使わないことを言う語（使わずに）。
# 「に」「で」の物は、道具も入る一覧（item-list-heading の tool）がある文書だけで照らす。
id: item-use
language: ja
entries:
  - { pattern: を, group: object, position: after }
  - { pattern: に, group: place, position: after }
  - { pattern: で, group: instrument, position: after }
