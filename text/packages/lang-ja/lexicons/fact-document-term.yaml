# 文書全体で一つの値を持つ項目の名前（fact-conflict）。表の升の値と、別の節の文の値を比べる。group が同じ名前は同じ項目。
# 名前に条件を書いたもの（正社員の試用期間）は、名前が違うので比べない。
id: fact-document-term
language: ja
entries:
  - { pattern: 試用期間, group: trial-period }
  # 加入できる年齢の上限。表の範囲（満20歳〜満70歳）と文の上限（満70歳まで）は、上の端で比べる。
  - { pattern: 加入できる年齢, group: age-limit }
  - { pattern: ご加入いただける年齢, group: age-limit }
  - { pattern: 加入年齢, group: age-limit }
  - { pattern: 加入可能年齢, group: age-limit }
  - { pattern: 契約年齢, group: age-limit }
  - { pattern: 契約できる年齢, group: age-limit }
  - { pattern: ご契約いただける年齢, group: age-limit }
  - { pattern: 契約可能年齢, group: age-limit }
  # 保証の長さ。保証期限（2027年6月30日まで）は終わりの日付で長さとは別の項目なので入れない。延長保証の期間も別の名前。
  - { pattern: 保証期間, group: warranty-period }
  - { pattern: 保証の期間, group: warranty-period }
