# 重ねて「それぞれの」を言える名詞。人（個人・各人）、まとまり（会社・部署・家庭）、単位（一行・一語）、場所（地域・各地）、場合や時（場面・時代）を指すもの。
# 「会社会社で考え方が違う」「場面場面で使い分ける」「一行一行を読む」。ここに無い漢語の名詞の重なり（資料資料・確認確認）は、doubled-word が書き損じとして数える。
# 漢字の名詞でも、時を言う副詞的な名詞（毎年・各自）と形容動詞の語幹（駄目）は、アダプタが品詞の細分類で重ね言葉と読むので、ここには要らない。
