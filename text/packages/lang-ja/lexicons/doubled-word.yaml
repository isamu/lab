# doubled-word が数えない重なり。形態素解析が一語にしない重ね言葉だけを置く。
# 「まだまだ」「ますます」「いろいろ」「時々」は一語になり、「そうそう」「もっともっと」は副詞なので、ここには要らない。
# 名詞を重ねて「それぞれの」を言う形（会社会社で）は、後ろの助詞でアダプタが見分ける（distributive-particle）。
# 前の語に引かれて名詞二つに切れた副詞（労働者ががんがん）は、アダプタが二語を続けて読み直して見分ける。
# 「早め早め」の「早め」は解析器が「資料」と同じ一般の名詞とするので、品詞や後ろの助詞では見分けられない。
# 「繰り返し繰り返し」「見る見る」は動詞を重ねて副詞にした形で、解析器は動詞二つに切る。
# 名詞・形容詞を丸ごと重ねた形（個人個人・好き好き・さいさい）と、一字の仮名の三つ以上の並び（ははは）はアダプタが重ね言葉と読むので、ここには要らない。
# 決まった言い回しのうち、助詞（などなど・ほどほどに。「ほどほど」だけでは一語の副詞に読む）、動詞（あるある・代わる代わる）、形容詞の古い形（めでたしめでたし）、
# 接続詞（またまた）、二字だけの笑い声（えへへ）の重なりはここに置く。言い切りの動詞の重なり（できるできるように）は書き損じが多い。
# 「知ったかか」は辞書に「知ったか」が無く、語の終わりの「か」と後ろの「か」が並んで見える。
id: doubled-word
language: ja
entries:
  - pattern: 一つ一つ
  - pattern: 見る見る
  - pattern: 毎日毎日
  - pattern: 日毎日毎
  - pattern: 毎回毎回
  - pattern: 早め早め
  - pattern: 繰り返し繰り返し
  - pattern: などなど
  - pattern: あるある
  - pattern: 知ったかか
  - pattern: ほどほどに
  - pattern: 代わる代わる
  - pattern: めでたしめでたし
  - pattern: またまた
  - pattern: えへへ
