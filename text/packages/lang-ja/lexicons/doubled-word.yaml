# doubled-word が数えない重なり。形態素解析が一語にしない重ね言葉だけを置く。
# 「まだまだ」「ますます」「いろいろ」「時々」は一語になり、「そうそう」「もっともっと」は副詞なので、ここには要らない。
# 名詞を重ねて「それぞれの」を言う形（会社会社で）は、後ろの助詞でアダプタが見分ける（distributive-particle）。
# 前の語に引かれて名詞二つに切れた副詞（労働者ががんがん）は、アダプタが二語を続けて読み直して見分ける。
# 「早め早め」の「早め」は解析器が「資料」と同じ一般の名詞とするので、品詞や後ろの助詞では見分けられない。
# 「繰り返し繰り返し」「見る見る」は動詞を重ねて副詞にした形で、解析器は動詞二つに切る。
id: doubled-word
language: ja
entries:
  - pattern: 一つ一つ
  - pattern: 見る見る
  - pattern: 毎日毎日
  - pattern: 日毎日毎
  - pattern: 毎回毎回
  - pattern: 早め早め
  - pattern: 繰り返し繰り返し
