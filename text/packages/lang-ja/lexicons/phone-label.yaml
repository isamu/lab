# 電話番号の前に置く語。group は何の番号か（電話・ファクス・携帯）で、違う group の番号どうしは比べない。
# phone-number-variant は、番号と同じ行で、番号のいちばん近く前にある語の group をその番号の種類とする。
id: phone-label
language: ja
entries:
  - { pattern: 電話, group: phone }
  - { pattern: TEL, group: phone }
  - { pattern: Tel, group: phone }
  - { pattern: "☎", group: phone }
  - { pattern: 代表, group: phone }
  - { pattern: 直通, group: phone }
  - { pattern: お問合せ, group: phone }
  - { pattern: お問い合わせ, group: phone }
  - { pattern: FAX, group: fax }
  - { pattern: Fax, group: fax }
  - { pattern: ファクス, group: fax }
  - { pattern: ファックス, group: fax }
  - { pattern: 携帯, group: mobile }
  - { pattern: 携帯電話, group: mobile }
  # 窓口の名前は番号の種類でなく行き先を言うので group は desk。番号は窓口名のすぐ前の語の種類（FAX窓口はファクス）、無ければ電話。
  # 「受付」だけ、「ライン」だけは入れない（受付番号、オンライン、ガイドラインの後ろの数字を番号と読んでしまう）。
  - { pattern: 窓口, group: desk }
  - { pattern: センター, group: desk }
  - { pattern: ダイヤル, group: desk }
  - { pattern: ダイヤルイン, group: desk }
  - { pattern: ホットライン, group: desk }
  - { pattern: ヘルプライン, group: desk }
  - { pattern: サポートデスク, group: desk }
