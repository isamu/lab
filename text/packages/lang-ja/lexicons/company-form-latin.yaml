# 日本語の文の中に英字のまま書く、外国の会社の名前の後ろに立つ形（SUNCALL CO., LTD.、JCI USA INC.）。名前の一部で、
# 中の「，」「．」は日本語の句読点ではなく、CO・LTD・INC は説明の要る略語ではない。
# 大文字・小文字と全角・半角、「，」の後ろの空白の有無は問わない（CO.，LTD. も Co., Ltd. と読む）。長い形を先に置く。
