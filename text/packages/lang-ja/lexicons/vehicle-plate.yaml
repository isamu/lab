# 自動車のナンバー（地名・分類番号・かな・一連番号。ひばり野 330 ね 48-15）の形。reference-number-variant は、reference-label の語のすぐ後ろでこの形に合う並びを、ここの group の番号として読む。
# pattern は正規表現で、名前の付いた部分がナンバーの部分。serial（一連番号）だけが打ち間違いで変わる部分で、ほかの部分がそろっていないナンバーどうしは一文字違いとして比べない。
id: vehicle-plate
language: ja
entries:
  - pattern: '(?<region>[\p{Script=Han}々ぁ-ゖァ-ヺー]{1,5})[ 　]?(?<class>[0-9０-９]{1,3}[A-Za-zＡ-Ｚ]?)[ 　]?(?<kana>[ぁ-ゖ])[ 　]?(?<serial>[0-9０-９]{1,2}[-‐−－][0-9０-９]{2}|[・･]{1,3}[0-9０-９]{1,3}|[0-9０-９]{1,4})'
    group: vehicle
