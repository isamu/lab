# て形を「で」の後に置き、後ろに動詞を続けないと「以て」（〜によって）になる動詞。辞書の形で、漢字とかなの両方を挙げる。
# 「電子でもって申請する」の「でもって」は手段を言う語で、物を持つ動詞は「で」の後に来ない（手で持って運ぶ は後ろに動詞が続く）。
# orthographic-variant はこの使い方を、動詞（鍵を持つ）と別に比べる。「を」の後（決意をもって、信念を持って）は動詞と見分けられないので、
# 動詞と同じ語として比べる。
id: orthographic-variant-means
language: ja
entries:
  - pattern: もつ
  - pattern: 持つ
