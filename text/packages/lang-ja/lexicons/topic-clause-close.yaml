# 述語のすぐ後ろに付いて、主題（〜は）の節を閉じる言い回し。topic-predicate-distance が読む。
# 「学校は地域の核となることから、…」「気持ちはしっかり受け止めつつ、…」のように、主題から言い回しまでに別の主語（〜が、〜は、
# 〜ことは）が無く、後ろに読点が続くとき、主題の述語はこの節にある。後ろの節は別のもの（国、書き手、読み手）について言う。
# 理由の「ため」「ので」は、目的の「ため」や主題が最後まで続く文（〜を把握するため、…を公表している）と見分けられないので入れない。
id: topic-clause-close
language: ja
entries:
  - pattern: ことから
  - pattern: つつ
  - pattern: としても
  - pattern: こととし
