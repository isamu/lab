# 場所の名前で、読みが同じで取り違えやすい字（八重洲 と 八重州、大阪 と 大坂）。group が同じ字どうしを同じ読みの字と見る（name-variant）。
# 漢字どうしの一字違いは、この組か、字体の違う同じ字（name-variant-char）のときだけ指す。戸塚 と 戸山 のような読みの違う一字違いは
# 別の所のことが多い。漢数字と数字（第二 と 第2、全角の ２）も同じ数を言う字の組で、ほかの数字との違い（第1 と 第2）は別の所。
