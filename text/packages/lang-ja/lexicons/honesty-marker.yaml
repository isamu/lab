# 本音だと前置きする「正直」。生成したブログとメールにあり、人のブログと業務文書には無い。
# 「正直な人」「正直者」は人柄なので、読点の後か、前置きの形（正直、・正直に言うと・正直言って）だけを置く。
# 文頭の「正直なところ、」は人の書いた文章（論文、書き比べの人の側）にもあるので置かない。読点の後なら「、正直」で当たる。
# 答弁の「正直申し上げますと」は講演の書き起こしにあり、この rule はそこでは動かない。
id: honesty-marker
language: ja
entries:
  - pattern: 、正直
  - pattern: 正直、
  - pattern: 正直に言うと
  - pattern: 正直に言えば
  - pattern: 正直言って
