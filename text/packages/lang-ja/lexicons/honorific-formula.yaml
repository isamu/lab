# 相手を立てて呼びかける決まり文句。「各学校設置者におかれては」「参考人におかれましては」の「れ」は尊敬で、受動ではない。
# agentless-passive はこの中の「れる/られる」を受動に数えない。漢字の「置かれては」は物を置く受動なので入れない。
# 「におかれては」は読点まで含めて照らす。「通路におかれてはならない」「共有フォルダにおかれては困る」は物を置く受動。
id: honorific-formula
language: ja
entries:
  - pattern: におかれましては
  - pattern: におかれては、
  - pattern: におかれては，
  - pattern: におかれては,
