# 受動のすぐ後ろに続いて、文の述語になる型。「検討されることとなった」「実施されることになりました」の「こと」は
# 修飾される名詞ではなく述語の一部なので、受動を名詞の修飾として外さない。語の原形をつないだ形で書く。
# 「も」「は」を挟んだ形（ことにもなる・こととはならない）と、漢字の「事」も同じ型。
id: passive-predicate-frame
language: ja
entries:
  - pattern: ことになる
  - pattern: こととなる
  - pattern: ことにもなる
  - pattern: ことにはなる
  - pattern: こととはなる
  - pattern: 事になる
  - pattern: 事となる
