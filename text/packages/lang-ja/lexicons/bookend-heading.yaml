# 本文を挟む見出し。「はじめに」で始めて「まとめ」で閉じる組み立ては、生成した記事に多い形です。
# position: before は本文の前に立つ見出し、after は本文の後に立つ見出し。見出しがこの語で始まれば当たります（「まとめ：〜」も）。
