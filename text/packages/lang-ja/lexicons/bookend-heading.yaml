    position: before
  - pattern: まとめ
    position: after
  - pattern: おわりに
    position: after
  - pattern: 終わりに
    position: after
  - pattern: さいごに
    position: after
  - pattern: 最後に
    position: after
  - pattern: 結論
    position: after
  - pattern: 総括
    position: after
