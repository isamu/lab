# 前の文が言った場面や行いをまるごと受けて文を始める語（PDFが送れない。そんなときの対処法を…／…と書いて送る。これだけで…）。
# no-mixed-desumasu が、この語で始まる文のすぐ前の常体の文を、場面を差し出す書き出しとして指さない（数には入れる）。
# 文の頭の語をつないで照らすので、「これだけ」は「これ」「だけ」と分かれていても当たる。
# 「これ」「その」だけでは前の文の一部を受けることが多く、書き損じた常体の文の後ろにも来るので入れない。
id: takeup-opener
language: ja
entries:
  - pattern: そんな
  - pattern: こんな
  - pattern: そういう
  - pattern: こういう
  - pattern: これだけ
  - pattern: それだけ
