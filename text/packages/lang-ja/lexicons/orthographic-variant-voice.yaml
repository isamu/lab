# 文書の中で、書き手の違う部分を始める文（正規表現）。判決の補足意見・反対意見は裁判官ごとに書くので、書き方もそれぞれ。
# orthographic-variant は、この文から次のこの文までを一つの部分として、部分ごとに比べる。最初のこの文より前が本文。
# 文の終わりまで合わせるので、意見に触れただけの文（裁判官甲の反対意見は次のとおりであるが、…）は部分を始めない。
id: orthographic-variant-voice
language: ja
entries:
  - pattern: 裁判官[^。]{1,20}?の(?:補足|反対)?意見は[、，,]?次の(?:とおり|通り|ごとく|如く)(?:で(?:ある|あります))?。?\s*$
    genres: [legal]
