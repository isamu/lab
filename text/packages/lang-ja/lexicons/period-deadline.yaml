# 期間の中の仕事の締め切りを示す語（課題レポートは…までに提出、提出期限、締切）。文書の頭か概要の節で書いた期間（開講期間：…）は、
# 後ろのどの節でも、この語のある項目や文の日付が期間の終わりより後なら、date-outside-period が指す。年の無い日付は、期間が一つの年に収まるときだけその年と読む。
# 支払や振込の期限は期間の後に来てよいので入れない（period-aside が除く）。成績発表や再試験は period-after-term が除く。
id: period-deadline
language: ja
entries:
  - pattern: 提出期限
  - pattern: 提出
  - pattern: 締切
  - pattern: 締め切り
  - pattern: 〆切
  # 「課題：2027年2月19日」のように、課題に添えた日付は提出の日。
  - pattern: 課題
