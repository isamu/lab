# リンクの言葉で終わる箇条書きの項目（「相談窓口はこちら」「申込はこちらから」）。項目は行き先を指す札で、文でも名前でもない。
# ページを写すときにリンクが落ちても、この終わり方は残る。list-item-form-mix はこの項目の形を見ない。
# 文の終わりの「はこちらです」「はこちらをご覧ください」は文なので入れない。
id: link-label-ending
language: ja
entries:
  - pattern: はこちら
  - pattern: はこちらから
  - pattern: はこちらへ
  - pattern: はこちらをクリック
  - pattern: はここをクリック
