# 謙譲語を相手の動作に使った形。謙譲語は自分の側の動作を低める語なので、読み手や第三者の動作には使わない。
#
# 二つの形だけを載せる。一つは謙譲語に「てください」を付けて相手に頼む形（伺ってください）。
# もう一つは謙譲語に尊敬の「れる・られる」を付けた形（申される）。
# 「伺われる」は「窺われる（うかがえる）」と同じ字になるので載せない。「お伺いください」「ご持参ください」のように認める手引きがある形も載せない。
id: humble-for-others
language: ja
