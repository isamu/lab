# 「れる/られる」を付けると自発（ひとりでにそう思える）に読む動詞。「〜と考えられる」「〜と思われる」は、
# 書き手の判断をやわらげて言うもので、誰かのした動作を隠していない。agentless-passive はこれを受動に数えない。
# 形態素解析の原形（基本形）で照らす。「解す」は法令・判決の「〜と解される」（解釈として自然にそう読める）。
# 過去の「考えられた」「解された」は誰かの考えた動作なので、語がここにあっても受動に数える（passive-reading.ts）。
# 現在形で考え出す意味の受動（「新しい案が考えられる」）は自発と形で分けられないので、数えない側に倒れる。
# 受動にも自発にも同じくらい読む動詞は入れない: 見る（「違いが見られる」は自発、「採用の際によく見られる」は受動）、
# 言う（「〜と言われる」は誰が言ったかを隠す）、求める（「協力が求められる」は誰が求めるのかを隠す）、
# 見込む（「増加が見込まれる」は自発、「予算に見込まれていない」は受動）。
id: spontaneous-verb
language: ja
entries:
  - pattern: 思う
  - pattern: 考える
  - pattern: 感じる
  - pattern: 案じる
  - pattern: 偲ぶ
  - pattern: 思い出す
  - pattern: 解す
