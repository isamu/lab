id: unqualified-superlative
layer: L2
status: stable
how_to_find: unqualified-superlative
word_list: superlative
extra_word_lists: [comparison-marker, superlative-scope, quantity-noun]
uses: [pos]
severity: warning

name:
  ja: 比べる相手のない最上級
  en: Superlative with nothing to compare

why:
  ja: 「最も速い」だけでは、何と比べて最もなのかがありません。比較対象も条件も無い最上級は、読み手に確かめようがありません。
  en: '"The fastest" without saying than what leaves the reader nothing to check.'

message:
  ja: 「{matched}」に比べる相手がありません（そういう言い方が {count} 箇所）
  en: '"{matched}" has nothing to compare against ({count} such {count|claim|claims})'

how_to_fix:
  ja: 比較対象か条件を添えてください。「社内の 3 案のうち最も速い」のように。
  en: Name the comparison. "The fastest of the three options we tried."

levels: { strict: 1, normal: 2, relaxed: 4 }
# An English tech blog states its thesis once: "The best way to X is Y" is the one bare claim in the post. Measured on the
# judged chaff-corpus, a limit of one brings back judged-correct findings only in English blog/tech; in Japanese blog/tech
# and in every other genre it brings back false ones.
by_genre:
  blog/tech:
    en: { strict: 1, normal: 1, relaxed: 2 }

use_for: [business, blog, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."
sources: [femmer-2017]

group: wording
summary:
  ja: 「最速」「最高の品質」のように、何と比べたのかを書いていない最上級
  en: A superlative such as "the fastest" with nothing to compare it against
example:
  ja:
    before: 当社の新製品は最速で、最高の品質です。圧倒的な使いやすさです。
    after: 当社の新製品は、従来品より処理が二割速くなりました。
  en:
    before: Our new product is the fastest on the market, with unmatched quality and unparalleled ease of use.
    after: Our new product processes orders a fifth faster than the previous model.

not_flagged:
  ja: 「当社比」「〜の中で」「〜のほうが」のように、比べる相手や範囲が同じ文にあれば指しません。「SES との最大の違い」のように、最上級のすぐ前に相手があるときも同じです。「国内最大」「業界最速」のように名詞がじかに付いた最上級と、「日本で最も」のように名前と「で」が前にある最上級は、範囲を言っているので指しません。「バグを検出できる唯一のルール」のように、動詞で終わる節が最上級のすぐ前にあって範囲を決めているときも同じです。「」や引用符で引いた言葉の中の最上級は、書き手の主張ではないので指しません。「最大化する」のように接尾辞が付いて別の語になったものも指しません。「芭蕉の最も有名な句」のように名前と「の」がすぐ前にある最上級、「最高裁判所」「最も近い駅」のような決まった言い方、「最大５億ドル」のように数のある文の最上級も指しません。「世界で唯一の」のように場や分野の名詞と「で」が前にある最上級、「俺にとって最高の日」のように誰にとってなのかが同じ節にある最上級、「最高の規律が求められる」「最高の栄誉が与えられるべき」のように求めるもの・あるべき姿として述べた最上級、「最も重要なことは」のように話の順を示す言い方、問いの文（？で終わる文）の最上級も指しません。
  en: A superlative with its comparison or scope in the same sentence ("in our range", "than last year", "the fastest in the industry") is not reported, nor is one limited by a clause ("the best we have measured"), nor one inside quotation marks, which are someone else's words, nor one inside a set phrase ("even the best", "in the best case", "make the most of", "the most recent", "the most common"), nor one in a question. A superlative that is sought or chosen rather than claimed ("to achieve the best results", "before deciding the best way", "start with the most important tasks") is not reported, nor one whose predicate points at a member of a set ("the best plan is the one you keep"), nor one whose noun names a part of a whole ("the most important part", "the most important role"), nor one whose set follows its noun ("the best thing about this event", "the most common form of debunking", "the most important tool for creating the culture").
level_meaning:
  ja: 比べる相手のない最上級が {limit} 箇所あれば指摘
  en: reported once there are {limit} such claims
