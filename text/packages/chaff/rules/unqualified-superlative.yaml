id: unqualified-superlative
layer: L2
status: experimental
how_to_find: unqualified-superlative
word_list: superlative
extra_word_lists: [comparison-marker, superlative-scope, quantity-noun]
uses: [pos]
severity: warning

name:
  ja: 比べる相手のない最上級
  en: Superlative with nothing to compare

why:
  ja: 「最も速い」だけでは、何と比べて最もなのかがありません。比較対象も条件も無い最上級は、読み手に確かめようがありません。
  en: '"The fastest" without saying than what leaves the reader nothing to check.'

message:
  ja: 「{matched}」に比べる相手がありません（そういう言い方が {count} 箇所）
  en: '"{matched}" has nothing to compare against ({count} such {count|claim|claims})'

how_to_fix:
  ja: 比較対象か条件を添えてください。「社内の 3 案のうち最も速い」のように。
  en: Name the comparison. "The fastest of the three options we tried."

levels: { strict: 1, normal: 2, relaxed: 4 }

use_for: [business, blog, legal, docs, academic, literature, speech]

group: wording
summary:
  ja: 「業界最速」「最高の品質」のように、何と比べたのかを書いていない最上級
  en: A superlative such as "the fastest" with nothing to compare it against
example:
  ja:
    before: 当社の新製品は業界最速で、最高の品質です。圧倒的な使いやすさです。
    after: 当社の新製品は、従来品より処理が二割速くなりました。
  en:
    before: Our new product is the fastest on the market, with unmatched quality and unparalleled ease of use.
    after: Our new product processes orders a fifth faster than the previous model.

not_flagged:
  ja: 「当社比」「〜の中で」「〜のほうが」のように、比べる相手や範囲が同じ文にあれば指しません。「SES との最大の違い」のように、最上級のすぐ前に相手があるときも同じです。「」や引用符で引いた言葉の中の最上級は、書き手の主張ではないので指しません。
  en: A superlative with its comparison or scope in the same sentence ("in our range", "than last year") is not reported, nor is one inside quotation marks, which are someone else's words.
level_meaning:
  ja: 比べる相手のない最上級が {limit} 箇所あれば指摘
  en: reported once there are {limit} such claims
