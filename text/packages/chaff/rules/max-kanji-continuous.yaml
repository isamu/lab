id: max-kanji-continuous
layer: L3
status: stable
how_to_find: kanji-run
# 品詞があれば、住所（地名と数だけでできた連なり）と 1 つの名前（辞書の固有名詞 1 語、人の姓と名）を数えない。無くても文字だけで動く。
uses: [pos]
# chaff.yaml の names に並べた名前は連なりを切る。鉤括弧の中身がまるごと 1 つの連なりなら数えない（書き手が 1 つの名前と示している）。
# 住所の先頭にしか来ない単位（都道府県）。地名の後ろに付けば、割られた町名ではなく地名の並び。
# 組織の名前（organisation-form で始まるか地名・固有名詞で始まり organisation-unit で閉じる、organisation-unit で閉じる区切りが続く、
# または固有名詞か地名を含み、名前の後ろに立つ法人格で閉じる）は数えない。
# 題の名前（title-ending で閉じ、括弧を閉じるか補いの括弧が続くか一行だけか見出しにあるか、文書の中で同じ連なりを繰り返すもの:
# 〜実施要綱、〜選考試験、〜幹部会同）は数えない。法令・制度・給付の名前（fixed-name-ending で閉じるもの: 〜法施行令、〜制度、
# 〜交付金）は、置き方を問わず数えない。
# 日付の単位（4月の「月」）は、数に付いた助数詞として連なりの頭から外す。漢数字の日付（令和七年六月二十三日）も頭から外す。
# 中黒の後ろへ続いて organisation-unit で閉じる名前（〜審議会企業年金・個人年金部会）の前半は数えない。
# 文書のどこかで括弧の中身がまるごとその連なりである名前は、文の中で使っても数えない。法令の題（〜に関する法律）を囲む括弧の中の連なりも数えない。
# 文書が単独で使う法令・制度の名前（政治資金規正法）と、法令が名に取った語（愛玩動物看護師法の「愛玩動物看護師」）は、連なりの中でも割る。
# 職名（kanji-known-word）のすぐ前か後ろの人の姓と名も割る。元号の付いた年（令和元年）と、仮名へ続く接続の語の漢字（及び の「及」）は外す。
extra_word_lists:
  [
    prefecture-unit,
    organisation-form,
    organisation-unit,
    title-ending,
    fixed-name-ending,
    calendar-unit,
    addressee-prefix,
    addressee-title,
    reference-prefix,
    list-suffix,
    kanji-known-word,
  ]
languages: [ja]
severity: info

name:
  ja: 漢字が続きすぎている
  en: Long run of kanji

why:
  ja: 漢字が続くと、どこで語が切れるのか読み手が探すことになります。「情報処理推進機構認定試験」は 12 字あり、区切りが見えません。
  en: A long unbroken run of kanji forces the reader to hunt for word boundaries.

message:
  ja: 「{word}」は漢字が {count} 字続いています（{limit} 字まで）
  en: '"{word}" runs {count} kanji together (limit {limit})'

how_to_fix:
  ja: ひらがなを 1 つ挟むか、助詞で割ってください。「情報処理推進機構の認定試験」に。割れない正式名称なら、chaff.yaml の names に並べると数えません。鉤括弧でまるごとくくった名前（「英国大使館別荘記念公園」）も数えません。
  en: Break it with a particle or kana. If it is an official name that cannot be broken, list it under names in chaff.yaml and it is not counted. A name that fills a 「」 quotation exactly is not counted either.

levels: { strict: 6, normal: 8, relaxed: 12 }

# ビジネス文書、特にお知らせは、組織名や制度名を漢字のまま並べる。既定の上限では group の文書の過半に出たので、測って上げた（spec §21.1）。
by_genre:
  business: { strict: 8, normal: 10, relaxed: 14 }

options:
  headword_genres:
    kind: words
    default: [docs/glossary]
    about:
      ja: 一行が漢字の連なりだけの行を、定義する見出し語と読んで数えない genre。見出し語は定義される語そのもので、書き換えられない
      en: Genres where a line holding only a run of kanji is the headword being defined, and is not counted. A headword is the term itself and cannot be reworded

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."
precision_hold:
  business: "Its false positives are official titles and the names of bodies, programmes and statutes; the rule is to be narrowed for them, not turned off."
  docs: "Its false positives are official titles and the names of bodies, programmes and statutes; the rule is to be narrowed for them, not turned off."
  speech: "Its false positives are official titles and the names of bodies, programmes and statutes; the rule is to be narrowed for them, not turned off."
sources: [shibasaki-tamaoka-2010, lee-2016]

group: readability
summary:
  ja: 「新規顧客獲得施策検討会議」のように、漢字だけが長く続く所
  en: A long run of kanji with no kana between them, hard for readers to take apart
example:
  ja:
    before: 来週、新規顧客獲得施策検討会議を開きます。
    after: 来週、新しい顧客を増やす施策を話し合う会議を開きます。

not_flagged:
  ja: 組織の正式名称（国立研究開発法人産業技術総合研究所、経済産業省製造産業局自動車課、東日本青葉自動車販売株式会社）、題の名前（要綱・試験・事業・法令などで終わり、一行だけで書くか括弧でくくるか見出しにあるか、文書の中で繰り返すもの。大阪市鶴見区役所公募型比較見積実施要綱など）、法令・制度・給付の名前（住民基本台帳法施行令、勤労者財産形成貯蓄制度、社会資本整備総合交付金。文のどこにあっても）、chaff.yaml の names に書いた組織名や製品名、法令の条番号（第二十二条第二項）は数えません。空白を挟んで法人格か組織の区切りの後ろに立つ組織の名前（一般社団法人 全国〜センター、〜局 〜課 〜係）と、鉤括弧の中身が漢字の連なりとカタカナや英数字の語だけの名前（「登録業者情報検索入力ページ」）も数えません。頭の、前を指す語（上記、当該）と代の序数（第百二代、初代）と漢数字の日付（令和七年六月二十三日、令和元年）、尻の「等」と、仮名へ続く接続の語の漢字（方針及び基本構想の「及」）は数えません。文書のどこかで括弧でまるごとくくった名前（「署名用電子証明書確認画面」、［当事者系審判請求人］）は文の中で使っても数えず、法令の題を囲む括弧（（〜に関する法律））の中の連なりも数えません。文書が単独で使う法令の名前（政治資金規正法）と法令が名に取った語（愛玩動物看護師法の「愛玩動物看護師」）、職名のすぐ前か後ろの人の姓と名（小泉純一郎内閣総理大臣、内閣総理大臣石破茂）は、連なりを割ります。序数で始まる組織の単位（方式審査室第三担当、東京電力福島第一原子力発電所）と、中黒の後ろで組織の語で閉じる名前の前半（社会保障審議会企業年金・個人年金部会の「社会保障審議会企業年金」）も数えません。文書がほかで単独で使う組織の名前（安全保障理事会常任理事国の「安全保障理事会」）、連なりを閉じる決まった語（日本国内閣総理大臣の「内閣総理大臣」、〜許可事業者）は、その前後を別の連なりとして数えます。用語集（headword_genres）の、一行が漢字の連なりだけの見出し語は数えません。出席者の並び（区長、副区長、〜委員会事務局長）のように文で終わらない名前の並びの項目は、宛名と同じく、組織の名前の後ろの役職を数えません。
  en: Official organisation names (a legal form or a place name followed by a name that ends in a unit such as 研究所 or 協会, or a chain of units such as 省・局・課, or a name with a proper noun closed by a legal form such as 株式会社), titles of named things (a run ending in 要綱, 試験, 事業, 法 and the like that stands on a line of its own, closes a bracket, is followed by a bracketed note, appears in a heading, or recurs in the document), names of statutes, schemes and grants wherever they stand (住民基本台帳法施行令, 勤労者財産形成貯蓄制度, 社会資本整備総合交付金), names listed under names in chaff.yaml, and provision numbers in statutes (第二十二条第二項) are not counted. Nor is an organisation name that follows a legal form or an organisation unit across a space (一般社団法人 全国〜センター, 〜局 〜課 〜係), or a name in 「」 made of the kanji run and words with no kanji or hiragana (「登録業者情報検索入力ページ」). A leading word that points back or ahead (上記, 当該), a leading ordinal (第百二代, 初代), a leading date in kanji numerals (令和七年六月二十三日, 令和元年), a trailing 等 and the kanji of a conjunction that continues in kana (及 in 方針及び基本構想) are not counted. A name the document puts whole in brackets somewhere (「署名用電子証明書確認画面」, ［当事者系審判請求人］) is not counted where it is used in a sentence either, nor is a run inside the brackets around a statute's title (（〜に関する法律）). A statute name the document uses on its own (政治資金規正法), the term a statute is named after (愛玩動物看護師 in 愛玩動物看護師法), and a person's full name right before or after an official title (小泉純一郎内閣総理大臣, 内閣総理大臣石破茂) split the run. Nor is an organisation unit that starts with an ordinal (方式審査室第三担当, 東京電力福島第一原子力発電所), or the first half of an organisation name that continues after a ・ and closes in an organisation unit (社会保障審議会企業年金 in 社会保障審議会企業年金・個人年金部会). An organisation name the document uses on its own elsewhere (安全保障理事会 in 安全保障理事会常任理事国), and a fixed word that closes the run (内閣総理大臣 in 日本国内閣総理大臣, 〜許可事業者) split the run, and what is before and after them is counted apart. In a glossary (headword_genres), a line that holds only a run of kanji is the headword and is not counted. In a list of names with no sentence end (an attendee list such as 区長、副区長、〜委員会事務局長), the title after an organisation name in an item is not counted, as in an addressee line.
level_meaning:
  ja: 漢字の連続 {limit} 字まで
  en: up to {limit} kanji in a row
