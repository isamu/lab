id: max-kanji-continuous
layer: L3
status: experimental
how_to_find: kanji-run
# 品詞があれば、住所（地名と数だけでできた連なり）と 1 つの名前（辞書の固有名詞 1 語、人の姓と名）を数えない。無くても文字だけで動く。
uses: [pos]
# chaff.yaml の names に並べた名前は連なりを切る。鉤括弧の中身がまるごと 1 つの連なりなら数えない（書き手が 1 つの名前と示している）。
# 住所の先頭にしか来ない単位（都道府県）。地名の後ろに付けば、割られた町名ではなく地名の並び。
extra_word_lists: [prefecture-unit]
languages: [ja]
severity: warning

name:
  ja: 漢字が続きすぎている
  en: Long run of kanji

why:
  ja: 漢字が続くと、どこで語が切れるのか読み手が探すことになります。「情報処理推進機構認定試験」は 12 字あり、区切りが見えません。
  en: A long unbroken run of kanji forces the reader to hunt for word boundaries.

message:
  ja: 「{word}」は漢字が {count} 字続いています（{limit} 字まで）
  en: '"{word}" runs {count} kanji together (limit {limit})'

how_to_fix:
  ja: ひらがなを 1 つ挟むか、助詞で割ってください。「情報処理推進機構の認定試験」に。割れない正式名称なら、chaff.yaml の names に並べると数えません。鉤括弧でまるごとくくった名前（「英国大使館別荘記念公園」）も数えません。
  en: Break it with a particle or kana. If it is an official name that cannot be broken, list it under names in chaff.yaml and it is not counted. A name that fills a 「」 quotation exactly is not counted either.

levels: { strict: 6, normal: 8, relaxed: 12 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."
sources: [shibasaki-tamaoka-2010, lee-2016]

group: readability
summary:
  ja: 「新規顧客獲得施策検討会議」のように、漢字だけが長く続く所
  en: A long run of kanji with no kana between them, which Japanese readers have to take apart
example:
  ja:
    before: 来週、新規顧客獲得施策検討会議を開きます。
    after: 来週、新しい顧客を増やす施策を話し合う会議を開きます。

not_flagged:
  ja: chaff.yaml の names に書いた組織名や製品名、法令の条番号（第二十二条第二項）は数えません。
  en: Names listed under names in chaff.yaml, and provision numbers in statutes (第二十二条第二項), are not counted.
level_meaning:
  ja: 漢字の連続 {limit} 字まで
  en: up to {limit} kanji in a row
