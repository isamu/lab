id: line-amount-mismatch
layer: L3
status: stable
how_to_find: line-amount
# The column names come from the language's quantity-column, unit-price-column and line-amount-column lexicons, and a
# catalog's from pack-count-column and pack-price-column; the units of a quantity and of a per-unit price from rate-unit
# and per-unit-mark.
languages: [ja, en]
severity: error

name:
  ja: 数量×単価が金額と合わない
  en: Quantity times unit price is not the line amount

why:
  ja: 見積書や請求書の明細で、数量と単価を掛けた額がその行の金額と合わないと、読み手はどれが正しいのかを問い合わせることになります。数量か単価だけを直して金額を直し忘れたときに起きます。見出しに数量・単価・金額の列がある表で、行ごとに数量の升の頭の数と単価を掛け、金額の升と比べます。商品カタログの入数・単価・1箱の価格の列がある表では、入数 × 単価を1箱の価格と比べます。項目の升の括弧に書いた掛け算（会費（3,000円×24名））も、名や世帯で数えた数と金額の一つずつなら掛けて、その行のただ一つの金額と比べます。
  en: When quantity times unit price in a line of a quote or an invoice is not the line's amount, the reader has to ask which one is right. It happens when the quantity or the price is changed and the amount is not. In a table with quantity, unit price and amount columns, each row's quantity (the number its cell starts with) times its unit price is compared with its amount. In a catalog with count per pack, unit price and pack price columns, count per pack × unit price is compared with the pack price. A product written in brackets in the item cell (Membership dues (24 members × $40)), one amount of money and one count in a counting word, is compared with the row's one amount too.

message:
  ja: 金額「{written}」が、数量×単価（{quantity} × {price} = {expected}）と合いません
  en: "The amount {written} is not quantity × unit price ({quantity} × {price} = {expected})"

how_to_fix:
  ja: 数量・単価・金額のどれが正しいかを確かめて直してください。小計と合計も一緒に直します。
  en: Check which of the quantity, the price and the amount is right and correct the others. Correct the subtotal and the total with them.

levels: { normal: error, relaxed: warning }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."

group: facts
summary:
  ja: 見積書や請求書の明細で、数量×単価がその行の金額と合わない所
  en: A line of a quote or invoice whose quantity times price is not its amount
example:
  ja:
    before: |
      | 品目 | 数量 | 単価 | 金額 |
      | --- | --- | --- | --- |
      | 画面開発 | 4画面 | 160,000円 | 600,000円 |
    after: |
      | 品目 | 数量 | 単価 | 金額 |
      | --- | --- | --- | --- |
      | 画面開発 | 4画面 | 150,000円 | 600,000円 |
  en:
    before: |
      | Item | Quantity | Unit price | Amount |
      | --- | --- | --- | --- |
      | Screens | 4 | $1,600 | $6,000 |
    after: |
      | Item | Quantity | Unit price | Amount |
      | --- | --- | --- | --- |
      | Screens | 4 | $1,500 | $6,000 |

not_flagged:
  ja: 端数は切り捨て・四捨五入・切り上げのどれでも合っていると読みます。納品書のように発注・納品・残の数量の列が並ぶ表では、どれか一つの数量×単価が金額になれば合っていると読みます。同じ役割の数量の列が二つある表（前回納品数と今回納品数）は読みません。単価と金額の書き方（円、万円、$）が違う行、単価が何かあたり（10,000円/時、月額、英語の Rate の列）で数量が別の単位で書かれた行（「2日」と月額）、ほかの列にも数のある行（値引き、税率。品名の列の数と、金額を税込で言い直す列は除きます）、升に数が二つ以上あるか負の印のある行、数量の升が数で始まらない行（「1式」は 1 と読みます）は比べません。年額の列（月額 × 月数）は、数量が「12か月」や月数の列のように月で数える行だけ比べます。入数は注文の数量ではないので、1箱の価格の列と並ぶときだけ読みます。見出しに三つの列がそろわない表と、コードの中は読みません。項目の升の括弧の掛け算は、×が二つ以上あるもの、% のあるもの、金額と数える語の数の組でないもの（12m×4m、3,000円×24日）と、金額のほかにも数のある行（予算と決算）は読みません。
  en: Rounding down, to the nearest or up are all read as right. In a table with ordered, delivered and backordered quantity columns (a delivery note), a row is right when any one of them times the price is the amount; a table with two quantity columns of one kind (previously and now delivered) is not read. A row whose price and amount are written with different marks ($ and USD, 円 and 万円), a row whose price is per a unit ($100/hour, $300 per month, a Rate column) and whose quantity is written in another unit (2 days at $100/hour), a row with a number in another column (a discount, a tax rate; not a number in the item's name, nor the amount restated with tax), a cell with two numbers or a negative sign, and a quantity cell that does not start with a number are not compared. An annual amount (monthly × months) is compared only in a row whose quantity counts months (12 months, a Months column). A count per pack is no order quantity, so it is read only beside a pack price column. A table without all three columns, and code, are not read. A product in an item cell's brackets with two times marks, a %, or factors that are not one amount and one count in a counting word (12m × 4m, $40 × 24 days), and a row with another number besides its amount (budget and actual), are not read.
