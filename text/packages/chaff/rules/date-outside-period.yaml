id: date-outside-period
layer: L3
status: stable
how_to_find: date-outside-period
requires: [dates]
severity: warning

name:
  ja: 書いた期間の外の日付
  en: A date outside the stated period

why:
  ja: 「旅行期間：10月12日〜10月15日」と書いた旅程の中に10月17日の予定があると、期間と日程のどちらが正しいのかを読み手が問い合わせることになります。日付を書き写し間違えたときや、日程を動かして期間を直し忘れたときに起きます。期間は「旅行期間」「会期」のような期間の語で始まる一行から読み、その後ろの同じ節の箇条書き、表の行、見出しの日付と、地の文の年の無い日付を比べます。前泊や事後の予定、申込締切や予約の日、過去の回のように、期間の外に置く語がその行や文、節の見出しにある日付は比べません。年の無い期間（12月28日〜1月4日）は年をまたぐ期間として読みます。「開講期間」のように文書の仕事がその中で済む期間を、文書の頭か概要の節に書いたときは、後ろのどの節でも「提出」「締切」「課題」のある項目や文の日付が期間の終わりより後なら指します（課題の提出期限が学期の後）。年の無い日付は、期間が一つの年に収まるときだけその年と読みます。
  en: 'When an itinerary says "Trip dates: Oct 12–15" and then lists something on October 17, the reader has to ask whether the period or the schedule is right. It happens when a date is copied wrong, or when the schedule moves and the period is not updated. The period is read from one line that starts with a period word such as "Trip dates" or "Conference", and the dates after it in the same section are compared, in list items, table rows and headings, and in running text when the date has no year. A date whose item, sentence or section heading marks it as outside the period on purpose (a post-trip meeting, a booking deadline, a past edition) is not compared. A period without a year ("Dec 28 – Jan 4") is read as running into the new year. When the period the document''s work is done in ("Term") is stated at the top or in the overview section, a date after its end in an item or sentence of any later section that says "submit", "due", "deadline" or "assignment" is reported (an assignment due after the term). A date without a year takes the term''s year only when the term lies within one year.'

message:
  ja: 「{date}」が、書いた期間「{period}」の外です
  en: '{date} is outside the stated period "{period}"'

how_to_fix:
  ja: 日付と期間を確かめて、書き間違えたほうを直してください。期間の前後に置く予定なら、前泊、事後のようにそう分かる書き方にしてください。
  en: Check the date and the period, and correct the one that is wrong. If the item is meant to fall before or after the period, say so ("pre-trip", "follow-up").

levels: { strict: error, normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."

group: facts
summary:
  ja: 旅程や会期のように書いた期間の外にある、日程の日付
  en: A dated item outside the period the document states, such as a trip's or a conference's dates
example:
  ja:
    before: |
      旅行期間：2026年10月12日〜2026年10月15日

      - 10月12日 成田を出発
      - 10月14日 市内視察
      - 10月17日 成田に帰着
    after: |
      旅行期間：2026年10月12日〜2026年10月15日

      - 10月12日 成田を出発
      - 10月14日 市内視察
      - 10月15日 成田に帰着
  en:
    before: |
      Conference: May 3–5, 2026

      - May 3: registration and keynote
      - May 4: workshops
      - May 7: closing session
    after: |
      Conference: May 3–5, 2026

      - May 3: registration and keynote
      - May 4: workshops
      - May 5: closing session

not_flagged:
  ja: 期間を書いていない文書、期間の外に置く語（前泊、事後、申込締切、予約、前回）のある日付、年の無い期間が年をまたぐときの年明けの日付は比べません。旅行期間や会期の後の締め切り（精算書の提出）、支払の期限、成績発表や成績照会、再試験のように学期の後に来てよい日付、年をまたぐ開講期間に対する年の無い締め切りは指しません。
  en: 'A document with no stated period, a date marked as outside on purpose ("post-trip", "follow-up", "book by", "deadline", "previous"), and the new-year dates of a period without a year that runs past December 31 are not compared. A deadline after a trip or a conference (an expense report), a payment deadline, work that may come after a term (grades released, grade appeals, resits), and a deadline without a year against a term that runs across two years are not reported.'
