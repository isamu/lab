id: doubled-word
layer: L3
status: experimental
how_to_find: doubled-word
word_list: doubled-word
requires: [pos]
severity: warning

name:
  ja: 語を二度書いている
  en: Word written twice

why:
  ja: 「資料をを送ります」「話にに出ました」のように助詞や助動詞が続くのは、消し忘れか、書き換えの途中で残った語です。読み手はつまずき、急いで書いた文書に見えます。名詞や形容詞を丸ごと重ねた形（「個人個人」「一行一行」「若い若い」）、擬音・擬態語（「ムクムク」「もちもち」）、笑い声（「ははは」）、決まった言い回し（「などなど」「あるある」）は、重ねるのが正しい書き方なので数えていません。
  en: The same word twice in a row ("the the"), or two words where English takes one ("our the platform"), is left over from an edit. The reader stumbles, and the document looks rushed. Repeats that grammar allows ("had had", "that that", "is, is") and repeats for emphasis ("very very") are not counted.

message:
  ja: 「{word}」で語が重なっています。どちらかが余分です
  en: '"{word}" doubles a word; one of the two is left over'

how_to_fix:
  ja: 余分なほうを消してください。書き換えの途中なら、残したい言い方に揃えてください。
  en: Delete the extra word. If a rewrite was half done ("our the platform"), keep the wording you meant.

levels: { strict: error, normal: warning, relaxed: info }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: slips
summary:
  ja: 「資料をを」「the the」のように、同じ語が続けて二度書かれている所
  en: The same word written twice in a row, as in "the the"
example:
  ja:
    before: 明日、資料をを送ります。
    after: 明日、資料を送ります。
  en:
    before: We will send the the file tomorrow.
    after: We will send the file tomorrow.

not_flagged:
  ja: 品詞の違う同じ語、名詞や形容詞を丸ごと重ねた形（「個人個人」「駄目駄目」「えらいえらい」）、仮名の擬音・擬態語（「ムクムク」「もちもち」）、同じ一字の仮名が三つ以上続く笑い声（「ははは」）、決まった言い回し（「などなど」「あるある」）、重ねて強める書き方（「そうそう」「very very」）は指しません。外来語の重なり（「ユーザーユーザー」）と、三つ続く重なり（「資料資料資料」）は指します。英語で文法が許す重なり（had had、that that）も指しません。
  en: Repeats that grammar allows ("had had", "that that"), repeats for emphasis ("very very"), and the same word in two different parts of speech are not reported.
