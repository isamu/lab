id: agreement-slip
layer: L3
status: experimental
how_to_find: agreement-slip
requires: [pos]
languages: [en]
extra_word_lists: [singular-determiner, plural-determiner, invariant-noun, count-adjective, dependent-possessive, finite-auxiliary, misnumbered-phrase]
severity: warning

name:
  ja: 語の形が合っていない
  en: Words that do not agree

why:
  ja: 「a significant changes」「these new version」のように限定詞と名詞の単数・複数が食い違う文や、「Your can check」のように所有の語が主語の位置にある文は、書き換えの途中で片方だけ直した跡です。読み手はつまずき、急いで書いた文書に見えます。解析器の読みが一通りに決まる形だけを数え、単数と複数が同じ綴りの語（series / data）、代名詞にも読める this / these の直後の語、名詞を重ねた語（a sales team）は数えていません。
  en: A determiner and a noun that differ in number ("a significant changes", "these new version"), or a possessive where the subject belongs ("Your can check"), is left over from an edit that fixed one word and not the other. The reader stumbles, and the document looks rushed. Only forms with one reading are counted; nouns spelled alike in both numbers ("series", "data"), a word right after "this" or "these" (which can stand alone), and nouns that modify another noun ("a sales team") are not.

message:
  ja: 「{word}」で単数と複数が合っていません
  en: '"{word}" mixes singular and plural'

messages:
  number:
    ja: 「{word}」で単数と複数が合っていません
    en: '"{word}" mixes singular and plural'
  possessive:
    ja: 「{word}」で、所有の語が主語の位置にあります
    en: '"{word}" puts a possessive where the subject belongs'

how_to_fix:
  ja: 限定詞か名詞のどちらかに揃えてください（a significant change / significant changes）。所有の語なら、主語の語に直してください（Your can → You can、their is → there is）。
  en: Make the determiner and the noun agree ("a significant change" or "significant changes"). For a possessive, write the subject you meant ("Your can" becomes "You can", "their is" becomes "there is").

levels: { strict: 1, normal: 1, relaxed: 1 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: slips
summary:
  ja: 英語で、「these new version」のように単数と複数が合っていない所
  en: Words that no longer agree after an edit, as in "these new version"
example:
  en:
    before: These new version will ship in May.
    after: This new version will ship in May.

not_flagged:
  ja: 単数と複数で形が同じ名詞（series、data）、this や these の直後の語、名詞を修飾する名詞（a sales team）は指しません。
  en: Nouns spelled alike in both numbers ("series", "data"), a word right after "this" or "these", and nouns that modify another noun ("a sales team") are not reported.
