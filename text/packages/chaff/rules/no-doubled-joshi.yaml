id: no-doubled-joshi
layer: L3
status: stable
how_to_find: doubled-particle
word_list: nesting-particle
requires: [pos]
languages: [ja]
severity: info

name:
  ja: 同じ助詞が入れ子で続いている
  en: Nested repeated particle

why:
  ja: 「弊社の新製品の販売の計画」のように同じ助詞が読点を挟まずに続くと、どれがどれに係るのか読み手が追えなくなります。読点で区切られた並列は数えていません。鉤括弧で引いた題名や発言（「食品中のウイルスの制御のための…」）の中は書き手が言い換えられないので数えず、引いたもの全体を一つの名詞として読みます。
  en: When the same particle repeats without a break, the reader cannot tell which phrase attaches to which. Items separated by punctuation are not counted. Nor are particles inside a title or a quotation in 「」 or 『』, which the writer cannot rephrase; the quotation as a whole is read as one noun.

message:
  ja: 「{word}」が読点を挟まずに {count} 回続いています（{limit} 回まで）
  en: '"{word}" repeats {count} {count|time|times} with no break (limit {limit})'

how_to_fix:
  ja: 文を割るか、係り先を言い換えてください。「弊社の新製品の販売の計画」を「弊社が新製品を販売する計画」に。
  en: Split the sentence, or rephrase so the attachment is explicit.

levels: { strict: 1, normal: 2, relaxed: 3 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."
sources: [yamamoto-cheng-2015]

group: readability
summary:
  ja: 「会社の部の課の方針」のように、同じ助詞が区切りなしに続く所
  en: The same Japanese particle repeated, so what attaches to what is unclear
example:
  ja:
    before: 本社の営業部の第二課の方針を確認しました。
    after: 本社営業部にある第二課の方針を確認しました。

not_flagged:
  ja: 読点で区切った並び、「」や『』の中の題名や引用は数えません。
  en: Items separated by commas, and titles or quotations inside 「」 or 『』, are not counted.
level_meaning:
  ja: 同じ助詞の連続 {limit} 回まで
  en: up to {limit} of the same particle in a row
