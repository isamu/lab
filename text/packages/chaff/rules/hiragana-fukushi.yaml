id: hiragana-fukushi
layer: L3
status: stable
how_to_find: phrase-match
word_list: hiragana-fukushi
uses: [pos]
languages: [ja]
severity: info

name:
  ja: 副詞は ひらがなで
  en: Adverb better in kana

why:
  ja: 表外漢字の副詞は、読める人と読めない人が分かれます。ひらがなで書けば誰でも読めて、意味は変わりません。公用文でかな書きと決まっているものだけを見ています。
  en: Adverbs written with rare kanji split readers into those who can read them and those who cannot. Kana costs nothing.

message:
  ja: 「{matched}」は ひらがなで書くのが読みやすいです
  en: '"{matched}" reads more easily in kana'

how_to_fix:
  ja: かなに開いてください。「殆ど」は「ほとんど」、「勿論」は「もちろん」。
  en: Write it in kana.

levels: { strict: 1, normal: 1, relaxed: 3 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: readability
summary:
  ja: 「殆ど」「勿論」のように、ひらがなのほうが読みやすい副詞を漢字で書いた所
  en: A Japanese adverb written in rare kanji where kana is easier to read
example:
  ja:
    before: 参加者の殆どが、勿論その案に賛成しました。
    after: 参加者のほとんどが、もちろんその案に賛成しました。

not_flagged:
  ja: 一覧にある副詞だけを見ます。常用漢字で普通に書く副詞（「必ず」「特に」など）は指しません。
  en: Only the adverbs on chaff's list are checked; adverbs normally written in common kanji are not.
level_meaning:
  ja: 当てはまる語が {limit} 箇所あれば指摘
  en: reported once there are {limit}
