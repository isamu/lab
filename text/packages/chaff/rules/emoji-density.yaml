id: emoji-density
layer: L1
status: experimental
how_to_find: emoji-density
severity: info

name:
  ja: 絵文字が多い
  en: Too many emoji

why:
  ja: 絵文字は 1 つなら目印になりますが、並ぶと文字そのものが読めなくなります。読み上げ環境では意味を持たない音が増えます。
  en: One emoji marks a spot. Many turn the text into decoration, and a screen reader has to say all of them.

message:
  ja: 1000 字あたり {density} 個の絵文字があります（{limit} 個まで）
  en: "{density} emoji per 1000 words (limit {limit})"

how_to_fix:
  ja: 見出しや強調で代えられるものは代えてください。
  en: Where a heading or emphasis would do the same job, use that instead.

# 1000 語（日本語は 1000 字）あたりの個数。件数で数えると長い文書ほど当たる。
levels: { strict: 3, normal: 8, relaxed: 20 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: readability
summary:
  ja: 絵文字が多すぎて、飾りのほうが目立つ所
  en: So many emoji that the decoration drowns the text
example:
  ja:
    pad: true
    before: |
      新機能が出ました🎉🎉 すぐに試せます🚀🔥 感想をお待ちしています🙏✨💬
    after: |
      新機能が出ました🎉 すぐに試せます。感想をお待ちしています。
  en:
    pad: true
    before: |
      The new feature is live 🎉 Try it today 🚀 We would love your feedback 🙏✨
    after: |
      The new feature is live 🎉 Try it today, and tell us what you think.

not_flagged:
  ja: 短い文書（日本語 500 字、英語 200 語より短いもの）は測りません。
  en: Documents under 200 words are not measured.
level_meaning:
  ja: 1000 字あたり絵文字 {limit} 個まで
  en: up to {limit} emoji per 1000 words
