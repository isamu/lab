id: section-length-uniformity
layer: L1
status: stable
how_to_find: section-uniformity
severity: info

name:
  ja: 節の長さが揃いすぎている
  en: Section lengths are too uniform

why:
  ja: 見出しごとに機械的に埋めると、節の長さが揃います。書くことの量は節ごとに違うはずです。
  en: Filling every heading to the same size is what a template does, not what a writer does.

message:
  ja: 節の長さのばらつきが {variance}% しかありません（{limit}% 以上ほしい）
  en: Section length varies by only {variance}% (want at least {limit}%)

how_to_fix:
  ja: 書くことの少ない節は短いままにしてください。
  en: Let the thin sections stay thin.

levels: { strict: 45, normal: 35, relaxed: 25 }

options:
  min_sections:
    kind: count
    default: 5
    about:
      ja: 測る節の数の下限。節が少ないと長さのばらつきは偶然で小さく出て、人の書いた文書でも揃って見えます
      en: The fewest sections measured. With few sections, the variation is small by chance, and a person's writing looks uniform too

use_for: [technical/readme, blog, legal, docs, academic, literature, speech]

group: ai-tells
summary:
  ja: どの節もほぼ同じ長さに埋めてあり、ひな形を埋めたように見える所
  en: Every section filled to the same size, which is what a template does
example:
  ja:
    config: { genre: blog/tech }
    before: |
      # 新しい道具の紹介

      ## 入れる

      公式のページから、使う機械に合った版を選んで入れます。

      ## 設定する

      右上の歯車の印を押して、言語と文書の種類を選びます。

      ## 招く

      左の招待の画面で、仲間の宛先を入れて送ります。

      ## 確かめる

      試しの文書を置いて、指摘が画面に出るかを見ます。

      ## 更新する

      新しい版が出たら、同じ公式のページから入れ直します。
    after: |
      # 新しい道具の紹介

      ## 入れる

      公式のページから入れます。

      ## 設定する

      右上の歯車の印を押して、言語と文書の種類を選びます。項目は多いですが、最初に触るのはこの二つだけで足ります。ほかは、使いながら必要になったときに変えてください。

      ## 招く

      左の招待の画面から送ります。

      ## 確かめる

      試しの文書を置いて、指摘が画面に出るかを見ます。

      ## 更新する

      新しい版は同じページにあります。
  en:
    config: { genre: blog/tech }
    before: |
      # Introducing the new tool

      ## Install

      Pick the version for your computer from the official page.

      ## Set up

      Press the gear icon and choose your language and document type.

      ## Invite

      Enter your team's addresses on the invite page and send.

      ## Check

      Add a sample document and look for findings on the screen.

      ## Update

      When a new version comes out, install it again from the same page.
    after: |
      # Introducing the new tool

      ## Install

      Download it from the official page.

      ## Set up

      Press the gear icon and choose your language and document type. There are many options, but at first you only need these two. Change the rest when you need to.

      ## Invite

      Send invites from the page on the left.

      ## Check

      Add a sample document and look for findings on the screen.

      ## Update

      New versions are on the same page.

not_flagged:
  ja: 中身のある節が 5 より少ない文書は見ません（min_sections で変えられます）。ビジネス文書と仕様書（technical/spec）のジャンルでは見ません。
  en: Documents with fewer than 5 sections are not checked (min_sections changes it). Business and specification (technical/spec) genres do not run this rule.
level_meaning:
  ja: 節の長さのばらつきが {limit}% 未満なら指摘
  en: reported when section length varies by less than {limit}%
