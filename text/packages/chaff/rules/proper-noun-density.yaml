id: proper-noun-density
layer: L3
status: stable
how_to_find: proper-noun-density
requires: [pos]
# chaff.yaml の names に並べた名前は、何語に割れても 1 つと数える。名前そのものは数える（読み手が知らないことは変わらない）。
severity: info

name:
  ja: 固有名詞が多い
  en: Too many proper nouns

why:
  ja: 製品名・社名・人名が続くと、それを知らない読者は文の骨組みを見失います。知っている人には読めるので、書いた本人には気づきにくいところです。
  en: A run of product, company and person names hides the shape of the sentence from anyone who does not already know them. It reads fine to the person who wrote it.

message:
  ja: 1000 字あたり {density} 個の固有名詞があります（{limit} 個まで）
  en: "{density} proper {density|noun|nouns} per 1000 words (limit {limit})"

how_to_fix:
  ja: 2 度目からは「その製品」「そのチーム」のように受けてください。初出で何者かを一言添えると、知らない人も読めます。
  en: After first use, refer back to it. One phrase saying what it is lets a stranger keep reading.

# 英語は 1000 語あたり。英語の人の書いた文書（コーパスと Project Gutenberg の小説・随筆）で測ると、名前の多さの分布の
# 95 パーセンタイルあたりに normal を置く。測り方とその値は PR に残した（数字はここに書かない）。
levels:
  ja: { strict: 20, normal: 40, relaxed: 80 }
  en: { strict: 150, normal: 200, relaxed: 260 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  academic: "Science writes in the passive, hedges its claims on purpose (may, suggest) and cites numbers as its evidence."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech: "A speech opens with greetings and closes with thanks: that is its form, not padding."
  business/press-release: "A release names the agency, the people quoted, the mission and the place: that is its news, not a crowd of names to thin out. Every English release in the corpus (GSA, NASA, NOAA) is over the limit."

group: readability
summary:
  ja: 製品名・会社名・人名が詰まりすぎて、知らない人には文の形が見えない所
  en: So many product, company and personal names that a newcomer gets lost
example:
  ja:
    config: { rules: { proper-noun-density: strict } }
    pad: true
    before: |
      田中さんと佐藤さんが、東京の丸の内にあるトヨタとソニーとパナソニックの展示を見てから、大阪の梅田で日立の鈴木さんと会いました。翌日は京都で任天堂の山本さんと、神戸で川崎重工の中村さんと会い、名古屋に戻ってデンソーの小林さんとトヨタの加藤さんに報告しました。
    after: |
      営業部の二人が、取引先三社の展示を見てから、大阪で別の取引先の担当者と会いました。翌日は関西の二社を回り、名古屋に戻って取引先二社に報告しました。
  en:
    config: { rules: { proper-noun-density: strict } }
    pad: true
    before: |
      Alice Moreno and Bob Tanaka from Contoso met Carol Diaz from Fabrikam in Seattle, then flew with Dave Okafor from Northwind to Boston to see Erin Walsh at Tailspin and Frank Liu at Litware.
      In Chicago, Grace Kim of Proseware and Henry Park of Wingtip joined Ivan Petrov of Adatum, and Julia Rossi of Contoso brought Kevin Shah of Fabrikam.
      From Denver, Laura Chen of Northwind and Mark Evans of Tailspin called Nina Alvarez of Litware, Oscar Grant of Proseware and Paula Novak of Wingtip.
    after: |
      Two of our sales team met three customers on the West Coast, then flew to Boston to meet two more.
      In Chicago, three partners joined them, and our account lead brought a fourth.
      From Denver, two of the team called the remaining customers.

not_flagged:
  ja: chaff.yaml の names に書いた名前は、何語に分かれても 1 つと数えます。短い文書（日本語 500 字、英語 200 語より短いもの）は測りません。
  en: A name listed under names in chaff.yaml counts as one, however many words it has. Short documents (under 200 words) are not measured.
level_meaning:
  ja: 1000 字あたり固有名詞 {limit} 個まで
  en: up to {limit} proper nouns per 1000 words
