id: excessive-hedging
layer: L2
status: experimental
how_to_find: hedging
word_list: excessive-hedging
# 1 つの文の重なりを数えるときの、それだけでは逃げていない包む言い方（「という状況です」、may）と、
# 逃げの表現のうちどこで成り立つかを言うもの（「場合がある」、in some cases）。
extra_word_lists: [hedge-frame, hedge-scope]
uses: [pos]
severity: warning

name:
  ja: 逃げの表現が多い
  en: Too much hedging

why:
  ja: 断言を避けるほど、読み手は何が決まったのか分からなくなります。1 つなら慎重さですが、重なると誰も責任を取らない文書になります。chaff は 2 つの見方で探します。1 つの文に逃げを重ねたもの（「〜という状況であると考えられます」「〜かもしれないと思われます」）は、短い文書でも 1 文で指摘します。文書全体で逃げの表現が多すぎるものは、短い文書では測りません。重なりを数えるとき、鉤括弧や引用符で引いた発言の中の逃げは、話した人のものなので数えません。
  en: The more the text avoids claiming, the less the reader can tell what was decided. One hedge is caution; many mean nobody is accountable. chaff looks two ways. A sentence that stacks hedges ("may possibly", "it could perhaps be argued") is reported on its own, even in a short document. Too many hedges across the whole document is measured only on longer documents. When counting hedges stacked in a sentence, a hedge inside a quotation is the speaker's, not the writer's, and is left out.

message:
  ja: 「{matched}」など、逃げの表現が 1000 字あたり {density} 個あります（{limit} 個まで）
  en: '"{matched}" and other hedges: {density} per 1000 words (limit {limit})'

# 1 つの文に重ねたもの。上の message は文書全体の密度。
messages:
  stacked:
    ja: この文は逃げの表現を {count} つ重ねています（「{matched}」）
    en: 'This sentence stacks {count} hedges ("{matched}")'

how_to_fix:
  ja: 言い切れるものは言い切ってください。言い切れないなら、何が分かれば言い切れるのかを書いてください。重ねた逃げは、1 つ残すか、全部外して言い切ってください。
  en: Commit where you can. Where you cannot, say what you would need to know. Where hedges are stacked, keep one or drop them all and commit.

# 文書全体の、1000 語（日本語は 1000 字）あたりの数の上限。1 つの文に 2 つ以上重ねたものは、どの段でも指摘する。
levels: { strict: 3, normal: 6, relaxed: 12 }

use_for: [business, blog, technical, legal, docs, academic, literature, speech]
sources: [femmer-2017]

group: wording
summary:
  ja: 「〜の可能性があるかもしれません」のように、逃げの表現を重ねて、何が言いたいのか分からない所
  en: Hedges piled up ("it may perhaps be possible") until nobody is saying anything
example:
  ja:
    before: 納期は遅れる可能性があるかもしれません。
    after: 部品の入荷が来週にずれたため、納期は三日遅れます。
  en:
    before: It may be that the launch could perhaps slip.
    after: The launch will slip by three days, because the parts arrive next week.

not_flagged:
  ja: 逃げの表現が一つだけなら慎重さなので指しません。引用の中の逃げは、書き手ではなく話し手のものなので数えません。
  en: A single hedge is caution and is not reported. A hedge inside a quotation is the speaker's, not the writer's, and is not counted.
level_meaning:
  ja: 1000 字あたり逃げの表現 {limit} 個まで（一文に重ねた逃げは、文書の長さによらず指摘）
  en: up to {limit} hedges per 1000 words (hedges stacked in one sentence are reported whatever the length)
rewrite:
  ja:
    direction: 重ねた逃げは一つだけ残すか、確かめたことなら全部外して言い切ってください。言い切れないなら、何が分かれば言い切れるかを書きます。
    pairs:
      - before: 遅延の原因はキャッシュにある可能性があるかもしれません。
        after: 遅延の原因はキャッシュかもしれません。
      - before: この方法で改善できる場合もあると考えられるのではないでしょうか。
        after: この方法で改善できる場合があります。
    keep:
      - 書き手が確かめていないことの推量
      - 根拠の強さ
    avoid:
      - 確かめていないことを言い切りにする
      - 推量を作った数字（「8 割の確率で」）に替える
  en:
    direction: Where hedges are stacked, keep one, or drop them all and commit if the point was checked. Where you cannot commit, say what would settle it.
    pairs:
      - before: The delay may possibly be caused by the cache.
        after: The delay may be caused by the cache.
      - before: It could perhaps be argued that this approach might help in some cases.
        after: This approach helps in some cases.
    keep:
      - doubt about what the writer has not checked
      - how strong the evidence is
    avoid:
      - committing to something nobody checked
      - turning a hedge into an invented figure ("80% likely")
