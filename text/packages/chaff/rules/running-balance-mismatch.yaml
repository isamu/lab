id: running-balance-mismatch
layer: L3
status: stable
how_to_find: running-balance
severity: warning

name:
  ja: 残高が前の行から計算した値と合わない
  en: A running balance the row above and this row's amounts do not give

why:
  ja: 返済予定表の「お支払後の残高」、通帳や入出金明細の「残高」、在庫表の「在庫」は、前の行の残高にその行の動きを足し引きした値です。読み手は引き算し直さずに信じます。一つの行の数字だけを直したとき、桁を打ち間違えたとき、行を別の表から写したときに食い違います。どの列が残高で、どの列がその行の動きかは、列の見出しの語（残高、元金、返済額、利息、入金、出金、Balance、Principal、Payment、Interest、Deposit、Withdrawal）だけで決めます。列の並びでは決めません。元金の列があれば、残高は前の行の残高から元金を引いた値です。元金の列が無く、利息の列も無ければ、支払額を引いた値です。入金と出金の列のある表では、前の行の残高に入金を足し、出金を引いた値です（空の升と「-」は0）。書いた数はどれも、最後の桁の半分までの丸めを認めます。言うのは表ごとに最初に合わない行だけです。一つの行の残高を打ち間違えると次の行も合わなくなるので、そこで止めます。
  en: 'The "balance after payment" of a repayment schedule, the "balance" of a bank statement and the "on hand" of a stock card are the row above''s balance moved by this row. Readers trust them without doing the subtraction again. They go wrong when one figure of a row is corrected and the balance is not, when a digit is mistyped, or when a row is copied from another table. Which column is the balance and which holds a row''s movement is decided by the heading words alone (Balance, Principal, Payment, Interest, Deposit, Withdrawal), never by where a column stands. With a principal column, the balance is the row above''s less the principal. With no principal column and no interest column, it is the row above''s less the payment. With deposit and withdrawal columns, it is the row above''s plus the deposit less the withdrawal (a blank cell or a dash is zero). Every written number may be rounded to half its last digit. Only the first row of a table that does not add up is reported: a mistyped balance makes the next row fail too, so the check stops there.'

message:
  ja: 残高「{balance}」は、前の行の残高とこの行の金額からは {computed} です
  en: 'The balance "{balance}" is written, but the row above and this row give {computed}'

how_to_fix:
  ja: この行と前の行の残高、この行の金額のどれが正しいかを確かめて、ほかを直してください。
  en: Check which of this balance, the one above it and this row's amounts is right, and correct the others.

levels: { strict: error, normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."

group: facts
summary:
  ja: 返済表や明細の残高が、前の行の残高からの足し引きと合わない所
  en: A running balance that is not the balance above plus or minus this row's amounts
example:
  ja:
    before: |
      | 回 | お支払額 | うち元金 | うち利息 | お支払後の残高 |
      | --- | --- | --- | --- | --- |
      | 1 | 32,826円 | 27,426円 | 5,400円 | 1,772,574円 |
      | 2 | 32,826円 | 27,508円 | 5,318円 | 1,754,066円 |
    after: |
      | 回 | お支払額 | うち元金 | うち利息 | お支払後の残高 |
      | --- | --- | --- | --- | --- |
      | 1 | 32,826円 | 27,426円 | 5,400円 | 1,772,574円 |
      | 2 | 32,826円 | 27,508円 | 5,318円 | 1,745,066円 |
  en:
    before: |
      | No. | Payment | Balance after payment |
      | --- | --- | --- |
      | 1 | $104.00 | $2,392.00 |
      | 2 | $104.00 | $2,298.00 |
    after: |
      | No. | Payment | Balance after payment |
      | --- | --- | --- |
      | 1 | $104.00 | $2,392.00 |
      | 2 | $104.00 | $2,288.00 |

not_flagged:
  ja: 残高の列が一つに決まらない表、元金の列も支払額の列も入出金の列も無い表、利息の列があって元金の列が無い表、返済の列と入出金の列の両方がある表、日付の列も回（番号）の列も無い表（口座ごと・品目ごとの一覧かもしれない）、「入出金」のように一つの列が両方の向きを書く表は比べません。残高や金額の升が数でない行（—、▲1,000、(1,000)）、単位の書き方が違う行、合計の行は比べず、次の行からまた数え始めます。入金と出金がどちらも空の行（前月繰越）も、そこから数え始めます。回の列の番号が増えていかない表、返済の表で残高が最後の行のほうが大きい表（並びが逆）は比べません。丸めで届く差は言いません。
  en: "A table whose balance column is not one, with no principal, payment, deposit or withdrawal column, with an interest column but no principal column, with both loan and deposit columns, or with no date or row-number column (its rows may be accounts or items, not times), or with one column for both directions (Deposit/Withdrawal) is not compared. A row whose balance or amount cell is not a number (—, -1,000, (1,000)), whose amounts are written with different units, or that is a total row is skipped, and the count starts again from the next row; so does a row with both deposit and withdrawal blank (brought forward). A table whose row numbers do not rise, or a repayment table whose last balance is larger than its first (rows in reverse), is not compared. A difference the rounding can reach is not reported."
