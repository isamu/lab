id: stock-transition
layer: L2
status: experimental
how_to_find: stock-transition
word_list: stock-transition
uses: [pos]
severity: info

name:
  ja: 決まった接ぎで始まる文が多い
  en: Too many stock transitions

why:
  ja: 「さらに」「加えて」「このように」で文を始めると、前の文と何がどう繋がるのかを言わずに済んでしまいます。重なると、並べただけの文章に見えます。生成文によく見られる癖として知られています。
  en: Opening with "Moreover" or "Additionally" lets a sentence skip saying how it follows from the last. Piled up, the text reads as a list with glue, a habit well known in generated text.

message:
  ja: 「{matched}」など、決まった接ぎで始まる文が 1000 字あたり {density} 個あります（{limit} 個まで）
  en: '"{matched}" and other stock transitions open {density} sentences per 1000 words (limit {limit})'

how_to_fix:
  ja: 接ぎの語を消して読んでください。繋がりが要るなら、何が何の理由なのかを言葉で書いてください。
  en: Delete the transition and reread. If the link matters, say what it is.

# 1000 語（日本語は 1000 字）あたりの数。
levels:
  ja: { strict: 2, normal: 3, relaxed: 5 }
  en: { strict: 4, normal: 6, relaxed: 10 }

use_for: [blog, business, legal, docs, academic, literature, speech]

group: ai-tells
summary:
  ja: 「さらに」「加えて」「このように」で始まる文が多く、何がどう繋がるのかを言わずに並べている所
  en: Too many sentences opening with "Moreover", "Additionally" or "Furthermore", listing without saying how they connect
example:
  ja:
    pad: true
    before: |
      さらに、費用が下がります。加えて、作業も速くなります。このように、良い点が多くあります。
    after: |
      費用が下がり、見積もりも一件あたり十分早く出せるようになりました。
  en:
    pad: true
    before: |
      Moreover, costs go down. Additionally, the work gets faster. Furthermore, the team is happier.
    after: |
      Costs went down, so each quote now goes out ten minutes sooner.

not_flagged:
  ja: 話を運ぶ接続詞（「また」「そのため」「しかし」）と、文の途中の接ぎは数えません。短い文書は測りません。
  en: Words that carry the argument (However, Therefore), a transition inside a sentence, and "In addition to …" are not counted. Short documents are not measured.
level_meaning:
  ja: 決まった接ぎで始まる文が 1000 字あたり {limit} 個まで
  en: up to {limit} sentences per 1000 words opening with a stock transition
rewrite:
  ja:
    direction: 文頭の接ぎの語を消して読み返してください。繋がりが分からなくなる所だけ、前の文との関係（理由、例外、順番）を言葉で書きます。
    pairs:
      - before: さらに、ログの保存期間も延ばしました。
        after: ログの保存期間も延ばしました。
      - before: 費用が下がりました。加えて、速度も上がりました。
        after: 費用が下がり、速度も上がりました。
      - before: このように、設定は三か所で変わります。
        after: 設定が変わるのは、この三か所です。
    keep:
      - 文の順番
      - 書き手が書いた理由や対比
    avoid:
      - 「さらに」を「また」「そして」に替えるだけで済ませる
      - 書き手が書いていない因果（「〜なので」）を作る
  en:
    direction: Delete the transition at the start of the sentence and reread. Only where the link is lost, say what it is (a reason, an exception, an order).
    pairs:
      - before: Moreover, we extended log retention.
        after: We also extended log retention.
      - before: Costs fell. Additionally, speed improved.
        after: Costs fell and speed improved.
      - before: In conclusion, the settings change in three places.
        after: The settings change in three places.
    keep:
      - the order of the sentences
      - a reason or contrast the writer stated
    avoid:
      - swapping "Moreover" for "Also" at the start of every sentence
      - inventing a cause ("because") the writer did not state
