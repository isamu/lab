id: stock-transition
layer: L2
status: experimental
how_to_find: stock-transition
word_list: stock-transition
uses: [pos]
severity: info

name:
  ja: 決まった接ぎで始まる文が多い
  en: Too many stock transitions

why:
  ja: 「さらに」「加えて」「このように」で文を始めると、前の文と何がどう繋がるのかを言わずに済んでしまいます。重なると、並べただけの文章に見えます。生成文によく見られる癖として知られています。
  en: Opening with "Moreover" or "Additionally" lets a sentence skip saying how it follows from the last. Piled up, the text reads as a list with glue, a habit well known in generated text.

message:
  ja: 「{matched}」など、決まった接ぎで始まる文が 1000 字あたり {density} 個あります（{limit} 個まで）
  en: '"{matched}" and other stock transitions open {density} sentences per 1000 words (limit {limit})'

how_to_fix:
  ja: 接ぎの語を消して読んでください。繋がりが要るなら、何が何の理由なのかを言葉で書いてください。
  en: Delete the transition and reread. If the link matters, say what it is.

# 1000 語（日本語は 1000 字）あたりの数。
levels:
  ja: { strict: 2, normal: 3, relaxed: 5 }
  en: { strict: 4, normal: 6, relaxed: 10 }

use_for: [blog, business, legal, docs, academic, literature, speech]
