id: change-rate-mismatch
layer: L3
status: stable
how_to_find: change-rate
requires: [structure]
uses: [pos]
severity: warning

name:
  ja: 増減率が二つの値と合わない
  en: A rate of change the two values do not give

why:
  ja: 「前年同月の1,000社から20%増えて1,200社」のように、もとの値・今の値・増減率を一つの文に書くと、読み手は率を確かめずに信じます。数字を一つだけ更新したとき、率だけを去年の文書から写したときに食い違います。一つの文に、もとの値（「から」「に比べて」「前年の」の付いた値）、同じ単位の今の値、向きの語（増加、減少）の付いた百分率が一つずつあるとき、二つの値から率を計算して比べます。率のそばにもとの値が無くても、「昨年の100万円から今年は150万円になり、前年比50%の増加」「2025年度は100万円、2026年度は150万円で」のように二つの値が並んですぐ後に率が続くなら読みます（年が書いてあれば早い年の値がもとの値）。今の値は率の後ろでも、「前年同期の2,400百万円から10.0%増加し、2,640百万円となりました」のように動いた先と分かれば読みます。値は書いた桁までの丸めを認めます（12億円は11.5億円から12.5億円のどれか）。表も読みます。見出しの語で前期の列（前期、前年同期）、当期の列（当期、当第2四半期）、増減率の列（増減率、前年同期比）が一つずつ分かる表（見出しの語が無くても、二つの列の見出しに年が一つずつ書いてあれば早い年の列が前期）では、行ごとに二つの値から率を計算し、書いた率と比べます。△・▲・−の付いた率は減少です。「増減」の列は、升に % があるときだけ率と読みます。
  en: When one sentence gives the earlier value, the current one and the rate of change ("1,200 companies, up 20% from 1,000"), readers trust the rate without checking it. It goes wrong when one figure is updated and the others are not, or when the rate is copied from last year's text. When a sentence has one earlier value (marked by "from" or "compared with"), one current value in the same unit, and one percentage with a word of direction (up, decline), chaff computes the rate from the two values and compares. The two values may also stand together right before the rate ("rose from $1.0 million last year to $1.5 million, an increase of 50%", "$1.0 million in 2025 and $1.5 million in 2026, up 50%"; with years, the earlier year's value is the earlier one). The rate may also come first, with the value reached and then the earlier one ("rose 10.0% to $2,640 million from $2,400 million"). Each value may be rounded to its last written digit ($12 million is anything from $11.5 million to $12.5 million). Tables are read too. When the headings name one column of the earlier value (Prior year), one of the current value (Current year) and one of the rate (YoY, Change (%)), or two columns are each headed by one year (FY2025, FY2026; the earlier year's column holds the earlier value), each row's rate is computed from its two values and compared. A rate marked -, −, ▲ or △ is a decrease. A column headed only "Change" or "Growth" is read as a rate only where its cells carry %.

message:
  ja: 「{rate}%」と書いていますが、二つの値からは {computed}% です
  en: '"{rate}%" is written, but the two values give {computed}%'

how_to_fix:
  ja: 二つの値と率のどれが正しいかを確かめて、ほかを直してください。
  en: Check which of the two values and the rate is right, and correct the others.

levels: { strict: error, normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."

group: facts
summary:
  ja: 「1,000社から20%増えて1,200社」のように、一つの文や表の一行の二つの値と増減率が合わない所
  en: A rate of change that the two values in the same sentence or table row do not give
example:
  ja:
    before: 利用企業は1,300社となり、前年の1,000社から20%増えました。
    after: 利用企業は1,300社となり、前年の1,000社から30%増えました。
  en:
    before: Revenue was $1.0 million in 2025 and $1.5 million in 2026, up 20%.
    after: Revenue was $1.0 million in 2025 and $1.5 million in 2026, up 50%.

not_flagged:
  ja: 向きの語の付いた率が二つある文、もとの値が「から」「に比べて」や年で名指されていない文、二つの値と率のあいだで主語が変わる文（「…に増え、利益は20%増えた」）、二つの値のあいだで主語が変わる文（"$1,000 in 2025 and costs were $1,500 in 2026"）、同じ単位の今の値が一つでない文、向きの語が率のそばに無い文は比べません。「前年比20%増」のように値が一つしか無いもの、ポイントの差、倍は見ません。丸めで届く範囲の率は言いません。表では、列の役割が見出しから一つずつ決まらない表、前期と当期の列の見出しが違う単位を書いた表（千円と百万円）、値や率の升が数でない行（—、1.0pt、0.5ポイント、(5.0)%）、値が負か百分率の行、二つの値の単位の書き方が違う行、前期の値が0の行は比べません。
  en: 'A sentence with two rates that each have a word of direction, with no value marked as the earlier one (by a word or a year), with another subject between the values and the rate ("…, and costs rose 20%") or between the two values ("$1,000 in 2025 and costs were $1,500 in 2026"), with no single current value in the same unit, or with no word of direction beside the rate is not compared. A change given with one value ("up 20% year on year"), percentage points and "times" are not read. A rate the rounding of the values can reach is not reported. In a table, nothing is compared when the headings do not name one column for each part or name different units for the two periods (thousand yen, million yen); nor is a row whose value or rate cell is not a number (—, 1.0pt, (5.0)% in brackets), whose values are negative or percentages, whose two values are written with different units, or whose earlier value is zero.'
