id: change-rate-mismatch
layer: L3
status: stable
how_to_find: change-rate
requires: [structure]
severity: warning

name:
  ja: 増減率が二つの値と合わない
  en: A rate of change the two values do not give

why:
  ja: 「前年同月の1,000社から20%増えて1,200社」のように、もとの値・今の値・増減率を一つの文に書くと、読み手は率を確かめずに信じます。数字を一つだけ更新したとき、率だけを去年の文書から写したときに食い違います。一つの文に、もとの値（「から」「に比べて」「前年の」の付いた値）、同じ単位の今の値、向きの語（増加、減少）の付いた百分率が一つずつあるとき、二つの値から率を計算して比べます。率のそばにもとの値が無くても、「昨年の100万円から今年は150万円になり、前年比50%の増加」「2025年度は100万円、2026年度は150万円で」のように二つの値が並んですぐ後に率が続くなら読みます（年が書いてあれば早い年の値がもとの値）。値は書いた桁までの丸めを認めます（12億円は11.5億円から12.5億円のどれか）。
  en: When one sentence gives the earlier value, the current one and the rate of change ("1,200 companies, up 20% from 1,000"), readers trust the rate without checking it. It goes wrong when one figure is updated and the others are not, or when the rate is copied from last year's text. When a sentence has one earlier value (marked by "from" or "compared with"), one current value in the same unit, and one percentage with a word of direction (up, decline), chaff computes the rate from the two values and compares. The two values may also stand together right before the rate ("rose from $1.0 million last year to $1.5 million, an increase of 50%", "$1.0 million in 2025 and $1.5 million in 2026, up 50%"; with years, the earlier year's value is the earlier one). Each value may be rounded to its last written digit ($12 million is anything from $11.5 million to $12.5 million).

message:
  ja: 「{rate}%」と書いていますが、二つの値からは {computed}% です
  en: '"{rate}%" is written, but the two values give {computed}%'

how_to_fix:
  ja: 二つの値と率のどれが正しいかを確かめて、ほかを直してください。
  en: Check which of the two values and the rate is right, and correct the others.

levels: { strict: error, normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."

group: facts
summary:
  ja: 「1,000社から20%増えて1,200社」のように、一つの文の二つの値と増減率が合わない所
  en: A rate of change that the two values in the same sentence do not give
example:
  ja:
    before: 利用企業は1,300社となり、前年の1,000社から20%増えました。
    after: 利用企業は1,300社となり、前年の1,000社から30%増えました。
  en:
    before: 1,300 companies used the app, up 20% from 1,000 companies a year earlier.
    after: 1,300 companies used the app, up 30% from 1,000 companies a year earlier.

not_flagged:
  ja: 向きの語の付いた率が二つある文、もとの値が「から」「に比べて」や年で名指されていない文、二つの値と率のあいだで主語が変わる文（「…に増え、利益は20%増えた」）、同じ単位の今の値が一つでない文、向きの語が率のそばに無い文は比べません。「前年比20%増」のように値が一つしか無いもの、ポイントの差、倍は見ません。丸めで届く範囲の率は言いません。
  en: 'A sentence with two rates that each have a word of direction, with no value marked as the earlier one (by a word or a year), with another subject between the values and the rate ("…, and costs rose 20%"), with no single current value in the same unit, or with no word of direction beside the rate is not compared. A change given with one value ("up 20% year on year"), percentage points and "times" are not read. A rate the rounding of the values can reach is not reported.'
