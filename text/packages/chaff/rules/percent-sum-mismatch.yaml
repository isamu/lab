id: percent-sum-mismatch
layer: L3
status: stable
how_to_find: percent-sum-mismatch
requires: [quantities]
severity: warning

name:
  ja: 内訳の割合を足しても 100% にならない
  en: Shares of a whole that do not add up to 100%

why:
  ja: 構成比や内訳の百分率を足して 100% にならないと、読み手はどの数字が違うのか、項目が抜けたのかを確かめることになります。項目を足したり消したり、数字を一つだけ直したりしたときに起きます。表のその列の見出しか、箇条書きや表のすぐ上の文・見出しに、全体を分けた割合の語（構成比、内訳、シェア）があるときだけ足します。表の列の見出しが「割合」「配点」「比率」「ウェイト」だけ（単位の括弧は除く）の列も、全体を分けた割合として足します。ただし表のすぐ上の文や見出し、または表の行が率（前年比、達成率、金利）を名指していれば足しません。一つの文に並べた内訳（「構成比は、Aが50%、Bが30%、Cが25%」）も、その文に割合の語があり百分率が三つ以上あれば足します。割合の語が無くても、最後の百分率が全体の残り（「その他が 5%」）なら、その文は一つの全体を分けたものとして足します。ただし、百分率のすぐ前後に値の動いた向きの語（伸びた、増加）がある文は変化を並べたものなので足しません。丸めの誤差は、項目ごとに最後の桁の半分まで（少なくとも 1 ポイント）認めます。
  en: When the shares of a whole do not add up to 100%, the reader has to work out which figure is wrong or which item is missing. It happens when an item is added or removed, or when one figure is changed. The percentages are added only when the column's header, or the sentence or heading right above the list or the table, names the parts of a whole (breakdown, market share, composition). A column whose header is only "Weight", "Share", "Percentage" or "Proportion" (a unit in brackets aside) is added too, unless the sentence or heading right above the table, or one of its rows, names a rate (growth, interest rate, year over year). A breakdown written in one sentence ("software made up 50% of sales, maintenance 30% and training 25%") is added too, when the sentence has such a word and three or more percentages, or when its last percentage is the rest of the whole ("other 5%"), which only the parts of one whole have, unless a word for which way values moved stands right next to a percentage (grew 45%). Rounding is allowed, up to half the last digit per item (at least one point).

message:
  ja: 内訳の割合の和が {sum} で、100% になりません
  en: The shares add up to {sum}, not 100%

how_to_fix:
  ja: 数字を確かめて、違う数字を直すか、抜けた項目（その他など）を足してください。
  en: Check the figures. Correct the wrong one, or add the missing item (such as "Other").

levels: { strict: error, normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."

group: facts
summary:
  ja: 構成比や内訳の百分率を足しても 100% にならない所
  en: A breakdown whose percentages do not add up to 100%
example:
  ja:
    before: |
      売上の構成比は次のとおりです。

      - 国内：60%
      - 海外：30%
    after: |
      売上の構成比は次のとおりです。

      - 国内：60%
      - 海外：40%
  en:
    before: |
      Revenue breakdown by region:

      - US: 60%
      - Europe: 30%
    after: |
      Revenue breakdown by region:

      - US: 60%
      - Europe: 40%

not_flagged:
  ja: 割合の語の無い百分率（利用率、伸び率）、複数回答の集計、符号の付いた増減（+3%）、合計の行がある表（合計が内訳の和と合わない の対象）、項目が一つだけのものは足しません。一つの文の内訳は、和が 100% から 10 ポイントより離れていれば言いません（大きい項目だけを挙げた文や、別の全体・前の年の割合を並べた文）。
  en: 'Percentages not named as shares (rates, growth), multiple-answer counts, signed changes (+3%), a table with a total row (left to "A total that is not the sum of its items"), and a single item are not added. A breakdown in one sentence whose sum is more than 10 points from 100% is not reported: it names only the larger parts, or shares of different wholes or of two periods.'
