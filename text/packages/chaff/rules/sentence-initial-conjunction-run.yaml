id: sentence-initial-conjunction-run
layer: L3
status: stable
how_to_find: conjunction-run
word_list: sentence-opener
languages: [ja, en]
uses: [pos]
severity: info

name:
  ja: 接続詞で始まる文が続いている
  en: Run of sentences opening with a conjunction

why:
  ja: 「そして」「しかし」「また」（英語の And、But）で始まる文は 1 つなら効きますが、続くとどの文も前の文の付け足しに見えて、何が主張なのかが分からなくなります。語の一覧は言語ごとの語彙表にあります。
  en: One sentence opening with "And" or "But" (そして, しかし) lands. A run of them makes every sentence read as an afterthought. The words are listed in the lexicon.

message:
  ja: 接続詞で始まる文が {count} 文続いています（{limit} 文まで）
  en: "{count} {count|sentence|sentences} in a row {count|opens|open} with a conjunction (limit {limit})"

how_to_fix:
  ja: どれか 1 つを残して、他は前の文に繋ぐか独立させてください。
  en: Keep one. Join the others to the previous sentence, or let them stand alone.

levels: { strict: 1, normal: 2, relaxed: 4 }

use_for: [blog, business, legal, docs, academic, literature, speech]
off_for:
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."

group: readability
summary:
  ja: 「そして」「しかし」（And、But）で始まる文が続く所
  en: A run of sentences that open with "And", "But" or "So" (そして, しかし)
example:
  ja:
    before: |
      月曜に更新を出しました。しかし、ログイン画面が壊れました。そして、直すのに二日かかりました。また、その間は一部の人が入れませんでした。
    after: |
      月曜に出した更新で、ログイン画面が壊れました。直すのに二日かかり、その間は一部の人が入れませんでした。
  en:
    before: |
      We shipped the update on Monday. But the login page broke. And the fix took two days. So some customers could not sign in.
    after: |
      We shipped the update on Monday, and the login page broke. The fix took two days, during which some customers could not sign in.

not_flagged:
  ja: 接続詞で始まる文が一つだけなら指しません。日本語では、話し言葉の文頭（でも、だから、なので）は colloquial-opener が、「さらに」「加えて」は stock-transition が見るので数えません。
  en: One sentence opening with "And" or "But" is not reported. In Japanese, spoken openers (でも, だから, なので) are colloquial-opener's and さらに, 加えて are stock-transition's, so they are not counted.
level_meaning:
  ja: 接続詞で始まる文の連続 {limit} 文まで
  en: up to {limit} sentences in a row opening with a conjunction
