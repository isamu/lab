id: contrast-framing
layer: L2
status: stable
how_to_find: contrast-framing
word_list: contrast-frame
# 打ち消し（it's not）と、それを返す語（it's、but）。後ろに返しが来たときだけ対比の枠になる。
extra_word_lists: [contrast-lead, contrast-turn]
uses: [pos]
severity: info

name:
  ja: 対比の枠が多い
  en: Too many contrast frames

why:
  ja: 「単なる X ではなく Y」「X だけでなく Y も」は、1 つなら論点を整理します。重なると、誰も言っていない X を打ち消し続ける文章になります。生成文によく見られる癖として知られています。
  en: '"It''s not X, it''s Y" and "not just X, but Y" sort out a point when used once. Piled up, the text keeps knocking down an X nobody said, a habit well known in generated text.'

message:
  ja: 「{matched}」など、対比の枠が 1000 字あたり {density} 個あります（{limit} 個まで）
  en: '"{matched}" and other contrast frames: {density} per 1000 words (limit {limit})'

how_to_fix:
  ja: 打ち消した側（X）を消して、言いたいこと（Y）だけを書いてください。
  en: Drop the X you knocked down and say Y directly.

# 1000 語（日本語は 1000 字）あたりの数。
levels:
  ja: { strict: 1, normal: 1.5, relaxed: 3 }
  en: { strict: 2, normal: 3, relaxed: 6 }

use_for: [technical/readme, blog, business, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech: "A speech opens with greetings and closes with thanks: that is its form, not padding."

group: ai-tells
summary:
  ja: 「単なる X ではなく Y」「X だけでなく Y も」のような対比の枠が重なり、誰も言っていない X を打ち消し続けている所
  en: 'Contrast frames piling up ("It''s not X, it''s Y", "not just X, but Y"), knocking down an X nobody said'
example:
  ja:
    pad: true
    before: |
      この仕組みは単なる道具ではなく、チームの文化です。速さだけでなく、安心も届けます。
    after: |
      この仕組みで、見積もりの作成が一件あたり十分短くなりました。
  en:
    pad: true
    before: |
      This tool is not just software, but a culture. It's not a feature. It's a promise.
    after: |
      This tool cut the time to draft a quote by ten minutes.

not_flagged:
  ja: 一つだけの対比、打ち消しを返していない「単なる」（「単なる設定ミスです」）、「A ではなく B です」だけの文、続けて並べた打ち消し（「まだです。まだ試していません。」）は指しません。短い文書は測りません。
  en: A single contrast, a denial nobody answers, and two denials in a row ("It's not ready. It's not tested.") are not reported. Short documents are not measured.
level_meaning:
  ja: 1000 字あたり対比の枠 {limit} 個まで
  en: up to {limit} contrast frames per 1000 words
rewrite:
  depth: light
  ja:
    direction: 打ち消している側（X）を消し、言いたい側（Y）を普通の文で書いてください。X が誰かの実際の誤解なら、その誤解を書いたうえで一度だけ打ち消してください。
    pairs:
      - before: この仕組みは単なる道具ではなく、チームの文化です。
        after: この仕組みは、チームの文化になっています。
      - before: 問題はツールではなく、運用です。
        after: 問題は運用にあります。
      - before: 速さだけでなく、安心も届けます。
        after: 速く、安心して使えます。
    keep:
      - 言いたい側（Y）の中身
      - 誰かが実際に言った X への反論
    avoid:
      - 「ではなく」を「というより」「むしろ」に替えて、同じ枠を残す
      - 消した X の代わりに、書き手が言っていない主張を足す
  en:
    direction: Delete the side you knock down (X) and state the side you mean (Y) as a plain sentence. If X is a real belief someone holds, name it and answer it once.
    pairs:
      - before: This tool is not just software, but a culture.
        after: This tool has become part of how the team works.
      - before: The problem isn't the tool, it's the process.
        after: The problem is the process.
      - before: We don't just ship fast; we ship safely.
        after: We ship fast and safely.
    keep:
      - what Y says
      - an answer to an X someone actually said
    avoid:
      - swapping "not X but Y" for "less X than Y" or "rather than X", which keeps the frame
      - adding a claim the writer did not make in place of the deleted X
