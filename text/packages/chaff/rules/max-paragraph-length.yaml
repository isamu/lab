id: max-paragraph-length
layer: L1
status: stable
how_to_find: paragraph-length
severity: warning

name:
  ja: 段落が長すぎる
  en: Paragraph too long

why:
  ja: 1 段落に文を詰めると、読み手はどこで息継ぎしていいか分からなくなります。
  en: A dense paragraph gives the reader nowhere to pause.

message:
  ja: この段落は {count} 文あります（{limit} 文まで）
  en: This paragraph runs {count} {count|sentence|sentences} (limit {limit})

how_to_fix:
  ja: 話題の変わり目で段落を割ってください。
  en: Split it where the topic turns.

levels: { strict: 3, normal: 5, relaxed: 8 }

# 条文・判決・論文の段落は、一つの規定や論点をまとめて書く。corpus のその種類の文書で、normal が最も長い一握りの段落だけを指すように測って置いた。
by_genre:
  legal: { strict: 5, normal: 8, relaxed: 12 }
  legal/statute: { strict: 8, normal: 12, relaxed: 16 }
  legal/judgment: { strict: 8, normal: 12, relaxed: 16 }
  academic: { strict: 5, normal: 9, relaxed: 12 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
