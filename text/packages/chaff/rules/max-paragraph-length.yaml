id: max-paragraph-length
layer: L1
status: stable
how_to_find: paragraph-length
severity: info

name:
  ja: 段落が長すぎる
  en: Paragraph too long

why:
  ja: 1 段落に文を詰めると、読み手はどこで息継ぎしていいか分からなくなります。短い文をいくつ並べても壁にはならないので、段落が普通の長さの文を上限の数だけ並べたより長いときだけ指摘します。
  en: A dense paragraph gives the reader nowhere to pause. Short sentences do not make a wall, so it is reported only when it is also longer than that many sentences of ordinary length.

message:
  ja: この段落は {count} 文あります（{limit} 文まで）
  en: This paragraph runs {count} {count|sentence|sentences} (limit {limit})

how_to_fix:
  ja: 話題の変わり目で段落を割ってください。
  en: Split it where the topic turns.

levels: { strict: 3, normal: 5, relaxed: 8 }

# 普通の長さの文 1 つの長さ。単位は adapter の lengthUnit（日本語は文字、英語は語）。
# 文の数が上限を超えても、段落の長さが「上限 × この長さ」以下なら指摘しない。子ども向けの文章のように短い文を重ねた段落は、息継ぎの場所がいくらでもある。
# corpus で、これより短い段落は短い文の積み重ね（子ども向けの解説、リリースの一覧、Q&A）だけだった。上限と掛けるので、段階・ジャンル・chaff.yaml の数値がそのまま効く。
full_sentence:
  ja: 70
  en: 18

# 条文・判決・論文の段落は、一つの規定や論点をまとめて書く。corpus のその種類の文書で、normal が最も長い一握りの段落だけを指すように測って置いた。
by_genre:
  legal: { strict: 5, normal: 8, relaxed: 12 }
  legal/statute: { strict: 8, normal: 12, relaxed: 16 }
  legal/judgment: { strict: 8, normal: 12, relaxed: 16 }
  academic: { strict: 5, normal: 9, relaxed: 12 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."
sources: [gov-uk-clear-language]

group: readability
summary:
  ja: 文を詰めこみすぎて、息をつく場所がない段落
  en: A paragraph packed with so many sentences that the reader has nowhere to pause
example:
  ja:
    config: { rules: { max-paragraph-length: strict } }
    before: |
      今期の売上は前年より一割増えましたが、その多くは春に新しく始めた定期購入の申し込みによるもので、店頭での買い物が増えたわけではありませんでした。一方で、店頭での販売は三か月続けて前年を下回り、特に平日の夕方の客数が大きく減っています。原因として、駅の反対側に開いた競合店と、夕方の品ぞろえの薄さが考えられるという声が、先月の店長会議で何人もの店長から出ました。来期は夕方の品ぞろえを見直し、定期購入の案内を店頭でも配ることで、両方の数字を同時に上げることを目指します。
    after: |
      今期の売上は前年より一割増えました。その多くは、新しく始めた定期購入の申し込みによるものです。

      一方で、店頭での販売は三か月続けて前年を下回りました。特に平日の夕方の客数が大きく減っています。

      来期は夕方の品ぞろえを見直し、定期購入の案内を店頭でも配ります。
  en:
    config: { rules: { max-paragraph-length: strict } }
    before: |
      Sales this term rose by a tenth over last year, and most of the growth came from the new subscription plan that we launched in the spring. In-store sales, on the other hand, fell below last year's level for three months in a row, with weekday evenings down the most. At the store managers' meeting, several people pointed to the competitor that opened nearby and to the thin evening range as likely causes. Next term we will review the evening range and hand out subscription leaflets in store, so that both numbers go up together.
    after: |
      Sales this term rose by a tenth over last year. Most of the growth came from the new subscription plan.

      In-store sales fell for three months in a row. Weekday evenings fell the most.

      Next term we will review the evening range and hand out subscription leaflets in store.

not_flagged:
  ja: 文の数が多くても、短い文を重ねただけの段落（普通の長さの文を上限の数だけ並べたより短いもの）は指しません。
  en: A paragraph of many short sentences is not reported, as long as it is shorter than that many sentences of ordinary length.
level_meaning:
  ja: 一つの段落に {limit} 文まで
  en: up to {limit} sentences in a paragraph
