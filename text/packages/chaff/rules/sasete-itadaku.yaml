id: sasete-itadaku
layer: L3
status: stable
how_to_find: phrase-count
word_list: sasete-itadaku
uses: [pos]
languages: [ja]
severity: info

name:
  ja: 「させていただく」が多い
  en: Overused humble form

why:
  ja: 1 度なら丁寧ですが、重なると誰の判断で何をするのかが消えます。「検討させていただきます」は、検討するのかしないのかを言っていません。
  en: Once it is polite. Repeated, it hides whose decision it is and what will actually happen.

message:
  ja: 「{matched}」が文書内に {count} 回あります（{limit} 回まで）
  en: '"{matched}" appears {count} {count|time|times} in this document (limit {limit})'

how_to_fix:
  ja: 主語を立てて言い切ってください。「検討させていただきます」を「来週までに結論を出します」に。
  en: Name the actor and commit. "We will look into it" becomes "we will decide by Friday".

levels: { strict: 1, normal: 3, relaxed: 6 }

use_for: [business, blog, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  academic: "Science writes in the passive, hedges its claims on purpose (may, suggest) and cites numbers as its evidence."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."

group: wording
summary:
  ja: 「させていただく」を繰り返して、誰が決めて何が起きるのかがぼやけた所
  en: The Japanese humble form させていただく repeated until it hides who decides what
example:
  ja:
    before: |
      本日は資料を配布させていただきます。続いて内容を説明させていただきます。そのあと質問に回答させていただきます。最後に日程を確認させていただきます。
    after: |
      本日は資料を配ります。続いて内容を説明します。そのあと質問に答えます。最後に日程を確認します。

not_flagged:
  ja: 上限の回数までは、丁寧な言い方として指しません。
  en: Up to the limit, the form reads as politeness and is not reported.
level_meaning:
  ja: 文書の中で {limit} 回まで
  en: up to {limit} times in a document
