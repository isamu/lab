id: total-mismatch
layer: L3
status: stable
how_to_find: total-mismatch
requires: [quantities]
severity: error

name:
  ja: 合計が内訳の和と合わない
  en: A total that is not the sum of its items

why:
  ja: 見積や請求の「合計」が、上に並べた金額の和と合わないと、読み手はどちらが正しいのかを計算し直すことになります。行を足したり消したりしたあとに、合計だけ直し忘れると起きます。箇条書きか表で、合計の語（合計・小計）で始まる行を、同じ単位で同じ列の金額の和と比べます。表の最初の列の見出しか、合計の行が数を書いた列の見出しが名指す語を付けた合計（見出しが「控除項目」の表の「控除合計」、「単位数」の列の「修得単位合計」）も合計の行と読みます。契約書のように一つの文に書いた合計（「保守費60,000円、運用費30,000円とし、合計100,000円とする」「月額150,000円（内訳：…）」）も、その文に並べた同じ単位の金額の和と比べます。小計のあとの総計のように、足し方が何通りかあるときは、どの足し方でも合わないときだけ指します。
  en: When the total of a quote or an invoice is not the sum of the amounts listed above it, the reader has to add them up again to find out which is right. It happens when a line is added or removed and the total is not updated. In a list or a table, a line starting with a total word (Total, Subtotal) is compared with the sum of the amounts in the same unit and column above it. A total with a word that the header of the table's first column, or of the column the total holds its number in, names ("Total deductions" under "Deduction", "Total credits earned" in the "Credits" column) is read as a total line too. A total written in a sentence, as contracts do ("$6,000 for hosting and $3,000 for support, for a total of $9,000", "$8 per month, made up of …"), is compared with the amounts in the same unit listed in that sentence. When there is more than one way to add them up, such as a grand total after a subtotal and tax, it is pointed out only when none of them matches.

message:
  ja: 合計「{written}」が、内訳の金額の和（{sum}）と合いません
  en: "The total {written} is not the sum of its items ({sum})"

how_to_fix:
  ja: 内訳の金額と合計のどちらが正しいかを確かめて、片方を直してください。
  en: Check which is right, the items or the total, and correct the other.

levels: { normal: error, relaxed: warning }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
sources: [de-marneffe-2008]

group: facts
summary:
  ja: 見積もりや請求書、契約書で、合計が内訳に並べた金額の和と合わない所
  en: A total in a quote, invoice or contract that is not the sum of its items
example:
  ja:
    before: |
      | 項目 | 金額 |
      | --- | --- |
      | 設計 | 300,000円 |
      | 開発 | 500,000円 |
      | 合計 | 900,000円 |
    after: |
      | 項目 | 金額 |
      | --- | --- |
      | 設計 | 300,000円 |
      | 開発 | 500,000円 |
      | 合計 | 800,000円 |
  en:
    before: |
      | Item | Amount |
      | --- | --- |
      | Design | $3,000 |
      | Build | $5,000 |
      | Total | $9,000 |
    after: |
      | Item | Amount |
      | --- | --- |
      | Design | $3,000 |
      | Build | $5,000 |
      | Total | $8,000 |

not_flagged:
  ja: 単位や列の違う金額は足しません。合計の語に表の見出しが名指さない語を付けた行（見出しが「項目」の表の「控除合計」）は、別の種類の合計かもしれないので比べません。面積のように、上の行の和とは限らない量の合計（面積合計）も比べません。重さ・容量・長さ（mg、g、mL、L、cm、km）は、列のどの行も同じ種類の量なら換算して足します（500mg と 0.5g は 1g）。何あたりかを書いた量（300mg/錠）、目安の量（約300mg）、範囲（300〜400mg）がある列は足しません。足し方が何通りもあるとき（小計と税のあとの総計など）は、どれとも合わないときだけ指します。文の中では、合計の語（合計・総額）のすぐ後ろの金額か内訳の語（内訳は）のすぐ前の金額だけを合計と読み、内訳の金額が二つ以上あるときだけ比べます。並びの一部（単価や上限など、合計の語から離れた金額を除いた並び）の和か、一つを引いた額（値引き）と合えば指しません。
  en: Amounts in another unit or column are not added. A total with a word the table's header does not name ("Total deductions" under "Item") is not compared, as it may be a total of another kind, nor is a total of a quantity that need not be the sum of the rows (Total area). Mass, volume and length (mg, g, mL, L, cm, km) are converted and added when every row of the column is the same kind of measure (500 mg and 0.5 g make 1 g); a column with an amount per something (300 mg/tablet), a rough amount (about 300 mg) or a range (300-400 mg) is not added. Where there is more than one way to add them up, it is reported only when none matches. In a sentence, only the amount right after a total phrase (a total of) or right before a breakdown phrase (made up of) is read as a total, and only when two or more items in its unit are listed. It is not reported when the items nearest the phrase add up to it, or when it matches with one item taken away (a discount).
