id: total-mismatch
layer: L3
status: stable
how_to_find: total-mismatch
requires: [quantities]
severity: error

name:
  ja: 合計が内訳の和と合わない
  en: A total that is not the sum of its items

why:
  ja: 見積や請求の「合計」が、上に並べた金額の和と合わないと、読み手はどちらが正しいのかを計算し直すことになります。行を足したり消したりしたあとに、合計だけ直し忘れると起きます。箇条書きか表で、合計の語（合計・小計）で始まる行を、同じ単位で同じ列の金額の和と比べます。表の最初の列の見出しか、合計の行が数を書いた列の見出しが名指す語を付けた合計（見出しが「控除項目」の表の「控除合計」、「単位数」の列の「修得単位合計」）も合計の行と読みます。合計が足す期間を頭に付けた合計（年間合計、年計、通年合計）も合計の行と読みます。見出しが「項目」の表でも、最後の行の差引合計・控除合計は、上に合計のような行が無く金額の列が一つなら合計の行と読みます。契約書のように一つの文に書いた合計（「保守費60,000円、運用費30,000円とし、合計100,000円とする」「月額150,000円（内訳：…）」「総額12,000円：設計5,000円、開発6,000円」）も、その文に並べた同じ単位の金額の和と比べます。合計で終わる文の次の文が「内訳は」で始まるときは、その文の金額と比べます。小計のあとの総計のように、足し方が何通りかあるときは、どの足し方でも合わないときだけ指します。
  en: When the total of a quote or an invoice is not the sum of the amounts listed above it, the reader has to add them up again to find out which is right. It happens when a line is added or removed and the total is not updated. In a list or a table, a line starting with a total word (Total, Subtotal) is compared with the sum of the amounts in the same unit and column above it. A total with a word that the header of the table's first column, or of the column the total holds its number in, names ("Total deductions" under "Deduction", "Total credits earned" in the "Credits" column) is read as a total line too, and so is a total naming the span it covers ("Total for the year", "Year total", "Annual total"). Under a header that names nothing ("Item"), a "Total deductions" on the table's last row is read too, when no row above it is a total or a gross or net amount and the table has one column of amounts. A total written in a sentence, as contracts do ("$6,000 for hosting and $3,000 for support, for a total of $9,000", "$8 per month, made up of …", "a total of $12,000 — $5,000 for design and $6,000 for development"), is compared with the amounts in the same unit listed in that sentence, and with the amounts of the next sentence when it opens with a breakdown phrase ("This consists of …"). When there is more than one way to add them up, such as a grand total after a subtotal and tax, it is pointed out only when none of them matches.

message:
  ja: 合計「{written}」が、内訳の金額の和（{sum}）と合いません
  en: "The total {written} is not the sum of its items ({sum})"

how_to_fix:
  ja: 内訳の金額と合計のどちらが正しいかを確かめて、片方を直してください。
  en: Check which is right, the items or the total, and correct the other.

levels: { normal: error, relaxed: warning }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
sources: [de-marneffe-2008]

group: facts
summary:
  ja: 見積もりや請求書、契約書で、合計が内訳に並べた金額の和と合わない所
  en: A total in a quote, invoice or contract that is not the sum of its items
example:
  ja:
    before: |
      | 項目 | 金額 |
      | --- | --- |
      | 設計 | 300,000円 |
      | 開発 | 500,000円 |
      | 合計 | 900,000円 |
    after: |
      | 項目 | 金額 |
      | --- | --- |
      | 設計 | 300,000円 |
      | 開発 | 500,000円 |
      | 合計 | 800,000円 |
  en:
    before: |
      | Item | Amount |
      | --- | --- |
      | Design | $3,000 |
      | Build | $5,000 |
      | Total | $9,000 |
    after: |
      | Item | Amount |
      | --- | --- |
      | Design | $3,000 |
      | Build | $5,000 |
      | Total | $8,000 |

not_flagged:
  ja: 単位や列の違う金額は足しません。合計の語に表の見出しが名指さない語を付けた行（見出しが「項目」の表の「消費税合計」）は、別の種類の合計かもしれないので比べません。差引合計・控除合計も、表の最後の行でないとき、上に合計の行や総支給額・支給合計の行があるとき、金額の列が二つ以上あるときは比べず、下から続けた行の和か、その上の行の和からそれを引いた額と合えば指しません。面積のように、上の行の和とは限らない量の合計（面積合計）も比べません。前の期間の合計（前年合計）は読まず、期間を付けた合計が内訳の和を一年に直した額（ちょうど4倍・12倍・52倍。月額の内訳に年間合計）なら比べません。重さ・容量・長さ（mg、g、mL、L、cm、km）は、列のどの行も同じ種類の量なら換算して足します（500mg と 0.5g は 1g）。何あたりかを書いた量（300mg/錠）、目安の量（約300mg）、範囲（300〜400mg）がある列は足しません。足し方が何通りもあるとき（小計と税のあとの総計など）は、どれとも合わないときだけ指します。文の中では、合計の語（合計・総額）のすぐ後ろの金額か内訳の語（内訳は）のすぐ前の金額だけを合計と読み、内訳の金額が二つ以上あるときだけ比べます。並びの一部（単価や上限など、合計の語から離れた金額を除いた並び）の和か、一つを引いた額（値引き）と合えば指しません。合計のすぐ後ろの「：」から続く内訳は、「うち」「または」「最大」のように内訳のすべてとは限らない語があるとき、ほかの単位の金額や割合を並べたときは比べません。内訳の前に主なものだけだと言う語（「主な設備投資は」「主な内訳は」「主に」）があれば、内訳は合計のすべてではないので比べません。合計と内訳のどれもが丸めた単位（百万円・千円・億円、million）で有効数字3桁以上（6,655百万円。4億円は除く）で書いてあれば、ずれが（内訳の数 − 1）× 最後の桁一つ分まで（三つの内訳を百万円で書いたなら2百万円まで）は、四捨五入や切り捨てのずれとして指しません。
  en: Amounts in another unit or column are not added. A total with a word the table's header does not name ("Total tax" under "Item") is not compared, as it may be a total of another kind, nor is a total of a quantity that need not be the sum of the rows (Total area). Under such a header, "Total deductions" is not compared when it is not the last row, when a total or a gross or net amount (Gross pay) is above it, or when the table has two columns of amounts; it is not reported when it matches the last few rows, or the rows above those less them. A total for another span ("Prior-year total") is not read, and a total naming its span that is the items scaled to a year (exactly 4, 12 or 52 times their sum, as monthly items under an annual total) is not compared. Mass, volume and length (mg, g, mL, L, cm, km) are converted and added when every row of the column is the same kind of measure (500 mg and 0.5 g make 1 g); a column with an amount per something (300 mg/tablet), a rough amount (about 300 mg) or a range (300-400 mg) is not added. Where there is more than one way to add them up, it is reported only when none matches. In a sentence, only the amount right after a total phrase (a total of) or right before a breakdown phrase (made up of) is read as a total, and only when two or more items in its unit are listed. It is not reported when the items nearest the phrase add up to it, or when it matches with one item taken away (a discount). Items after a colon or a dash right after a total are not compared when "including", "or" or "up to" shows they may not be every item, when one of them is in another unit, or when they are percentages. Items introduced as only the main ones ("mainly", 主な) are not compared, as they need not be every item. When the total and every item are written in a rounded unit (millions, billions, 百万円) with at least three significant digits ($6,655 million, not $4 million), a difference of up to (number of items − 1) last digits ($2 million for three items in whole millions) is rounding and is not reported.
