id: sentence-rhythm
# 「AI 生成は文の長さが揃う」は未検証の仮説。corpus 評価まで既定では動かさない。spec §26-4。
status: experimental
layer: L1
how_to_find: sentence-rhythm
severity: warning

name:
  ja: 文の長さが単調
  en: Monotonous sentence rhythm

why:
  ja: どの文も同じ長さだと、読者は途中で読むリズムを失います。
  en: When every sentence is the same length, the reader loses the rhythm.

message:
  ja: 文の長さのばらつきが {count}%（{limit}% 以上ほしい）
  en: "Sentence length varies by only {count}% (want {limit}%)"

how_to_fix:
  ja: 短い文をいくつか混ぜてください。1 文を 2 つに割るだけで変わります。
  en: Mix in short sentences. Splitting one in two is enough.

# 文長の変動係数を 100 分率で持つ。下回ったら指摘する。
levels:
  strict: 35
  normal: 30
  relaxed: 20

use_for: [blog, legal, docs, academic, literature, speech]

group: readability
summary:
  ja: どの文もほぼ同じ長さで、読むリズムが単調な所
  en: Sentences that are all about the same length, so the text reads as a drone
example:
  ja:
    config: { genre: blog/tech }
    before: |
      今日は新しい道具の使い方を紹介します。最初に画面の右上から設定を開きます。次に一覧から使いたい項目を選びます。項目の横にある印を押して有効にします。最後に保存の印を押して閉じます。これで最初の準備が整いました。次は仲間を招く手順を見ます。招待の画面は左の端にあります。
    after: |
      今日は新しい道具の使い方を紹介します。まず設定を開きます。画面の右上にある歯車の印を押すと、使える項目が一覧で出てくるので、使いたいものを選び、横の印を押して有効にしてください。最後に保存です。これで最初の準備が整いました。次は、仲間を招く手順です。招待の画面は、左の端にあります。
  en:
    config: { genre: blog/tech }
    before: |
      Today we look at the new tool in detail. First you open the settings page here. Then you pick the option you want to use. Next you switch the option on with a click. Finally you press save and close it. Now the first part of setup is done. Next we invite the rest of the team. The invite page sits on the left side.
    after: |
      Today we look at the new tool. Open the settings. The gear icon at the top right opens a list of everything you can change, so pick the option you want there and switch it on. Then save. That is the first part done. Next, invite the rest of the team from the page on the left.

not_flagged:
  ja: 文が 8 文より少ない文書は、ばらつきが当てにならないので測りません。
  en: A document with fewer than 8 sentences is not measured, because the spread means little.
level_meaning:
  ja: 文の長さのばらつきが {limit}% 未満なら指摘
  en: reported when sentence length varies by less than {limit}%
