id: padded-intro
layer: L2
status: stable
how_to_find: phrase-match
word_list: padded-intro
uses: [pos]
where: opening
severity: warning

name:
  ja: 水増しの導入
  en: Padded opening

why:
  ja: どの記事にも当てはまる書き出しは、読者に次を読む理由を与えません。
  en: An opening that fits any article gives the reader no reason to continue.

message:
  ja: 「{matched}」は、どの記事にも当てはまる書き出しです
  en: '"{matched}" is an opening that fits any article'

how_to_fix:
  ja: 具体的な状況か、この記事だけの主張から始めてください。
  en: Start from a concrete situation, or from the claim only this piece makes.

levels:
  strict: 1
  normal: 1
  relaxed: 2

# プレスリリース・メール・議事録の冒頭は理由や用件を言う所で、つかみではない。
use_for: [blog, business/report, business/proposal, legal, docs, academic, literature, speech]

group: wording
summary:
  ja: 「近年、〜が注目されています」のように、どの文書にも当てはまる書き出し
  en: An opening such as "In recent years, X has gained attention" that fits any document
example:
  ja:
    before: 近年、生成 AI が注目を集めています。今回、社内の問い合わせ対応に試しました。
    after: 社内の問い合わせ対応に生成 AI を試し、回答までの時間が半分になりました。
  en:
    before: In recent years, generative AI has gained significant attention. We tried it on our internal help desk.
    after: We tried generative AI on our internal help desk, and replies now take half as long.

not_flagged:
  ja: 文書の冒頭（最初の 4 文）だけを見ます。本文の途中の「近年」は指しません。
  en: Only the opening (the first four sentences) is checked; "in recent years" later in the text is not reported.
level_meaning:
  ja: 当てはまる書き出しが {limit} 箇所あれば指摘
  en: reported once there are {limit}
rewrite:
  ja:
    direction: どの文書にも当てはまる書き出し（「近年、〜が注目されています」）を消し、この文書だけが扱う状況か主張から始めてください。それが本文に無ければ書き手に聞きます。
    pairs:
      - before: 近年、生成 AI が注目されています。本記事では、社内での使い方を紹介します。
        after: 社内で生成 AI を使うときの手順を紹介します。
      - before: テレワークが普及する中、会議の進め方が見直されています。当社では週次会議を 30 分に短くしました。
        after: 当社では週次会議を 30 分に短くしました。
    keep:
      - この文書だけの状況と主張
    avoid:
      - 書き出しを別の一般論（「今や〜は欠かせません」）に替える
      - 本文に無い場面や逸話を作る
  en:
    direction: Delete the opening that fits any document ("In recent years, X has gained attention") and start from the situation or the claim only this piece has. If the body has none, ask the writer.
    pairs:
      - before: In recent years, generative AI has gained attention. This article shows how we use it internally.
        after: This article shows how we use generative AI internally.
      - before: As remote work spreads, meetings are being rethought. We cut our weekly meeting to 30 minutes.
        after: We cut our weekly meeting to 30 minutes.
    keep:
      - the situation and claim only this piece has
    avoid:
      - swapping the opening for another generality ("X is now essential")
      - inventing a scene or an anecdote that is not in the body
