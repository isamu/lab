uses: [pos]
severity: info

name:
  ja: 略語が説明なしで出てくる
  en: Acronym never expanded

why:
  ja: 略語は読む人によって指すものが違います。社内で通じても、半年後の自分や別の部署には通じません。
  en: An acronym means different things to different readers. What is obvious inside one team is not obvious outside it.

message:
  ja: 「{word}」が説明なしで使われています（説明のない略語 {count} 個）
  en: '"{word}" is used without an expansion ({count} such {count|acronym|acronyms})'

how_to_fix:
  ja: 初出のところで括弧に入れて展開してください。「CI（継続的インテグレーション）」のように。読み手が名前として知っている略語（社名など）なら、chaff.yaml の names に並べると求めません。
  en: Expand it in brackets at first use. If your readers know it as a name (a company, say), list it under names in chaff.yaml and it is not asked for.

levels: { strict: 1, normal: 3, relaxed: 6 }

# 技術文書の読み手は、分野の略語を知っている。既定の数では group の文書の過半に出たので、測って上げた（spec §21.1）。
by_genre:
  technical: { strict: 3, normal: 5, relaxed: 8 }
  # 業務文書と講演と FAQ は、名前や通じる略語を数えなくなってから judged corpus で測り直して下げた。上げたままだと、説明のない略語の正しい指摘を落とす。
  business: { strict: 1, normal: 2, relaxed: 5 }
  speech: { strict: 1, normal: 2, relaxed: 5 }
  docs/faq: { strict: 1, normal: 1, relaxed: 3 }

use_for: [business, technical, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."
  academic: measured by yarn rules:measure
sources: [plain-2011, jis-z8301-2019]

group: readability
summary:
  ja: 「KGI」「PMF」のように、説明なしで出てくる略語
  en: An acronym such as "KGI" or "PMF" used without ever being spelled out
example:
  ja:
    config: { rules: { undefined-acronym: strict } }
    before: 今期の KGI は、PMF の達成です。
    after: 今期の最終目標（KGI, Key Goal Indicator）は、製品が市場に受け入れられること（PMF, Product Market Fit）です。
  en:
    config: { rules: { undefined-acronym: strict } }
    before: Our KGI this term is to reach PMF.
    after: Our key goal indicator (KGI) this term is to reach product-market fit (PMF).

not_flagged:
  ja: 誰でも知っている略語（URL、PDF など）と、前後の括弧で説明した略語、会社の名前の中の英字（㈱ADEKA、CO.,LTD.）は指しません。ひな形の名前の置き場所（OOOO、XX 月）と、外のページへのリンクを並べた一覧の題名の中の略語も指しません（題名の略語は数には入れます）。大文字の違うだけの書き方で説明した略語（TCoP と TCOP）、略語を話題にする文で語に書き出した略語（略語の DOB … date of birth）、一覧で語のすぐ下にその語を名指すリンクを入れ子にした語（- GPL の下の GNU General Public License）も指しません。判例の引用の中の当事者と裁判所の名前（Ashwander v. TVA, 297 U.S. 288、MCI Telecomms. Corp. v. AT&T、(SDNY 1952)）、引用の中の行政機関の事件番号（NOV/CFA 01-01）も指しません（引用の略語は数には入れます）。判決の頭の MR. JUSTICE も指しません。括弧の中で略語に「or」で別の呼び名を添えたもの（Department of Health and Human Services (HHS or the Department)）、ハイフンで繋いだ字まで名前と揃うもの（Agency for Health (ARPA-H)）は説明したと読み、メールアドレスの中の英字（OASH-RFI@hhs.gov）は略語と読みません。文書の中に書いた ABNF の文法の規則の名前と値（CRLF、%x0D）、等級の並び（A と AA）、番号で引く官報や判例集（80 FR 66128、2022 WL 4447293）、日付の付いた識別子の前の種類（WD WD-ABC1-20200101）、PO Box の PO も指しません。文献を引いて始まる注（1. See L. Summers (2015), "…," IMF Economic Review）の中の略語は、引いた文献の題名や誌名の書き方なので指しません（数には入れます）。角括弧の見出しで始まる文献の項目（[FETCH]    WHATWG, …）の中の略語も同じです。2 つ以上の番号で引く続き物の名前（BCP 78 と BCP 14、DR 4339 と DR 4340）、同じ文の前のほうで名前を書き出した略語（U.S. Small Business Administration … SBA）、肩書きの後ろの判事の姓（Lord HOLT、Mr. Justice BULLER）、商標の印の付いた名前（Acrobat DC®）、条で引く法令集（44 USC. 3502、15 USCA § 709）も指しません。
  en: Common acronyms (URL, PDF), acronyms spelled out in brackets next to them, and the letters of a company name (㈱ADEKA, CO.,LTD.) are not reported. Neither are a template's placeholders (OOOO, XX 月) or an acronym in the title of a page in a list of links (it still counts towards the limit). Nor are an acronym explained under another capitalisation (TCoP, then TCOP), one a sentence about the abbreviation writes out (the abbreviation DOB … date of birth), or a term in a list whose nested link names it (- GPL above GNU General Public License). Nor are the parties and courts of a case citation (Ashwander v. TVA, 297 U.S. 288; MCI Telecomms. Corp. v. AT&T; (SDNY 1952)), an agency's docket number in a citation (NOV/CFA 01-01); a citation's acronyms still count towards the limit. Nor is the MR. JUSTICE that opens a line of an opinion. An acronym given another name after "or" in its parenthesis (Department of Health and Human Services (HHS or the Department)) or spelled out with its hyphened letter (Agency for Health (ARPA-H)) counts as expanded, and the letters of an email address (OASH-RFI@hhs.gov) are not an acronym. Nor are the rule names and values of an ABNF grammar in the text (CRLF, %x0D), the rungs of a grade ladder (A and AA), a register or reporter cited by number (80 FR 66128, 2022 WL 4447293), the kind written before a dated identifier (WD WD-ABC1-20200101), or the PO of a PO Box. A note that opens with a citation (1. See L. Summers (2015), "…," IMF Economic Review) is written in the cited work's words, and its acronyms are not reported (they still count towards the limit); so is an entry of a reference list keyed by a bracketed label ([FETCH]    WHATWG, …). Nor are capitals the document cites by two or more numbers (BCP 78 and BCP 14, DR 4339 and DR 4340), an acronym whose name the same sentence writes out before it (U.S. Small Business Administration … SBA), a judge's surname after his title (Lord HOLT, Mr. Justice BULLER), a name marked as a trademark (Acrobat DC®), or a code cited by section (44 USC. 3502, 15 USCA § 709).
level_meaning:
  ja: 説明のない略語が {limit} 種類あれば指摘。文書が自分で略語を {limit} 個展開していれば、1 つの抜けから指摘
  en: reported once {limit} different acronyms go unexplained, or from the first one when the document itself spells out {limit} others
