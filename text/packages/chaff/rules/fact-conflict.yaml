id: fact-conflict
layer: L3
status: stable
how_to_find: fact-conflict
requires: [quantities]
uses: [pos]
severity: warning

name:
  ja: 同じ項目に違う値が書いてある
  en: One item given two different values

why:
  ja: 同じ節の中で「締切：10月5日」と「締切：10月7日」のように、同じ項目に違う値を書くと、読み手はどちらを信じればよいか分かりません。日程や料金を直したときに、一か所だけ直し忘れると起きます。「項目：値」「項目は値です」と書いた所と表の升を読み、同じ節で同じ項目名（全角半角、大文字小文字は揃えて比べます）に、同じ単位で違う値があれば指します（単位の語彙表にある単位の量、410 g と 450 g も、期間、3ヶ月 と 6か月 も比べます。年は月に直して比べ、1年 と 12ヶ月 は同じ長さです。1か月 と 30日 のように長さの決まらない組は比べません）。年齢も値として読みます（満70歳、満70歳まで、満20歳〜満70歳）。範囲と上限（まで）は上の端で比べ、一人の年齢は範囲とは比べません。保存期間は節をまたいで比べます。「個人情報を1年間保存します」と「3年間を経過した個人情報を削除します」のように、同じもの（同じ名詞句）に二通りの長さが書いてあれば指します。文書全体で一つの値を持つ項目（語彙表 fact-document-term の名前、試用期間など）も節をまたいで比べます。表の升に「試用期間 | 3ヶ月」とあり、別の節の文が「試用期間は6ヶ月で」と書いていれば指します。項目の名前を見出しにした節（「第2条（保証期間）」）の値も、表の升と同じく拠り所にします。その項目を主語にした文は、起算の句が付いていても読みます（「本製品の保証期間は、お買い上げ日から24か月です」）。1年 と 12ヶ月 のように大きさの違う期間は比べません）。表の行の見出しをそのまま主語にした文（「入院給付金は、入院1日につき10,000円をお支払いします」）の金額も、同じ節の表のその行の金額（日額5,000円）と比べます。
  en: 'When one section says "Deadline: May 3" and later "Deadline: May 5", the reader cannot tell which to trust. It happens when a date or a price is changed in one place and not in the other. Values written as "Item: value" or "The item is value", and table cells, are read; the same item name (case and width aside) with two different values in the same unit within one section is pointed out (measured quantities such as 410 g and 450 g included, and lengths of time such as 3 months and 6 months; years are compared in months, so 1 year and 12 months agree, while 1 month and 30 days are not compared). Ages are values too ("aged 40", "up to the age of 70", "aged 20 to 70"): a range and an upper limit are compared by their upper ends, and one age is not compared with a range. A retention period is compared across the whole document: "we keep personal information for 1 year" and "we delete personal information 3 years after the account is closed" give one thing (the same noun phrase) two lengths. An item that has one value for the whole document (a name in the fact-document-term lexicon, such as probation period) is compared across sections too: a table cell "Probation | 3 months" and a sentence in another section "The probation period is 6 months" disagree. The value in a section headed by the item''s name ("2. Warranty period") counts like a table cell, and a sentence with the item as its subject is read even with the point it counts from ("The warranty period for the product is 24 months from the date of purchase"). Values written as "Item: value" or "The item is value", and table cells, are read; the same item name (case and width aside) with two different values in the same unit within one section is pointed out (measured quantities such as 410 g and 450 g included, and lengths of time such as 3 months and 6 months; 1 year and 12 months are not compared). A sentence whose subject is exactly a table row''s heading ("Hospital cash is paid at $150 for each day") has its amount compared with that row''s amount in the same section ($100 a day).''

message:
  ja: 「{label}」が {value} と書かれていますが、同じ節の前の所では {other} です
  en: '"{label}" is {value} here, but {other} earlier in the same section'

messages:
  retention:
    ja: 「{label}」の保存期間が {value} と書かれていますが、前の所では {other} です
    en: 'The retention period of "{label}" is {value} here, but {other} earlier in the document'
  term:
    ja: 「{label}」が {value} と書かれていますが、表では {other} です
    en: '"{label}" is {value} here, but {other} in the table'
  term-section:
    ja: 「{label}」が {value} と書かれていますが、「{section}」の節では {other} です
    en: '"{label}" is {value} here, but {other} in the section "{section}"'

how_to_fix:
  ja: どちらの値が正しいかを確かめて、もう一方を直してください。別のもの（別の回、別の対象）の値なら、項目名にそれを書き分けてください（「第2回の締切」）。
  en: Check which value is right and correct the other. If they are values of different things (another session, another group), say so in the item name ("Second session deadline").

levels: { normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."

group: facts
summary:
  ja: 同じ節の中で、同じ項目（締切、料金など）に違う値を書いた所
  en: The same item (a deadline, a fee) given two different values in one section
example:
  ja:
    before: |
      締切：10月5日

      - 参加費：3,000円
      - 締切：10月7日
    after: |
      締切：10月5日

      - 参加費：3,000円
      - 締切：10月5日
  en:
    before: |
      Deadline: May 3, 2026

      - Fee: $300
      - Deadline: May 5, 2026
    after: |
      Deadline: May 3, 2026

      - Fee: $300
      - Deadline: May 3, 2026

not_flagged:
  ja: 違う見出しの下、違う親の項目の下、太字だけの行や「第2回：」のような行の後ろの値は、別のものの値として比べません。値の後ろに条件が続くもの（「3,000円から」「10月5日に開催」）、読点のあとから始まる項目名（「大人は、参加費は」）、単位の違う値（単位の食い違いは別に見ます）も比べません。同じ項目に三通り以上の値があれば、一覧として何も言いません。保存期間は、別のもの（ログは90日、個人情報は1年）や、上限・下限・目安の長さ（最長、以上、約）とは比べません。文書全体の項目は、拠り所（表の升、項目の名前を見出しにした節）と文のあいだだけで比べます。表どうしや、拠り所の無い文どうし（雇用形態ごとの節）、拠り所が二通りの値を書いた項目、条件の句の後ろの値（「製品登録をされた場合、保証期間は24か月です」）、名前に条件を書いた値（正社員の試用期間）は比べません。文書全体の項目は、表の升と文のあいだだけで比べます。表どうしや文どうし（雇用形態ごとの節）、表が二通りの値を書いた項目、名前に条件を書いた値（正社員の試用期間）は比べません。表の行と主語の文の金額は、行か文に同じ通貨の金額が二つ以上あるとき（日額と上限）、期間の違う金額（日額と月額）、主語が見出しより長いとき（入院給付金の上限は）、文に条件の語（場合、ただし）があるときは比べません。
  en: Values under different headings, under different parent list items, or after a bold-only line or a line like "Session 2:" are taken as values of different things. A value followed by a condition ("$300 per person", "May 3 at noon"), a name that starts after a comma ("For adults, the fee"), and values in different units are not compared. An item with three or more different values is read as a list and left alone. A retention period is not compared with that of another thing (logs 90 days, account data 1 year) or with a bound or an estimate (up to, at least, about). A whole-document item is compared only between its source (a table cell, or a section headed by its name) and a sentence; two tables, two sentences with no source (sections per type of employment), an item its sources give two values, a value after a condition ("If you register the product, the warranty runs for 24 months"), and a qualified name (part-time probation period) are left alone. A whole-document item is compared only between a table cell and a sentence; two tables or two sentences (sections per type of employment), an item the tables give two values, and a qualified name (part-time probation period) are left alone. A table row and a sentence naming it are not compared when either holds two amounts in the currency (a daily amount and a cap), when the amounts are for different periods (a day, a month), when the subject is longer than the heading ("Hospital cash cover is"), or when the sentence puts a condition on its amount (if, unless).
rewrite:
  depth: light
  ja:
    direction: 二つの値のどちらが正しいかを書き手に確かめ、もう一方を同じ値に直してください。どちらが正しいか文書から決まらないときは、推測で選ばずに書き手に聞いてください。
    pairs:
      - before: |
          締切：10月5日
          （中略）
          締切：10月7日
        after: |
          締切：10月5日
          （中略）
          締切：10月5日
      - before: |
          参加費は3,000円です。
          （中略）
          参加費は3,500円です。
        after: |
          参加費は3,000円です。
          （中略）
          第2回の参加費は3,500円です。
    keep:
      - 正しいと確かめた値
      - 項目名と単位
    avoid:
      - どちらが正しいかを推測で決める
      - 片方の値を消して、項目ごと無くす
  en:
    direction: Ask the writer which of the two values is right and make the other match it. If the document does not settle it, ask rather than guess.
    pairs:
      - before: |
          Deadline: May 3
          (…)
          Deadline: May 5
        after: |
          Deadline: May 3
          (…)
          Deadline: May 3
      - before: |
          The fee is $300.
          (…)
          The fee is $350.
        after: |
          The fee is $300.
          (…)
          The late fee is $350.
    keep:
      - the value confirmed as right
      - the item name and the unit
    avoid:
      - guessing which value is right
      - deleting one of them along with the item
