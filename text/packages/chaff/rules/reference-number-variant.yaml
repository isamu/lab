id: reference-number-variant
layer: L3
status: stable
how_to_find: reference-number-variant
word_list: reference-label
# The labels (予約番号, Booking number, 発注番号, Student number) and what each labels come from the language's reference-label lexicon; numbers after
# labels of different kinds (a booking number and a confirmation number) are never compared.
languages: [ja, en]
severity: warning

name:
  ja: 予約番号などの文字の入れ違い
  en: Booking or reference number with two characters swapped

why:
  ja: 予約確認書や受付の控えでは、予約番号や受付番号が冒頭と、キャンセルや問合せの案内とに何度も書かれます。一か所だけ「MN-48215」が「MN-48251」になっていると、読み手はどちらを伝えればよいか分からず、違う番号を伝えると予約が見つかりません。隣り合う二つの文字の入れ違いは、打ち間違いで最も多い形です。「予約番号」「受付番号」のような同じ種類の語のすぐ後ろに書いた番号どうしを比べ、隣り合う二つの文字だけが入れ違った番号を指します。
  en: "A confirmation or a receipt writes its booking number more than once: at the top, and again where it says how to cancel or whom to call. When one place reads MN-48251 for MN-48215, the reader cannot tell which to quote, and the wrong one finds no booking. Two neighbouring characters swapped is the commonest slip in typing a number. chaff compares the numbers written right after labels of the same kind (Booking number, Confirmation number) and reports one that is another with two neighbouring characters swapped."

message:
  ja: 番号「{written}」は、「{other}」の隣り合う文字が入れ違っています
  en: "The number {written} is {other} with two neighbouring characters swapped"

messages:
  substituted:
    ja: ナンバー「{written}」は、この文書の車のナンバー「{other}」と一連番号の一文字だけが違います
    en: "The plate {written} differs from this document's plate {other} in one character of its serial"

how_to_fix:
  ja: 正しい番号を確かめて、もう一方を直してください。
  en: Check which number is right and correct the other.

levels: { strict: error, normal: warning, relaxed: warning }

options:
  listed_kinds:
    kind: words
    default: [item, model]
    about:
      ja: 文書が多くを並べる番号の種類（reference-label の group）。この種類の、語の後ろや表にある番号どうしは比べず、語の無い番号だけを比べる
      en: Kinds of number a document lists many of (reference-label groups). Two labelled or tabled numbers of such a kind are never compared; only one with no label is

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: A story's booking numbers are made up and need not agree; one may differ on purpose.
  speech: A transcript writes what was said, numbers misspoken and corrected included.

group: facts
summary:
  ja: 同じ文書で、予約番号などの隣り合う文字が入れ違っている所（MN-48215 と MN-48251）
  en: A booking number written once with two neighbours swapped (MN-48215, MN-48251)
example:
  ja:
    before: |
      # ご予約の確認

      予約番号：MN-48215

      ご連絡の際は、予約番号 MN-48251 をお伝えください。
    after: |
      # ご予約の確認

      予約番号：MN-48215

      ご連絡の際は、予約番号 MN-48215 をお伝えください。
  en:
    before: |
      # Your booking

      Booking number: MN-48215

      When you call, please give your booking number, MN-48251.
    after: |
      # Your booking

      Booking number: MN-48215

      When you call, please give your booking number, MN-48215.

not_flagged:
  ja: 「予約番号」「受付番号」「予約確認番号」「お問い合わせ番号」「社員番号」「学籍番号」「発注番号」「見積番号」「請求書番号」「患者番号」「契約番号」「登録番号」「口座番号」「証券番号」のような語のすぐ後ろ（間は空白と「：」「、」や開き括弧だけ）にある、数字を4つ以上含む英数字の並びだけを番号と見ます。発注番号は取引先の番号を書き写すこともありますが、同じ種類の語の番号どうしで隣り合う二文字だけが入れ違ったものしか指さないので、別の注文の番号は指しません。「原契約番号」「基本契約番号」「旧契約番号」「変更契約番号」「親契約番号」は別の契約の番号を引く語なので、文書自身の「契約番号」とは比べません。「登録番号」「受講番号」は参加者の登録の番号、「申込番号」は申込みの番号として、互いに比べません。「振込先口座番号」「振込元口座番号」は振込の相手の口座の番号を書く語なので、口座自身の「口座番号」とは比べません。「契約者番号」は契約者その人の番号で、証券番号とは見ません。語の無い番号（下に書く品番の形のものを除く）、種類の違う番号（学籍番号と社員番号、予約番号と受付番号、請求書番号と注文番号、見積番号と注文番号や請求書番号、登録番号と申込番号）、一文字だけ違う番号、離れた文字の入れ違い、二か所以上入れ違った番号は指しません。自動車のナンバー（ひばり野 330 ね 48-15）の形に合う並びは、語が「登録番号」でも自動車のナンバーとして読みます。ナンバーだけは、文書が一台の車のことを書いているとき（その車のナンバーを「登録番号：」のような語と番号だけの行に一つだけ書き、ほかのナンバーは一つだけで、その語が文の初めにあるとき。「代車の登録番号」のように語の前に語があれば別の車と見ます）に限って、地名・分類番号・かなが同じで一連番号が一文字だけ違うものも指します。「ナンバー」だけの語や英語の「Registration」だけの語は、ナンバーの語として読みません。「品番」「商品コード」「品目コード」は商品の番号の語です。表の行や列の見出しにこの語を書いた升の品番も、語の後ろの品番と同じに読みます。語の無い品番（「GP-0521の替芯」）は、英字と「-」と数字4つ以上の形（GP-0521）のときだけ、語の後ろか表にある品番のちょうど一つと隣り合う二文字だけが入れ違っていれば指します。その書き方の品番が文書のどこかで語の後ろか表にあれば、別の商品の品番と見て指しません（カタログの表に並ぶ AB-1234 と AB-1243 は二つの商品です）。語の後ろや表にある品番どうしも、別の商品の品番として比べません（この扱いをする種類は listed_kinds で決めます）。二つ以上の品番のどれとも読めるもの、英字や「-」の無い番号（48251）も指しません。「会員番号」「会員ID」の会員の番号と、「お客様番号」の番号は、別の番号になり得るので比べません。語のすぐ後ろの番号を「HM 5520 8137」のように空白一つずつで区切って書いたときは、続く並びがどれも4文字以上の大文字と数字で数字を含む間を一つの番号と読み、行の終わりや、語（「の方」「2名」）の前で止めます。「型番」は製品の型番の語で、品番と同じく、語の後ろや表にある型番どうしは比べません。製品の文書（回収のお知らせや保証書）が自分の製品として名指す番号（題名にある番号、「型番：」「商品コード：」のような語と番号だけの行の番号、表で型番や品番の語を書いた升の番号）がちょうど一つのときに限り、「-」の前に英字が二つ以上あり、数字が二つ以上の短い番号（NH-805、FT-38）も読み、文書に一度だけ書いた、その番号の隣り合う二文字が入れ違った番号（NH-850）を指します。そう名指す番号が二つ以上ある文書（カタログ）、表にある番号、二度以上書いた番号、その番号と同じ行にある番号（「NH-805 と NH-850」）、「予約番号」のような別の種類の語の後ろの番号、英字一つの番号（A-12）は指しません。
  en: "Only letters and digits right after a label (booking number, reservation number, confirmation number, reference number, employee number, student number, PO number, quote or estimate number, invoice number, patient number, contract or agreement number, registration number, account number, policy number), with nothing but spaces, a colon, a comma or an opening bracket between, are read, and only when they hold four digits or more. A PO number may be the buyer's, copied from another document, but only two numbers of one kind that differ by two neighbours swapped are reported, so a different order's number is not. An original, master, former, amended or parent contract number (and an amendment number) cites another contract, so it is never compared with the document's own contract number. A registration number labels an attendee's registration and an application number an application, so the two are never compared. A payee's, beneficiary's, payer's or sender's account number labels the other side of a transfer, so it is never compared with the account's own account number; a policyholder number is not read as a policy number. Unlabelled codes (but for item codes, below), numbers of different kinds (a student number and an employee number, a booking number and an order number, an invoice number and an order number, a quote number and an order or invoice number, a registration number and an application number), numbers that differ in one character, swaps of characters that are not neighbours and numbers with more than one swap are not reported. A bare quote is not read as a label, since it is also a verb (quote your PO number). A plate number, number plate or licence plate is a vehicle's and is never compared with a registration number; a bare Registration label is not read as a plate, since an attendee's registration is written so too. An item code, item no., SKU or product code labels an item; a code in a table under such a label, in its row or its column, is read as if written after it. A code with no label (Refills for GP-0521) is reported only in the shape letters, a hyphen and four digits or more, and only when it is exactly one labelled or tabled code with two neighbours swapped. When the document labels or tables that writing itself anywhere, it is another item and is not reported (a catalog's AB-1234 and AB-1243 are two items), and two labelled or tabled item codes are never compared with each other (listed_kinds names the kinds read so); nor is a code two labelled codes swap to, or a number with no letters or hyphen (48251). A member number or member ID and a customer number may be different numbers, so they are never compared. A number written in groups one space apart (HM 5520 8137) is read as one while each further group is four or more capitals and digits holding a digit, stopping at the line's end or before a word or a short count (expires, 100 copies). A model, model number or model no. labels a product's model, and, as with item codes, two labelled or tabled models are never compared. When a product document (a recall, a warranty) names exactly one code as its own (in its title, on a line holding only a model or item label and the code, as Model: SH-710, or in a table under such a label), a shorter code is read too (two letters or more before a hyphen, and two digits or more: SH-710, FT-38), and a code written once that is that code with two neighbours swapped (SH-701) is reported. Not when the document names two codes so (a catalog), nor a code in a table, one written twice or more, one on a line that also names the document's code (the SH-710 replaces the SH-701), one after a label of another kind (booking number), or one with a single letter (A-12)."
