id: quote-without-source
layer: L2
status: stable
how_to_find: quote-without-source
severity: info

name:
  ja: 人の言葉として引いた文に出典がない
  en: A quotation given to someone, with no source

why:
  ja: 「〜は『…』と述べている」のように人の言葉として引いた文は、読み手がその人の言葉だと信じて読みます。出典が無いと、本当にその人がそう言ったのか、言い回しが正しいのかを誰も確かめられません。人から人へ伝わるうちに言葉が変わったり、言った人が入れ替わったりするのは、引用でいちばんよく起きる誤りです。chaff はその人が本当に言ったかを知りませんが、確かめる手がかりが無いことは言えます。鉤括弧や引用符で引いた文の直後か少し前に、誰かに帰する言い回し（「と述べ」「によれば」。語の一覧は言語ごとの語彙表にあります）があり、同じ段落にリンクも脚注も番号の引用も括弧の中の年も無いときに指します。Markdown の引用（`>`）の終わりかすぐ次の行に「— 名前」と書いた引用も、名前の行と引用の中に出典が無ければ指します。
  en: 'A quotation given to someone ("X once said …", "according to X") is read as that person''s words. With no source, nobody can check that the person said it, or said it that way; words change and speakers swap as a quotation is passed along, which is the commonest error in quoting. chaff cannot know who said what, but it can say there is nothing to check the quotation against. It points at a quotation in quotation marks given to someone by the words right after it or shortly before it ("said", "according to"; the words are in each language''s word list), in a paragraph with no link, no footnote, no numbered citation and no year in brackets. A Markdown block quotation (`>`) with a dash line ("— Name") as its last line or right after it is given to someone too, and is pointed at when neither the quotation nor that line gives a source.'

message:
  ja: 「{quote}」を人の言葉として引いていますが、出典（リンク、脚注、書誌）がありません
  en: '"{quote}" is given to someone, but no source (a link, a footnote, a reference) is given'

how_to_fix:
  ja: 同じ段落に出典を書いてください。Web で読めるならリンクを、本や論文なら「（著者, 書名, 年）」か脚注を付けます。出典が見つからないなら、言い回しを確かめられるまで人の言葉としては引かないでください。`chaff cite --scaffold <文書>` がこうした引用を引用.json のひな形にするので、source に出典のファイルを書いて `chaff cite <引用.json>` を動かせば、その言葉が出典に本当にあるかを照らせます。
  en: 'Name the source in the same paragraph: a link when it can be read online, or "(Author, Title, year)" or a footnote for a book or a paper. If no source can be found, do not give the words to the person until they can be checked. `chaff cite --scaffold <document>` writes these quotations as a quotes.json to fill in: put the source''s file in each `source`, and `chaff cite <quotes.json>` checks that the words are really there.'

levels: { strict: warning, normal: info, relaxed: info }

use_for: [blog, academic, docs, legal, literature, speech]
off_for:
  blog/owned-media: "An organisation's article quotes the people it interviewed: the interview is the source."
  docs: "A manual quotes messages, labels and commands, not people's words."
  legal: "A contract or a statute quotes its own terms and other provisions, which are cited by article."
  literature: "A story's quotations are its characters' words."
  speech: "A speech or a transcript gives its own words, and quotes from memory by design."

group: facts
summary:
  ja: 「〜は『…』と述べた」のように人の言葉として引いたのに、同じ段落に出典の無い所
  en: A quotation given to someone ("X said …") in a paragraph that gives no source
example:
  ja:
    config: { genre: blog/tech }
    before: |
      # 遅れた計画

      ある研究者は「遅れているプロジェクトに人を足すと、さらに遅れる」と述べている。人を足す前に、仕事を分けられるかを考えたい。
    after: |
      # 遅れた計画

      ある研究者は「遅れているプロジェクトに人を足すと、さらに遅れる」と述べている（[出典](https://example.com/essay)）。人を足す前に、仕事を分けられるかを考えたい。
  en:
    config: { genre: blog/tech }
    before: |
      # Late projects

      As one engineer put it, "adding people to a late project only makes it later." Before adding people, ask whether the work can be split.
    after: |
      # Late projects

      As one engineer put it, "adding people to a late project only makes it later" ([source](https://example.com/essay)). Before adding people, ask whether the work can be split.

not_flagged:
  ja: 短い鉤括弧（「保存」ボタン、「出典」という語）は語や名前を引いたもので、人の言葉ではないので見ません。誰かに帰する言い回しが引用のすぐ後ろ（「…」と述べた）か少し前（によれば「…」）に無い引用は、書き手自身の言葉か、題名や言い換えなので見ません。同じ段落にリンク、URL、脚注（[^1]）、番号の引用（[3]）、括弧の中の年（（1975）、（1999年））があれば、出典を書いたと見ます。「— 名前」の行が無い `>` の引用は、誰の言葉かを示していないので見ません。「— 名前、書名（1975）」のように名前の行に年やリンクがあれば、出典を書いたと見ます。出典が正しいかは見ません。それは `chaff cite` が照らします。記事（ブログ、エッセイ）と論文で見ます。組織の記事は取材した人の言葉を、プレスリリースや報告書は自分たちの言葉や題名で示した文書を引くので、手順書、仕様、契約や法令、小説、話し言葉とあわせて既定で止めています。
  en: 'A short quotation (the "Save" button, the word "source") names a word or a thing, not someone''s words, and is not read. A quotation with no such words right after it or shortly before it is the writer''s own words, a title or a paraphrase. A link, a URL, a footnote ([^1]), a numbered citation ([3]) or a year in brackets ((1975)) in the same paragraph counts as a source. A `>` block quotation with no dash line ("— Name") does not say whose words it holds and is not read; a dash line with a year or a link ("— Name, Title (1975)") counts as a source. Whether the source is right is not checked here: `chaff cite` checks that. Blog posts, essays and papers are read. An organisation''s articles quote the people they interviewed, and press releases and reports quote their own people or documents named by title, so they are left out by default, with manuals, specifications, contracts and statutes, fiction and speech.'
