id: annual-pay-mismatch
layer: L3
status: stable
how_to_find: annual-pay-mismatch
# The amounts are read with currency-notation and amount-multiplier; the labels are annual-pay-label, the other words
# annual-pay-word, approximate-marker, duration-month, number-word (digit), range-connector and amount-range-word.
severity: warning

name:
  ja: 月給と賞与から計算した額と合わない年収例
  en: An example annual pay that is not the monthly pay and bonus

why:
  ja: 求人の「年収例 450万円（月給28万円の場合）」は、読み手が月給と賞与から確かめずに信じる数字です。月給や賞与の月数を書き直したときや、別の求人の行を写したときに、年収例だけが古いまま残ります。年収例・想定年収の金額を、月給の12か月分と賞与の月数分を足した額（月給28万円、賞与3ヶ月分なら28万円 × 15 = 420万円）と比べます。月給と賞与は、年収例の行に書いてあればそれを、無ければ文書に一つだけ書いてあるものを使います。年収例は書いた桁までの丸めを認めます（「420万円」なら1万円未満の差、数字だけの「4,200,000円」なら1,000円未満の差）。年収例と月給がどちらも幅で書いてあれば、下の端どうし・上の端どうしを比べます。
  en: 'A posting''s "Example annual pay: $75,000 (with a monthly salary of $4,800)" is a figure readers believe without working it out. It goes wrong when the monthly pay or the bonus is changed and the example is not, or a line is copied from another posting. An example annual pay is compared with twelve months of the monthly pay plus the bonus months ($4,800 with three months of bonus is $4,800 × 15 = $72,000). The monthly pay and the bonus are those on the annual line, else the one each the posting states. The annual figure may be rounded to its last written place ("$72k" to a thousand; plain digits to a thousand). When both the annual pay and the monthly pay are ranges, the low ends and the high ends are compared.'

message:
  ja: 年収 {annual} が、月給 {monthly} の12か月分と賞与 {bonus} を足した{months}か月分と合いません
  en: "{annual} is not {months} months of the monthly pay {monthly} (twelve months and a bonus of {bonus})"

how_to_fix:
  ja: 月給・賞与の月数・年収例のどれが正しいかを確かめて、ほかを直してください。年収例に残業代や手当を含めるなら、そう書いてください。
  en: Check which of the monthly pay, the bonus and the annual figure is right, and correct the others. If the annual figure includes overtime or allowances, say so.

levels: { strict: error, normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."

group: facts
summary:
  ja: 「月給28万円、賞与3ヶ月分」で「年収例 450万円」のように、月給の12か月分と賞与を足した額と合わない年収例
  en: An example annual pay that is not 12 months' pay plus the bonus months
example:
  ja:
    before: |
      | 項目 | 内容 |
      | --- | --- |
      | 賞与 | 年2回（合計で月給の3ヶ月分） |
      | 年収例 | 450万円（入社3年目、月給28万円の場合） |
    after: |
      | 項目 | 内容 |
      | --- | --- |
      | 賞与 | 年2回（合計で月給の3ヶ月分） |
      | 年収例 | 420万円（入社3年目、月給28万円の場合） |
  en:
    before: |
      | Item | Details |
      | --- | --- |
      | Bonus | Twice a year, three months' salary in total |
      | Example annual pay | $75,000 (with a monthly salary of $4,800) |
    after: |
      | Item | Details |
      | --- | --- |
      | Bonus | Twice a year, three months' salary in total |
      | Example annual pay | $72,000 (with a monthly salary of $4,800) |

not_flagged:
  ja: 月給・賞与の月数（「賞与なし」を含む）・年収例の三つがそろわない求人は比べません。年俸・年俸制の語がある文書は比べません（月給が年俸の12分の1とも14分の1・16分の1ともありうるため）。ただの「年収」（平均年収など）は年収例として読みません。年収例の行か、年収例について書いた文に残業・時間外・手当・インセンティブ・歩合・みなしの語があれば、その文書の年収例は比べません。「約」「以上」「から」の付いた額、「400万円〜」のように開いた幅、片方だけが幅の組、月給の違う行が二つ以上ある文書、賞与の月数が「2〜3ヶ月」のような幅のもの・「各1ヶ月」のように1回あたりのもの・「夏1ヶ月、冬1ヶ月」のように月数が二つあるもの・「年2回、1ヶ月分」のように「計」「合計」の無いもの・金額で書いたもの・「別途」「決算賞与」のあるものも比べません。「給与」の見出しは「月額」「/月」があるときだけ月給として読みます。通貨の違う額は比べません。
  en: 'A posting without all three of a monthly pay, a bonus in months (or "no bonus") and an annual figure is not compared. A document that mentions an annual salary is not compared, since its monthly pay may be the salary over 12, 14 or 16, and a bare "annual pay" (an average, a past pay) is not read as an example. When the annual line or a sentence about it mentions overtime, allowances, incentives, commission or tips, the document''s annual figures are not compared. An amount with "about", "from", "or more" or "+", an open range, a range on one side only, a posting that states two different monthly pays, and a bonus given as a range of months, per payment ("one month each"), as two counts, paid more than once a year without "in total" ("twice a year, one month"), as an amount, or with another bonus besides are not compared. A "Salary" label is read as monthly only with "a month" or "per month" beside it. Amounts in different currencies are not compared.'
level_meaning:
  ja: 年収例が月給の12か月分と賞与の月数分を足した額と合わないとき指摘
  en: reported when an example annual pay is not twelve months of the monthly pay plus the bonus
