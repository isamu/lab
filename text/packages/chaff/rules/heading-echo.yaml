id: heading-echo
layer: L1
status: stable
how_to_find: heading-echo
uses: [pos]
severity: info

name:
  ja: 見出しの繰り返し
  en: Heading echoed

why:
  ja: 見出しで言ったことを次の文が繰り返すと、読者はそこで何も受け取れません。
  en: When the first sentence repeats the heading, the reader gains nothing by reading on.

message:
  ja: 見出し「{heading}」を直後の文がほぼそのまま繰り返しています
  en: The first sentence repeats the heading "{heading}"

how_to_fix:
  ja: 見出しが約束したことの中身から書き始めてください。
  en: Start from what the heading promised, not from the heading itself.

# 見出しの文字 3-gram のうち、直後の文に現れた割合（包含率）。100 分率で持つ。
# Jaccard ではない理由は detectors/heading-echo.ts を参照。
levels:
  strict: 45
  normal: 60
  relaxed: 75

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."

group: readability
summary:
  ja: 見出しのすぐ後の文が、見出しをほぼそのまま繰り返している所
  en: A first sentence that only repeats the heading above it
example:
  ja:
    before: |
      ## 経費の精算方法

      経費の精算方法について説明します。領収書を添えて、月末までに申請してください。
    after: |
      ## 経費の精算方法

      領収書を添えて、月末までに申請してください。
  en:
    before: |
      ## How to claim expenses

      This section explains how to claim expenses. Attach the receipt and submit it by the end of the month.
    after: |
      ## How to claim expenses

      Attach the receipt and submit it by the end of the month.

not_flagged:
  ja: 短い見出し（言葉が少なく、重なりを測れないもの）は見ません。見出しの頭の番号の札（例 3：、Step 3:、1.、第2章）は重なりに数えません。
  en: Headings too short to measure an overlap are not checked. A number label at the head of a heading (Step 3:, Example 4:, 1., Chapter 2:) is not counted in the overlap.
level_meaning:
  ja: 見出しと直後の文の重なりが {limit}% 以上なら指摘
  en: reported when the first sentence overlaps the heading by {limit}% or more
