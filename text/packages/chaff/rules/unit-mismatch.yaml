id: unit-mismatch
layer: L3
status: experimental
how_to_find: unit-mismatch
requires: [quantities]
uses: [pos]
severity: warning

name:
  ja: 同じ項目の量を違う単位で書いて、換算すると合わない
  en: One item given in two units that do not convert

why:
  ja: 「距離：5 km」と「距離：3000 m」のように、同じ項目の量を違う単位で書くと、読み手は換算してどちらが正しいかを確かめることになります。片方の単位を書き換えたときに、数を直し忘れると起きます。「項目：量」「項目は量です」と書いた所と表の升を読み、同じ節の同じ項目で単位の違う量（長さ、重さ、時間、体積、データの量）を換算して比べます。丸めた書き方（1 mile と 1.6 km）は、2% までの差なら合っているとみなします。
  en: 'When one item is given as "Distance: 5 km" and later "Distance: 3000 m", the reader has to convert to find out which is right. It happens when the unit of one is rewritten and its number is not. Values written as "Item: value" or "The item is value", and table cells, are read; within one section, the same item in two different units (of length, mass, time, volume or data) is converted and compared. A rounded figure (1 mile and 1.6 km) agrees when the difference is within 2%.'

message:
  ja: "「{label}」が {value} と書かれていますが、同じ節の前の所では {other} で、換算すると合いません"
  en: '"{label}" is {value} here, but {other} earlier in the same section, and they do not convert'

how_to_fix:
  ja: どちらの量が正しいかを確かめて、もう一方を換算して直してください。一つの文書では、同じ項目の単位を揃えると読み手が比べやすくなります。
  en: Check which value is right and convert the other to match. Using one unit for an item throughout a document makes it easier to compare.

levels: { normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]

group: facts
summary:
  ja: 同じ項目の量を、違う単位で書いて換算すると合わない所（距離：5 km と 3000 m）
  en: 'The same item given in two units that do not convert ("Distance: 5 km" and "3000 m")'
example:
  ja:
    before: |
      距離：5 km

      - 集合：駅前
      - 距離：3000 m
    after: |
      距離：5 km

      - 集合：駅前
      - 距離：5000 m
  en:
    before: |
      Distance: 5 km

      - Start: the station
      - Distance: 3000 m
    after: |
      Distance: 5 km

      - Start: the station
      - Distance: 5000 m

not_flagged:
  ja: 単位が同じ量（食い違いは fact-conflict が見ます）、種類の違う量（長さと重さ）、違う見出しや違う親の項目の下の量、2% までの差は見ません。GB や MB は 1000 倍でも 1024 倍でも合えば合うとみなします。
  en: Values in the same unit (fact-conflict looks at those), of different kinds (a length and a mass), under different headings or parent items, and differences within 2% are left alone. GB and MB agree when they match at either 1000 or 1024.
rewrite:
  depth: light
  ja:
    direction: 二つの量のどちらが正しいかを書き手に確かめ、もう一方を換算して直してください。どちらが正しいか文書から決まらないときは、推測で選ばずに書き手に聞いてください。
    pairs:
      - before: |
          距離：5 km
          （中略）
          距離：3000 m
        after: |
          距離：5 km
          （中略）
          距離：5000 m
      - before: |
          所要時間は90分です。
          （中略）
          所要時間は2時間です。
        after: |
          所要時間は90分です。
          （中略）
          所要時間は1.5時間です。
    keep:
      - 確かめた量
      - 単位の揃え方
    avoid:
      - どちらが正しいかを推測で決める
      - 換算した数を、元の量より細かい桁で書く
  en:
    direction: Ask the writer which value is right, and convert the other to match. If the document does not settle it, ask rather than guess.
    pairs:
      - before: |
          Distance: 5 km
          (…)
          Distance: 3000 m
        after: |
          Distance: 5 km
          (…)
          Distance: 5000 m
      - before: |
          The session is 90 minutes.
          (…)
          The session is 2 hours.
        after: |
          The session is 90 minutes.
          (…)
          The session is 1.5 hours.
    keep:
      - the value confirmed as right
      - one unit for the item
    avoid:
      - guessing which value is right
      - writing the converted value with more precision than the original
