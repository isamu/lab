id: date-order
layer: L3
status: stable
how_to_find: date-order
requires: [dates]
severity: warning

name:
  ja: 日程の順番が前後している
  en: A date out of order in a schedule

why:
  ja: 旅程やマイルストーンのように日付を並べた箇条書きや表、変更履歴の版ごとの見出しのように同じ深さに並ぶ見出しで、ひとつだけ前の日付より早い日付があると、書き間違いか順番の入れ替わりかを読み手が確かめることになります。並びが古い順か新しい順かは多いほうで決め、それに逆らう日付だけを指します。その向きに沿う日付が半分以下の並びは、名前や版の順に並べた一覧として扱い、何も言いません。
  en: In a list or a table of dates, such as an itinerary or milestones, or in a run of headings at one depth, such as the release headings of a changelog, one date earlier than the one before it makes the reader check whether it is a typo or a swapped row. The direction of the list (oldest or newest first) is taken from most of its steps, and only a date against it is pointed out. A list where no more than half of the dates follow that direction is taken as sorted by something else, such as a name or a version, and nothing is said.

message:
  ja: 「{date}」が、前後の日付の並びから外れています（前は「{previous}」）
  en: "{date} breaks the order of the dates around it (after {previous})"

messages:
  first:
    ja: 「{date}」が、後の日付の並びから外れています（次は「{next}」）
    en: "{date} breaks the order of the dates after it (before {next})"

how_to_fix:
  ja: 日付を確かめて、書き間違いなら直し、順番が違うなら並べ替えてください。
  en: Check the date. Correct it if it is a typo, or move the row if the order is wrong.

levels: { strict: error, normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
sources: [de-marneffe-2008]

group: facts
summary:
  ja: 旅程や予定表、変更履歴の見出しで、一つだけ日付の順番が前後している所
  en: One date out of order in an itinerary, a schedule or a changelog's headings
example:
  ja:
    before: |
      - 2026年4月1日 出発
      - 2026年4月3日 視察
      - 2026年3月5日 会議
      - 2026年4月10日 帰国
    after: |
      - 2026年4月1日 出発
      - 2026年4月3日 視察
      - 2026年4月5日 会議
      - 2026年4月10日 帰国
  en:
    before: |
      - 1 April 2026: depart
      - 3 April 2026: site visit
      - 5 March 2026: meeting
      - 10 April 2026: return
    after: |
      - 1 April 2026: depart
      - 3 April 2026: site visit
      - 5 April 2026: meeting
      - 10 April 2026: return

not_flagged:
  ja: その向きに沿う日付が半分以下の並びは、名前や版の順に並べた一覧として扱い、何も言いません。
  en: A list where no more than half of the dates follow one direction is taken as sorted by something else, and nothing is said.
