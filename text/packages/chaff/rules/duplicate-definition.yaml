id: duplicate-definition
layer: L3
status: experimental
how_to_find: duplicate-definition
requires: [structure]
severity: warning

name:
  ja: 同じ語の二重定義
  en: Term defined twice

why:
  ja: 同じ語を二か所で定義すると、二つの定義が食い違っていないかを読み手が確かめなければなりません。長い契約書では、後から足した定義が先の定義と少しずれることがよくあります。中身が食い違っているかは機械では決まらないので、chaff は二度目の定義の場所だけを示します。見出し（「『X』とは」）は語を掲げるだけなので、定義として数えません。
  en: A term defined in two places makes the reader check whether the two definitions agree. In long contracts a definition added later often drifts from the first. Whether they conflict is not something a machine can decide, so chaff only points at the second one. A heading that names the term is not counted as a definition.

message:
  ja: 「{term}」は {first} 行目でも定義されています
  en: '"{term}" is also defined on line {first}'

how_to_fix:
  ja: 定義を一か所にまとめ、もう一方は「第2条に定める{term}」のように参照にしてください。意図して意味を変えているなら、別の語にします。
  en: Keep one definition and refer to it from the other place. If the meaning changes on purpose, use a different term.

# chaff explain と規則の一覧には指摘が無いので、{term} をこう読ませる。
placeholders:
  term:
    ja: 〇〇
    en: the term

levels: { strict: 1, normal: 1, relaxed: 1 }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]

group: structure
summary:
  ja: 同じ語を、文書の二か所で定義している所
  en: The same term defined in two places in one document
example:
  ja:
    before: |
      # 利用規約

      ## 第1条（定義）

      「本サービス」とは、当社が提供する予約の仕組みをいう。

      ## 第2条（利用）

      「本サービス」とは、当社が運営する予約のサイトをいう。利用者は、本サービスを無料で使える。
    after: |
      # 利用規約

      ## 第1条（定義）

      「本サービス」とは、当社が運営する予約のサイトをいう。

      ## 第2条（利用）

      利用者は、本サービスを無料で使える。
  en:
    before: |
      # Terms of use

      ## 1. Definitions

      "Service" means the booking system we provide.

      ## 2. Use

      "Service" means the booking website we run. Users may use the Service free of charge.
    after: |
      # Terms of use

      ## 1. Definitions

      "Service" means the booking website we run.

      ## 2. Use

      Users may use the Service free of charge.

not_flagged:
  ja: 二つの定義が食い違っているかは決めません。二つ目を指すだけです。語を名前にした見出しは定義に数えません。
  en: Whether the two definitions conflict is not decided; only the second is pointed at. A heading that names the term is not a definition.
