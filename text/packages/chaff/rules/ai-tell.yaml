id: ai-tell
layer: L2
status: stable
how_to_find: ai-tell
word_list: ai-tell
uses: [pos]
severity: info

name:
  ja: 生成文にありがちな言い回し
  en: Phrasing common in generated text

why:
  ja: どれも単独では普通の日本語です。重なったときだけ意味があるので、重みを足し合わせて出しています。これだけで「AI が書いた」とは言えません。
  en: Each is ordinary on its own. Only the pile-up means anything, so the weights are summed. This alone never says the text was generated.

message:
  ja: 「{word}」が揃っています（点 {density}、{limit} まで）
  en: '"{word}" {count|appears|appear together} (score {density}, limit {limit})'

how_to_fix:
  ja: 自分の言葉に置き換えてください。置き換えられないなら、その段落は無くても通るかもしれません。
  en: Put it in your own words. If you cannot, the paragraph may not be needed.

# 重みの合計を 10 倍した点。0.9 の言い回しが 2 つで 18。
levels: { strict: 10, normal: 18, relaxed: 30 }

use_for: [technical/readme, blog, business, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."
sources: [kobak-2025, liang-2024, juzek-ward-2025]

group: ai-tells
summary:
  ja: 「重要な役割を果たす」「と言えるでしょう」のような、生成された文章にありがちな言い回しが重なった所
  en: Phrases common in generated text ("delve into", "plays a crucial role") piled up
example:
  ja:
    before: |
      現代社会において、データは重要な役割を果たすと言えるでしょう。
    after: |
      当社では、在庫の数を毎朝データで確かめてから発注しています。
  en:
    before: |
      In today's fast-paced world, data plays a crucial role. Let us delve into why.
    after: |
      We check stock levels every morning before placing orders.

not_flagged:
  ja: どの言い回しも、一つだけなら普通の文章にあります。重みの合計が上限を超えるまでは何も言いません。これだけで生成された文章だとは言いません。
  en: Each phrase is ordinary on its own; nothing is said until the weights add up past the limit. This alone never says the text was generated.
level_meaning:
  ja: 言い回しの重みの合計が {limit} 点まで
  en: up to a score of {limit}
rewrite:
  depth: light
  ja:
    direction: 決まった言い回しを、その文が実際に言っている中身（誰が、何を、どれだけ）に置き換えてください。中身の無い文は消してください。
    pairs:
      - before: 現代社会において、在庫データは発注の判断で重要な役割を果たしています。
        after: 発注は在庫データを見て決めています。
      - before: 原因の調査に三日間、時間を溶かしました。
        after: 原因の調査に三日かかりました。
      - before: 本記事では、キャッシュの仕組みについて深く掘り下げていきます。
        after: この記事では、キャッシュの仕組みを説明します。
    keep:
      - 数字、日付、名前、条件
      - 書き手の確かさ（言い切りか、推量か）
    avoid:
      - 書き手が書いていない例や数字を作る
      - 決まり文句を別の決まり文句に替える（「重要な役割を果たす」を「欠かせない存在だ」に）
      - どの段落も同じ形に書き揃える
  en:
    direction: Replace the stock phrase with what the sentence actually claims, who does what and how much. If nothing is claimed, delete the sentence.
    pairs:
      - before: In today's fast-paced world, stock data plays a crucial role in ordering.
        after: Orders are decided from stock data.
      - before: Let's delve into how the cache works.
        after: This section explains how the cache works.
      - before: The release is a testament to the team's meticulous planning.
        after: The team planned the release in detail.
    keep:
      - numbers, dates, names and conditions
      - how sure the writer is
    avoid:
      - inventing an example or a number the writer did not give
      - trading one stock phrase for another ("plays a crucial role" for "is pivotal")
      - giving every paragraph the same shape
