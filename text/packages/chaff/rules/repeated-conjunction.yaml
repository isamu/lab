id: repeated-conjunction
layer: L2
status: experimental
how_to_find: repeated-conjunction
word_list: paragraph-opener
uses: [pos]
severity: warning

name:
  ja: 段落が同じ調子で始まり続ける
  en: Paragraphs keep opening the same way

why:
  ja: 接続詞で始まる段落は 1 つなら流れを作りますが、続くとどの段落も前の付け足しに見えて、話がどこへ向かっているのか分からなくなります。
  en: One paragraph opening with a conjunction carries the flow. A run of them makes every paragraph an afterthought.

message:
  ja: 接続詞で始まる段落が {count} 続いています（{limit} まで）
  en: "{count} {count|paragraph|paragraphs} in a row {count|opens|open} with a conjunction (limit {limit})"

how_to_fix:
  ja: どれか 1 つを残して、他は言いたいことから始めてください。
  en: Keep one. Start the others with what you want to say.

levels: { strict: 1, normal: 2, relaxed: 4 }

use_for: [business, blog, technical, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."

group: readability
summary:
  ja: 「また、」「さらに、」のように、接続詞で始まる段落が続く所
  en: Paragraph after paragraph opening with a connective such as "Also" or "Moreover"
example:
  ja:
    before: |
      新しい料金は来月から始まります。

      また、請求書の形式も変わります。

      さらに、支払いの期限が月末になります。

      そして、古い料金は三月で終わります。
    after: |
      新しい料金は来月から始まります。

      請求書の形式も変わります。

      支払いの期限は月末になります。

      古い料金は三月で終わります。
  en:
    before: |
      The new prices start next month.

      Also, the invoice format will change.

      Moreover, payment will be due at the end of the month.

      Furthermore, the old prices end in March.
    after: |
      The new prices start next month.

      The invoice format will change.

      Payment will be due at the end of the month.

      The old prices end in March.

not_flagged:
  ja: 接続詞で始まる段落が一つだけなら、流れをつなぐ普通の書き方なので指しません。
  en: One paragraph opening with a connective is ordinary and is not reported.
level_meaning:
  ja: 接続詞で始まる段落の連続 {limit} まで
  en: up to {limit} paragraphs in a row opening with a connective
