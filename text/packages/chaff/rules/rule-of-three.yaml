id: rule-of-three
layer: L1
status: stable
how_to_find: rule-of-three
severity: info

name:
  ja: 3 項目の箇条書きばかり
  en: Everything comes in threes

why:
  ja: 3 つ並べると収まりがよいので、言いたいことが 2 つでも 4 つでも 3 つにされます。
  en: Three items feel complete, so two become three and four become three.

message:
  ja: 箇条書き {total} 個のうち {count} 個が 3 項目です（{limit}% まで）
  en: "{count} of {total} {total|list|lists} {count|has|have} exactly three items ({limit}% allowed)"

how_to_fix:
  ja: 数を合わせるために足した項目を消してください。2 つで足りるなら 2 つで。
  en: Drop the item you added to reach three.

levels: { strict: 50, normal: 70, relaxed: 90 }

use_for: [technical/readme, blog, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  academic: "Science writes in the passive, hedges its claims on purpose (may, suggest) and cites numbers as its evidence."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech: "A speech opens with greetings and closes with thanks: that is its form, not padding."
sources: [reinhart-2025, zhang-2024]

group: ai-tells
summary:
  ja: 箇条書きがどれも三つの項目で、数を合わせて並べたように見える所
  en: Lists that almost all have exactly three items, as if padded or trimmed to fit
example:
  ja:
    config: { genre: blog/tech }
    before: |
      # 在庫管理

      よい在庫管理の条件です。

      - 正確さ
      - 速さ
      - 安さ

      毎日することです。

      - 数える
      - 記録する
      - 見返す

      よくある失敗です。

      - 数え忘れ
      - 記録の漏れ
      - 見返さない
    after: |
      # 在庫管理

      よい在庫管理の条件です。

      - 正確さ
      - 速さ

      毎日することです。

      - 数える
      - 記録する
      - 見返す
      - 月末の棚卸しと突き合わせる

      よくある失敗です。

      - 数え忘れ
      - 記録の漏れ
      - 見返さない
  en:
    config: { genre: blog/tech }
    before: |
      # Stock control

      Good stock control is:

      - Accurate
      - Fast
      - Cheap

      Every day we:

      - Count
      - Record
      - Review

      Common mistakes:

      - Missed counts
      - Gaps in the record
      - No review
    after: |
      # Stock control

      Good stock control is:

      - Accurate
      - Fast

      Every day we:

      - Count
      - Record
      - Review
      - Match against the month-end count

      Common mistakes:

      - Missed counts
      - Gaps in the record
      - No review

not_flagged:
  ja: 箇条書きが 3 つより少ない文書は見ません。ビジネス文書と仕様書（technical/spec）のジャンルでは見ません。
  en: Documents with fewer than three lists are not checked. Business and specification (technical/spec) genres do not run this rule.
level_meaning:
  ja: 3 項目の箇条書きの割合 {limit}% まで
  en: up to {limit}% of lists with exactly three items
rewrite:
  ja:
    direction: 三つ並んだ箇条書きのうち、ほかの項目と同じことを言っている項目を消すか、一つにまとめてください。本当に三つあるリストはそのままにします。
    pairs:
      - before: |
          - 速い
          - 高速に動く
          - 安い
        after: |
          - 速い
          - 安い
      - before: |
          - 費用の削減
          - コストの低減
          - 保守の手間が減る
        after: |
          - 費用が下がる
          - 保守の手間が減る
    keep:
      - 互いに別のことを言っている項目
    avoid:
      - 別々のことを一つにまとめて意味を変える
      - 三つを避けるために四つ目を作る
  en:
    direction: In each list of three, delete or merge the item that says what another item already says. A list that really has three items stays.
    pairs:
      - before: |
          - fast
          - quick to run
          - cheap
        after: |
          - fast
          - cheap
      - before: |
          - lower costs
          - reduced spending
          - less maintenance
        after: |
          - lower costs
          - less maintenance
    keep:
      - items that say different things
    avoid:
      - merging two different things into one and changing the meaning
      - inventing a fourth item to get away from three
