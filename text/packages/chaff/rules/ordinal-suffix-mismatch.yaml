id: ordinal-suffix-mismatch
layer: L2
status: stable
how_to_find: ordinal-suffix
severity: warning

name:
  ja: 数に合わない序数の字
  en: An ordinal with the wrong ending

why:
  ja: 英語の序数は、数の終わりで付く字が決まっています（1st、2nd、3rd、4th、11th、12th、13th、21st）。「3th」「22th」「11st」は打ち間違いか、数だけを書き換えて字を残したもので、読み手はどの数が正しいのかを疑います。数と字の対応は決まっているので、機械で言えます。
  en: An English ordinal's ending is fixed by how the number ends (1st, 2nd, 3rd, 4th, 11th, 12th, 13th, 21st). "3th", "22th" or "11st" is a slip, or a number changed with its old ending left on, and the reader starts to doubt the number. The ending follows from the number, so a machine can tell.

message:
  ja: 「{written}」は「{expected}」と書きます
  en: '"{written}" is written "{expected}"'

how_to_fix:
  ja: 数が正しいかを確かめ、その数に合う字に直してください。
  en: Check that the number is right, then give it the ending that goes with it.

levels: { normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]

group: wording
summary:
  ja: 「3th」「22th」「11st」のように、英語の序数の字が数と合わない所
  en: An English ordinal whose ending does not go with its number, such as "3th", "22th" or "11st"
example:
  ja:
    before: 今年で 3th イベントになります。
    after: 今年で 3rd イベントになります。
  en:
    before: This is our 22th annual meeting.
    after: This is our 22nd annual meeting.

not_flagged:
  ja: 語や番号の一部（v1th、0x2nd、1-2th）と、法律の引用の「2d」「3d」は読みません。コードの中は読みません。
  en: Parts of a word or an identifier (v1th, 0x2nd, 1-2th) and the "2d" and "3d" of legal citations are not read. Code is not read.

rewrite:
  ja:
    direction: 数が正しいかを確かめ、その数に合う序数の字に直してください。日本語の文なら「第3回」のように書き換えてもかまいません。
    pairs:
      - before: 今年で 3th イベントになります。
        after: 今年で 3rd イベントになります。
      - before: 11st の候補を選びました。
        after: 11th の候補を選びました。
    keep:
      - 数そのもの（数が違っていれば、まず数を確かめる）
    avoid:
      - 数を確かめずに字だけを直す
  en:
    direction: Check that the number is right, then give it the ending that goes with it. Where the number is small, spelling the ordinal out also works.
    pairs:
      - before: This is our 22th annual meeting.
        after: This is our 22nd annual meeting.
      - before: She finished 11st out of forty.
        after: She finished 11th out of forty.
    keep:
      - the number itself (if it is wrong, fix the number first)
    avoid:
      - changing the ending without checking the number
