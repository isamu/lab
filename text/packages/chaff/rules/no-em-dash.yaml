id: no-em-dash
layer: L1
status: stable
how_to_find: dash-density

# 記号の許容度は言語で違う。英語では正当な用法が多く、日本語の組版では扱いが難しい。spec §12.4。
severity:
  ja: warning
  en: info

name:
  ja: ダッシュが多い
  en: Too many dashes

why:
  ja: 日本語の組版でダッシュは扱いが難しく、環境によって長さも見えかたも変わります。読点や括弧で書けることが多いです。
  en: In English a dash is a legitimate tool, and a heavy hand with it is also one of the better-known marks of generated text. On its own it says little; it counts toward the composite signal.

message:
  ja: 1000 字あたり {density} 個のダッシュがあります（{limit} 個まで）
  en: "{density} {density|dash|dashes} per 1000 words (limit {limit})"

how_to_fix:
  ja: 読点か括弧に置き換えてください。挟み込みなら括弧、言い換えなら読点が読みやすいです。
  en: A comma or a pair of brackets usually reads better.

# 1000 あたりの個数。英語は許容度が高いので緩い。
levels:
  ja: { strict: 1, normal: 3, relaxed: 8 }
  en: { strict: 3, normal: 8, relaxed: 20 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
sources: [freeburg-2026]

group: ai-tells
summary:
  ja: ダッシュ（——）が多すぎる所。英語では、生成された文章のよく知られた印の一つでもあります
  en: Too many dashes, which is also one of the better-known marks of generated text
example:
  ja:
    pad: true
    before: |
      新しい料金——来月から始まります——は、請求書にも反映されます。支払いの期限——月末です——にご注意ください。
    after: |
      新しい料金は来月から始まり、請求書にも反映されます。支払いの期限は月末です。
  en:
    pad: true
    before: |
      The new prices — which start next month — will show on invoices. Payment is due — as before — at the end of the month.
    after: |
      The new prices start next month and will show on invoices. Payment is due at the end of the month, as before.

not_flagged:
  ja: 短い文書は測りません。英語では、ダッシュそのものを誤りとは言いません。
  en: Short documents are not measured. In English a dash is not called wrong; only a heavy hand is.
level_meaning:
  ja: 1000 字あたりダッシュ {limit} 個まで
  en: up to {limit} dashes per 1000 words
rewrite:
  ja:
    direction: 挟み込みのダッシュは括弧に、言い換えや補足のダッシュは読点に替えるか、二文に分けてください。
    pairs:
      - before: この設定——とくに保存期間——は慎重に決めてください。
        after: この設定（とくに保存期間）は慎重に決めてください。
      - before: 答えは一つ——締め切りを守ることです。
        after: 答えは一つ、締め切りを守ることです。
    keep:
      - 挟み込んだ中身と、それが掛かる語
    avoid:
      - ダッシュを全角コロンや別の線の記号に替えるだけで済ませる
  en:
    direction: Turn an aside between dashes into commas or brackets, and a dash before an explanation into a comma, a colon or a new sentence.
    pairs:
      - before: The setting — especially retention — needs care.
        after: The setting, especially retention, needs care.
      - before: There is one answer — meet the deadline.
        after: There is one answer. Meet the deadline.
    keep:
      - the aside and what it belongs to
    avoid:
      - swapping every dash for a colon or a semicolon
