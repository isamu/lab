id: announcing-opener
layer: L2
status: stable
how_to_find: opener-pile
word_list: announcing-opener
uses: [pos]
severity: info

name:
  ja: 予告で始まる文が多い
  en: Too many sentences that announce before they say

why:
  ja: 「重要なのは、」「ポイントは、」「正直に言うと、」は、中身の前に「これから大事なことを言う」と予告します。1 つなら目印ですが、重なるとどの文も同じ重さに見え、予告だけが残ります。生成文によく見られる癖として知られています。
  en: '"The key point is", "Here''s the thing" and "Honestly," announce a point before making it. Once, that is a signpost; piled up, every sentence claims the same weight and the announcements are all that stand out. A habit well known in generated text.'

message:
  ja: 「{matched}」など、予告で始まる文が {count} 個あります（{limit} 個から）
  en: '"{matched}" and other announcing openers start {count} sentences ({limit} needed)'

how_to_fix:
  ja: 予告を消して、中身から書き始めてください。本当に一番大事な一つだけなら、予告を残してもかまいません。
  en: Delete the announcement and start with the point. If it really is the one point that matters most, keep that one.

# 指摘に要る数。長さで割らない：人の記事は長くても 1 つ 2 つで、生成文は短くても重ねる。
levels: { strict: 2, normal: 3, relaxed: 5 }

use_for: [technical/readme, blog, business, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech: "A speech opens with greetings and closes with thanks: that is its form, not padding."

group: ai-tells
summary:
  ja: 「重要なのは、」「ポイントは、」「正直に言うと、」のように、中身の前に予告する文頭が重なっている所
  en: 'Openers that announce a point before making it ("The key point is", "Here''s the thing", "Honestly,") piling up'
example:
  ja:
    before: |
      重要なのは、設定を先に確かめることです。ポイントは、ログを残すことです。正直に言うと、手順書は古くなっています。
    after: |
      まず設定を確かめ、そのときのログを残してください。手順書は去年の版のままなので、画面の名前が違います。
  en:
    before: |
      The key point is that settings come first. Here's the thing: logs matter too. Honestly, the manual is out of date.
    after: |
      Check the settings first and keep the log of that check. The manual is last year's, so the screen names differ.

not_flagged:
  ja: 文の途中の「このポイントは」と、指摘に要る数に届かない予告は言いません。「大事なのは」「結論から言うと」は、生成 AI 以前の人の記事にも同じくらいあるので数えません。
  en: An announcing phrase inside a sentence, and fewer than the level needs, are not reported.
level_meaning:
  ja: 予告で始まる文が {limit} 個あれば指摘
  en: reported once {limit} sentences open with an announcement
rewrite:
  ja:
    direction: 「重要なのは、」「ポイントは、」のような予告を消し、その後ろの中身から文を始めてください。
    pairs:
      - before: 重要なのは、締め切りを先に決めることです。
        after: 締め切りは先に決めます。
      - before: 正直に言うと、この設定は分かりにくいです。
        after: この設定は分かりにくいです。
      - before: ポイントは、キャッシュを毎回消すことです。
        after: キャッシュは毎回消します。
    keep:
      - 予告の後ろの中身
      - 文書でいちばん大事な一つにだけ付けた予告
    avoid:
      - 予告を別の予告（「大切なのは」「注目すべきは」）に替える
      - 予告を消したぶん、強める語（「必ず」「非常に」）を足す
  en:
    direction: Delete the announcement ("The key point is", "Here's the thing") and start the sentence with what came after it.
    pairs:
      - before: The key point is that deadlines come first.
        after: Deadlines come first.
      - before: Here's the thing, the setting is confusing.
        after: The setting is confusing.
      - before: Honestly, the cache should be cleared every time.
        after: The cache should be cleared every time.
    keep:
      - what followed the announcement
      - one announcement on the single point that matters most
    avoid:
      - swapping one announcement for another ("What matters is", "Notably")
      - adding an intensifier ("always", "really") to make up for the deleted opener
