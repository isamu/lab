id: colon-lead-in
layer: L1
status: stable
how_to_find: colon-lead-in
severity: info

name:
  ja: コロンで箇条書きへ渡す文が多い
  en: Too many colon lead-ins to lists

why:
  ja: 「以下の通りです：」「ポイントは次の 3 つ：」のように、コロンで終わる文から箇条書きへ渡す形です。1 つなら案内ですが、節ごとに続くと、説明が箇条書きの前置きだけになり、項目どうしの繋がりが書かれません。生成文によく見られる形です。
  en: 'A sentence ending in a colon that hands the reader to a list ("Here''s what you need to know:"). Once, it guides; section after section, the prose shrinks to list captions and the links between the items go unwritten. A shape common in generated text.'

message:
  ja: コロンで箇条書きへ渡す文が 1000 字あたり {density} 個あります（{limit} 個まで）
  en: "{density} colon lead-ins to lists per 1000 words (limit {limit})"

how_to_fix:
  ja: 箇条書きの一部を文に戻し、項目どうしがどう繋がるのかを書いてください。手順や部品の一覧のように、本当に並べるものはそのままでかまいません。
  en: Turn some of the lists back into sentences and say how the items connect. Real lists (steps, parts) can stay.

# 1000 字（英語は 1000 語）あたりの数。2 つより少なければ言わない（ai-phrasing.ts の PILE）。
# 英語の人の文書はコロンから箇条書きへよく渡すので、英語の上限は高い。
levels:
  ja: { strict: 1, normal: 2, relaxed: 4 }
  en: { strict: 3, normal: 4, relaxed: 6 }

options:
  min_sections:
    kind: count
    default: 3
    about:
      ja: 前置きのある節の数の下限。1 つ 2 つの節だけなら、手順の前置きや対になった箇条書きで、節ごとに続く形ではありません。見出しの無い文書は前置きの数で数えます
      en: The fewest sections with a lead-in. In one or two sections it is a procedure's lead-in or a pair of lists, not section after section. A document without headings counts its lead-ins

use_for: [technical/readme, blog, business, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech: "A speech opens with greetings and closes with thanks: that is its form, not padding."

group: ai-tells
summary:
  ja: 「以下の通りです：」のように、コロンで終わる文から箇条書きへ渡す形が続き、説明が箇条書きの前置きだけになっている所
  en: Section after section that opens with a sentence ending in a colon before a list
example:
  ja:
    pad: true
    before: |
      準備は以下の通りです：

      - 鍵
      - 地図

      当日の流れは次の通りです：

      - 集合
      - 出発
    after: |
      鍵と地図を用意してください。当日は駅に集合してから出発します。

      - 鍵
      - 地図
  en:
    pad: true
    before: |
      Here's what to bring:

      - A key
      - A map

      Here's how the day goes:

      - Meet at the station
      - Set off
    after: |
      Bring the key and a map. We meet at the station and set off from there.

      - A key
      - A map

not_flagged:
  ja: 1 つだけのコロンの前置きと、コロンで終わらない前置き（「次のとおりとする。」）は数えません。項目ごとに同じ名詞の札（太字の「参考:」）を置く形は、項目の欄の名前なので数えません。一行に立つ太字の名詞の札（**メリット：**、**Pros:**）も、見出しと同じく箇条書きの名前なので数えません。前置きが 3 つより少ない節にしか無いとき（短いハウツーの手順の前置き二つ、一つの節に並べた事実の一覧）は、節ごとに続く形ではないので言いません。説明書・法務・仕様書（technical/spec）のジャンルでは見ません。短い文書は測りません。英語の文書は、人もコロンから箇条書きへよく渡すので、上限を高くしています。日本語の文書の中の英文（Examples include:）は数えません。
  en: A single colon lead-in, and a lead-in that does not end in a colon, are not counted. Nor is the same noun label repeated before each entry's list (a bold 参考:), which names a field of the entry, nor a bold noun label on a line of its own (**Pros:**, **Cons:**), which names its list as a heading does. Lead-ins in fewer than three sections (two procedure lead-ins in a short how-to, the lists of facts in one section of a press release) are not section after section and are not reported; a document without headings counts its lead-ins. Documentation, legal and specification (technical/spec) genres do not run this rule. Short documents are not measured. English writers hand off to a list after a colon often, so the English limit is higher. In a Japanese document, an English sentence inside (Examples include:) is not counted.
level_meaning:
  ja: コロンで箇条書きへ渡す文が 1000 字あたり {limit} 個まで
  en: "colon lead-ins to lists: up to {limit} per 1000 words"
rewrite:
  depth: structure
  ja:
    direction: コロンで箇条書きへ渡す所のうち、項目が二つか三つで互いに繋がっているものを文に戻してください。手順や部品の一覧は箇条書きのままにします。
    pairs:
      - before: |
          保存期間は以下の通りです：

          - 30 日間
          - 期限を過ぎると消える
        after: |
          保存期間は 30 日間で、期限を過ぎると消えます。
      - before: |
          利点は次のとおりです：

          - 速い
          - 安い
        after: |
          速くて安いのが利点です。
    keep:
      - 項目の中身と数
      - 手順の順番
    avoid:
      - 長い箇条書きを一つの長い文に詰める
      - 項目の間に、書き手が書いていない因果を足す
  en:
    direction: Of the lists a colon hands over to, turn back into sentences the ones with two or three items that connect. Steps and parts lists stay lists.
    pairs:
      - before: |
          Here's how long we keep it:

          - 30 days
          - Deleted after that
        after: |
          We keep it for 30 days and delete it after that.
      - before: |
          The benefits are:

          - Fast
          - Cheap
        after: |
          It is fast and cheap.
    keep:
      - what the items say, and how many
      - the order of steps
    avoid:
      - packing a long list into one long sentence
      - adding causes between the items that the writer did not state
