id: concrete-evidence-density
layer: L1
status: stable
how_to_find: concrete-evidence
# 品詞があれば使う（数の語、言い回しの動詞）。無くても文字だけで動く。
uses: [pos]
severity: info

name:
  ja: 具体物のない節がある
  en: Section with nothing concrete

why:
  ja: 数値もコードもリンクも無い節は、読み終えても持ち帰るものがありません。抽象的な説明だけが残ります。仕様書では「error とは何か」のような定義の節が普通にあるので、technical では動かしません。
  en: A section with no number, no code and no link leaves the reader with nothing to take away.

message:
  ja: 「{word}」の節に数値もコードもリンクもありません（そういう節が {count}/{total}）
  en: 'Section "{word}" has no number, code or link ({count} of {total} {total|section|sections})'

how_to_fix:
  ja: 実例を 1 つ足してください。書けないなら、その節は他の節に畳めるかもしれません。
  en: Add one example. If you cannot, the section may belong inside another one.

levels: { strict: 1, normal: 3, relaxed: 6 }

use_for: [blog, business, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  academic: "Science writes in the passive, hedges its claims on purpose (may, suggest) and cites numbers as its evidence."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech: "A speech opens with greetings and closes with thanks: that is its form, not padding."

group: structure
summary:
  ja: 数字もコードもリンクも無く、読み手が持ち帰れるものの無い節
  en: "A section with no number, code or link: nothing for the reader to take away"
example:
  ja:
    config: { rules: { concrete-evidence-density: strict } }
    before: |
      # 改善の報告

      ## 成果

      問い合わせ対応が大きく良くなりました。お客様からの評判も上々です。担当者の負担も軽くなりました。
    after: |
      # 改善の報告

      ## 成果

      問い合わせへの回答が、平均 3 日から 1 日になりました。お客様アンケートの満足度は 72% から 85% に上がりました。担当者の残業は月 10 時間減りました。
  en:
    config: { rules: { concrete-evidence-density: strict } }
    before: |
      # Improvement report

      ## Results

      Our help desk got much better. Customers are pleased with it. The team feels less pressure too.
    after: |
      # Improvement report

      ## Results

      Replies to help desk tickets now take 1 day on average, down from 3. Customer satisfaction rose from 72% to 85%. Overtime fell by 10 hours a month.

not_flagged:
  ja: 3 文より短い節、索引のように項目を並べた節は見ません。
  en: Sections shorter than three sentences, and index-like sections of entries, are not checked.
level_meaning:
  ja: 具体物のない節が {limit} 個あれば指摘
  en: reported once {limit} sections have nothing concrete
