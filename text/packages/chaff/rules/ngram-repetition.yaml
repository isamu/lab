id: ngram-repetition
layer: L1
status: stable
how_to_find: ngram-repetition
# 品詞があれば使う（数の語、言い回しの動詞）。無くても文字だけで動く。
uses: [pos]
severity: info

name:
  ja: 同じ言い回しの繰り返し
  en: Repeated phrasing

why:
  ja: 同じ言い回しが何度も出ると、読み手は新しいことが書かれていないと感じます。日本語は文字の並びで、英語は語の切れ目にそろえた並びで数えます。一覧の項目ごとに付く括弧の札・リンクの文字・記号は、書き手の言い回しではないので数えません。
  en: The same phrasing again and again reads as nothing new being said. Counted on runs of whole words in English and of characters in Japanese. Bracketed tags, link text and symbols that a listing repeats on every entry are not the writer's phrasing, and are not counted.

message:
  ja: 「{word}」が {count} 回出てきます（{limit} 回まで）
  en: '"{word}" appears {count} {count|time|times} (limit {limit})'

how_to_fix:
  ja: 2 回目以降を言い換えるか、まとめて 1 度にしてください。繰り返しているのが組織名や製品名なら、chaff.yaml の names に並べると数えません。
  en: Rephrase the repeats, or say it once. If what repeats is an organisation or product name, list it under names in chaff.yaml and it is not counted.

levels: { strict: 3, normal: 5, relaxed: 9 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  docs/glossary: "A reader looks up one entry and reads only that. A definition is a noun phrase (風の吹いてくる方向。), and sibling entries share one wording on purpose (Portion of labor productivity change attributed to …), which no reader sees twice."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."

group: readability
summary:
  ja: 同じ言い回しが何度も出てきて、新しいことを言っていないように読める所
  en: The same phrase used over and over, so nothing new seems to be said
example:
  ja:
    pad: true
    config: { rules: { ngram-repetition: strict } }
    before: |
      お客様の声を大切にしています。商品開発でもお客様の声を大切にしています。店頭でもお客様の声を大切にしています。電話の窓口でもお客様の声を大切にしています。
    after: |
      お客様の声を大切にしています。商品開発では試作品を常連の方に使ってもらい、店頭では買い物のあとに感想を聞いています。
  en:
    pad: true
    config: { rules: { ngram-repetition: strict } }
    before: |
      We listen to our customers. In product design we listen to our customers. In our stores we listen to our customers. On the phone we listen to our customers.
    after: |
      We listen to our customers. Regulars try every prototype, and store staff ask shoppers what they thought.

not_flagged:
  ja: 一覧の飾り（各項目に付くタグやリンクの文字）、欄の名前（Cited by:）、かぎ括弧で引いた題や言葉、文書が定義した語と、名前にかかる語句は数えません。英語の、名詞と形容詞と略語だけが並ぶ用語（the federal funds rate、extended AI assistant）は言い回しではないので数えません。一つの文の中の繰り返しは 1 回と数えます。文書の題にある言い回しは主題なので数えません。よくある質問の答えは、問いの見出しごとに別々に数えます。節の最初の文にある言い回し（節ごとのひな形の書き出し）、番号を振った項目の見出し（（1）…に係る規定に関する改正）、参照の項目の説明の段落（`max-age` の節、定義の並び）、句点の無い名詞で終わる一行（表の欄）に出たぶんは数えません。項目ごとの決まった結び（〜ものとすること。原案のとおり決定する。が表示されます。）も、文の終わりにあれば数えません。引いた題で終わる文の短い結び（詳しくは「…」を確認してください。）、文書の部分を指す名前（Section 3.1、表2）にかかる語句、表の欄が 2 つ続いた後ろの一行の文（表の行の最後の欄）も数えません。英語で、名詞の入る所の -ing 形の句（what occupying the anticipatory mode requires）と、用語の後ろの be（the anticipatory mode is）は用語で、言い回しではありません。短い文書は測りません。
  en: Tags, link text and symbols that a listing repeats on every entry, field labels (Cited by:), titles and words quoted in Japanese brackets, terms the document defines, and the words around a repeated name are not counted. A term made only of nouns, adjectives and acronyms ("the federal funds rate", "extended AI assistant") is not a phrasing and is not counted. A phrase repeated inside one sentence counts once, and one in the document's title is its subject and is not counted. The answers in a FAQ are counted one question at a time. Uses in the first sentence of sections (each section's template opening), in numbered item titles ((1) ... amendment of the provision on ...), in the first paragraph of a reference entry (a section headed `max-age`, a definition list) and in a line without a full stop that ends in a noun (a table cell) are not counted, nor a fixed closing line repeated per item at the end of a Japanese sentence (〜ものとすること。, 原案のとおり決定する。, が表示されます。). Nor are the short closing after a quoted title (詳しくは「…」を確認してください。), the words around a reference to a numbered part (set out in Section 3.1, 表2), or a one-line sentence after two table cells (the last cell of a table run into lines). In English, an -ing phrase in a noun's place (what occupying the anticipatory mode requires) and a term followed by be (the anticipatory mode is) are terms, not phrasing. Short documents are not measured.
level_meaning:
  ja: 同じ言い回し {limit} 回まで
  en: up to {limit} uses of the same phrase
