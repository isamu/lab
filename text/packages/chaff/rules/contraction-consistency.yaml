id: contraction-consistency
layer: L2
status: stable
how_to_find: contraction-mix
word_list: contraction
languages: [en]
severity: info

name:
  ja: 短縮形の使いかたが揃っていない
  en: Contraction use is inconsistent

why:
  ja: 短縮形を使うかどうかは文体の選択で、どちらが正しいかは決めません。1 つの文書で混ざっていると、読み手は文ごとに距離感を測り直すことになります。
  en: Whether to use contractions is a choice of register, and neither is wrong. Mixed within one document, the reader re-measures the distance sentence by sentence.

message:
  ja: 「{matched}」は、この文書のほかの所では「{majority}」と書かれています
  en: '"{matched}" is written "{majority}" elsewhere in the document'

how_to_fix:
  ja: 同じ語は、多いほうの書きかたに揃えてください。
  en: Write the same word the way the document mostly writes it.

# 1 つの対で、少ないほうの書きかたが何回までなら「混在」と見るか。これを超えたら混在ではなく、書き分け。
levels: { strict: 4, normal: 2, relaxed: 1 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."
  docs: measured by yarn rules:measure

group: consistency
summary:
  ja: 英語で、同じ語を「don't」と「do not」のように両方の形で書いている所
  en: The same word written both contracted ("don't") and in full ("do not")
example:
  en:
    before: |
      We don't store your password. We don't read your messages. We don't share your data. We do not sell your address.
    after: |
      We don't store your password. We don't read your messages. We don't share your data. We don't sell your address.

not_flagged:
  ja: 短縮形を使うかどうかは決めません。比べるのは同じ語の 2 つの形（「you're」と「you are」）だけで、別の語どうしは比べません。「you're」と書き、否定は「do not」と書く文書は揃っています。同じ語の 2 つの形が同じ回数なら、少ないほうが無いので指しません。
  en: Whether to use contractions is not decided. Only the two forms of the same word are compared ("you're" with "you are"), never different words, so a document that writes "you're" but keeps "do not" in full is consistent. When both forms of a word appear as often, there is no minority and nothing is pointed at.
level_meaning:
  ja: 同じ語の少ないほうの書き方が {limit} 箇所以下のとき指摘
  en: reported when the minority form of a word appears {limit} times or fewer
