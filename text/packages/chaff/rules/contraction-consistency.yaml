id: contraction-consistency
layer: L2
status: experimental
how_to_find: contraction-mix
word_list: contraction
languages: [en]
severity: info

name:
  ja: 短縮形の使いかたが揃っていない
  en: Contraction use is inconsistent

why:
  ja: 短縮形を使うかどうかは文体の選択で、どちらが正しいかは決めません。1 つの文書で混ざっていると、読み手は文ごとに距離感を測り直すことになります。
  en: Whether to use contractions is a choice of register, and neither is wrong. Mixed within one document, the reader re-measures the distance sentence by sentence.

message:
  ja: 「{matched}」だけ他と書きかたが違います（そういう書きかたが {count} 種）
  en: '"{matched}" is written differently from the rest of the document'

how_to_fix:
  ja: 多いほうに揃えてください。
  en: Match the majority.

# 少数派が何種までなら「混在」と見るか。これを超えたら混在ではなく、そういう文体。
levels: { strict: 4, normal: 2, relaxed: 1 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: consistency
summary:
  ja: 英語で、「don't」と「do not」のように短縮形を使う書き方と使わない書き方が混ざっている所
  en: Contractions ("don't") and full forms ("do not") mixed in one document
example:
  en:
    before: |
      We don't store your password. We can't read your messages. We won't share your data. We do not sell your address.
    after: |
      We don't store your password. We can't read your messages. We won't share your data. We don't sell your address.

not_flagged:
  ja: 短縮形を使うかどうかは決めません。文書の中で少ないほうだけを指します。
  en: Whether to use contractions is not decided; only the minority form in the document is pointed at.
level_meaning:
  ja: 少ないほうの書き方が {limit} 箇所以下のとき指摘
  en: reported when the minority form appears {limit} times or fewer
