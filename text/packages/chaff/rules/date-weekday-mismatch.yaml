id: date-weekday-mismatch
layer: L3
status: stable
how_to_find: date-weekday-mismatch
requires: [dates]
severity: error

name:
  ja: 日付と曜日の食い違い
  en: Date and weekday disagree

why:
  ja: 「2026年10月1日（金）」のように、日付と曜日が食い違っていると、読み手はどちらが正しいのか確かめに行くことになります。日程を書き写すときや、年をまたいで予定を使い回すときに起きます。年を書いていない日付（メールの「10月9日（金）」）は、年を書いたすぐ前の日付（前に無ければ文書で最初のもの）から5か月以内に収まる年の日付として、暦と比べます。
  en: When a date and its weekday disagree ("Friday, 1 October 2026"), the reader has to find out which one is right. It happens when a schedule is copied, or reused for another year. A date written without its year ("Friday, October 9" in an email) is checked as the date in the year that puts it within five months of the dated date just before it (or, with none before, the first one in the document).

message:
  ja: 「{date}」は{actual}です（{written}と書いてあります）
  en: "{date} is a {actual}, not a {written}"

how_to_fix:
  ja: 日付と曜日のどちらが正しいかを確かめて、片方を直してください。
  en: Check which is right, the date or the weekday, and correct the other.

levels: { normal: error, relaxed: warning }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."

group: facts
summary:
  ja: 「2026年10月1日（金）」のように、日付と曜日が暦と合っていない所
  en: A date and its weekday that disagree, such as "Friday, 1 October 2026"
example:
  ja:
    before: 次の会議は 2026年10月1日（金）です。
    after: 次の会議は 2026年10月1日（木）です。
  en:
    before: The next meeting is on Friday, 1 October 2026.
    after: The next meeting is on Thursday, 1 October 2026.

not_flagged:
  ja: 年を書いていない日付は、文書に年を書いた日付が無いときと、年を書いた日付から5か月より離れていてどちらの年とも読めるときは、暦と照らしません。
  en: A date without its year is not checked when the document gives no date with a year, or when it is more than five months from the dated date and could be in either year.
