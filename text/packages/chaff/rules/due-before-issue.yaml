group: facts
summary:
  ja: 支払期限や締切など、後に来るはずの日付が先の日付より前の所
  en: A due date or other later date that falls before the date it must follow
example:
  ja:
    before: |
      発行日：2026年11月30日

      お支払期限：2026年11月25日
    after: |
      発行日：2026年11月30日

      お支払期限：2026年12月25日
  en:
    before: |
      Issued: November 30, 2026

      Payment due: November 25, 2026
    after: |
      Issued: November 30, 2026

      Payment due: December 25, 2026

not_flagged:
  ja: 行の頭に発行日や期限の語が無い日付（文の中の「12月25日までにお支払いください」）、年の無い日付、一行に日付が二つある行は比べません。発行日が二つあれば、最初のものと比べます。発行日から8行以上離れた期限と、期限が過ぎたことを書いた行（「期限切れ」「延滞」）は、この文書の期限ではなく報告している期限と読んで比べません。議事録として読むのは題に「議事録」などのある文書だけです。議事録では、宿題の節（見出しに「宿題」など）の外の日付、済んだ印のある宿題（升だけの「済」、括弧の中や行末の「完了」、チェック済みの箱）、前回の宿題を振り返る節、年の無い日付で年を越す期限（12月の会議の「1月10日」）は比べません。物件の案内では、「即入居可」のように日付の無い入居可能日、年の無い日付、「即入居」「即日」のある行、掲載日から40行以上離れた日付は比べません。求人では、「随時」のように日付の無い締切と年の無い日付は比べません。決算短信では、対象期間の行の無い文書、年の無い説明会の日、行の頭が「前回説明会」のように別の回を言う日、「発表日」や「説明会開催日」だけの日は比べません。健診や検査の結果では、「報告日」とだけ比べ、「発行日」や「作成日」とは比べません。受診券や検査の依頼書は、受診日や採血日より前に発行するからです。保証書では、日付の無い締切（「お早めに」）と年の無い日付は比べません。予約では、同じ日のチェックインとチェックアウト（日帰り）、同じ日のキャンセル期限、時刻だけの行（「15:00から」）、年の無い日付は比べません。「出発日」は、旅券や書類の返却日より後に来ることがあるので、貸出の日と読みません。チェックアウトとキャンセル期限、返却とチェックインのように、別の組の語どうしは比べません。法令、判決、特許、よくある質問、用語集、論文、文学、スピーチのジャンルでは止めています。契約と手引きでは動きます。保証書や規約は、その文書の日付と締切を自分で決めるからです。ローンや分割払いでは、初回お支払日を「ご契約日」とだけ比べ、「発行日」や「お申込日」とは比べません。変更や借り換えの申込書は、今の返済予定より後に申し込むからです。回収のお知らせでは、交換や返金の受付期限だけを比べ、年の無い日付と、「受付期限」「お申し込み期限」だけの締切や「発表日」「公表日」は比べません。受付を終えたお知らせは過ぎた締切を書き、懸賞の結果は締切より後に発表するからです。給与明細では、支給日を支給対象期間、計算期間、対象期間の終わりとだけ比べ、同じ日の支給日と年の無い日付は比べません。出張では、帰着を出発とだけ比べ、同じ日の帰着（日帰り）と年の無い日付は比べません。「返却日」は帰着と読みません。旅の案内では、書類の返却日が出発日より前に来るからです。発注書や納品書では、納期、納品日、納入日を発注日、注文日、受注日とだけ比べ、同じ日の納品と年の無い日付は比べません。「納期限」は納期と読みません。成績証明書では、卒業や修了の日を入学の日（入学年月日、入学日）と、発行日と証明日を卒業や修了の日とだけ比べ、入学の日と発行日は比べません。同じ日と年の無い日付も比べません。組の先の日付と後の日付がどちらも何行もある文書（学歴の表のように一行に一件ずつ書いたもの）では、後の日付を、いちばん近くに書いた先の日付より前のときだけ指します。一度だけ書いた後の日付（記録の下の発行日）は、最初の先の日付と比べます。給与所得と源泉徴収税額の明細書では、「交付日」を対象期間の終わりと退職日とだけ比べ、同じ日と年の無い日付は比べません。「発行日」は交付日と読みません。前払いの請求書は対象期間の初めに発行し、退職の手続きの案内は退職日より前に発行するからです。梱包明細書やインボイスでは、到着日と到着予定日を船積日とだけ比べ、「請求日」とは比べません。インボイスの日付は、船積みの前にも後にも来るからです。予定の日（到着予定日）は後に来る側にだけ読み、同じ日と年の無い日付は比べません。診療明細書では、「発行日」を「診療日」とだけ比べ、「受診日」とは比べません。受診券は受診日より前に発行するからです。入院では、退院日を入院日とだけ比べ、同じ日の退院と年の無い日付は比べません。賃貸借では、退去日、明渡日、退去予定日を、入居日や入居開始日と、解約通知日や解約予告日とそれぞれ比べ、同じ日と年の無い日付は比べません。予定の日（退去予定日）は後に来る側にだけ読み、「入居予定日」は入居日と読みません。空室の案内の入居予定日は、前の借主の退去日より後に来るからです。車の整備では、次回点検日、次回点検予定日、次回車検を、整備日、入庫日、点検日、作業日とだけ比べ、同じ日と年の無い日付は比べません。「前回点検日」は後に来る側に読みません。前の点検は今回の整備より前に来るからです。健診の「検査日」や「報告日」とは組みません。工事では、完工日、完工予定日、竣工日、竣工予定日、引渡日を、着工日、工事開始日、着工予定日とだけ比べ、同じ日と年の無い日付は比べません。サービスの利用期間では、ご利用終了日、利用終了日、契約終了日、サービス終了日を、ご利用開始日、利用開始日、契約開始日、サービス開始日とだけ比べ、同じ日と年の無い日付は比べません。「開始日」「終了日」だけの語は組みません。工程表や作業の記録も使うからです。「契約日」は契約開始日と読みません。価格表や証書では、適用終了日、有効終了日、有効期限を、適用開始日、有効開始日、発効日とだけ比べ、同じ日と年の無い日付は比べません。「有効期限」は、これまでどおり発行日とも別の組として比べます。明細では、照会終了日、対象期間終了日、期間終了日を、照会開始日、対象期間開始日、期間開始日とだけ比べ、同じ日と年の無い日付は比べません。「対象期間開始日」は、期間を書く「対象期間」と読みません。保険金の請求では、事故日、事故発生日、発生日、受傷日、発病日を、請求日、請求書作成日、申請日とだけ比べ、同じ日と年の無い日付は比べません。会計報告書では、監査日、会計監査日、監査実施日を、会計年度と事業年度の終わりとだけ比べ、同じ日、年の無い期間、期間を書いていない年度（「2025年度」）は比べません。「承認日」「総会承認日」「報告日」は年度の終わりと比べません。予算書は年度が始まる前に承認し、中間の報告は年度の途中に出すからです。行の頭に語の無い監査や承認の日（署名の行の日付、文の中の「定期総会で承認」）も比べません。
  en: A date without a word at the head of its line (a due date in a sentence), a date without its year, and a line with two dates are not compared. With two issue dates, the first is used. A due date eight lines or more from the issue date, and a line that says the deadline has passed (overdue, expired), are read as reporting on a deadline rather than setting this document's own, and are not compared. Only a document whose title names it as minutes (Minutes, Meeting notes) is read as minutes. In minutes, a date outside an action-items section (a heading with Action items or the like), an item marked done (a Done cell, done in brackets or at the end of the line, a checked box), a section reviewing the previous meeting's items, and a deadline without a year that falls early in the next year (Jan 10 at a December meeting) are not compared. In a listing, a move-in date without a date (Available now), a date without its year, a line saying immediately, and a date forty lines or more from the listing date are not compared. In a job posting, a deadline without a date (Open until filled) and a date without its year are not compared; a bare "Posted" pairs only with an application deadline, not with the dates of a blog post or release notes. In an earnings release, a document without a reporting period line, a call date without its year, a line naming another call (Previous call) and a bare "Release date" or "Conference call" are not compared. In a checkup or lab report, only a report date (Report date, Date reported) is compared, not a bare "Issue date", since an admission ticket or a lab order is issued before the test or collection date it names. In a warranty, a deadline without a date, a date without its year, and "Register by" followed directly by the date without a colon are not compared. In a booking, a same-day check-in and check-out (a day use), a cancellation deadline on the check-in day, a line with only a time (from 3:00 PM) and a date without its year are not compared; a bare "Return" is not read as a drop-off, since an order's return window uses it too. Words of different pairs are not compared either (a check-out and a cancellation deadline, a drop-off and a check-in). It is off for statutes, judgments, patents, FAQs, glossaries, and the academic, literature and speech genres. It runs on contracts and manuals, which set their own dates and deadlines, as a warranty does. In a loan or an installment plan, a first payment date is compared only with the contract date (Contract date, Agreement date), not with the issue date or an application date, since a change or refinancing form is signed after the current schedule began. In a recall notice, only a replacement, refund or exchange deadline is compared; a date without its year and a bare "Requests accepted until" or "Deadline for requests" are not, since a notice that a window has closed states the deadline that has passed. In a payslip, a pay date is compared only with the end of the pay period; a pay date on the period's last day and a date without its year are not compared. In a trip, a return is compared only with the departure; a same-day return (a day trip) and a date without its year are not compared, and a "Return date" is not read as the trip's return, since a guide's return date for forms comes before the departure. In a purchase order or a delivery note, a delivery date is compared only with the order date (Order date, PO date); a same-day delivery and a date without its year are not compared, and a bare "Due date" is not read as a delivery date, since an invoice uses it for the payment due date. In a transcript, a graduation or completion date is compared only with the enrolment date (Date of enrolment, Date of admission), and the issue date only with the graduation or completion date, never with the enrolment date; a same-day date and a date without its year are not compared. Where both dates of a pair are written on several lines (an education history listing one school per row), a later date is pointed out only when it is also before the earlier date written closest to it; a later date written once (an issue date below the records) is compared with the first. In a tax statement, the issue date (Issue date, Date of issue) is compared only with the end of the tax year (Tax year) and the leaving date (Leaving date, Date of leaving); a same-day date and a date without its year are not compared, and a "Period covered" is not read as the tax year, since an invoice billed in advance is issued at the start of the period it covers. In a packing list or a commercial invoice, an arrival date (Arrival date, Estimated arrival, ETA) is compared only with the shipment date (On-board date, Shipment date), never with the invoice date, since an invoice may be dated before or after shipment; an estimated date is read only as the later side, and a same-day arrival and a date without its year are not compared. In a medical bill, the issue date (Date issued) is compared only with the date of visit; a same-day issue and a date without its year are not compared. In a hospital stay, a discharge date is compared only with the admission date; a same-day discharge is not reported, and a "Date of admission" is compared with a discharge date and with a graduation date as two separate pairs. In a tenancy, a move-out date (Move-out date, Planned move-out date) is compared with the move-in date and, separately, with the notice date (Notice date, Date of notice); a same-day date and a date without its year are not compared, a planned date is read only as the later side, and a "Planned move-in date" is not read as the move-in date, since a vacancy notice's planned move-in comes after the previous tenant's move-out. In a car's service record, the next inspection (Next inspection, Next inspection due, Next service due) is compared only with the service date (Service date, Date of service); a same-day date and a date without its year are not compared, and a "Last inspection date" is not read as the later side, since the last inspection comes before this service. A lab report's "Test date" or "Report date" is not paired with it. In a construction or renovation document, a completion or handover date (Completion date, Expected completion, Handover date) is compared only with the start (Work start, Construction start, Start date); a same-day date and a date without its year are not compared. A bare "Start date" is compared with a completion date only, never with a "Handover date", since it also heads a new hire's first day, and a handover can come before that; a transcript's "Date of completion" is not read as the end of the works. In a service period, the end date (Service end date, End of service, Contract end date) is compared only with the start date (Service start date, Start of service, Contract start date); a same-day end and a date without its year are not compared, and a bare "Start date" or "End date" is not read, since a project plan or a timesheet uses them too. In a price list, a coupon or a policy, the end of the validity (Valid until, Valid to, Expiry date, Expires) is compared only with its start (Valid from, Effective date, Effective from); a same-day date and a date without its year are not compared, and "Expires" is read only at the head of a line followed by a colon or the date, not in a sentence (your password expires). "Valid until" and "Expires" are still compared with the issue date, as a separate pair. In a statement whose period is written as two lines, the end (Period end, Statement period end) is compared only with the start (Period start, Statement period start); a same-day date and a date without its year are not compared. In an insurance claim, the incident date (Date of incident, Date of loss, Incident date, Date of injury) is compared only with the claim date (Date of claim, Claim date); a same-day claim and a date without its year are not compared. In a treasurer's report, an audit date (Audited, Date audited, Audit date, Date of audit) is compared only with the end of the fiscal or financial year; a same-day date, a period without its year and a year written without its dates (Financial year 2025–26) are not compared. An approval or report date (Approved, Report date) is not compared with the year's end, since a budget is approved before its year begins and an interim report is dated inside the year. An audit or approval date without a word at the head of its line (the date on a signature line, an approval at the annual general meeting in a sentence) is not compared either.
