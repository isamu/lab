id: due-before-issue
layer: L3
status: stable
how_to_find: due-date
# The issue-date and due-date words come from the language's issue-date-label and due-date-label lexicons; the words of
# minutes from minutes-title-word, meeting-date-label, action-section-heading, earlier-section-word, action-due-label and item-done-word;
# the other pairs of dates that must come in order (a listing date and a move-in date, a posting date and an application
# deadline, an earnings call and the reporting period, an examination and its report, a purchase and its registration
# deadline, a recall notice and its request deadline, a loan contract and its first payment, check-in and check-out, a
# rental's pick-up and drop-off, a booking's cancellation deadline and its start, a payslip's pay date and its pay period,
# a trip's departure and return, an order and its delivery, a transcript's enrolment, graduation and issue dates, a tax
# statement's issue date and the end of its tax year or the leaving date, a shipment and its arrival, a medical visit
# and its bill's issue date, a hospital admission and discharge, a tenancy's move-in, notice and move-out, a car's
# service date and its next inspection, a construction start and its completion or handover, a service's or a contract's start and end dates, a price list's or a policy's validity start and end, a statement's period
# start and end, a financial year and its audit) from
# dated-pair-label and date-now-word,
# the column headers of a table whose rows each hold both dates of a pair (a points statement's earning date and
# expiry) from dated-pair-label and the header-only dated-column-label,
# and the words whose line states
# a period, compared by its end, from dated-span-label.
# An insurance claim's date and the incident it claims for are a pair in dated-pair-label too.
requires: [dates]
languages: [ja, en]
severity: error

name:
  ja: 期限が発行日より前
  en: A due date before the issue date

why:
  ja: 請求書の「お支払期限」や見積書の「有効期限」が「発行日」より前だと、受け取った時点で期限が過ぎていることになり、読み手はどちらの日付が正しいのかを問い合わせることになります。前の月の請求書を使い回して、片方の日付だけ直したときに起きます。発行日の語で始まる行と期限の語で始まる行の日付を比べ、期限が発行日より前なら指します。議事録の宿題も同じで、会議の日（日時）より前の期限は、会議の時点で過ぎています。宿題の節の、期限の列の日付や「（期限 11月2日）」を、頭の方の「日時」の日付と比べます。物件の案内の「入居可能日」も同じで、「掲載日」や「情報公開日」より前の入居可能日は、載せた時点で過ぎています。求人の「応募締切」も同じで、「掲載日」や「募集開始日」より前の締切は、載せた時点で過ぎています。決算短信の「決算説明会」も同じで、「対象期間」が終わる前の説明会では、まだ締まっていない期間の業績を説明することになります。対象期間のように期間を書く行は、その終わりの日と比べます。健診や検査の結果も同じで、「受診日」や「採血日」より前の「報告日」では、受ける前の結果を報告することになります。保証書の「登録の締切」も同じで、「お買い上げ日」より前の締切は、買った時点で過ぎています。宿泊やレンタカーの予約も同じで、「チェックイン」より前の「チェックアウト」、「貸出」より前の「返却」は、泊まる前に発ち、借りる前に返すことになります。「無料キャンセル期限」がチェックインや貸出より後なら、泊まり始めてからでも無料で取り消せることになり、どちらかの日付が違っています。二つの日付は、後に書いた方の行で指します。前後の決まった日付の組は、言語の語彙表に組ごとに書いてあります。ローンや分割払いの「初回お支払日」も同じで、「ご契約日」より前の初回は、契約した時点で過ぎています。製品の回収のお知らせも同じで、「お知らせ日」より前の交換や返金の「受付期限」は、知らせた時点で過ぎています。給与明細の「支給日」も同じで、「支給対象期間」や「計算期間」が終わる前の支給日では、まだ働き終えていない期間の給与を払うことになります。出張の精算書の「帰着」も同じで、「出発」より前の帰着では、発つ前に帰ったことになります。発注書や納品書の「納期」や「納品日」も同じで、「発注日」や「注文日」より前の納期では、頼む前に届いたことになります。成績証明書や卒業・修了の証明書も同じで、「入学年月日」より前の「卒業年月日」や「修了年月日」では入学する前に卒業したことになり、卒業や修了の日より前の「発行日」や「証明日」では、まだ卒業していない人の卒業を証明することになります。給与所得と源泉徴収税額の年間の明細書も同じで、「対象期間」が終わる前や「退職日」より前の「交付日」では、まだ締まっていない年の金額を証明することになります。梱包明細書やインボイスも同じで、「船積日」より前の「到着日」や「到着予定日」では、積む前に着くことになります。診療明細書や領収書も同じで、「診療日」より前の「発行日」では、まだ受けていない診療の代金を受け取ったことになります。入院の明細も同じで、「入院日」より前の「退院日」では、入院する前に退院したことになります。賃貸借の敷金精算書も同じで、「入居日」より前の「退去日」では入居する前に退去したことになり、「退去日」より後の「解約通知日」では、退去してから解約を知らせたことになります。車の整備記録も同じで、「整備日」や「点検日」より前の「次回点検日」や「次回車検」では、次の点検の日が整備した時点で過ぎています。工事やリフォームの見積書も同じで、「着工日」より前の「完工予定日」や「引渡日」では、始める前に工事が終わったことになります。携帯電話やサービスの契約の利用期間も同じで、「ご利用開始日」や「契約開始日」より前の「ご利用終了日」や「契約終了日」では、始まる前に終わったことになります。価格表やクーポンも同じで、「適用開始日」や「発効日」より前の「適用終了日」や「有効期限」では、始まる前に終わることになります。取引明細の期間を二つの行に分けて書いたときも同じで、「照会開始日」や「期間開始日」より前の「照会終了日」や「期間終了日」では、期間が始まる前に終わることになります。保険金や給付金の請求書も同じで、「事故日」や「発病日」より前の「請求日」では、起きる前の事故や病気の保険金を請求することになります。会計報告書や収支決算報告書も同じで、「会計年度」が終わる前の「監査日」では、まだ締まっていない年度の会計を監査したことになります。ポイントの明細のように、一つの表の見出しに組の二つの列（「ご利用日」と「有効期限」）があれば、行ごとに二つの日付を比べます。ご利用日より前の有効期限では、得た時点でポイントが失効しています。別の行や別の表の日付とは比べません。
  en: When the payment due date of an invoice or the expiry of a quote is before its issue date, the document is overdue on arrival and the reader has to ask which date is right. It happens when last month's invoice is reused and only one date is changed. The date on a line starting with an issue word (Issued, Invoice date) is compared with the date on a line starting with a due word (Payment due, Valid until), and an earlier due date is pointed out. Minutes are read the same way. An action item due before the meeting it was set in is overdue when it is written down. The dates in the due column, or after "due" in a list item, of an action-items section are compared with the date on the "Date" line near the top. A property listing is read the same way. An "Available from" date before the "Listed" date has passed when the listing goes up. A job posting is read the same way. An "Application deadline" before the "Posted" date has passed when the posting goes up. An earnings release is read the same way. An "Earnings call" before the "Reporting period" ends would discuss results for a period that has not closed; a line stating a period is compared by the period's last day. A checkup or lab report is read the same way. A "Report date" before the "Examination date" or the "Collection date" reports results that did not exist yet. A product warranty is read the same way. A "Registration deadline" before the "Purchase date" has passed when the product is bought. A hotel or car rental booking is read the same way. A "Check-out" before the "Check-in", or a "Drop-off" before the "Pick-up", leaves before arriving; a "Free cancellation until" date after the check-in or the pick-up lets the booking be cancelled free once it has started, so one of the dates is wrong. The finding is on whichever of the two dates is written second. The pairs of dates that must come in order are listed, pair by pair, in the language's vocabulary. A loan or an installment plan is read the same way. A "First payment date" before the "Contract date" has passed when the contract is signed. A recall notice is read the same way. A deadline for replacement or refund requests before the "Notice date" has passed when the notice goes out. A payslip is read the same way. A "Pay date" before the "Pay period" ends pays for work not yet done. A trip or an expense report is read the same way. A "Return" before the "Departure" comes back before leaving. A purchase order or a delivery note is read the same way. A "Delivery date" before the "Order date" delivers goods not yet ordered. An academic transcript or a certificate of graduation or completion is read the same way. A "Date of graduation" or "Date of completion" before the "Date of enrolment" ends the course before it began, and a "Date of issue" before the graduation or completion date certifies a graduation that has not happened yet. An annual earnings and tax withholding statement is read the same way. An "Issue date" before the "Tax year" ends, or before the "Leaving date", states the year's amounts before they are final. A packing list or a commercial invoice is read the same way. An "Arrival date" or "Estimated arrival" before the "On-board date" arrives before the goods are shipped. An itemized medical bill is read the same way. A "Date issued" before the "Date of visit" bills a visit that has not happened yet, and a "Date of discharge" before the "Date of admission" leaves hospital before arriving. A tenancy's deposit settlement is read the same way. A "Move-out date" before the "Move-in date" leaves before moving in, and a "Notice date" after the "Move-out date" gives notice once the tenant has already left. A car's service record is read the same way. A "Next inspection due" before the "Service date" has passed when the car is serviced. A construction or renovation quote is read the same way. A "Completion date" or "Handover date" before the "Start date" or "Construction start" finishes the work before it begins. A phone bill or a service contract is read the same way. A "Service end date" or "Contract end date" before the "Service start date" or "Contract start date" ends the service before it began. A price list, a coupon or a policy is read the same way. A "Valid until" or an "Expiry date" before the "Valid from" or the "Effective date" ends before it begins. A bank statement whose period is written as two lines is read the same way. A "Period end" before the "Period start" ends the period before it begins. An insurance or benefit claim is read the same way. A "Date of claim" before the "Date of incident" claims for a loss that has not happened yet. A treasurer's report or an income and expenditure statement is read the same way. An audit date before the "Fiscal year" or the "Financial year" ends audits accounts that have not closed. When one table's header names both columns of a pair, as a points statement's "Date" and "Expires" do, the two dates of each row are compared. Points that expire before the date they were earned have lapsed on arrival. A row is never compared with another row or another table.

message:
  ja: 期限（{due}）が、発行日（{issued}）より前です
  en: "The due date {due} is before the issue date {issued}"

messages:
  meeting:
    ja: 宿題の期限（{due}）が、会議の日（{meeting}）より前です
    en: "The action item's due date {due} is before the meeting date {meeting}"
  order:
    ja: 「{later_label}」（{later}）が、「{earlier_label}」（{earlier}）より前です
    en: '"{later_label}" {later} is before "{earlier_label}" {earlier}'
  period:
    ja: 「{later_label}」の {later} が、「{earlier_label}」の終わり {earlier} より前です
    en: '"{later_label}" {later} is before the end of the "{earlier_label}", {earlier}'

how_to_fix:
  ja: 発行日と期限のどちらが正しいかを確かめて、片方を直してください。
  en: Check which is right, the issue date or the due date, and correct the other.

levels: { normal: error, relaxed: warning }

