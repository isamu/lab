id: preferred-term
layer: L2
status: experimental
how_to_find: preferred-term
word_list: preferred-term
severity: warning

name:
  ja: チームの表記と違う
  en: Not the team's spelling

why:
  ja: 同じものを「サーバー」とも「サーバ」とも書くと、読み手は別のものかと迷い、検索でも片方を取りこぼします。どちらに寄せるかはチームごとに違うので、chaff.yaml の prefer に「使わない書き方」と「使う書き方」の組を自分で並べてください。並べていなければ何も言いません。
  en: Writing the same thing two ways ("e-mail" and "email") makes a reader wonder whether they differ, and a search misses one of them. Which way wins is the team's choice, so list pairs (the spelling to avoid, then the one to use) under `prefer` in chaff.yaml. With nothing listed, this rule says nothing.

message:
  ja: 「{matched}」は「{preferred}」と書きます
  en: 'Write "{preferred}", not "{matched}"'

how_to_fix:
  ja: 「{preferred}」に直してください。固有名詞など、そのままにすべき箇所なら stet で理由を添えて黙らせます。
  en: Change it to "{preferred}". Where it must stay (a product's own name, a quotation), silence it with stet and the reason.

# chaff explain と規則の一覧には指摘が無いので、{preferred} をこう読ませる。
placeholders:
  preferred:
    ja: prefer に並べた使う書き方
    en: the spelling listed under prefer

# チームが並べた書き方なので、1 つでも指摘する。並べた時点で「使わない」と決めている。
levels: { strict: 1, normal: 1, relaxed: 3 }

use_for: [business, blog, technical, legal, docs, academic, literature, speech]

group: team
summary:
  ja: チームで決めた表記と違う書き方（「サーバー」と決めたのに「サーバ」と書いた、など）。chaff.yaml の prefer に書いた組だけを見ます
  en: A spelling the team has chosen not to use ("e-mail" where the team writes "email"), from prefer in chaff.yaml
example:
  ja:
    config: { prefer: { サーバ: サーバー } }
    before: 新しいサーバを来週入れます。
    after: 新しいサーバーを来週入れます。
  en:
    config: { prefer: { e-mail: email } }
    before: Please send it by e-mail.
    after: Please send it by email.

not_flagged:
  ja: chaff.yaml の prefer に書いた組だけを見ます。何も書かなければ何も言いません。
  en: Only the pairs under prefer in chaff.yaml are checked. With nothing listed, it says nothing.
level_meaning:
  ja: 当てはまる語が {limit} 箇所あれば指摘
  en: reported once there are {limit}
