id: hyphen-as-dash
layer: L1
status: stable
how_to_find: hyphen-dash
languages: [en]
severity: info

name:
  ja: ダッシュの代わりのハイフン
  en: Hyphen used as a dash

why:
  ja: 英語で、空白で挟んだハイフン（late - very late）や二つ重ねたハイフン（late--very late）は、ダッシュ（— や –）の代わりです。ハイフンは語をつなぐ印なので、読み手は一瞬、語の一部かと迷います。
  en: A spaced hyphen ("late - very late") or a double hyphen ("late--very late") stands in for a dash (— or –). A hyphen joins words, so the reader stops for a moment to see whether it is part of one.

message:
  ja: 「{matched}」をダッシュの代わりに使っています
  en: '"{matched}" stands in for a dash'

how_to_fix:
  ja: ダッシュ（— か –）にするか、読点やコロンで書き直してください。
  en: Use a dash (— or –), or rewrite with a comma or a colon.

levels: { strict: 1, normal: 1, relaxed: 3 }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: 'Older printed texts set the dash as "--" and titles in capitals.'

group: slips
summary:
  ja: 英語で、ダッシュの代わりに、空白で挟んだハイフンや二重のハイフンを使った所
  en: A spaced hyphen or a double hyphen standing in for a dash
example:
  en:
    before: |
      The release is late - very late.
    after: |
      The release is late — very late.

not_flagged:
  ja: "語と語のあいだのものだけを見ます。箇条書きの印の「- 」、数の範囲（1 - 2）、語の中のハイフン（well-known）、コードは見ません。番号の付いたまとまりの見出しで、番号と題を分けるハイフン（PART I - THE AGENCIES GENERALLY）も見ません。ダッシュの字（— や –）を一つも使わない文書の「--」は、その文書のダッシュの打ち方（文字だけの規格文書、Markdown で -- をダッシュにする書き方）なので見ません。写したものの中の区切りも見ません。印刷どおりに引いた札や掲示の、大文字の前のハイフン（“Unhelpful - Post needs no note”）、番号の付いた文献の一覧の行（[12] … My robot friend - a study）、項目の値の短い名前（Category の後ろの Office Space - Monthly）、ログやボットの行（URL、exit_code=99、sre.mediawiki.restart を含む行、<bot> で始まる行）、文字として見えている HTML のタグです。文学の文書では既定で止めています（古い版がダッシュを「--」で組むため）。"
  en: 'Only between words. A list marker ("- "), a number range ("1 - 2"), a hyphen inside a word ("well-known") and code are not reported. Nor is the hyphen that sets a numbered division''s label apart from its title in a heading ("PART I - THE AGENCIES GENERALLY"). Nor is "--" in a document that sets no dash as a character (— or –), where it is how the document types its dash, as plain-text standards and Markdown typographers do. Nor is a separator in copied text: before a capital inside a quotation that reproduces a label or a sign ("Unhelpful - Post needs no note"), in a numbered reference entry ([12] … My robot friend - a study), in a short name given as a field''s value (Office Space - Monthly after Category and a colon), in a log or bot line (one that holds an address, a setting such as exit_code=99 or a dotted name such as sre.mediawiki.restart, or starts with <bot>), and inside an HTML tag shown as text. The literature presets turn it off, since older printed texts set the dash as "--".'
level_meaning:
  ja: "{limit} 箇所あれば指摘"
  en: reported once there are {limit}
rewrite:
  depth: light
  en:
    direction: Replace the spaced or doubled hyphen with a dash, or rewrite the sentence with a comma or a colon. Use the dash the document already uses, if any.
    pairs:
      - before: The release is late - very late.
        after: The release is late — very late.
      - before: Two teams--sales and support--will attend.
        after: Two teams (sales and support) will attend.
    keep:
      - the words on both sides
    avoid:
      - adding more dashes than the sentence had hyphens
