id: empty-intensifier
layer: L2
status: stable
how_to_find: phrase-match
word_list: empty-intensifier
uses: [pos]
severity: warning

name:
  ja: 空虚な強調
  en: Empty intensifier

why:
  ja: 「非常に重要」は、何がどう重要なのかを言っていません。強調した気になるだけです。
  en: '"Extremely important" does not say what matters or why. It only feels emphatic.'

message:
  ja: 「{matched}」は、中身を言わずに強調だけしています
  en: '"{matched}" emphasises without saying anything'

how_to_fix:
  ja: 何がどう重要なのかを書いてください。書けないなら、その一文は落とせます。
  en: Say what matters and why. If you cannot, the sentence can go.

levels:
  strict: 1
  normal: 1
  relaxed: 3

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: wording
summary:
  ja: 「非常に重要」「言うまでもなく」のように、何が大事かを言わずに強めるだけの言い方
  en: Phrases such as "extremely important" that add weight without saying what matters
example:
  ja:
    before: 期限を守ることは非常に重要です。
    after: 期限に遅れると、先方の検収が翌月に回り、入金が一か月遅れます。
  en:
    before: It is important to note that the deadline is Friday.
    after: The deadline is Friday; a late delivery pushes payment into next month.

not_flagged:
  ja: 一覧にある言い回しだけを見ます。「重要です」と書いたあとに理由が続くかどうかは読みません。
  en: Only the phrases on chaff's list are checked; whether a reason follows is not read.
level_meaning:
  ja: 当てはまる言い回しが {limit} 箇所あれば指摘
  en: reported once there are {limit}
rewrite:
  depth: light
  ja:
    direction: 強める語（「非常に」「言うまでもなく」）を消し、何がどう大事なのかが本文にあれば、それを主語と述語で書いてください。無ければ書き手に聞きます。
    pairs:
      - before: 言うまでもなく、バックアップは非常に重要で、消えたデータは戻りません。
        after: バックアップが無いと、消えたデータは戻りません。
      - before: この変更は極めて重要です。料金が月額から従量制に変わります。
        after: この変更で、料金が月額から従量制に変わります。
    keep:
      - なぜ大事なのかを書いた部分
    avoid:
      - 強める語を別の強める語（「とても」「きわめて」）に替える
      - 大事な理由を作る
  en:
    direction: Delete the intensifier ("extremely", "needless to say") and, if the text says why the thing matters, say that instead. If it does not, ask the writer.
    pairs:
      - before: Needless to say, backups are extremely important, because lost data cannot be recovered.
        after: Without a backup, lost data cannot be recovered.
      - before: This change is critically important. Billing moves from monthly to usage-based.
        after: With this change, billing moves from monthly to usage-based.
    keep:
      - the part that says why it matters
    avoid:
      - swapping one intensifier for another ("very", "truly")
      - inventing a reason it matters
