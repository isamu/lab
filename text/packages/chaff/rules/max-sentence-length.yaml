id: max-sentence-length
layer: L1
status: stable
how_to_find: sentence-length
severity: info

name:
  ja: 一文が長すぎる
  en: Sentence too long

why:
  ja: 長い文は、読んでいるうちに主語を見失います。
  en: In a long sentence the reader loses the subject before reaching the verb.

message:
  ja: この文は {count} 文字あります（{limit} 文字まで）
  en: "This sentence runs {count} {count|word|words} (limit {limit})"

# 文書と違う言語で書いた文。和文の中の英文は語で、英文の中の和文は文字で数え、その言語の段と比べる。
messages:
  embedded-en:
    ja: この英文は {count} 語あります（{limit} 語まで）
    en: "This English sentence runs {count} {count|word|words} (limit {limit})"
  embedded-ja:
    ja: この和文は {count} 文字あります（{limit} 文字まで）
    en: "This Japanese sentence runs {count} {count|character|characters} (limit {limit})"

how_to_fix:
  ja: 接続助詞のところで 2 文に割ってください。それだけで読めるようになります。
  en: Split it in two at the conjunction.

# 単位は adapter の lengthUnit。日本語は文字、英語は語。spec §7。
levels:
  ja: { strict: 70, normal: 100, relaxed: 140 }
  en: { strict: 18, normal: 25, relaxed: 35 }

# ジャンルで読まれかたが違う。社内メールの 1 文と随筆の 1 文に同じ上限を課すと、どちらかが必ず間違う。
# 技術文書・ブログ・ビジネス文書・説明書の normal は、人の書いた文書で測って置いた（spec §21.1、yarn rules:measure）。
# 既定の上限では group の文書の大半に出て、group ごと止まっていた。いまは過半を十分下回るが、info で出る線は超える。
by_genre:
  technical:
    ja: { strict: 100, normal: 140, relaxed: 180 }
    en: { strict: 30, normal: 40, relaxed: 50 }
  blog:
    ja: { strict: 120, normal: 160, relaxed: 200 }
    en: { strict: 30, normal: 40, relaxed: 50 }
  blog/essay:
    ja: { strict: 140, normal: 180, relaxed: 220 }
    en: { strict: 35, normal: 45, relaxed: 55 }
  business:
    ja: { strict: 100, normal: 140, relaxed: 180 }
    en: { strict: 35, normal: 45, relaxed: 55 }
  # メールは短く書く。spec §9 の初期値のまま、他のビジネス文書より上限を低く置く。
  business/email:
    ja: { strict: 50, normal: 70, relaxed: 100 }
    en: { strict: 12, normal: 18, relaxed: 25 }
  docs:
    ja: { strict: 100, normal: 140, relaxed: 180 }
    en: { strict: 30, normal: 40, relaxed: 50 }
  # 法令・契約・判決・論文は、長い一文がその種類の書き方。corpus のその種類の文書で、normal が最も長い一握りの文だけを指すように測って置いた。
  # 法務は、この上限でも文書の過半に出るので既定では動かない（genres.yaml）。
  legal:
    ja: { strict: 120, normal: 200, relaxed: 300 }
    en: { strict: 40, normal: 60, relaxed: 80 }
  legal/statute:
    ja: { strict: 200, normal: 300, relaxed: 450 }
    en: { strict: 80, normal: 130, relaxed: 180 }
  legal/judgment:
    ja: { strict: 250, normal: 350, relaxed: 450 }
  # 英語の定義は、限定を重ねた名詞句の一文になる。英語の用語集で測り、normal が列挙を詰めた定義や長い注記だけを指すように置いた。
  # 日本語は説明書の上限のまま。
  docs/glossary:
    en: { strict: 40, normal: 50, relaxed: 60 }
  academic:
    ja: { strict: 100, normal: 140, relaxed: 180 }
    en: { strict: 35, normal: 50, relaxed: 65 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."
  legal: measured by yarn rules:measure
sources: [shibasaki-tamaoka-2010, yasashii-nihongo-2020, koyobun-2022, gov-uk-clear-language]

group: readability
summary:
  ja: 読み終える前に主語を見失うほど長い一文
  en: A sentence so long that the reader loses the subject before the verb
example:
  ja:
    before: |
      新しい料金体系は先週の会議で営業部から提案があったもので来月から試験的に導入することになりましたが、既存の顧客への説明のしかたと請求システムを直す時期がまだ決まっておらず、社内の手引きを書き直す人もまだ決まっていないため、担当者を決めたうえで今週中に進め方を相談したいと考えています。
    after: |
      新しい料金体系を、来月から試験的に導入します。既存の顧客への説明のしかたと、請求システムを直す時期はまだ決まっていません。社内の手引きを書き直す人も未定です。今週中に担当者を決め、進め方を相談します。
  en:
    before: |
      The new pricing, which the sales team proposed at last week's meeting, will be trialled from next month, but because we have not yet decided how to explain it to existing customers or when to change the billing system, we would like to agree on a plan this week.
    after: |
      The new pricing will be trialled from next month. We have not yet decided how to explain it to existing customers, or when to change the billing system. We will agree on a plan this week.

not_flagged:
  ja: 見出し、表のセル、コードは数えません。法令や論文のように長い一文が普通の種類では、ジャンルが上限を長くします。
  en: Headings, table cells and code are not counted. Genres where long sentences are normal (statutes, papers) raise the limit.
level_meaning:
  ja: 一文 {limit} 字まで
  en: up to {limit} words in a sentence
rewrite:
  depth: light
  ja:
    direction: 接続助詞（〜が、〜ので、〜し）か「、そして」の所で二文に割り、二文目にも主語を書いてください。
    pairs:
      - before: 申請書は総務部に提出しますが、期限を過ぎた場合は翌月の扱いになり、その場合は再申請が必要になります。
        after: 申請書は総務部に提出します。期限を過ぎた申請は翌月の扱いになり、再申請が必要です。
      - before: 新しい端末は来週届く予定なので、それまでは今の端末を使い、届いたら情報システム部が設定します。
        after: 新しい端末は来週届く予定です。それまでは今の端末を使います。届いた端末は情報システム部が設定します。
    keep:
      - 条件と例外（「〜の場合」）と、それが掛かる先
    avoid:
      - 割るときに条件を別の文へ移して、掛かる先を変える
      - 長い修飾を削って中身を落とす
  en:
    direction: Split the sentence at a conjunction (and, but, so, which) and give the second sentence its own subject.
    pairs:
      - before: Submit the form to the office, but if you miss the deadline it moves to the next month, in which case you have to apply again.
        after: Submit the form to the office. A form that misses the deadline moves to the next month and has to be submitted again.
      - before: The new laptops arrive next week, so keep using the old ones until then, and IT will set the new ones up when they come.
        after: The new laptops arrive next week. Keep using the old ones until then. IT will set the new ones up when they come.
    keep:
      - conditions and exceptions ("if", "unless") and what they apply to
    avoid:
      - moving a condition into another sentence so that it applies to something else
      - dropping content to make the sentence shorter
