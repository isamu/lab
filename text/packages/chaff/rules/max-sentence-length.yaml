id: max-sentence-length
layer: L1
status: stable
how_to_find: sentence-length
severity: warning

name:
  ja: 一文が長すぎる
  en: Sentence too long

why:
  ja: 長い文は、読んでいるうちに主語を見失います。
  en: In a long sentence the reader loses the subject before reaching the verb.

message:
  ja: この文は {count} 文字あります（{limit} 文字まで）
  en: "This sentence runs {count} {count|word|words} (limit {limit})"

# 文書と違う言語で書いた文。和文の中の英文は語で、英文の中の和文は文字で数え、その言語の段と比べる。
messages:
  embedded-en:
    ja: この英文は {count} 語あります（{limit} 語まで）
    en: "This English sentence runs {count} {count|word|words} (limit {limit})"
  embedded-ja:
    ja: この和文は {count} 文字あります（{limit} 文字まで）
    en: "This Japanese sentence runs {count} {count|character|characters} (limit {limit})"

how_to_fix:
  ja: 接続助詞のところで 2 文に割ってください。それだけで読めるようになります。
  en: Split it in two at the conjunction.

# 単位は adapter の lengthUnit。日本語は文字、英語は語。spec §7。
levels:
  ja: { strict: 70, normal: 100, relaxed: 140 }
  en: { strict: 18, normal: 25, relaxed: 35 }

# ジャンルで読まれかたが違う。spec §9 の初期値。
# 社内メールの 1 文と随筆の 1 文に同じ上限を課すと、どちらかが必ず間違う。
by_genre:
  business/email:
    ja: { strict: 50, normal: 70, relaxed: 100 }
    en: { strict: 12, normal: 18, relaxed: 25 }
  business/meeting-notes:
    ja: { strict: 60, normal: 80, relaxed: 110 }
    en: { strict: 14, normal: 20, relaxed: 28 }
  business/proposal:
    ja: { strict: 65, normal: 90, relaxed: 125 }
    en: { strict: 16, normal: 22, relaxed: 30 }
  business/press-release:
    ja: { strict: 65, normal: 90, relaxed: 125 }
    en: { strict: 16, normal: 22, relaxed: 30 }
  blog/essay:
    ja: { strict: 100, normal: 140, relaxed: 180 }
    en: { strict: 25, normal: 35, relaxed: 45 }
  blog/owned-media:
    ja: { strict: 65, normal: 90, relaxed: 125 }
    en: { strict: 16, normal: 22, relaxed: 30 }
  # 法令・契約・判決・論文は、長い一文がその種類の書き方。corpus のその種類の文書で、normal が最も長い一握りの文だけを指すように測って置いた。
  legal:
    ja: { strict: 120, normal: 200, relaxed: 300 }
    en: { strict: 40, normal: 60, relaxed: 80 }
  legal/statute:
    ja: { strict: 200, normal: 300, relaxed: 450 }
    en: { strict: 80, normal: 130, relaxed: 180 }
  legal/judgment:
    ja: { strict: 250, normal: 350, relaxed: 450 }
  # 英語の定義は、限定を重ねた名詞句の一文になる。英語の用語集で測り、normal が列挙を詰めた定義や長い注記だけを指すように置いた。
  # 日本語は既定の上限のままで、すでに最も長い一握りだけを指していた。
  docs/glossary:
    en: { strict: 30, normal: 40, relaxed: 50 }
  academic:
    ja: { strict: 100, normal: 140, relaxed: 180 }
    en: { strict: 35, normal: 50, relaxed: 65 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
