id: defined-term-form
layer: L3
status: stable
how_to_find: defined-term-form
requires: [structure, pos]
severity: info

name:
  ja: 定義した語を、定義と違う形で使っている
  en: A defined term used in another form

why:
  ja: 契約では、定義した語は定義した形のまま使うのが決まりです。「本サービス」と定義したあとで「「本サービス」」とかぎ括弧を付け直すと、新しく定義し直したのか、同じものなのかが読み手に分かりません。英語では "Services" と定義した語を "services" と小文字で書くと、定義した意味なのか、ふつうの意味なのかが分かれ、争いのもとになります。「本業務」と定義して「本件業務」と書くと、別の業務を指すのかと読めます。「管理責任者」と定義して「文書管理責任者」と書くと、定義した者なのか別の者なのかが分かりません。定義の後ろで、かぎ括弧や引用符に入れ直した語、大文字で定義した語を小文字で書いた所（大文字の使用より少ないとき）、頭の「本」と「本件」を入れ替えた語（その形も定義した語なら除きます）、定義の文の語を足して長くした語（文書管理責任者、App と定義した後の Application）を指します。法令・規程でも、定義した語は定義の形のまま使います。
  en: 'A contract uses each defined term exactly as defined. Quoting a term again after its definition ("the "Services"") leaves the reader asking whether it is being defined anew. Writing "services" where "Services" is defined splits the defined sense from the ordinary one, which is where disputes start. In Japanese, 本件業務 written where 本業務 is defined reads as another task. "the Application" written where the Pinecone Notes application is defined as the "App" leaves the reader asking whether it is the same thing. chaff points at a term set in quotes again after its definition, at a capitalised term written in lower case (when the capitalised uses are more, "records officer" for "Records Officer" too), at a Japanese term written with its other prefix (本 for 本件 or the other way round) unless that form is defined too, and at a term made longer with a word of its own definition (Application for App, 文書管理責任者 for 管理責任者). Statutes and regulations use their defined terms as defined, too.'

message:
  ja: 定義した「{term}」と違う形で使っています
  en: '"{term}" is used in another form than defined'

messages:
  quoted:
    ja: 「{term}」は {line} 行目で定義した語です。定義のあとは、かぎ括弧を付けずに使います
    en: '"{term}" is defined on line {line}; after that it is used without quotes'
  case:
    ja: 「{term}」は {line} 行目で大文字で定義した語ですが、ここは小文字です
    en: '"{term}" is defined with a capital on line {line}, but written in lower case here'
  prefix:
    ja: 「{term}」は {line} 行目で定義した語ですが、ここは「{written}」と書いています
    en: '"{term}" is defined on line {line}, but written "{written}" here'
  extended:
    ja: 「{term}」は {line} 行目で定義した語ですが、ここは定義の文の語を足して「{written}」と書いています
    en: '"{term}" is defined on line {line}, but written "{written}" here, longer with a word of its definition'

how_to_fix:
  ja: 定義した語はかぎ括弧を付けずに使い、英語では定義のとおり大文字で始めてください。ふつうの意味で使うなら、別の言葉に替えます。
  en: Use the defined term without quotes and, in English, with its capital as defined. If the ordinary sense is meant, use another word.

levels: { strict: 3, normal: 2, relaxed: 1 }

use_for: [legal, docs, academic, literature, speech]
off_for:
  docs: "Defined terms and short names are a contract's apparatus: the legal genres check them."
  academic: "Defined terms and short names are a contract's apparatus: the legal genres check them."
  literature: "Defined terms and short names are a contract's apparatus: the legal genres check them."
  speech: "Defined terms and short names are a contract's apparatus: the legal genres check them."

group: consistency
summary:
  ja: 契約・規約・規程で、定義した語を定義のあとでかぎ括弧に入れ直したり、大文字で定義した語を小文字で書いたり、「本業務」を「本件業務」と書いたり、「管理責任者」を「文書管理責任者」と長くしたりしている所
  en: A defined term quoted again after its definition, a capitalised defined term written in lower case, a Japanese term with its other prefix (本件業務 for 本業務), or a term made longer with a word of its definition (Application for App)
example:
  ja:
    config: { genre: legal/contract }
    before: |
      # 利用規約

      第1条　当社は、会議室の予約サービス（以下「本サービス」という。）を提供する。

      第2条　利用者は、「本サービス」を業務の目的でだけ使う。
    after: |
      # 利用規約

      第1条　当社は、会議室の予約サービス（以下「本サービス」という。）を提供する。

      第2条　利用者は、本サービスを業務の目的でだけ使う。
  en:
    config: { genre: legal/contract }
    before: |
      # Terms

      1. We provide a room booking service (the "Services").

      2. You may use the Services for business only. The Services are provided as is.

      3. You must not resell the services.
    after: |
      # Terms

      1. We provide a room booking service (the "Services").

      2. You may use the Services for business only. The Services are provided as is.

      3. You must not resell the Services.

not_flagged:
  ja: 定義そのもの（以下「本サービス」という、「本サービス」とは）、定義より前の使用（use-before-definition が見ます）、文の頭の大文字、小文字の使用が {limit} 個を超えるか大文字の使用より多い語（ふつうの意味で使っているとみなす）は指しません。定義の文の中の使用（「顧客」とは、表紙に「顧客」と書いた者をいう）も見ません。法令・規程（statute の profile で読む文書）は、語そのものを指すために語をかぎ括弧に入れる（「株主」とあるのは、「個人情報」の定義）ので、かぎ括弧に入れ直した語は指しません。小文字の語句は、形容詞で始まるもの、形容詞や所有の語が前に付くもの（its own confidential information、additional terms of service）は普通の語句として見ません。「本」と「本件」を入れ替えた形は、その形も定義した語であるとき、長い語の一部（見本物品）のときは見ません。長くした語は、指す語（当該・前記・同・各）が前に付いただけのもの、二字以下の語（提供、登録）を長くしたもの、定義の文がその長い語を書いているもの（東京都（以下「都」という。））、その長い語も定義した語であるもの、複数形（Boxes）は見ません。
  en: 'The definitions themselves ("Services" means, (the "Services")), uses before the definition (use-before-definition reads those), capitals at the start of a sentence, and terms written in lower case more than {limit} times or more often than capitalised (taken as the ordinary word used on purpose) are not reported, nor is a use inside the defining sentence ("Customer" means the party named "Customer"). A statute or a regulation (a document read with the statute profile) quotes a term to talk about the term itself ("controller" has the same meaning as in Part 3), so a quoted term is not reported there. A lower-case phrase that starts with an adjective, or that an adjective or a possessive comes before (its own confidential information, additional terms of service), is the ordinary phrase and is not reported. A term with its other prefix (本件業務 for 本業務) is not reported when that form is defined too, or inside a longer word (見本物品). A longer word is not reported when only a pointing word comes before the term (当該管理責任者), when the term has two characters or fewer (提供, 登録), when the definition itself writes the longer word (東京都（以下「都」という。）), when the longer word is defined too, or when it is a plural (Boxes).'
level_meaning:
  ja: 小文字の使用が {limit} 個以下で、大文字の使用より少ないとき指摘
  en: lower-case uses reported when they are {limit} or fewer and fewer than the capitalised ones
rewrite:
  depth: light
  ja:
    direction: 定義した語を定義の形に戻してください。かぎ括弧を外し、英語の語は定義のとおり大文字で始めます。ふつうの意味で使っているのが明らかなら、定義した語と紛れない別の言葉に替えます。どちらの意味か決められなければ、書き手に確かめます。
    pairs:
      - before: 利用者は、「本サービス」を業務の目的でだけ使う。
        after: 利用者は、本サービスを業務の目的でだけ使う。
      - before: 乙は、「対象情報」を第三者に開示しない。
        after: 乙は、対象情報を第三者に開示しない。
    keep:
      - 条の番号と中身
      - 定義した語そのもの
    avoid:
      - 定義を書き換える
      - 意味が分からない所を推測で大文字にする
  en:
    direction: Bring the term back to its defined form. Remove the quotes, and capitalise it as defined. If the ordinary sense is clearly meant, use a word that cannot be mistaken for the defined term. If it is not clear which sense is meant, ask the writer.
    pairs:
      - before: You must not resell the services.
        after: You must not resell the Services.
      - before: The "Customer" must pay within 30 days.
        after: The Customer must pay within 30 days.
    keep:
      - the clause numbers and their content
      - the defined term itself
    avoid:
      - changing the definition
      - capitalising a word whose sense is unclear without asking
