id: adverb-overuse
layer: L3
status: experimental
how_to_find: adverb-density
requires: [pos]
languages: [en]
severity: info

name:
  ja: -ly 副詞が多い
  en: Too many -ly adverbs

why:
  ja: -ly 副詞は、動詞が弱いことの目印になります。"walked quickly" より "hurried" のほうが短く、絵が見えます。
  en: An -ly adverb usually marks a weak verb. "Hurried" is shorter and sharper than "walked quickly".

message:
  ja: 1000 語あたり {density} 個の -ly 副詞があります（{limit} 個まで）
  en: "{density} -ly {density|adverb|adverbs} per 1000 words (limit {limit})"

how_to_fix:
  ja: 副詞ごと動詞に畳んでください。"said loudly" を "shouted" に。
  en: Fold the adverb into the verb. "Said loudly" becomes "shouted".

# 1000 語あたりの個数。件数で数えると長い文書ほど当たる（bold-density と同じ）。
levels: { strict: 10, normal: 15, relaxed: 25 }

use_for: [blog, business, legal, docs, academic, literature, speech]

group: readability
summary:
  ja: 英語で、-ly の副詞が多すぎる所（弱い動詞の印になりやすい）
  en: Too many -ly adverbs, which usually prop up a weak verb
example:
  en:
    pad: true
    before: |
      She quickly walked to the room and quietly opened the door. He really badly needed the report and angrily asked for it.
    after: |
      She hurried to the room and eased the door open. He needed the report and demanded it.

not_flagged:
  ja: 短い文書（200 語より短いもの）は測りません。
  en: Documents under 200 words are not measured.
level_meaning:
  ja: 1000 語あたり -ly 副詞 {limit} 個まで
  en: up to {limit} -ly adverbs per 1000 words
