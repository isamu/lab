id: cushion-phrase-density
layer: L2
status: experimental
how_to_find: cushion-density
word_list: cushion-phrase
uses: [pos]
severity: info

name:
  ja: クッション言葉が多い
  en: Too many softeners

why:
  ja: 1 つなら礼儀ですが、重なるほど本題が遠ざかります。読み手は用件を探して読み進めることになります。
  en: One softener is courtesy. Several push the point further away, and the reader has to hunt for it.

message:
  ja: 「{matched}」など、クッション言葉が 1000 字あたり {density} 個あります（{limit} 個まで）
  en: '"{matched}" and other softeners: {density} per 1000 words (limit {limit})'

how_to_fix:
  ja: 最初の 1 つだけ残して、あとは用件を先に書いてください。
  en: Keep the first one. Lead with the request after that.

levels: { strict: 2, normal: 5, relaxed: 10 }

use_for: [business, legal, docs, academic, literature, speech]

group: wording
summary:
  ja: 「恐れ入りますが」「念のため」のようなクッション言葉が多く、用件が埋もれている所
  en: So many softeners ("sorry to bother", "just wanted to") that the request gets lost
example:
  ja:
    pad: true
    before: |
      お忙しいところ恐れ入りますが、念のためご確認をお願いします。差し支えなければ、取り急ぎご返信ください。
    after: |
      お忙しいところ恐れ入りますが、金曜までに見積もりの金額をご確認ください。
  en:
    pad: true
    before: |
      Sorry to bother you, but I just wanted to check the quote. If you don't mind, reply when you get a chance.
    after: |
      Could you check the quote by Friday? The total on page two changed.

not_flagged:
  ja: クッション言葉が一つだけなら礼儀なので指しません。短い文書（メールなど）は短い手紙ほどの長さの文書として測り、既定の水準では三つ目から指します。一つだけならどの水準でも指しません。
  en: One softener is courtesy and is not reported. A short document, such as an email, is measured as if it were as long as a short letter, so at the default level the third softener is the first reported; one alone is never reported.
level_meaning:
  ja: 1000 字あたりクッション言葉 {limit} 個まで
  en: up to {limit} softeners per 1000 words
rewrite:
  depth: light
  ja:
    direction: クッション言葉は最初の一つだけ残し、あとは用件（何を、いつまでに）から書いてください。敬語の丁寧さは変えません。
    pairs:
      - before: 恐れ入りますが、念のため、お手数ですが、資料をご確認いただけますでしょうか。
        after: 恐れ入りますが、資料をご確認いただけますか。
      - before: 大変申し訳ないのですが、もし可能であれば、金曜までにご返信いただけると幸いです。
        after: 申し訳ありませんが、金曜までにご返信いただけますか。
    keep:
      - 敬語の丁寧さと、相手との距離
      - 依頼の中身、期限、宛先
    avoid:
      - クッション言葉を全部消して命令の口調にする
      - 期限や条件を落とす
  en:
    direction: Keep the first softener and lead with the request (what, by when) after that. Keep the level of politeness.
    pairs:
      - before: Sorry to bother you, but I just wanted to check whether you might possibly be able to review the draft.
        after: Sorry to bother you. Could you review the draft?
      - before: Just a quick note to gently remind you, if you don't mind, that the report is due Friday.
        after: A reminder that the report is due Friday.
    keep:
      - the level of politeness
      - the request, its deadline and who it is for
    avoid:
      - deleting every softener until the request reads as an order
      - dropping a deadline or a condition
