id: date-without-year
layer: L1
status: stable
how_to_find: date-without-year
requires: [dates]
# The dates come from the language package's date reader.
languages: [ja, en]
severity: info

name:
  ja: 年の無い日付
  en: Date without a year

why:
  ja: 文書の日付が二つ以上の年にわたるとき（2025年の日付と2026年の日付）、年の無い日付はどの年のことか読み手には決まりません。年をまたぐ日付が並ぶ文書（12月と1月）でも、年の無い日付がどちらの年か決まりません。日付がみな同じ年なら、年が無くても読み手には分かります。
  en: When the document's dates span more than one year (some in 2025, some in 2026), a date without a year leaves the reader unable to tell which year it means. The same holds where the dates cross the turn of a year (December and January). When every dated date is in one year, the reader can tell the year without it.

message:
  ja: 「{date}」には年がありません。この文書の日付は {from}年から{to}年にわたるので、どの年か決まりません
  en: '"{date}" has no year, and the document''s dates run from {from} to {to}, so the year is unclear'
messages:
  boundary:
    ja: 「{date}」には年がありません。年の変わり目をまたぐ日付が並んでいるので、どちらの年か決まりません
    en: '"{date}" has no year, and the dates around it cross the turn of a year'

how_to_fix:
  ja: 年を書いてください（2027年1月15日）。
  en: Write the year (January 15, 2027).

levels: { strict: warning, normal: info, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]

group: structure
summary:
  ja: 文書の日付が二つ以上の年にわたるときや年の変わり目をまたぐときの、年の無い日付
  en: A date with no year where the document's dates span years or cross a new year
example:
  ja:
    before: |
      # 日程

      - 2025年10月15日（水）：前回の説明会
      - 2026年10月14日（水）：説明会
      - 10月28日（水）：結果の連絡
    after: |
      # 日程

      - 2025年10月15日（水）：前回の説明会
      - 2026年10月14日（水）：説明会
      - 2026年10月28日（水）：結果の連絡
  en:
    before: |
      # Schedule

      - October 15, 2025: last year's briefing
      - October 14, 2026: briefing
      - October 28: results sent
    after: |
      # Schedule

      - October 15, 2025: last year's briefing
      - October 14, 2026: briefing
      - October 28, 2026: results sent

not_flagged:
  ja: 年のある日付がみな同じ年の文書では、年の無い日付を指しません（どの年か読み手に分かるため）。年を一度だけ書いて、あとの日付は月と日だけで書く文書（年の無い日付のほうが多い文書）も、書き方の選び方として指しません。ただしどちらの場合も、年をまたぐ日付は指します。どの年のものでもない日付も指しません。毎年の日（毎年4月1日、年末年始閉庁日（12月29日～1月3日）、4月1日から翌年3月31日まで）と、例の日付（例えば…4月1日に届いた場合、例：のあとの日付）です。年のある日付が一つも無い文書、月だけ・年だけの日付は見ません。
  en: A document whose dated dates are all in one year is not reported, since the reader can tell the year. A document that writes the year once and the rest as month and day (more yearless dates than dated ones) is a style, and not reported either. In both, a date across the turn of a year is still reported. Nor is a date of no one year, such as a day that comes round every year ("every year on April 1", "each December 31", "April 1 to March 31 of the following year") and a date in a worked example ("for example, a request received on April 1", the dates after "e.g."). A document with no dated date, and month-only and year-only dates, are not checked.
rewrite:
  depth: light
  ja:
    direction: 指摘された日付に年を書き足してください。年は本文のほかの日付と、曜日から確かめます。決められなければ、作らずに［年］と空けて書き手に聞きます。
    pairs:
      - before: 10月28日（水）：結果の連絡
        after: 2026年10月28日（水）：結果の連絡
      - before: 1月15日に次の会議を開きます。
        after: 2027年1月15日に次の会議を開きます。
    keep:
      - 月・日・曜日
      - ほかの日付の書き方
    avoid:
      - 曜日と合わない年を書く
      - 本文から決まらない年を推して書く
  en:
    direction: Add the year to the date that lacks one. Take it from the document's other dates and from the weekday, if one is written. Where the text does not settle it, leave "[year]" for the writer rather than inventing one.
    pairs:
      - before: "October 28: results sent"
        after: "October 28, 2026: results sent"
      - before: The next meeting is on January 15.
        after: The next meeting is on January 15, 2027.
    keep:
      - the month, the day and the weekday
      - how the other dates are written
    avoid:
      - a year that does not match the weekday
      - guessing a year the text does not give
