id: name-variant
layer: L3
status: stable
how_to_find: name-variant
requires: [pos]
severity: info

name:
  ja: 同じ名前の書き分け
  en: One name written two ways

why:
  ja: 人や会社や製品の名前を、ある所では「山田太郎」、別の所では「山田太朗」と書くと、読み手は同じ人か別の人か分かりません。契約書なら当事者の特定が揺らぎます。多いのは打ち間違いと、別の文書から写した段落です。どちらの形が正しいかは決めず、文書の中で少ないほうを指します。
  en: A person, company or product written as "GitHub" in one place and "Github" in another leaves the reader unsure whether they are the same. In a contract it blurs who the party is. The usual causes are a typo and a paragraph pasted from another document. chaff does not decide which form is right; it points at the one the document uses less.

message:
  ja: 「{name}」は、ほかの所では「{usual}」と書いています
  en: '"{name}" is written "{usual}" elsewhere in the document'

messages:
  spelling:
    ja: 「{name}」は、ほかの所では「{usual}」と書いています（字の大小・幅・記号の違い）
    en: '"{name}" is written "{usual}" elsewhere in the document (case, width or punctuation)'
  reading:
    ja: 「{name}」は、ほかの所では同じ読みの「{usual}」と書いています
    en: '"{name}" is written "{usual}", read the same, elsewhere in the document'
  character:
    ja: 「{name}」は、ほかの所では字体の違う同じ字で「{usual}」と書いています
    en: '"{name}" is written "{usual}", with another form of the same character, elsewhere in the document'
  near:
    ja: 「{name}」は、ほかの所で何度も書いた「{usual}」と一字違いです
    en: '"{name}" is one letter away from "{usual}", which the document uses more than once'
  surname:
    ja: 「{name}」は、ほかの所で何度も書いた「{usual}」と名が同じで、姓が数字だけ違います
    en: '"{name}" has the given name of "{usual}", which the document uses more than once, and a surname a few letters away'
  place-word:
    ja: 「{name}」は、ほかの所では場所の語を別の形にして「{usual}」と書いています
    en: '"{name}" is written "{usual}", with the place word in another form, elsewhere in the document'
  company-form:
    ja: 「{name}」は、ほかの所では会社の種類の違う「{usual}」と書いています
    en: '"{name}" is written "{usual}", with another company form, elsewhere in the document'
  company-position:
    ja: 「{name}」は、ほかの所では会社の種類を名前の反対側に置いて「{usual}」と書いています
    en: '"{name}" is written "{usual}", with the company form on the other side, elsewhere in the document'
  company-near:
    ja: 「{name}」は、ほかの所で書いた会社名「{usual}」と一字違いです
    en: '"{name}" is one letter away from the company name "{usual}" written elsewhere in the document'

how_to_fix:
  ja: 正しい形を確かめ、一つに揃えてください。本当に別の人や会社なら、そのままで構いません。
  en: Check the right form and use it throughout. If they really are different people or companies, leave them.

placeholders:
  name:
    ja: 名前
    en: the name
  usual:
    ja: 別の形
    en: another form

levels: { strict: warning, normal: info, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]

group: consistency
summary:
  ja: 同じ人・会社・製品の名前を、少しだけ違う形で書いている所（山田太郎 と 山田太朗、GitHub と Github）
  en: The same person, company or product written in slightly different forms (GitHub and Github, Acme, Inc. and Acme Inc.)
example:
  ja:
    before: |
      担当は山田太郎です。見積もりは山田太郎が作り、請求書は山田太朗が送ります。
    after: |
      担当は山田太郎です。見積もりは山田太郎が作り、請求書も山田太郎が送ります。
  en:
    before: |
      The code lives on GitHub. Reviews happen on GitHub, and releases are tagged on Github.
    after: |
      The code lives on GitHub. Reviews happen on GitHub, and releases are tagged on GitHub.

not_flagged:
  ja: 品詞解析が固有名詞と読んだ語だけを見ます。大文字だけの名前（ACME INC、NASA）は見ません。一字違いの英字の名前は、6 字以上で、多いほうが二度以上、少ないほうが一度だけのときに限ります（Iran と Iraq は別の名前）。人の名前どうしは、字体の違う同じ字（斎藤 と 斉藤、渡辺 と 渡邊）か、読みが同じで一字だけ違い、多いほうが二度以上、少ないほうが一度だけのとき（松本 と 松元）に限ります（伊藤 と 伊東 は別の人のことがある）。人の名前とは、品詞解析が人名と読んだ語か、「様」「さん」「氏」の付いた名前です（解析器が名前と読めない字体の字を含む名前は、敬称の前の 2〜4 字の漢字を名前と読みます）。敬称の無い名前も、前後に漢字が続かない 2〜4 字の漢字で、片方の書き方に「担当の」「私、」などの前置きか敬称が付き、もう片方が「です」「が」「までご連絡」などの前にあれば比べます（担当の斎藤です と 斉藤までご連絡ください）。地名にも同じ組がある（鹿島 と 鹿嶋）ので、どちらにも前置きも敬称も無いときは比べません。会社の名前は、語彙表の会社の種類の語（株式会社、(株)、有限会社）の隣にあるものを、品詞と関係なく比べます。名前が同じで種類の語が違うもの（株式会社 と 有限会社）、種類の語を名前の反対側に置いたもの（株式会社アオバ と アオバ株式会社）、記号・幅だけが違うものを指します。同じ種類の語の略した形（株式会社 と (株)）、種類の語を省いた呼び名（アオバシステム、以下「アオバ」）は指しません。名前の一字違いは、7 字以上の名前で、違う字が漢字でないときに限ります（日本電気 と 日本電機 は別の会社のことがある）。漢字だけの名前は、品詞解析が固有名詞と読んだときだけ会社の名前と見ます（清算株式会社、当該株式会社）。場所の名前は、語彙表の場所の語（口、駅、センター、ホール）で終わる名前を、品詞と関係なく比べます。記号・幅だけが違うもの（コンベンションセンター と コンベンション・センター）を指し、名前の読みが同じかかなで書いた読みのもの（筑紫口 と ちくし口）と、固有名詞の字の一字違い（八重洲中央口 と 八重州中央口）は、多いほうが二度以上、少ないほうが一度だけのときに限ります。方角や数字の違い（北口 と 南口、第1会議室 と 第2会議室）は別の所なので指しません。表の升は升ごとに品詞解析し、名前の形をした升（空白を挟んだ二つか三つの漢字・カタカナの語）を本文の名前と比べます。記号・幅だけの違い（佐々木 美穂 と 佐々木　美穂）と、本文と同じく読みが同じで一語だけ違うもの（佐々木 美穂 と 佐々木 美保）を指し、後者は本文の形が二度以上、升の形が一度だけのときに限ります。読みの違う一字違い（佐藤 太郎 と 佐藤 次郎）は別の人のことが多いので指しません（英字の名前は一字違いも指します）。場所の名前は表の升の中のものも比べます。英字の人の名前は、名が同じで、7 字以上の姓の頭 4 字以上がそろい、あいだの 2 字（長いほうは 3 字）までだけ違うもの（Rachel Whitford と Rachel Whitfield）も、多いほうが二度以上、少ないほうが一度だけのときに指します。
  en: Only words the tagger reads as proper nouns are checked. Names in capitals only (ACME INC, NASA) are left out. Names one letter apart are reported only when six letters or longer, with the usual form used at least twice and the other once (Iran and Iraq are different names). Two Japanese person names are compared only when written with another form of the same character (斎藤 and 斉藤), or read the same with one character different, the usual form used at least twice and the other once (松本 and 松元); 伊藤 and 伊東 can be two people. A person's name is one the tagger reads as such, or one followed by 様, さん or 氏 (when a name holds a character form the tagger cannot read, the two to four kanji before the honorific are taken as the name). A name without an honorific is compared too when it is two to four kanji standing alone, one form has a lead such as 担当の or 私、 or an honorific, and the other stands before a word such as です, が or までご連絡 (担当の斎藤です and 斉藤までご連絡ください). Places have such pairs as well (鹿島 and 鹿嶋), so two forms with neither a lead nor an honorific are not compared. A company name is one next to a company form from the lexicon (Inc., Ltd., Co., Ltd., LLC), whatever the tagger reads it as. The same name with forms of two kinds (Inc. and Ltd.), and the same name written with other punctuation or width, are reported. The short and long spelling of one form (Inc and Incorporated) and a name written without its form (Aoba Systems, the "Company") are not. Two names one letter apart are reported only when seven letters or longer, with the same form, and the letter is not a kanji. A place name is one ending in a place word from the lexicon (Street, St., Avenue, Station, Center), whatever the tagger reads it as. The same place written with other punctuation (King's Cross and Kings Cross) or with the place word short and long (11th Street and 11th St.) is reported; a place whose name is one letter away (Union Station and Unoin Station) only when the usual form is used at least twice and the other once. Other numbers and other names (1st Street and 2nd Street, North Hall and South Hall) are different places. Table cells are tagged cell by cell, and a cell holding only a name (two to four capitalised words, or two or three kanji or katakana words with a space) is compared with the names read in the prose. Reported are the same name with other punctuation or case, or one word different with the other words the same, either a letter away (Sofia Mendes in the text, Sofia Mendez in the table) or, for a Japanese name, read the same as the prose name (佐々木 美穂 and 佐々木 美保); these only when the prose form is used at least twice and the cell form once. Place names inside table cells are compared too. A word next to a name that the tagger did not read as a name (to Rachel Whitford, with Rachel read as a verb) is read with it when the two together are read as a name elsewhere. Two names with the same given name and a surname of seven letters or more, whose first four letters match and which differ in at most two letters between the shared start and end (three in the longer one), are reported when the usual form is used at least twice and the other once (Rachel Whitford and Rachel Whitfield). A different given name (Daniel Whitfield) or a surname alone is not compared this way.
rewrite:
  depth: light
  ja:
    direction: 少ないほうの形を、多いほうの形に替えてください。どちらが正しいか本文から分からなければ、書き手に聞きます。別の人や会社なら替えません。
    pairs:
      - before: 見積もりは山田太郎が作り、請求書は山田太朗が送ります。
        after: 見積もりは山田太郎が作り、請求書も山田太郎が送ります。
      - before: 発注先は株式会社ミナト商事です。納品はミナト商時が行います。
        after: 発注先は株式会社ミナト商事です。納品はミナト商事が行います。
    keep:
      - 名前の正しい形
    avoid:
      - 別の人や会社の名前を一つにまとめる
  en:
    direction: Replace the less frequent form with the usual one. If the text does not show which is right, ask the writer. Leave names that belong to different people or companies.
    pairs:
      - before: Reviews happen on GitHub, and releases are tagged on Github.
        after: Reviews happen on GitHub, and releases are tagged on GitHub.
      - before: Acme Inc. signs the order. Payment goes to Acme, Inc. within thirty days.
        after: Acme Inc. signs the order. Payment goes to Acme Inc. within thirty days.
    keep:
      - the name's right form
    avoid:
      - merging the names of two different people or companies
