id: doubled-nado
layer: L2
status: stable
how_to_find: phrase-match
word_list: doubled-nado
requires: [pos]
languages: [ja, en]
severity: warning

name:
  ja: 「など」と「等」の重ね
  en: '"And so on" said twice (and etc., など等)'

why:
  ja: 「書類等など」「申請など等」のように「など」と「等」を重ねても、どちらも「ほかにもある」と言うだけで、意味は増えません。読み手には書き損じに見えます。英語の「and etc.」も、etc.（et cetera）がもう「and」を含むので同じ重ねです。組は言語ごとの語彙表にあります。
  en: '"Etc." is et cetera, "and the rest", so "and etc." says "and" twice; in Japanese, など and 等 both mean "and so on", and 書類等など doubles them. Either adds nothing and reads as a slip. The pairs are listed in the lexicon.'

message:
  ja: 「{matched}」は、「ほかにもある」を二度言っています
  en: '"{matched}" says "and so on" twice'

how_to_fix:
  ja: どちらか一つにしてください（書類等など → 書類など、and etc. → etc.）。
  en: Keep one of the two ("and etc." → "etc.", 書類等など → 書類など).

levels: { strict: 1, normal: 1, relaxed: 2 }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]

group: slips
summary:
  ja: 「書類等など」「and etc.」のように、「ほかにもある」を言う語を重ねた所
  en: '"And etc." or など with 等: two words for "and so on" written together'
example:
  ja:
    before: |
      申請書等などを提出してください。
    after: |
      申請書などを提出してください。
  en:
    before: |
      Bring pens, paper and etc. to the workshop.
    after: |
      Bring pens, paper, etc. to the workshop.
not_flagged:
  ja: 一覧にある組だけを見ます。「などなど」は話し言葉の強めなので数えません。英語の「such as A, B, etc.」のように間に語を挟んだ重ねは、一つの言い回しとして見られないので見ません。
  en: Only the pairs on chaff's list. などなど, a spoken intensifier, is not counted. "Such as A, B, etc.", where words come between the two, cannot be matched as one phrase and is not checked.
level_meaning:
  ja: 重ねた所が {limit} 箇所あれば指摘
  en: reported once there are {limit}
rewrite:
  depth: light
  ja:
    direction: 「など」か「等」のどちらか一つを消してください。文書の中でほかに多く使っている方を残します。
    pairs:
      - before: 申請書等などを提出してください。
        after: 申請書などを提出してください。
      - before: 交通費、宿泊費など等は会社が負担します。
        after: 交通費、宿泊費などは会社が負担します。
    keep:
      - 並べた項目
    avoid:
      - 項目を足して「など」を言い換える
  en:
    direction: Drop the extra "and" (or "and so on") and keep "etc.". Change nothing else.
    pairs:
      - before: Bring pens, paper and etc. to the workshop.
        after: Bring pens, paper, etc. to the workshop.
      - before: We cover travel, meals, etc. and so on.
        after: We cover travel, meals, etc.
    keep:
      - the listed items
    avoid:
      - adding items to replace "etc."
