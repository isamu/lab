id: repeated-sentence-head
layer: L1
status: stable
how_to_find: repeated-head
severity: warning

name:
  ja: 同じ書き出しの連続
  en: Repeated sentence opening

why:
  ja: 同じ書き出しが続くと、読者は文の切れ目を見失って読み飛ばします。
  en: Identical openings blur the boundary between sentences.

message:
  ja: 「{head}」で始まる文が {count} 続いています（{limit} まで）
  en: '{count} {count|sentence|sentences} in a row {count|opens|open} with "{head}" (limit {limit})'

how_to_fix:
  ja: 語順を変えるか、1 文を前の文に繋げてください。
  en: Reorder, or fold one sentence into the one before it.

levels:
  strict: 2
  normal: 3
  relaxed: 4

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: readability
summary:
  ja: 同じ言葉で始まる文が続き、文の切れ目がぼやける所
  en: Several sentences in a row that open with the same words
example:
  ja:
    before: |
      この機能は、無料です。この機能は、登録なしで使えます。この機能は、スマートフォンにも対応しています。この機能は、英語でも使えます。
    after: |
      この機能は無料で、登録なしで使えます。スマートフォンにも対応していて、英語でも使えます。
  en:
    before: |
      The tool is free. The tool is ready without an account. The tool is fine on phones too. The tool is available in Japanese as well.
    after: |
      The tool is free and needs no account. It works on phones too, and it speaks Japanese as well.
