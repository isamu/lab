id: weasel-word
layer: L2
status: stable
how_to_find: phrase-match
word_list: weasel-word
requires: [pos]
languages: [ja, en]
severity: info

name:
  ja: 出所を言わない「多くの専門家」
  en: Weasel words

why:
  ja: 「〜と言われています」「多くの専門家が」「ある研究によると」（英語の many experts say, studies show）は、主張を名前の無い大勢や、どれとも言わない研究に預けます。読み手は誰がそう言ったのかを確かめられず、書き手は主張に責任を持たずに済みます。言い回しは言語ごとの語彙表にあります。
  en: '"Many experts say", "it is widely believed" and "studies show" (と言われています, ある研究によると) lend a claim to an unnamed crowd or to research no one names. The reader cannot check who said it, and the writer need not stand behind it. The phrases are listed in the lexicon.'

message:
  ja: 「{matched}」は、誰が言ったのかを言っていません
  en: '"{matched}" does not say who'

how_to_fix:
  ja: 誰が・どの研究がそう言ったのかを書いてください（名前、年、出典）。書けないなら、書き手自身の主張として書くか、その文を落としてください。
  en: Name who said it or which study shows it (a name, a year, a source). If you cannot, state it as your own claim, or drop it.

levels: { strict: 1, normal: 1, relaxed: 2 }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  literature: 'A narrator and a character speak as they speak: dialect ("would of"), "So," and hearsay are the voice.'
  speech: "A transcript keeps the speaker's words: hedges and ら dropped as spoken."

group: wording
summary:
  ja: 「〜と言われています」「ある研究によると」（many experts say, studies show）のように、主張を名前の無い誰かに預ける言い回し
  en: Phrases such as "many experts say" and "studies show" (と言われています, ある研究によると) that credit a claim to no one in particular
example:
  ja:
    before: |
      在宅勤務は生産性を上げると言われています。
    after: |
      2023年のスタンフォード大学の調査（1,600人）では、在宅勤務で生産性が4%上がりました。
  en:
    before: |
      Many experts say remote work raises output.
    after: |
      A 2023 Stanford study of 1,600 staff found remote work raised output by 4%.

not_flagged:
  ja: 一覧にある言い回しだけを見ます。すぐ後ろに出典が書いてあっても指摘します（文の中で研究の名前を言えるため）。日本語では、前に出典が来やすい「研究によると」「専門家によると」は「ある」「最近の」「多くの」が付いた形だけを、「と言われる」は「と言われている」だけを見ます（「よく言われる話」のように言い回しを話題にするものは見ません）。「一般的に」だけでは指しません。
  en: Only the phrases on chaff's list are checked. A citation right after the phrase does not silence it, since the sentence can name the study itself. In Japanese, 研究によると and 専門家によると, which often follow their source, are checked only as ある・最近の・多くの forms, と言われる only as と言われている (not よく言われる, which mostly talks about the saying itself), and 一般的に alone is not checked.
level_meaning:
  ja: 当てはまる言い回しが {limit} 箇所あれば指摘
  en: reported once there are {limit}
rewrite:
  depth: light
  ja:
    direction: 名前の無い大勢（多くの専門家、ある研究）を、本文や出典が名指す人や研究に置き換えてください。名指していなければ作らずに書き手に聞くか、書き手自身の主張として書きます。
    pairs:
      - before: ある研究によると、短い会議は時間を節約します［3］。
        after: 山田（2021）は、15分の会議で各チームの時間が週2時間減ったと報告しています［3］。
      - before: 旧APIのほうが遅いと言われています。
        after: 5月の負荷試験では、旧APIのほうが30%遅い結果でした。
    keep:
      - 出典の番号やリンク
      - 主張そのもの
    avoid:
      - 本文に無い研究や名前を作る
      - 別の名前の無い大勢（一部の研究者）に替えるだけ
  en:
    direction: Replace the unnamed crowd ("many experts", "studies") with the person or study the text or its sources name. If they name none, do not invent one; ask the writer, or state the claim as the writer's own.
    pairs:
      - before: Studies show that short meetings save time [3].
        after: Smith (2021) found that 15-minute meetings saved each team two hours a week [3].
      - before: It is widely believed that the old API is slower.
        after: Our load test in May found the old API 30% slower.
    keep:
      - the citation number or link
      - the claim itself
    avoid:
      - inventing a study or a name the text does not give
      - swapping one unnamed crowd for another ("some researchers")
