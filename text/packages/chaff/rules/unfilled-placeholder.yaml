id: unfilled-placeholder
layer: L2
status: experimental
how_to_find: unfilled-placeholder
word_list: placeholder-word
severity: warning

name:
  ja: 埋め忘れた空欄
  en: Unfilled placeholder

why:
  ja: "「【会社名】」「[Your Name]」「（ここに会社名を書く）」は、雛形や生成した下書きに残る空欄です。値に「TODO: …」「未定」とだけ書いたものも、後で埋めるつもりの空欄です。文体の好みではなく、埋め忘れです。例として置いた「○○」は正しい書き方なので数えません。"
  en: '"[Your Name]" and "[Insert Date]" are the blanks a template or a generated draft leaves. A value that only says "TODO: …" or "TBD" is a blank too, left to fill in later. This is not a matter of style: the blank was never filled.'

message:
  ja: 「{matched}」が埋まっていません
  en: '"{matched}" was never filled in'

how_to_fix:
  ja: 中身を書いてください。例のつもりなら、例だと分かる書き方（例：山田太郎）にしてください。
  en: Fill it in. If it is meant as an example, say so ("for example, Jane Smith").

# 空欄は 1 つでも埋め忘れなので、段は数ではなく指摘の重さを決める。
levels: { strict: error, normal: warning, relaxed: info }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: slips
summary:
  ja: "「【会社名】」「[Your Name]」「TODO: …」のように、雛形の空欄や後で埋めるつもりの値が埋まらないまま残っている所"
  en: 'A template blank or a to-do value left unfilled, such as "[Your Name]", "[Insert Date]" or "TODO: …"'
example:
  ja:
    before: |
      【会社名】の田中です。見積もりをお送りします。
    after: |
      山田商事の田中です。見積もりをお送りします。
  en:
    before: |
      We can meet on [Insert Date] to go through the quote.
    after: |
      We can meet on Friday 9 October to go through the quote.

not_flagged:
  ja: "例として置いた「○○」、Markdown のリンク、脚注の番号、チェック欄とチェックリストの項目（- [ ] TODO: …）、値が続く見出しの札（【氏名】山田）、コードとコードのコメント（// TODO）、文の中の「未定」（日程は未定です）は指しません。"
  en: 'Markdown links and reference definitions, footnote numbers, checkboxes and checklist items ("- [ ] TODO: …"), a label its value follows ("[Date]: 2024-04-01"), code and code comments ("// TODO"), and "TBD" inside a sentence ("the date is TBD") are not reported.'
