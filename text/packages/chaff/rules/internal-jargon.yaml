id: internal-jargon
layer: L2
status: stable
how_to_find: internal-jargon
word_list: internal-jargon
severity: warning

name:
  ja: 社内でしか通じない言葉
  en: Words that only work inside

why:
  ja: 社内で通じる言葉は、外の人にも半年後の自分にも通じません。何が社内用語かはチームごとに違うので、chaff.yaml の jargon に自分で並べてください。並べていなければ何も言いません。
  en: A word that works inside one team does not work outside it, or six months later. Which words those are differs by team, so list them under `jargon` in chaff.yaml. With nothing listed, this rule says nothing.

message:
  ja: 「{matched}」は社内でしか通じないかもしれません（そういう語が {count} 箇所）
  en: '"{matched}" may only be understood inside your team ({count} such {count|word|words})'

how_to_fix:
  ja: 初出のところで普通の言葉に言い換えるか、括弧で説明を添えてください。jargon には辞書形（握る）でも語幹（巻き取）でも書けますが、複合動詞は語幹のほうが確実です。
  en: Use ordinary words, or explain it in brackets at first use. Entries can be dictionary forms or stems; for compound verbs a stem is safer.

# チームが並べた語なので、1 つでも指摘する。並べた時点で「使わない」と決めている。
levels: { strict: 1, normal: 1, relaxed: 3 }

use_for: [business, blog, technical, legal, docs, academic, literature, speech]

group: team
summary:
  ja: 「横展開」「握る」のように、社内でしか通じない言葉。chaff.yaml の jargon に書いた語だけを見ます
  en: Words that only work inside your team, from jargon in chaff.yaml
example:
  ja:
    config: { jargon: [横展開] }
    before: この取り組みを、ほかの部にも横展開します。
    after: この取り組みを、ほかの部でも同じように始めます。
  en:
    config: { jargon: [ping] }
    before: I will ping the vendor about the quote.
    after: I will email the vendor about the quote.

not_flagged:
  ja: chaff.yaml の jargon に書いた語だけを見ます。何も書かなければ何も言いません。
  en: Only the words under jargon in chaff.yaml are checked. With nothing listed, it says nothing.
level_meaning:
  ja: 当てはまる語が {limit} 箇所あれば指摘
  en: reported once there are {limit}
