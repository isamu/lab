id: bold-label-list
layer: L1
status: stable
how_to_find: bold-label-list
requires: [markdown]
uses: [pos]
severity: info

name:
  ja: 太字の札で始まる箇条書きが多い
  en: Too many list items led by a bold label

why:
  ja: 「- **速さ**：〜」のように、項目ごとに太字の札とコロンを置いて説明を続ける形です。「- **情報が古くなる。** 〜」のように、太字の一文で始めて説明を続ける形も同じです。札が並ぶと、どの項目も同じ重さの見出しに見え、項目どうしの繋がりは書かれません。段落ごとに「**利用は毎週伸びた**：〜」と、言い切りの太字で始めて説明を続ける形も同じです。生成文によく見られる形です。
  en: 'An item that opens with a bold label and a colon ("- **Speed**: ..."), or with a bold lead sentence ("- **Information gets out of date.** ..."), item after item. The labels make every item look like a heading of equal weight, and the links between the items go unwritten. Paragraphs that each open with a bold statement ("**Usage grew each week**: ...") are the same shape. A shape common in generated text.'

message:
  ja: 「{label}」など、太字の札で始まる項目が {count} 個あります（{limit} 個から）
  en: '"{label}" and other bold labels open {count} list items ({limit} needed)'

messages:
  paragraphs:
    ja: 「{label}」など、言い切りの太字で始まる段落が {count} 個あります（{limit} 個から）
    en: '"{label}" and other bold statements open {count} paragraphs ({limit} needed)'

how_to_fix:
  ja: 札を外して、項目を文にしてください。大事な項目が 1 つ 2 つなら、それを段落で書き、残りは消すか 1 文にまとめます。用語集のように、本当に札と説明の組を並べるものはそのままでかまいません。
  en: Drop the labels and write the items as sentences. If only one or two items matter, give them a paragraph and cut or merge the rest. A real glossary, where each label is the term being defined, can stay.

# 指摘に要る項目の数。長さで割らない：人の記事は長くても 1 つ 2 つで、生成文は短くても並べる。
levels: { strict: 3, normal: 5, relaxed: 8 }
options:
  min_leads:
    kind: count
    default: 3
    about:
      ja: 太字の一文で始まる項目（- **範囲を固定する。** 〜）だけで指摘する数。人の文書は手順や欄の名前に太字の札を 3 つ 4 つ並べることはあっても、太字の一文で始まる項目を並べることはほとんどありません
      en: How many items opening with a bold lead sentence (- **Lock your ranges.** ...) report on their own. Human documents may give three or four steps or fields a bold label, but rarely make a list of bold lead sentences
  min_clause_paragraphs:
    kind: count
    default: 3
    about:
      ja: 言い切りの太字（述語のある文。**利用は毎週伸びた**：〜）で始まる段落だけで指摘する数。句点で閉じた英語の命令の一文（**Pick the quietest room you can.** 〜）も数えます。人の文書の段落の頭の太字は、語だけのもの（**勤務時間**：）、コロンで閉じた動詞で始まるもの（英語の命令形 **Talk to the people:**）、動名詞（**Examining the risks.**）、問い（**読み手は誰か？**）がほとんどで、これらは数えません。品詞が読めないときは段落を数えません
      en: "How many paragraphs opening with a bold statement (a clause with its own subject and verb, **Usage grew each week**: ...) report on their own. A whole English instruction closed by its own stop (**Pick the quietest room you can.** ...) counts too. A human run-in head is a term (**Work schedule**:), an imperative closed by a colon (**Talk to the people:**), a gerund (**Examining the risks.**) or a question (**Who is my audience?**), none of which count. Without part-of-speech tags, paragraphs are not counted"

use_for: [technical/readme, blog, business, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  academic: "Science writes in the passive, hedges its claims on purpose (may, suggest) and cites numbers as its evidence."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  business/meeting-notes: "A header block of labelled fields (- **日時**：…, - **出席者**：…) is the form of minutes, not a list of captions."
  speech/transcript: "Labelled speaker turns (- **記者**：…) are how a transcript is laid out."
sources: [zhang-2024]

group: ai-tells
summary:
  ja: 太字の札（**速さ**：）や太字の一文で始まる項目が続く箇条書き
  en: List items in a row that open with a bold label or a bold lead sentence
example:
  ja:
    config: { genre: blog/tech }
    before: |
      # 新しい在庫システム

      **新しいシステムが動き始めました。** 変わった点は次のとおりです。

      - **速さ**：一覧が 1 秒で出ます。
      - **正確さ**：数え間違いが減ります。
      - **安さ**：月の費用が下がります。
      - **使いやすさ**：画面が分かりやすくなりました。
      - **安全**：権限を細かく分けられます。
    after: |
      # 新しい在庫システム

      一覧は 1 秒で出るようになり、数え間違いも減りました。
      月の費用は下がり、権限も細かく分けられます。
  en:
    config: { genre: blog/tech }
    before: |
      # Our new stock system

      **The new system is live.** Here is what changed.

      - **Speed**: the list loads in a second.
      - **Accuracy**: fewer counting mistakes.
      - **Cost**: the monthly bill is lower.
      - **Ease of use**: the screens are clearer.
      - **Security**: permissions can be split finely.
    after: |
      # Our new stock system

      The list now loads in a second, and we make fewer counting mistakes.
      The monthly bill is lower, and permissions can be split finely.

not_flagged:
  ja: 札がコードだけの項目（`--flag` の説明のような、設定や引数の一覧）は数えません。段落は、太字が言い切りの文か、句点で閉じた英語の命令の一文（**Pick the quietest room you can.**）のときだけ数え、語だけの太字・コロンで閉じた英語の命令形の札（**Talk to the people:**）・動名詞・問いは数えません。札の後ろにコロンも句点も無い項目（太字が文の頭の語だけのもの）と、その後ろに何も無い項目も数えません。太字の後ろが一項目ずつ段落ほどの長さ（中ほどの項目で英語 40 語、日本語 100 字から）ある箇条書きは、太字の助言をそれぞれ長く説明する手引きの形なので数えません。仕様書（technical/spec）・法務・説明書・論文・文学のジャンルでは見ません。
  en: An item whose label is only code (a list of options or fields) is not counted, nor is one whose bold ends in neither a colon nor a full stop (a bold opening word of a sentence), or that has no text after it. A list whose items each run a paragraph after the bold (the middle item 40 words or more, 100 characters in Japanese) is a handbook's tips, the advice in bold and the item explaining it, and is not counted. A paragraph counts only when its bold is a statement, or a whole English instruction closed by its own stop (**Pick the quietest room you can.**), not a term, an imperative run-in head closed by a colon (**Talk to the people:**), a gerund or a question. Specification (technical/spec), legal, documentation, academic and literary genres do not run this rule.
level_meaning:
  ja: 太字の札で始まる項目が {limit} 個あれば指摘（太字の一文で始まる項目は min_leads、言い切りの太字で始まる段落は min_clause_paragraphs の数から）
  en: reported once {limit} list items open with a bold label (items opening with a bold lead sentence from min_leads, paragraphs opening with a bold statement from min_clause_paragraphs)
rewrite:
  depth: structure
  ja:
    direction: 太字の札を外し、項目を文に戻してください。札の語は文の中に入れ、項目どうしの関係（理由、順番、どちらが大事か）を書きます。用語集のように、札が定義される語そのものなら箇条書きのままにします。
    pairs:
      - before: |
          - **速さ**：一覧が 1 秒で出ます。
          - **正確さ**：数え間違いが減ります。
        after: |
          一覧は 1 秒で出るようになり、数え間違いも減りました。
      - before: |
          - **原因**：設定ファイルの読み込み順が変わった。
          - **対策**：読み込み順を固定した。
        after: |
          設定ファイルの読み込み順が変わっていたので、順番を固定しました。
    keep:
      - 項目の中身と数字
      - 手順の順番
      - 用語集の語と定義の組
    avoid:
      - 札を消しただけで、同じ並びの短い箇条書きを残す
      - 太字の札を、見出しのような一文に置き換える
      - 項目の間に、書き手が書いていない因果を足す
  en:
    direction: Drop the bold labels and turn the items back into sentences. Put the label's words into the sentence, and say how the items relate (a reason, an order, which matters more). Keep a glossary as a list, where each label is the term being defined.
    pairs:
      - before: |
          - **Speed**: the list loads in a second.
          - **Accuracy**: fewer counting mistakes.
        after: |
          The list now loads in a second, and we make fewer counting mistakes.
      - before: |
          - **Cause**: the config files were read in a new order.
          - **Fix**: we pinned the order.
        after: |
          The config files were being read in a new order, so we pinned it.
    keep:
      - what each item says, and its numbers
      - the order of steps
      - a glossary's terms and definitions
    avoid:
      - dropping the labels but keeping the same short list
      - replacing a bold label with a heading-like sentence
      - adding causes between the items that the writer did not state
