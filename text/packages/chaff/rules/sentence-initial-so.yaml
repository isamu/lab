id: sentence-initial-so
layer: L2
status: stable
how_to_find: opener-pile
word_list: so-opener
requires: [pos]
languages: [en]
severity: info

name:
  ja: 文頭の「So,」
  en: Sentence opening with "So,"

why:
  ja: 英語で文の頭に置く「So,」は、話し言葉の間合いを書き言葉に持ち込んだものです。前の文との関係（理由・結果・話題の切り替え）を言わずに文をつなぎます。読点の無い「So far」「So that」は普通の書き出しなので数えません。
  en: '"So," at the head of a sentence carries a spoken pause into writing. It joins the sentence to the last without saying how (a reason, a result, a change of topic). "So far" and "So that", without the comma, open a sentence on their own terms and are not counted.'

message:
  ja: 「{matched}」で始まる文が {count} 個あります（{limit} 個から）
  en: '{count} {count|sentence opens|sentences open} with "{matched}" ({limit} needed)'

how_to_fix:
  ja: 「So,」を消して読み直してください。つながりが要るなら、それを言う語（Therefore、As a result）に替えます。
  en: Delete "So," and reread. If the link is needed, use a word that says what it is ("Therefore", "As a result").

levels: { strict: 1, normal: 1, relaxed: 3 }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]

group: wording
summary:
  ja: 英語で、「So,」で始まる文（話し言葉の間合い）
  en: A sentence that opens with "So,", a spoken pause carried into writing
example:
  en:
    before: |
      So, the release moves to Friday.
    after: |
      The release moves to Friday.

not_flagged:
  ja: 読点の付いた「So,」だけを見ます。「So far」「So that」「So the board decided」は数えません。英語の文書だけで動きます。小説と話し言葉では既定で止めています（話す調子がその文書の書き方のため）。
  en: Only "So," with its comma. "So far", "So that" and "So the board decided" are not counted. Only in English documents; the fiction and speech presets turn it off, since a spoken tone is their form.
level_meaning:
  ja: 「So,」で始まる文が {limit} 個あれば指摘
  en: reported once {limit} sentences open with "So,"
rewrite:
  depth: light
  en:
    direction: Delete the "So," at the head of the sentence. If the link to the last sentence is needed, use a word that says what it is.
    pairs:
      - before: So, we moved the release to Friday.
        after: We moved the release to Friday.
      - before: The vendor was late. So, the launch slipped.
        after: The vendor was late. As a result, the launch slipped.
    keep:
      - the rest of the sentence
    avoid:
      - swapping "So," for another empty opener ("Well,", "Now,")
