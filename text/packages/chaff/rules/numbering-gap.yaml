id: numbering-gap
layer: L3
status: stable
how_to_find: numbering-gap
requires: [structure]
severity: error

name:
  ja: 番号の抜け・重なり
  en: Skipped or repeated number

why:
  ja: 第3条の次が第5条、(a) の次が (c)、同じ第2項が二つ。番号が飛ぶか重なると、読み手は何かが消えたのか、参照がどちらを指すのかを判断できません。同じ親の中で並ぶ番号だけを比べます。枝番号（第3条の2）は並びの外として扱います。Markdown の番号付きの箇条書き（手順の「1.」「2.」「4.」）も、書いた番号を比べます。表示は最初の番号から数え直しますが、原文と「手順4を参照」は書いた番号を見ます。
  en: Article 5 right after Article 3, (c) right after (a), two paragraphs numbered 2. A reader cannot tell whether something was removed, or which one a reference means. Only numbers side by side under the same parent are compared. The numbers written on a Markdown ordered list (steps "1.", "2.", "4.") are compared too. The page renders them counted from the first, but the source and a "see step 4" use the numbers as written.

message:
  ja: 「{previous}」の次が「{label}」です（{expected} 番目のはず）
  en: '"{label}" follows "{previous}" (expected number {expected})'

how_to_fix:
  ja: 番号を振り直してください。削った条を欠番として残すなら、「第4条（削除）」のように番号だけを残すと読み手に伝わります。
  en: Renumber. If a provision was removed on purpose, keep its number with a note such as "Section 4 [Deleted]".

levels: { normal: error, relaxed: warning }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]

group: structure
summary:
  ja: 第1条の次が第3条、(a) の次が (c) のように、番号が飛んだり重なったりしている所
  en: A numbered item that skips or repeats a number, such as Article 3 right after Article 1
example:
  ja:
    before: |
      # 就業規則

      ## 第1条（目的）

      この規則は、働き方の決まりを定める。

      ## 第3条（勤務時間）

      勤務時間は、午前九時から午後六時までとする。
    after: |
      # 就業規則

      ## 第1条（目的）

      この規則は、働き方の決まりを定める。

      ## 第2条（勤務時間）

      勤務時間は、午前九時から午後六時までとする。
  en:
    before: |
      # Staff rules

      ## Article 1 (Purpose)

      These rules set out how we work.

      ## Article 3 (Working hours)

      Working hours are from nine to six.
    after: |
      # Staff rules

      ## Article 1 (Purpose)

      These rules set out how we work.

      ## Article 2 (Working hours)

      Working hours are from nine to six.

not_flagged:
  ja: 同じ親の下で隣り合う番号だけを比べます。別の章の番号どうしは比べません。どの項目にも同じ番号（「1.」）を書いた箇条書きと、引用の中の箇条書きは見ません。
  en: Only numbers side by side under the same parent are compared. A list that writes the same number on every item ("1." on each) and a list inside a quotation are not checked.
