id: duration-mismatch
layer: L3
status: experimental
how_to_find: duration-mismatch
requires: [dates]
severity: warning

name:
  ja: 始まりと期間から計算した終わりが、書いた終わりと合わない
  en: A start plus a length of time that does not reach the stated end

why:
  ja: 「4月1日から3か月間（7月31日まで）」のように、始まりと期間と終わりを一緒に書くと、読み手は三つのうちどれが正しいのか分かりません。期間か日付の片方だけを直したときに起きます。一つの文に日付が二つと期間が一つあるとき、始まりに期間を足した日を終わりと比べます。終わりの日を含めて数える書き方（4月1日から3か月間は6月30日まで）、含めない書き方（7月1日まで）、初日を数えずに期間が過ぎた日（「4月1日から2週間が経過した日（4月16日）」）のどれとも合わないときだけ指します。
  en: 'When a start, a length and an end are written together ("for 3 months from April 1, 2026, until July 31, 2026"), the reader cannot tell which of the three is right. It happens when the length or one date is changed and not the other. In a sentence with two dates and one length of time, the start plus the length is compared with the end. Three ways of counting are accepted: with the last day included (April 1 plus 3 months is June 30), without it (July 1), and the day after the period has passed when the first day is not counted (July 2); it is pointed out only when the end matches none.'

message:
  ja: "{start}から{duration}なら、終わりは{expected}ごろのはずですが、{end}と書かれています"
  en: "{start} plus {duration} ends around {expected}, but the end is given as {end}"

how_to_fix:
  ja: 期間と終わりの日付のどちらが正しいかを確かめて、もう一方を直してください。
  en: Check whether the length or the end date is right and correct the other.

levels: { normal: warning, relaxed: info }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]

group: facts
summary:
  ja: 「4月1日から3か月間（7月31日まで）」のように、始まりに期間を足しても書いた終わりにならない所
  en: A start date plus a length of time that does not reach the end date written beside them
example:
  ja:
    before: |
      契約期間は2026年4月1日から3か月間（2026年7月31日まで）です。
    after: |
      契約期間は2026年4月1日から3か月間（2026年6月30日まで）です。
  en:
    before: |
      The trial runs for 3 months from April 1, 2026 (until July 31, 2026).
    after: |
      The trial runs for 3 months from April 1, 2026 (until June 30, 2026).

not_flagged:
  ja: 三通りの数え方（終わりを含める、含めない、初日を数えずに過ぎた日）のどれとも合わないときだけ指します。「約3か月」「3か月程度」のような目安の期間、日付が三つ以上か期間が二つ以上ある文、年を書いた日付と書かない日付の組は見ません。
  en: Only an end that matches none of the three ways of counting is pointed out. A rough length ("about 3 months"), a sentence with three or more dates or two or more lengths, and a pair of one date with a year and one without are left alone.
rewrite:
  depth: light
  ja:
    direction: 始まり・期間・終わりのうち、どれが正しいかを書き手に確かめ、残りを合わせてください。期間か終わりのどちらかを消して、一つだけにしてもかまいません。
    pairs:
      - before: 4月1日から3か月間（7月31日まで）
        after: 4月1日から3か月間（6月30日まで）
      - before: 5月1日から10日間（5月15日まで）
        after: 5月1日から15日間（5月15日まで）
    keep:
      - 確かめた始まりの日
      - 終わりの日を含めるかどうかの数え方
    avoid:
      - どれが正しいかを推測で決める
      - 期間を「約」でぼかして合わせる
  en:
    direction: Ask the writer which of start, length and end is right, and make the rest agree. Dropping either the length or the end, so only one is stated, also works.
    pairs:
      - before: for 3 months from April 1, 2026 (until July 31, 2026)
        after: for 3 months from April 1, 2026 (until June 30, 2026)
      - before: for 10 days from May 1, 2026 to May 15, 2026
        after: for 15 days from May 1, 2026 to May 15, 2026
    keep:
      - the confirmed start date
      - whether the last day is counted
    avoid:
      - guessing which value is right
      - blurring the length with "about" to make it fit
