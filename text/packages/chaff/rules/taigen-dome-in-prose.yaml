id: taigen-dome-in-prose
layer: L3
status: stable
how_to_find: noun-ending
requires: [pos]
languages: [ja]
severity: info

name:
  ja: 体言止めが続いている
  en: Too many noun-ending sentences

why:
  ja: 体言止めは 1 つなら効きますが、続くと文が途中で切れたように読めます。箇条書きでは普通の書きかたなので、本文だけを見ています。
  en: One noun-ending sentence lands. Several in a row read as unfinished. Bullet lists are excluded, where the form is normal.

message:
  ja: 本文に体言止めが {count} 文あります（{limit} 文まで）
  en: "{count} {count|sentence|sentences} {count|ends|end} on a noun in the body text (limit {limit})"

how_to_fix:
  ja: 述語を足してください。「〜が課題。」を「〜が課題です。」に。
  en: Add the predicate.

levels: { strict: 2, normal: 4, relaxed: 8 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: readability
summary:
  ja: 名詞で終わる文（体言止め）が本文に続き、言いかけのように読める所
  en: Many Japanese sentences in the body that stop on a noun, which read as unfinished
example:
  ja:
    config: { rules: { taigen-dome-in-prose: strict } }
    before: |
      今年の目標は売上の回復。そのための施策は三つ。最初は店頭の品ぞろえの見直し。
    after: |
      今年の目標は売上の回復です。そのための施策は三つあります。最初に、店頭の品ぞろえを見直します。
