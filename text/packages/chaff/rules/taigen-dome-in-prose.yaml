id: taigen-dome-in-prose
layer: L3
status: stable
how_to_find: noun-ending
requires: [pos]
languages: [ja]
severity: info

name:
  ja: 体言止めが続いている
  en: Too many noun-ending sentences

why:
  ja: 体言止めは 1 つなら効きますが、続くと文が途中で切れたように読めます。箇条書きでは普通の書きかたなので、本文だけを見ています。
  en: One noun-ending sentence lands. Several in a row read as unfinished. Bullet lists are excluded, where the form is normal.

message:
  ja: 本文に体言止めが {count} 文あります（{limit} 文まで）
  en: "{count} {count|sentence|sentences} {count|ends|end} on a noun in the body text (limit {limit})"

how_to_fix:
  ja: 述語を足してください。「〜が課題。」を「〜が課題です。」に。
  en: Add the predicate.

levels: { strict: 2, normal: 4, relaxed: 8 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  docs/glossary: "A reader looks up one entry and reads only that. A definition is a noun phrase (風の吹いてくる方向。), and sibling entries share one wording on purpose (Portion of labor productivity change attributed to …), which no reader sees twice."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."

group: readability
summary:
  ja: 名詞で終わる文（体言止め）が本文に続き、言いかけのように読める所
  en: Many Japanese sentences that stop on a noun and read as unfinished
example:
  ja:
    config: { rules: { taigen-dome-in-prose: strict } }
    before: |
      今年の目標は売上の回復。そのための施策は三つ。最初は店頭の品ぞろえの見直し。
    after: |
      今年の目標は売上の回復です。そのための施策は三つあります。最初に、店頭の品ぞろえを見直します。

not_flagged:
  ja: 箇条書きの中の体言止めは、その書き方が普通なので数えません。
  en: Noun endings in bullet lists, where the form is normal, are not counted.
level_meaning:
  ja: 本文の体言止め {limit} 文まで
  en: up to {limit} noun-ending sentences in the body
rewrite:
  depth: light
  ja:
    direction: 本文で名詞で止めた文に、文書の文体に合わせた述語（です・ます、または、だ・である）を足してください。見出し、箇条書き、表はそのままにします。
    pairs:
      - before: 次の課題は費用。
        after: 次の課題は費用です。
      - before: 導入は来月から。対象は営業部。
        after: 導入は来月からです。対象は営業部です。
    keep:
      - 見出し、箇条書き、表の体言止め
      - 文書の文体（です・ます、または、だ・である）
    avoid:
      - 文末を「〜となります」「〜になります」に揃えて別の癖を作る
      - 述語を足すときに強める（「大きな課題です」）
