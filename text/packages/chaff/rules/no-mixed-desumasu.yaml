id: no-mixed-desumasu
layer: L3
status: stable
how_to_find: sentence-ending
word_list: polite-ending
extra_word_lists:
  [
    neutral-ending,
    neutral-request,
    neutral-wish,
    notice-phrase,
    asker-heading,
    licence-word,
    set-polite-phrase,
    contact-line-opener,
    declaration-particle,
    takeup-opener,
    quote-label,
  ]
requires: [pos]
languages: [ja]
severity: info

name:
  ja: 文末の調子が混ざっている
  en: Mixed sentence-ending register

why:
  ja: ですます調とである調が混ざると、読み手は「誰に向けた文書か」を掴み損ねます。どちらが正しいかではなく、1 つの文書で揃っているかの問題です。
  en: Mixing polite and plain endings leaves the reader unsure who the document addresses. Neither register is wrong; consistency within one document is the point.

message:
  ja: この文だけ他と文末の調子が違います（本文の中で {count} 文）
  en: "This sentence's ending register differs from the rest ({count} in the body text)"

# 数えるのは、文が属するまとまりの中。message は本文、list は箇条書き 1 つ（番号で始まる段落の並びも）。
messages:
  list:
    ja: この文だけ他と文末の調子が違います（この箇条書きの中で {count} 文）
    en: "This sentence's ending register differs from the rest ({count} in this list)"

how_to_fix:
  ja: 多いほうに揃えてください。少数派のほうを直すのが、いちばん手数が少なくて済みます。
  en: Match the majority. Rewriting the minority is the smallest change.

# 少数派が何文までなら「混在」と見るか。これを超えたら、混在ではなく別の文体と判断して黙る。
levels: { strict: 5, normal: 3, relaxed: 1 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."
sources: [yasashii-nihongo-2020, koyobun-2022, jtf-style-guide]

group: consistency
summary:
  ja: 「です・ます」の中に「だ・である」が混ざった文
  en: A Japanese sentence whose polite or plain ending differs from the rest
example:
  ja:
    before: |
      新しい料金は来月から始まります。請求書の形式も変わります。支払いの期限は月末です。古い料金は三月で終わる。
    after: |
      新しい料金は来月から始まります。請求書の形式も変わります。支払いの期限は月末です。古い料金は三月で終わります。

not_flagged:
  ja: どちらの調子が正しいかは決めません。多いほうに揃っていない、少ないほうの文だけを指します。本文と箇条書きは別々に数えます。箇条書きの中の少ないほうが文書全体では多いほうなら、その文は指しません。項目や段落の頭の太字の札（「- **速く書ける。** 説明です。」の「速く書ける。」）は見出しと同じく文に数えません。免責や変更の予告を書いた段落（「…ご了承ください。」）が、2 文以上すべて文書の多いほうと違う同じ調子でそろっているときも、本文とは別の決まり文句として数えません。読み手の相談や質問を載せる節（見出しが「【相談事例等】」「ご質問内容」）の文も、尋ねた人の言葉のままなので数えません。文書の最後に掲載先が付けた利用条件の断り書き（ライセンスの名前と条件の URL を書いた短い段落）も数えません。札を付けて引いた言葉（「例：」「Q:」で始まる文、「用例」だけの段落の下の段落）、「■ 調査目的」のような印付きの札の行の下の記入欄の値、〒や「電話：」の行がある問い合わせ先の段落、一つの文の中に「？」で並べて引いた問い（…一覧か？順序付きか？などです。）、一番上の見出し（#）が二つ以上ある文書で、その見出しの下の 2 文以上がみな文書の多いほうと違う同じ調子でそろった部分（通達の後ろに付いた、ページの説明）も数えません。数えたうえで指さないのは、丁寧な形でしか言わない挨拶（お疲れ様でした。）、相手への願い（信じてほしい。）、条件だけで問う文（…だったら？）、演説で主語を言わずに決意を言い切る文（戦争の惨禍を、二度と繰り返さない。）、次の文が「そんな」「こんな」「これだけで」で受ける場面や行いの書き出し（PDFが送れない。そんなときは…）、「！」で終わる叫び（わかるかっ！）、※で始まる行の注記、文で終わらない行の塊に前後を挟まれた表のセル（制限なし。）です。
  en: Neither register is called right; only the sentences in the minority are pointed at. The body and each list are counted apart, and a sentence in a list's minority is left alone when its register is the document's majority. A bold label that opens an item or a paragraph and is followed by more text on its line is a heading, not a sentence. A paragraph of disclaimer or notice wording (…ご了承ください。) whose two or more sentences all share the register the rest of the document does not use is boilerplate in its own voice and is not counted. Nor are the sentences of a section whose heading names what a reader asked (【相談事例等】, ご質問内容), since they quote the asker in their own words. Nor is a licence notice the publisher appends at the end (a short closing paragraph that names a licence and links to its terms). Nor are words quoted under a label (a sentence opening with 例： or Q:, the paragraph under a lone 用例), the value under a marked field label (■ 調査目的), a contact block (a paragraph with a 〒 or 電話： line), questions run together inside one sentence (…一覧か？順序付きか？などです。), or, in a document with two top-level (#) headings or more, a part under one of them whose two or more sentences all share the register the rest of the document does not use (a page's note about the directive it carries). Counted but never pointed at are a greeting said only politely (お疲れ様でした。), a wish to others (信じてほしい。), a question that gives only a condition (…だったら？), a speaker declaring a resolve without a subject in a speech (戦争の惨禍を、二度と繰り返さない。), a scene-setting opener the next sentence takes up with そんな, こんな or これだけで, a cry that ends in an exclamation mark (わかるかっ！), a note on a line opening with ※, and a table cell set out between runs of lines that do not end as sentences (制限なし。).
level_meaning:
  ja: 少ないほうの調子の文が {limit} 文以下のとき、それを指摘
  en: reported when the minority register has {limit} sentences or fewer
