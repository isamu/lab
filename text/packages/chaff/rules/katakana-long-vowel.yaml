id: katakana-long-vowel
layer: L3
status: experimental
how_to_find: katakana-long-vowel
# 語は形態素解析で取る。複合語の中の「ユーザー」も一語として見る。品詞が無ければ動かない。
requires: [pos]
# ending: keep が読む、辞書が「ー」付きで知る語の印。この rule が動くときだけ lang-ja が辞書に聞く。
token_features: [LongVowelEnding]
languages: [ja]
severity: warning

name:
  ja: カタカナ語の語末の「ー」がそろっていない
  en: The final ー of katakana words is inconsistent

why:
  ja: 「コンピューター」と「コンピュータ」のように、カタカナ語の語末の「ー」は付ける書き方と省く書き方があります。どちらも正しく、困るのは一つの文書の中で混ざることです。読み手は別のものかと迷い、検索でも片方を取りこぼします。設定が無ければ、同じ語が両方で書かれた所だけを指摘し、違う語どうし（サーバーとブラウザ）は比べません。options の ending を drop か keep にすると、決めた書き方に合わない語をすべて指摘します。音は語末の「ー」を除いて「コ・ン・ピュ・ー・タ」で 5 音と数えます（小さい「ャュョァィゥェォ」は前の字と合わせて 1 音、「ッ」「ン」と語中の「ー」は 1 音ずつ。JIS Z 8301:2011 表 G.3 の数え方）。辞書が固有名詞と知っている語（ディズニー）と、chaff.yaml の names に並べた名前は見ません。
  en: A katakana loanword can be written with or without its final long-vowel mark (コンピューター / コンピュータ). Both are right; what reads badly is mixing them in one document, which makes a reader wonder whether they differ and makes a search miss one. With no setting chaff points only at a word written both ways, and does not compare different words (サーバー and ブラウザ). Setting ending under options to drop or keep points at every word written the other way. Morae are counted before the final ー, as コ・ン・ピュ・ー・タ, five (a small ャュョァィゥェォ joins the kana before it; ッ, ン and a ー inside the word are one each), as JIS Z 8301:2011 Table G.3 counts. Words the dictionary knows as proper nouns (ディズニー) and the names under names in chaff.yaml are left alone.

message:
  ja: 「{matched}」は語末の「ー」がほかと違います（「{preferred}」）
  en: 'The final ー of "{matched}" differs from the rest ("{preferred}")'

messages:
  same-word:
    ja: 「{matched}」と「{preferred}」が混ざっています（この語は {of} 回のうち {count} 回が「{matched}」）
    en: '"{matched}" and "{preferred}" are both used ({count} of {of} are "{matched}")'
  drop:
    ja: 「{matched}」は語末の「ー」を省いて「{preferred}」と書きます（{min_morae} 音以上の語）
    en: 'Write "{preferred}", without the final ー ({min_morae} morae or more)'
  keep:
    ja: 「{matched}」は語末の「ー」を付けて「{preferred}」と書きます
    en: 'Write "{preferred}", with the final ー'

how_to_fix:
  ja: 「{preferred}」に直してください。どちらに寄せるかチームで決めているなら、chaff.yaml の options で ending を決めておくと、この文書の多いほうではなく、決めた書き方で見ます。製品名など、そのままにすべき語は options の except か names に並べます。
  en: Change it to "{preferred}". If the team has decided which way, set ending under options in chaff.yaml, and chaff checks against that instead of the document's usual way. List a word that must stay as it is (a product's name) under except in options, or under names.

placeholders:
  matched:
    ja: 見つけた語
    en: the word found
  preferred:
    ja: 直した書き方
    en: the other way of writing it

# 何語違えば指摘するか。1 は「1 語でも違えば」。
levels: { strict: 1, normal: 1, relaxed: 3 }

options:
  ending:
    kind: choice
    default: consistent
    about:
      ja: 語末の「ー」をどちらに寄せるか
      en: Which way the final ー goes
    choices:
      consistent:
        ja: 決めない。文書の中でそろっているかだけを見る
        en: No side taken; only checks that the document is consistent
      drop:
        ja: min_morae 音以上の語の、英語の -er、-or、-ar に当たる語末の「ー」（ア段の字の後ろ）を省く（電子情報通信学会、JIS Z 8301:2011 まで）
        en: Drop the final ー that stands for English -er, -or, -ar (after a kana of the ア row) on words of min_morae morae or more (IEICE; JIS Z 8301 up to 2011)
      keep:
        ja: 語末の「ー」を付ける（文化庁「外来語の表記」、JIS Z 8301:2019）。「ー」の無い語は、辞書が「ー」付きで知っている語（メモリ）か、文書がほかで「ー」付きで書く語だけを見る
        en: Keep the final ー (the Agency for Cultural Affairs' 外来語の表記; JIS Z 8301:2019). A word without one is checked only when the dictionary knows it with one (メモリ) or the document writes it with one elsewhere
  min_morae:
    kind: count
    default: 2
    about:
      ja: 何音以上の語を見るか。語末の「ー」は数えない（コンピューターは 5 音、カバーは 2 音、カーは 1 音）
      en: The shortest word checked, in morae before the final ー (コンピューター is five, カバー two, カー one)
  except:
    kind: words
    default: []
    about:
      ja: 見ない語。どちらの書き方で並べても、両方の書き方が外れる
      en: Words left alone; listing either way of writing one exempts both

use_for: [business, blog, technical, legal, docs, academic, literature, speech]
sources: [koyobun-2022, gairaigo-1991, jis-z8301-2019, jtf-style-guide]

group: consistency
summary:
  ja: カタカナ語の語末の「ー」を、同じ語で付けたり省いたりしている所（コンピューターとコンピュータ）。options で省く・付けるを決めることもできます
  en: A katakana word written both with and without its final ー in one document (コンピューター and コンピュータ); options can set which way
example:
  ja:
    before: |
      新しいコンピューターを買いました。古いコンピュータは来月捨てます。
    after: |
      新しいコンピューターを買いました。古いコンピューターは来月捨てます。

not_flagged:
  ja: 違う語どうし（サーバーとブラウザ）は比べません。「ー」の前が 1 音の語（カー）、辞書が固有名詞と知っている語、chaff.yaml の names に並べた名前も見ません。「ー」を付けると別の語になる語（知ってるフリ／フリー、タブ／タブー、ベタ／ベター）は、語彙表 long-vowel-distinct に並べたものを同じ語として比べず、keep でも「ー」を足させません。drop は ュー・エー・イーなどで終わる語（メニュー、グレー、コピー）を見ません。
  en: Different words (サーバー and ブラウザ) are not compared. Words of one mora before the final ー (カー), words the dictionary knows as proper nouns and the names under names in chaff.yaml are left alone. A word that becomes another word with a final ー (フリ and フリー, タブ (tab) and タブー (taboo), ベタ and ベター) is not compared, nor asked for a ー by keep, when it is in the long-vowel-distinct word list. drop leaves words ending in ュー, エー, イー and the like alone (メニュー, グレー, コピー).
level_meaning:
  ja: 違う書き方の語が {limit} 箇所あれば指摘
  en: reported once {limit} words go the other way
