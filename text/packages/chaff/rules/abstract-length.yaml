id: abstract-length
layer: L3
status: experimental
how_to_find: abstract-length
severity: info

name:
  ja: 要旨が長すぎる、または無い
  en: Abstract too long, or missing

why:
  ja: 読み手は要旨だけを読んで、本文を読むかを決めます。要旨が長すぎると、その判断に本文と同じだけ時間がかかり、投稿先の字数の上限も超えがちです。節を立てた論文に要旨が無いと、読み手は本文を読み進めないと何の研究かが分かりません。要旨は、「要旨」「抄録」「Abstract」の見出しの下の文、それだけを書いた行の次の段落、または段落の頭の「要旨：」「【要旨】」の後ろの文です。和文の論文の英文の Abstract は、英語の語数で測ります。
  en: 'Readers decide from the abstract alone whether to read the paper. An abstract that runs long takes as much time as the paper to judge, and tends to exceed the venue''s word limit. A paper with sections but no abstract makes the reader read on before learning what the study is. The abstract is the text under an "Abstract" heading, the paragraph after a line that says only "Abstract", or the text after "Abstract:" at the head of a paragraph. The Japanese abstract (要旨) of a bilingual paper is measured in characters.'

message:
  ja: 要旨が長すぎます
  en: The abstract is too long

messages:
  chars:
    ja: 要旨が {count} 字あります（{limit} 字まで）
    en: The abstract has {count} characters (up to {limit})
  words:
    ja: 要旨が {count} 語あります（{limit} 語まで）
    en: The abstract has {count} words (up to {limit})
  missing:
    ja: 節を立てた論文ですが、要旨がありません
    en: This paper has sections but no abstract

how_to_fix:
  ja: 要旨は、目的・方法・結果・結論を一、二文ずつに絞ってください。要旨が無ければ、本文の前に「要旨」の節を足します。
  en: Cut the abstract to a sentence or two each for the aim, the method, the results and the conclusion. If there is none, add an "Abstract" section before the body.

levels:
  ja: { strict: 600, normal: 1000, relaxed: 1400 }
  en: { strict: 250, normal: 400, relaxed: 500 }

use_for: [academic, legal, docs, literature, speech]

group: structure
summary:
  ja: 字数（英語は語数）の上限を超える要旨と、節を立てた論文で要旨が無いもの
  en: An abstract over the length limit, or a paper with sections that has no abstract
example:
  ja:
    config: { genre: academic/paper }
    before: |
      # 昼寝と記憶

      ## はじめに

      昼寝が記憶に与える影響を調べた。

      ## 方法

      大学生 40 人に単語を覚えてもらった。
    after: |
      # 昼寝と記憶

      ## 要旨

      大学生 40 人で、昼寝が単語の記憶を助けるかを調べた。

      ## はじめに

      昼寝が記憶に与える影響を調べた。

      ## 方法

      大学生 40 人に単語を覚えてもらった。
  en:
    config: { genre: academic/paper }
    before: |
      # Naps and memory

      ## Introduction

      We studied how naps affect memory.

      ## Methods

      Forty students learned a list of words.
    after: |
      # Naps and memory

      ## Abstract

      With forty students, we tested whether a nap helps them remember words.

      ## Introduction

      We studied how naps affect memory.

      ## Methods

      Forty students learned a list of words.

not_flagged:
  ja: 要旨の有無は、「はじめに」「方法」「結果」「考察」のような論文の節の見出しが二つ以上ある文書だけで見ます。要旨に付けた札（要旨：、【要旨】）は数えません。論文のジャンルでだけ見ます。
  en: 'Whether an abstract is present is checked only in a document with two or more headings that name a paper''s sections (Introduction, Methods, Results, Discussion). The label itself ("Abstract:") is not counted. Only the academic paper genre runs this rule.'
level_meaning:
  ja: 要旨 {limit} 字まで
  en: up to {limit} words in the abstract
rewrite:
  depth: structure
  ja:
    direction: 要旨を、目的・方法・結果・結論をそれぞれ一、二文で言う形に縮めてください。背景の説明や先行研究の紹介は本文に移します。数字は、結論を支える一つか二つだけを残します。要旨が無ければ、本文から目的・方法・結果・結論を抜き出して要旨を書きます。
    pairs:
      - before: 近年、睡眠と記憶の関係については多くの研究が行われており、さまざまな知見が得られてきた。本研究では、そうした流れを踏まえ、昼寝が単語の記憶に与える影響について、大学生を対象として詳しく調べることとした。
        after: 昼寝が単語の記憶を助けるかを、大学生 40 人で調べた。
      - before: 実験の結果、昼寝をした群は、昼寝をしなかった群と比べて、翌日の再生率が高い傾向が見られ、その差は統計的にも意味のあるものであった。
        after: 昼寝をした群は、翌日の再生率が 12 ポイント高かった。
    keep:
      - 本文にある目的・方法・結果・結論
      - 結論を支える数字
    avoid:
      - 本文に無い結果を書く
      - 結論を弱める・強める
  en:
    direction: Shorten the abstract to a sentence or two each for the aim, the method, the results and the conclusion. Move background and earlier work into the body. Keep only the one or two figures the conclusion rests on. If there is no abstract, write one from the aim, method, results and conclusion in the body.
    pairs:
      - before: In recent years, a great deal of research has examined the relationship between sleep and memory, and many findings have been reported. Building on this body of work, the present study set out to examine in detail the effect of naps on word memory in university students.
        after: We tested whether a nap helps forty university students remember words.
      - before: The results of the experiment showed that the group that napped tended to recall more words the next day than the group that did not, and the difference was statistically significant.
        after: Students who napped recalled 12 points more words the next day.
    keep:
      - the aim, method, results and conclusion stated in the body
      - the figures the conclusion rests on
    avoid:
      - stating a result the body does not report
      - softening or strengthening the conclusion
