id: closing-cliche
layer: L2
status: stable
how_to_find: phrase-match
word_list: closing-cliche
uses: [pos]
where: closing
severity: warning

name:
  ja: 定型の結び
  en: Cliched closing

why:
  ja: 「いかがでしたか」で終わる記事は、読者に何も残しません。結びは最後の主張の場所です。
  en: A closing that only thanks the reader leaves nothing behind.

message:
  ja: 「{matched}」で締めています
  en: 'Closes with "{matched}"'

how_to_fix:
  ja: 本文で分かったことのうち、いちばん持ち帰ってほしい 1 つを書いてください。
  en: Name the one thing you want the reader to take away.

levels:
  strict: 1
  normal: 1
  relaxed: 2

use_for: [blog, legal, docs, academic, literature, speech]

group: wording
summary:
  ja: 「いかがでしたか」「参考になれば幸いです」のように、何も残さない決まり文句の結び
  en: A stock closing such as "Hope this helps" that leaves the reader nothing
example:
  ja:
    config: { genre: blog/tech }
    before: |
      ## まとめ

      設定を一行変えるだけで、ビルドが二倍速くなりました。いかがでしたか。
    after: |
      ## まとめ

      設定を一行変えるだけで、ビルドが二倍速くなりました。次は、テストの並列化を試します。
  en:
    config: { genre: blog/tech }
    before: |
      ## Summary

      Changing one line of the settings made the build twice as fast. Hope this helps!
    after: |
      ## Summary

      Changing one line of the settings made the build twice as fast. Next, we will try running the tests in parallel.

not_flagged:
  ja: 最後の節の、終わりの四段落だけを見ます。見出しの無い文書でも同じです。文書の最初の段落と、それより前の本文の「まとめると」は普通のつなぎなので指しません。箇条書きの中も見ません。
  en: Only the last four paragraphs of the last section are checked, with or without headings; the document's first paragraph and "to sum up" earlier in the text are ordinary links and are not reported. List items are not checked.
level_meaning:
  ja: 当てはまる結びが {limit} 箇所あれば指摘
  en: reported once there are {limit}
rewrite:
  depth: light
  ja:
    direction: 決まり文句の結びを消してください。本文の結論がすでに最後にあれば、そこで終えます。無ければ、本文で分かったことのうち持ち帰ってほしい一つを一文で書きます。
    pairs:
      - before: 設定は管理画面の一か所で変えられます。いかがでしたか？参考になれば幸いです。
        after: 設定は管理画面の一か所で変えられます。
      - before: 以上、キャッシュの消し方について解説しました。
        after: キャッシュは、設定を変えるたびに消してください。（本文の結論がこれであるとき）
    keep:
      - 本文の結論
    avoid:
      - 本文に無い結論や呼びかけを足す
      - 「いかがでしたか」を「ぜひ試してみてください」に替える
  en:
    direction: Delete the stock closing. If the piece already ends on its conclusion, stop there; if not, state in one sentence the one thing from the body the reader should take away.
    pairs:
      - before: The setting lives in one place on the admin page. Hope this helps!
        after: The setting lives in one place on the admin page.
      - before: In conclusion, we have explored how to clear the cache.
        after: Clear the cache after every settings change. (when that is what the body found)
    keep:
      - the conclusion the body reached
    avoid:
      - adding a conclusion or a call to action that is not in the body
      - swapping "Hope this helps" for "Give it a try"
