id: closing-cliche
layer: L2
status: stable
how_to_find: phrase-match
word_list: closing-cliche
uses: [pos]
where: closing
severity: warning

name:
  ja: 定型の結び
  en: Cliched closing

why:
  ja: 「いかがでしたか」で終わる記事は、読者に何も残しません。結びは最後の主張の場所です。
  en: A closing that only thanks the reader leaves nothing behind.

message:
  ja: 「{matched}」で締めています
  en: 'Closes with "{matched}"'

how_to_fix:
  ja: 本文で分かったことのうち、いちばん持ち帰ってほしい 1 つを書いてください。
  en: Name the one thing you want the reader to take away.

levels:
  strict: 1
  normal: 1
  relaxed: 2

use_for: [blog, legal, docs, academic, literature, speech]

group: wording
summary:
  ja: 「いかがでしたか」「参考になれば幸いです」のように、何も残さない決まり文句の結び
  en: A stock closing such as "Hope this helps" that leaves the reader nothing
example:
  ja:
    config: { genre: blog/tech }
    before: |
      ## まとめ

      設定を一行変えるだけで、ビルドが二倍速くなりました。いかがでしたか。
    after: |
      ## まとめ

      設定を一行変えるだけで、ビルドが二倍速くなりました。次は、テストの並列化を試します。
  en:
    config: { genre: blog/tech }
    before: |
      ## Summary

      Changing one line of the settings made the build twice as fast. Hope this helps!
    after: |
      ## Summary

      Changing one line of the settings made the build twice as fast. Next, we will try running the tests in parallel.

not_flagged:
  ja: 最後の節の、終わりの四段落だけを見ます。見出しの無い文書でも同じです。文書の最初の段落と、それより前の本文の「まとめると」は普通のつなぎなので指しません。箇条書きの中も見ません。
  en: Only the last four paragraphs of the last section are checked, with or without headings; the document's first paragraph and "to sum up" earlier in the text are ordinary links and are not reported. List items are not checked.
level_meaning:
  ja: 当てはまる結びが {limit} 箇所あれば指摘
  en: reported once there are {limit}
