id: ai-generated-composite
layer: L1
status: experimental
how_to_find: composite
severity: warning

# 単独では何も言えない signal。揃ったときだけ意味がある。spec §20.2。
from:
  - ai-tell
  - rule-of-three
  - section-length-uniformity
  - sentence-rhythm
  - padded-intro
  - closing-cliche
  - no-em-dash
  - contrast-framing
  - stock-transition
  - assistant-residue
  - announcing-opener
  - colon-lead-in
  - ai-structure

name:
  ja: 生成文の特徴がそろっている
  en: Several signals of generated text together

why:
  ja: ここに挙げた特徴は、どれも 1 つでは普通の文章に出ます。同じ文書で 3 つ以上そろったときだけ意味を持ちます。**これでも「AI が書いた」とは言えません。** 読み直す場所の目印です。
  en: Each of these appears in ordinary writing on its own. Only three or more in one document mean anything. **Even then it does not say the text was generated.** It marks a place to reread.

message:
  ja: 「{word}」が同じ文書にそろっています（{count} 種、{limit} 種から）
  en: '"{word}" {count|occurs|occur together} in this document ({count} {count|signal|signals}, {limit} needed)'

how_to_fix:
  ja: 自分が書きたかったことが残っているか、通して読み直してください。個々の指摘を 1 つずつ直すより、段落ごと書き直すほうが早いことがあります。
  en: Read it through and check your own point is still there. Rewriting a paragraph is often faster than fixing each finding.

# 何種そろったら出すか。spec §20.2 は 3。
levels: { strict: 2, normal: 3, relaxed: 5 }

use_for: [blog, business, legal, docs, academic, literature, speech]

group: ai-tells
summary:
  ja: 生成された文章の特徴がいくつも一つの文書にそろっている所（生成だと決めつけはしません）
  en: Several signals of generated text together in one document (a place to reread, not a verdict)
example:
  ja:
    config: { genre: blog/tech, rules: { ai-generated-composite: strict } }
    before: |
      # 在庫管理を見直す

      現代社会において、データは重要な役割を果たすと言えるでしょう。

      - 正確さ
      - 速さ
      - 安さ

      毎日することです。

      - 数える
      - 記録する
      - 見返す

      よくある失敗です。

      - 数え忘れ
      - 記録の漏れ
      - 見返さない
    after: |
      # 在庫管理を見直す

      当社では、在庫の数を毎朝データで確かめてから発注しています。

      - 正確さ
      - 速さ

      毎日することです。

      - 数える
      - 記録する
      - 見返す
      - 月末の棚卸しと突き合わせる

      よくある失敗です。

      - 数え忘れ
      - 記録の漏れ
      - 見返さない
  en:
    config: { genre: blog/tech, rules: { ai-generated-composite: strict } }
    before: |
      # Rethinking stock control

      In today's fast-paced world, data plays a crucial role. Let us delve into why.

      - Accuracy
      - Speed
      - Cost

      Every day we:

      - Count
      - Record
      - Review

      Common mistakes:

      - Missed counts
      - Gaps in the record
      - No review
    after: |
      # Rethinking stock control

      We check stock levels every morning before placing orders.

      - Accuracy
      - Speed

      Every day we:

      - Count
      - Record
      - Review
      - Match against the month-end count

      Common mistakes:

      - Missed counts
      - Gaps in the record
      - No review

not_flagged:
  ja: 特徴が一つだけなら何も言いません。そろっても、生成された文章だとは言いません。読み返す場所の目印です。
  en: One signal alone says nothing. Even several together do not say the text was generated; they mark a place to reread.
level_meaning:
  ja: 特徴が {limit} 種そろえば指摘
  en: reported once {limit} signals occur together
