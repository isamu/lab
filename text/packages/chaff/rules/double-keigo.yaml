id: double-keigo
layer: L3
status: experimental
how_to_find: phrase-match
word_list: double-keigo
uses: [pos]
languages: [ja]
severity: warning

name:
  ja: 二重敬語
  en: Doubled honorific

why:
  ja: 1 つの動詞に同じ種類の敬語を二重にかけた形です。丁寧さは増えず、読み手には不自然に映ります。
  en: The same kind of honorific applied twice to one verb. It does not read as more polite, only as awkward.

message:
  ja: 「{matched}」は敬語が二重になっています
  en: '"{matched}" applies the honorific twice'

how_to_fix:
  ja: どちらか一方にしてください。「おっしゃられました」は「おっしゃいました」で足ります。
  en: Keep one. "Said" with a single honorific is enough.

levels: { strict: 1, normal: 1, relaxed: 2 }

use_for: [business, legal, docs, academic, literature, speech]
off_for:
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  academic: "Science writes in the passive, hedges its claims on purpose (may, suggest) and cites numbers as its evidence."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."

group: wording
summary:
  ja: 「おっしゃられる」のように、同じ種類の敬語を二重にかけた所
  en: A Japanese verb with the same kind of honorific applied twice
example:
  ja:
    before: 部長がおっしゃられたとおり、来週から始めます。
    after: 部長がおっしゃったとおり、来週から始めます。

not_flagged:
  ja: 一覧にある形だけを見ます。一覧にない形は、二重敬語でも指しません。
  en: Only the forms on chaff's list are checked; a doubled honorific not on the list is not reported.
level_meaning:
  ja: 当てはまる形が {limit} 箇所あれば指摘
  en: reported once there are {limit}
