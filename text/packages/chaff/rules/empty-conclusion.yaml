id: empty-conclusion
layer: L4
status: stable
how_to_find: empty-conclusion
severity: warning
uses: [pos]

name:
  ja: 結びに中身がない
  en: Empty conclusion

why:
  ja: 本文を繰り返すだけの結びは、読者に何も残しません。
  en: A closing that only restates the body leaves the reader with nothing.

message:
  ja: "{reason}"
  en: "{reason}"

how_to_fix:
  ja: 本文で分かったことのうち、いちばん持ち帰ってほしい 1 つを書いてください。
  en: Name the one thing you want the reader to take away.

what_to_check:
  ja: |
    文書の結びに、本文の要約以外のものがあること。
    新しい主張、判断、次にすべきこと、読者への問いのいずれかがあればよい。
    本文に書いたことを並べ直しているだけなら、決まりに反する。
  en: |
    The closing must contain something beyond a summary of the body — a new
    claim, a judgement, a next step, or a question to the reader.

levels:
  strict: error
  normal: warning
  relaxed: info

# メール・議事録・プレスリリースの結びは挨拶か連絡先で、判断を書く所ではない。
use_for: [blog, business/report, business/proposal]

group: wording
summary:
  ja: 本文をなぞるだけで、読み手に何も残さない結び（AI に読ませる検査）
  en: A conclusion that only restates the body and leaves the reader nothing (checked by an AI)
example:
  ja:
    before: |
      ## まとめ

      この記事では、ビルドを速くする方法を紹介しました。ビルドを速くすることは大切です。
    after: |
      ## まとめ

      設定を一行変えるだけで、ビルドが二倍速くなりました。次は、テストを並列で動かします。
  en:
    before: |
      ## Conclusion

      This article described how to make the build faster. A fast build is important.
    after: |
      ## Conclusion

      One line of settings made the build twice as fast. Next, we will run the tests in parallel.
