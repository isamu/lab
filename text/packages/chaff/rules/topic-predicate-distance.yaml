id: topic-predicate-distance
layer: L3
status: stable
how_to_find: topic-predicate-distance
requires: [pos]
extra_word_lists: [topic-clause-close, statute-article-opener, topic-adverb]
languages: [ja]
severity: info

name:
  ja: 主題と述語が離れている
  en: Topic far from its predicate

why:
  ja: 日本語の文は述語が最後に来るので、「会議は」と主題を出してから述語までが長いと、読み手は主題を覚えたまま、間の修飾や節を全部読み終えるまで「会議は何なのか」を待つことになります。文の長さが上限に収まっていても、主題が文の頭にあって述語が遠ければ起きます。chaff は文の最初の「名詞＋は」から文の終わりの述語までの字数を数えます（述語を厳密に探すのではなく、文の終わりに置く日本語の形を使った近似です）。鉤括弧で引いたものの中は数えません。
  en: A Japanese sentence puts its predicate last, so after a topic (会議は) the reader waits for everything in between before learning what the topic does. chaff counts the characters from the first noun followed by は to the end of the sentence, where Japanese puts the predicate; it is an approximation, not a parse. Anything quoted in 「」 is not counted.

message:
  ja: 「は」で出した主題から述語まで {count} 字あります（{limit} 字まで）
  en: "{count} characters between the topic (は) and the predicate (limit {limit})"

how_to_fix:
  ja: 主題を述語の近くに動かすか、間に挟んだ説明を別の文にしてください。「会議は、〜のため、〜について、〜した結果、延期になった」は「〜した結果、会議は延期になった」のように。
  en: Move the topic next to the predicate, or take what stands between them into its own sentence.

levels: { strict: 60, normal: 80, relaxed: 100 }

# 法令と契約は、主題の後に要件と例外を挟んでから述語を置く。既定の上限では group の文書の大半に出たので、測って上げた（spec §21.1）。
by_genre:
  legal: { strict: 160, normal: 200, relaxed: 260 }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]
off_for:
  literature: measured by yarn rules:measure

group: readability
summary:
  ja: 「会議は」のように主題を出してから、文の終わりの述語まで長く待たせる文
  en: A Japanese sentence that makes the reader wait long for its verb
example:
  ja:
    before: |
      来週の定例会議は、新しい担当者の紹介と、先月から続いている予算の見直しと、春に予定している本社の移転の準備と、秋の採用計画の確認と、年末の懇親会の段取りについて話し合う必要があるため、二時間に延長します。
    after: |
      来週は、新しい担当者の紹介、先月から続く予算の見直し、春の本社移転の準備、秋の採用計画の確認、年末の懇親会の段取りを話し合います。そのため定例会議は二時間に延長します。

not_flagged:
  ja: 主題（名詞＋は）の無い文、鉤括弧で引いたものの中、上限までの距離は見ません。主題の述語が先の節で閉じる文（「この計画は簡単ではありませんが、…」「〜であって、…」、後ろの節に別の主語がある「〜ではなく、」「〜であるため、」「〜の想定のため、」「〜であり、」（主題との間に別の主題（〜は）が無く、文末がまた繋辞か「〜がある」でないとき。後ろの主語は節を名詞にしたもの（〜することが求められている）でもよく、文末の名詞に「が」の主語が付くとき（〜を図ることが必要である）は繋辞で終わっても）、読点を挟まない「〜は〜で、」「〜であるならば、」「〜にあるところ、」「〜ており、」、受け身で伝える引用「〜だと言われているが」、主題と「〜ますが、」「〜ましたが、」（打ち消しの「〜ませんが、」「〜ませんでしたが、」も）の間に別の主語が無く、その後ろが別の主語（〜が）の節を経て新しい主題（〜は、〜には）に移る文か、直後に名前の新しい主題（〜ましたが、赤澤大臣は…）が立って文末まで続く文、主題が行いを名詞にしたもの（〜することは差し控えますが、…）、主題からそこまでに別の主語が無い「〜ことから、」「〜つつ、」「〜としても、」「〜こととし、」（語は語彙表 topic-clause-close）、述語の後ろに丸数字の番号（③）が来て一行に詰まった箇条の次の項目が始まるところ、「〜のは」の主題が「という」で名詞に掛かる節の中で繋辞の述語を得て、その名詞句が読点で終わるところ（〜来てほしいのは日本であったという調査の結果、…））は、その節の終わりまでを数えます。後ろの節の主語には「〜のほとんどは」も数えます。副詞になる「は」（最後は＝結局のところ。語は語彙表 topic-adverb）は主題と読みません。前に名詞や「の」が付けば（交渉の最後は）主題です。時や場面を言う「は」（今夜は、当日は、〜ときは）の後ろに別の主題があれば、その主題から数えます。時や場面を言う主題（決定後は、普及以前は）は、「〜ますが、」「〜でしたが、」の後ろに別の主語があれば、間に別の主語があってもそこまでを数えます。法令でも契約でもない文書が条文をそのまま載せた文（「第7条 …」、形は語彙表 statute-article-opener）は、書き手が直せる文ではないので数えません。英語の文書には使いません。
  en: Sentences with no topic (noun + は), quotations in 「」, and distances up to the limit are not counted. When the topic gets its own predicate in an earlier clause (〜ではありませんが, 〜であって; 〜ではなく, 〜であるため, 〜の想定のため, 〜であり (when no other topic stands between and the sentence does not end on a copula or 〜がある again; the later subject may be a clause made a noun, 〜することが求められている, and when the final noun has a subject of its own with が, 〜を図ることが必要である, the sentence may end on a copula), 〜は〜で with no comma between, 〜であるならば, 〜にあるところ or 〜ており followed by a clause with its own subject; a passive report 〜だと言われているが; 〜ますが or 〜ましたが (or the negative 〜ませんが, 〜ませんでしたが) with no other subject between the topic and it, followed by a clause with a subject of its own (〜が) and then a new topic (〜は, 〜には), or straight away by a name as a new topic that runs to the end (〜ましたが、赤澤大臣は…), or always when the topic is an act made a noun (〜することは差し控えますが、…); 〜ことから, 〜つつ, 〜としても or 〜こととし with no other subject between the topic and it, from the topic-clause-close word list; a circled number (③) after a predicate, where a list run into one line starts its next item; a 〜のは topic that gets its copula inside a clause という makes a noun's content, when that noun phrase ends at a comma, as in 〜来てほしいのは日本であったという調査の結果、…), the count stops at that clause's end. A later clause's subject may be a part, as in 〜のほとんどは. A は that makes an adverb of the noun before it (最後は, in the end; the words are in the topic-adverb word list) is not a topic; with a noun or の before it (交渉の最後は) it is. When a は that sets the time or the case (今夜は, 当日は, 〜ときは) is followed by another topic, the count starts from that topic. A topic that sets the time or the case (決定後は, 普及以前は) ends at 〜ますが or 〜でしたが when a subject of its own follows, even with another subject between. An article of a statute that a document of another kind quotes as it stands (第7条 …, the forms in the statute-article-opener word list) is not the writer's sentence and is not counted. Not used on English documents.
level_meaning:
  ja: 主題から述語まで {limit} 字まで
  en: up to {limit} {limit|character|characters} between the topic and the predicate
rewrite:
  depth: light
  ja:
    direction: 主題（〜は）を述語の近くに動かすか、主題と述語の間に挟んだ説明を前の文に出してください。
    pairs:
      - before: 来週の定例会議は、新しい担当者の紹介と、先月から続いている予算の見直しと、春に予定している本社の移転の準備と、秋の採用計画の確認と、年末の懇親会の段取りについて話し合う必要があるため、二時間に延長します。
        after: 来週は、新しい担当者の紹介、先月から続く予算の見直し、春の本社移転の準備、秋の採用計画の確認、年末の懇親会の段取りを話し合います。そのため定例会議は二時間に延長します。
      - before: この機能は、利用者が設定画面で通知の頻度や送り先を変えたときに、変更前の設定と変更した日時と変更した人の名前を記録として一週間保存しておき、あとで元に戻せるようにするために使います。
        after: 利用者が設定画面で通知の頻度や送り先を変えたとき、変更前の設定と日時と変更した人の名前を一週間保存し、あとで元に戻せるようにします。この機能はそのために使います。
    keep:
      - 主題と述語の組み合わせ（何が・どうなる）
      - 間に挟んだ条件や理由
    avoid:
      - 間の説明を消す
      - 主題を消して、何の話なのか分からなくする
