id: expletive-construction
layer: L3
status: stable
how_to_find: expletive
requires: [pos]
languages: [en]
severity: info

name:
  ja: 主語を後ろへ押しやる書き出し
  en: Expletive construction

why:
  ja: "There is / It is ... that は、主語を後ろへ押しやって誰が何をするのかを消します。"
  en: '"There is" and "it is ... that" push the subject to the back and drop who does what.'

message:
  ja: '"{word} is ..." の形が文書内に {count} 回あります（{limit} 回まで）'
  en: '"{word} is ..." appears {count} {count|time|times} (limit {limit})'

how_to_fix:
  ja: 主語を前に出してください。"There is a need to review" を "The board must review" に。
  en: Put the subject first. "There is a need to review" becomes "the board must review".

levels: { strict: 1, normal: 3, relaxed: 6 }

use_for: [blog, business, legal, docs, academic, literature, speech]
off_for:
  legal: "Legal drafting repeats its terms and its sentence heads on purpose, puts the actor in the passive (shall be deemed), and joins long noun compounds (個人情報取扱事業者). This rule would only flag the form."
  docs: "A help page repeats its heading in its first line (To upload a file, ...) and states no claims to back up."
  academic: "Science writes in the passive, hedges its claims on purpose (may, suggest) and cites numbers as its evidence."
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."

group: readability
summary:
  ja: 英語で、There is や It is ... that で主語を後ろへ押しやった文が多い所
  en: Many sentences that open with "There is" or "It is ... that", pushing the subject to the back
example:
  en:
    config: { rules: { expletive-construction: strict } }
    before: |
      There is a meeting on Friday to review the budget. It is the finance team that will lead it.
    after: |
      The team meets on Friday to review the budget. The finance team will lead it.

not_flagged:
  ja: 「it is raining」のように that 節を伴わない It is は数えません。
  en: '"It is" without a that-clause ("it is raining") is not counted.'
level_meaning:
  ja: この形の文 {limit} 回まで
  en: up to {limit} such sentences
