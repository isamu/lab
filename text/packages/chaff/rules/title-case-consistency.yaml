id: title-case-consistency
layer: L3
status: experimental
how_to_find: title-case-mix
languages: [en]
severity: info

name:
  ja: 見出しの大文字化が揃っていない
  en: Heading capitalisation is inconsistent

why:
  ja: Title Case と sentence case のどちらが正しいかは決めません。1 つの文書で混ざっていると、見出しの階層が変わったように見えます。文書の題名（先頭にある深さ 1 の見出しが 1 つだけのとき）は名前なので比べません。節の見出しが同数に割れたときだけ、題名の流儀に合わせます。
  en: Neither Title Case nor sentence case is wrong. Mixed within one document, the headings look like they change level. The document's title (a single top-level heading that opens it) is a name and is not compared; when the section headings split evenly, the title's style decides.

message:
  ja: この見出しだけ他と大文字化の流儀が違います（文書の中で {count} 個）
  en: "This heading's capitalisation differs from the rest ({count} in this document)"

how_to_fix:
  ja: 多いほうに揃えてください。
  en: Match the majority.

levels: { strict: 3, normal: 2, relaxed: 1 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: consistency
summary:
  ja: 英語の見出しで、Title Case と sentence case が混ざっている所
  en: Headings that mix Title Case and sentence case
example:
  en:
    before: |
      # User guide

      ## Getting started

      Install the app.

      ## Changing your settings

      Open the menu.

      ## Sharing Files With Your Team

      Press share.
    after: |
      # User guide

      ## Getting started

      Install the app.

      ## Changing your settings

      Open the menu.

      ## Sharing files with your team

      Press share.

not_flagged:
  ja: 文書の題（最初の一番上の見出し）は名前なので比べません。どちらの流儀が正しいかは決めません。
  en: The document's title (the single top-level heading that opens it) is a name and is not compared. Neither style is called right.
level_meaning:
  ja: 少ないほうの流儀の見出しが {limit} 個以下のとき指摘
  en: reported when the minority style has {limit} headings or fewer
