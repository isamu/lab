id: no-nakaguro-parallel
layer: L3
status: stable
how_to_find: middle-dot
# 中黒を含めて 1 語の語（キャッシュ・フロー）。その中黒は並べた項目の切れ目ではないので数えない。
word_list: nakaguro-word
languages: [ja]
severity: info

name:
  ja: 中黒で並べすぎている
  en: Too many items joined by middle dots

why:
  ja: 中黒の並列は 1 組なら読めますが、1 文に何組も入ると、どの項目がどの組に属するのか追えなくなります。実文書では 1 文 4 個までは普通に読めていました。行頭の「・」は箇条書きの印なので数えません。
  en: One run of middle dots reads fine. Several runs in one sentence make it impossible to tell which item belongs to which group. A 「・」 that opens a line is a bullet and is not counted.

message:
  ja: この文に中黒が {count} 個あります（{limit} 個まで）
  en: "{count} middle {count|dot|dots} in this sentence (limit {limit})"

how_to_fix:
  ja: 文を割るか、箇条書きにしてください。組の切れ目がはっきりします。
  en: Use commas, or turn it into a bullet list.

# 実文書の分布から。1 文 4 個までは読める。
levels: { strict: 3, normal: 5, relaxed: 8 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]
off_for:
  literature: "Length, rhythm, repetition and register are the author's choices in literature, and dialogue mixes styles. Only what one work can hold itself to runs: consistent spacing and commas, and numbering without gaps."
  speech/transcript: "A transcript records what was said: its sentences, repeats and register are the speaker's, not the writer's to fix."

group: readability
summary:
  ja: 一つの文に「・」で並べた語が多すぎて、どれとどれが組なのか分からない所
  en: So many items joined by middle dots (・) in one sentence that groups blur
example:
  ja:
    before: 対象は営業・企画・総務・経理・人事・法務の各部と、東京・大阪・名古屋の各拠点です。
    after: |
      対象は次の部と拠点です。

      - 部: 営業、企画、総務、経理、人事、法務
      - 拠点: 東京、大阪、名古屋

not_flagged:
  ja: 行の頭の「・」は箇条書きの印なので数えません。表や箇条書きを変換が一続きにした文（年表の行が年月でつながったもの、＜事業戦略＞・オーナーチェンジ物件への回帰・都市部シェア拡大・…のように句の長さの項目が並ぶもの）も、中黒が項目の印か語の切れ目か読めないので数えません。
  en: A 「・」 at the start of a line is a bullet and is not counted. Nor is a table or a bullet list a converter ran into one sentence (rows of a chronology joined at their dates, or items as long as phrases joined by 「・」), where a dot cannot be told from an item's mark.
level_meaning:
  ja: 一文に中黒 {limit} 個まで
  en: up to {limit} middle dots in a sentence
