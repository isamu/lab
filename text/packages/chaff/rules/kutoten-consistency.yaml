id: kutoten-consistency
layer: L3
status: stable
how_to_find: kutoten-consistency
languages: [ja]
severity: warning

name:
  ja: 句読点の書き方がそろっていない
  en: Japanese commas and periods are mixed

why:
  ja: 読点を「、」と「，」、句点を「。」と「．」のどちらで書くかは、どちらでも読めます（横書きの論文や公用文には「，」があります）。困るのは一つの文書の中で混ざることで、貼り付けた文や別の人が書いた段落が、そこだけ違って見えます。chaff はどちらが正しいかを決めず、読点と句点のそれぞれで、文書の中で少ないほうを指摘します。数の中の「，」「．」（１，０００、３．５）、番号の印の点（１．はじめに、２．確認、(注)１．、イ．ロ．）、一、二文字の英字の印の後ろの点（Ｑ．）、英字の会社の名前の形（CO.，LTD.）、符号を並べる「，」（特許の公報の９ｃ，９ｃ、ａ，ｂ，ｃ）、鉤括弧で引いたものの中と、注の番号で始まる行や URL を含む文（文献や出典の書き方に従う）は数えません。日本語の語の間の半角の「,」（自家用自動車,社用車）は「，」の側に数えます。
  en: Whether Japanese text uses 、 or ， for its commas and 。 or ． for its periods is a choice either way (， is common in horizontal academic and official writing). What reads badly is mixing both in one document, which makes a pasted sentence or another writer's paragraph stand out. chaff does not decide which is right; for commas and for periods separately, it points at whichever the document uses less. Marks inside a number (１，０００, ３．５), after a list number or label (１．はじめに, ２．確認, (注)１．, イ．ロ．), after a one- or two-letter label (Ｑ．), in a company form written in Latin letters (CO.，LTD.), between reference signs (a patent's ９ｃ，９ｃ or ａ，ｂ，ｃ), inside a 「」 quotation, and in a sentence that starts with a note number or holds a URL (a citation follows its own style) are not counted. A half-width "," between Japanese words (自家用自動車,社用車) counts on the ， side.

message:
  ja: 「{mark}」と書いています（この文書はふつう「{usual}」。{of} 箇所のうち {count} 箇所が違う）
  en: '"{mark}" here, where the document usually writes "{usual}" ({count} of {of})'

messages:
  comma:
    ja: 読点を「{mark}」と書いています（この文書はふつう「{usual}」。{of} 箇所のうち {count} 箇所が違う）
    en: 'The Japanese comma is written "{mark}" here, where the document usually writes "{usual}" ({count} of {of})'
  period:
    ja: 句点を「{mark}」と書いています（この文書はふつう「{usual}」。{of} 箇所のうち {count} 箇所が違う）
    en: 'The Japanese period is written "{mark}" here, where the document usually writes "{usual}" ({count} of {of})'

how_to_fix:
  ja: 文書の多いほうの書き方に合わせてください。チームで決めているなら、STYLE.md に書いておくと迷いません。
  en: Match the way the rest of the document does it. If the team has decided, write it in the style guide.

# 何箇所違えば指摘するか。1 は「1 箇所でも混ざっていれば」。
levels: { strict: 1, normal: 1, relaxed: 3 }

use_for: [business, technical, blog, legal, docs, academic, literature, speech]

group: consistency
summary:
  ja: 読点の「、」と「，」、句点の「。」と「．」が、一つの文書の中で混ざっている所
  en: Japanese commas or periods written two ways (、 and ，, 。 and ．)
example:
  ja:
    before: |
      申込書は、窓口で受け付けます。書類は，担当者が確認します。結果は、翌日に知らせます。
    after: |
      申込書は、窓口で受け付けます。書類は、担当者が確認します。結果は、翌日に知らせます。

not_flagged:
  ja: 数の中の「，」「．」（１，０００、３．５）、番号の印の点（１．、(注)１．、イ．）、番号を指す点（3．から5．まで、（1）4．の改正）、「Ｑ．」や行の頭の「A1．」のような英字の印、英字の会社の名前の形（CO.，LTD.）、符号を並べる「，」（９ｃ，９ｃ、ａ，ｂ，ｃ）、「」の中、注の番号で始まる行と URL を含む文は数えません。どちらの書き方が正しいかは決めません。
  en: Marks inside numbers (１，０００, ３．５), after a list number or label (１．, (注)１．, イ．), after a number that is referred to (3．から5．まで, （1）4．の改正), in a letter label (Ｑ．, or A1． at the start of a line), in a company form (CO.，LTD.), between reference signs (９ｃ，９ｃ, ａ，ｂ，ｃ), inside 「」, and in a note or a sentence with a URL are not counted. Neither way is called right.
level_meaning:
  ja: 少ないほうの書き方が {limit} 箇所あれば指摘
  en: reported once {limit} places go against the document's habit
