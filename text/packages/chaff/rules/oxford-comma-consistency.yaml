id: oxford-comma-consistency
layer: L3
status: stable
how_to_find: oxford-comma
languages: [en]
# The list, its items and its conjunction are read on tokens; without them there is nothing to judge.
requires: [pos]
extra_word_lists:
  [
    participle-word,
    example-marker,
    pair-opener,
    sequence-opener,
    enclosing-unit,
    connective-opener,
    clause-conjunction,
    indefinite-article,
    elision-mark,
    open-list-end,
  ]
severity: info

name:
  ja: 並列の読点が揃っていない
  en: Oxford comma use is inconsistent

why:
  ja: 最後の and の前に読点を打つかは、スタイルガイドで割れます。どちらが正しいかは決めません。1 つの文書で混ざっていると、読み手は項目の切れ目を毎回読み直すことになります。
  en: Whether to put a comma before the final "and" is a style-guide split. Neither is wrong. Mixed within one document, the reader re-parses every list.

message:
  ja: この文だけ並列の読点の打ちかたが他と違います（文書の中で {count} 文）
  en: "This list punctuates differently from the rest ({count} in this document)"

how_to_fix:
  ja: 多いほうに揃えてください。
  en: Match the majority.

levels: { strict: 3, normal: 2, relaxed: 1 }

use_for: [blog, business, technical, legal, docs, academic, literature, speech]

group: consistency
summary:
  ja: 英語で、並べた最後の and の前にカンマを打つか打たないかが揃っていない所
  en: Lists that put a comma before the final "and" in some places and not in others
example:
  en:
    before: |
      We sell apples, pears, and plums. We ship to homes, offices, and schools. We accept cash, cards and vouchers.
    after: |
      We sell apples, pears, and plums. We ship to homes, offices, and schools. We accept cash, cards, and vouchers.

not_flagged:
  ja: カンマを打つかどうかは決めません。半々に分かれた文書では、どちらが少ないとも言えないので指しません。郵便番号で終わる住所のあとの and / or（Leeds LS1 4AB, or email）は、住所の読点のあとなので並びとして数えません。最後の読点のあとに前後を空けたダッシュがある and / or（Washington, DC – The Cybersecurity and Infrastructure Security Agency）も、読点はダッシュの前の日付行のものなので数えません。読点のあとの否定（more correct, not cleaner or more elegant）と、順番の語で始まる導入（First, outside a block, …）も並びではありません。主語と述語のあいだに読点で挟んだ例の句（X, such as Y, are excluded and are not…）も並びの項目に数えません。and / or の直前で読点に挟まれ、中に and / or を持つ例の句（gases, such as ozone and carbon dioxide, and the amount）のあとの読点は、句を閉じる読点なので数えません。番号を付けた法典の区分のあとの名前（Title 44, Public Printing and Documents）と、前の項目を限定する句（any other agency or office, in accordance with law or as directed）の中の and / or も数えません。but で始まる節（If you need help, but it’s not a priority, add it and bring it up）、文頭のつなぎの語（However,）、不定冠詞と形容詞だけの語（A simple, minimalist palette / Neat, a flexible and lightweight grid）、目的語を後ろに残した前置詞（impose conditions upon, certain transfers / on or before May 1）は並びの項目ではありません。並びがその先も続くなら（and so forth まで続く並びも）、途中の項目の中の and / or は最後の継ぎ目ではありません（counseling and financial literacy, commercial conversions, and support）。読点なしで同じ接続詞を重ねた並び（questions and issues and use cases）と、省略の印（... や * * *）を含む引用の中の並びも数えません。動詞と目的語のあいだに読点で挟んだ前置詞の句（received, at its most recent examination, a rating）は並びの項目ではなく、並びの前置詞を最後の項目で言い直したもの（at A, B, C and D campgrounds, and at E）は同じ並びの続きです。題名を文の書き方で並べた所（The bridge witch, The law of finance and regulation, …）の、小文字の語が続く and / or は題名の中のものです。
  en: Whether to use the comma is not decided. A document split evenly has no minority and is not reported. An and / or right after a postal address closed by its postcode ("Leeds LS1 4AB, or email us") follows the address's commas and is not counted as a list, and neither is one after a spaced dash that follows the last comma (a dateline such as "Washington, DC – The Cybersecurity and Infrastructure Security Agency"). Nor is a contrast after a comma ("more correct, not cleaner or more elegant") or an introduction opened by a sequence word ("First, outside a block, …"), and an example phrase set off by commas between a subject and its predicate ("X, such as Y, are excluded and are not…") is not counted as an item. A comma that closes an example phrase holding its own and / or just before the and ("gases, such as ozone and carbon dioxide, and the amount") closes the aside and is not counted. Nor is an and / or inside the name after a numbered division of a code ("Title 44, Public Printing and Documents") or inside a phrase that qualifies the item before it ("any other agency or office, in accordance with law or as directed"). A clause opened by but ("If you need help, but it’s not a priority, add it and bring it up"), a word tying the sentence to the last one ("However,"), an indefinite article with only adjectives ("A simple, minimalist palette" / "Neat, a flexible and lightweight grid") and a preposition left waiting for its object ("impose conditions upon, certain transfers" / "on or before May 1") are not items. When the list goes on past an and / or, including to "and so forth", that and / or is inside an item, not the last joint ("counseling and financial literacy, commercial conversions, and support"). A run that repeats the conjunction without commas ("questions and issues and use cases") and a list inside a quotation that marks an omission (... or * * *) are not counted either. A prepositional phrase set off by commas between a verb and its object ("received, at its most recent examination, a rating") is not an item, a last item that repeats the list's preposition ("at A, B, C and D campgrounds, and at E") continues the same list, and in a list of titles written in sentence case ("The bridge witch, The law of finance and regulation, …") an and / or followed by a lower-case word belongs to a title.
level_meaning:
  ja: 少ないほうの打ち方が {limit} 箇所以下のとき指摘
  en: reported when the minority style appears {limit} times or fewer
