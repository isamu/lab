id: statute

name:
  ja: 法令
  en: Statute

why:
  ja: 法令は条・項・号の番地を漢数字で書き（第二十二条第二項）、各号・及び・本文のような語で番地をつなぎます。番地は割れない一つの単位で、漢字の連なりとして数えません。
  en: A statute writes its addresses in kanji numerals (第二十二条第二項) and joins them with words such as 各号, 及び or 本文. An address is one unit that cannot be broken up, and is not counted as a run of kanji.

# 設定（chaff.yaml の profile / by_path）が無いときに、内容から選ぶ。この形の行が min_lines 行以上あれば法令として読む。
detect:
  ja:
    line: "^第[〇一二三四五六七八九十百千]+条(?:の[〇一二三四五六七八九十百千]+)*[　 ]"
    min_lines: 3

ja:
  # 定義した語を括弧に入れるのは、語そのものを指すとき（「株主」とあるのは「社員」と読み替える、「個人情報」の定義）。
  # 定義のあとの括弧を、定義し直しや付け忘れとして指さない（defined-term-form）。
  quote_mentions_term: true
  # 番地の書き方。第 + 漢数字 + 単位、枝番号（の二）が続いてもよい。
  # 「前二項」「前三条」は直前の二つの項・三つの条を指す番地で、数量ではない。「前二年」は期間なので書かない。
  addresses:
    - "第[〇一二三四五六七八九十百千]+[条項号章節款目編](?:の[〇一二三四五六七八九十百千]+)*"
    - "前[〇一二三四五六七八九十百千]+[条項号章節款目編]"
  # 番地と番地のあいだ、番地の後ろに付く語。
  connectives: [各号, 各項, 及, 又, 若, 並, 中, 本文, 前段, 後段, 但書, 同条, 乃至]
  # 番地の並びのすぐ後ろに来てよい文字。漢字が続けば、番地ではなく普通の語（第一条件、第五条中央銀行、前二項目標）。
  address_end: "[^\\p{Script=Han}]|$"
  # 条の見出しは、条の前の行に括弧だけで書く（「（解雇の予告）」）。括弧の中が、すぐ次の条の見出しになる。
  caption: "^[ \\t\u3000]*[（(]([^（）()]{1,40})[）)][ \\t\u3000]*$"
  # 古い法令は第 2 項以降に番号を振らず、全角空白で字下げした行を新しい項（深さ 2）にする。
  # 条の行に本文が続く条（「第三十四条　使用者は、…。」）の中だけ。契約書の「第1条（目的）」の次の字下げの行は、第 1 項の本文。
  unnumbered: { indent: "\u3000", inside: article, depth: 2 }
  # 書いた場所から番地が決まる参照（前条・次項・同号・本条・前各項・前二項・前条第二項）。
  relative:
    before: [前]
    after: [次]
    same: [同]
    current: [本]
    every: [各]
    count: "[〇一二三四五六七八九十百千]+"
    # 単位の語と、lang-ja が付ける木の深さ（編 -2・章 -1・節 0・条 1・項 2・号 3）。
    units: { 編: -2, 章: -1, 節: 0, 条: 1, 項: 2, 号: 3 }
    suffix_prefix: 第
    # 法令は第 1 項に番号を振らない。
    implicit_first: 項
    # 漢字の後ろの「前条」は語の一部（事前条件）。後ろの決まりは address_end と connectives を使う。
    not_after: "\\p{Script=Han}"
    # 読み替え（「『前条』とあるのは『…』と読み替える」）の括弧の中の前条・同項は、読み替える先の文の言葉。
    # 中の「第三条」も読み替える先の法令の番地なので、この文書の木では引かず、document の名前の文書を指す。
    substitution: { open: 「, close: 」, after: [とあるのは], before: [とあるのは, とあるのは、], document: （読み替えの中） }
    # 条を書かない「第一項」「第二号」は、書いた条・項の中を指す。
    inside: [項, 号]
    # 並びをつなぐもの（正規表現）。「第三十三条第七項若しくは第九項」の「第九項」は、前の参照（第三十三条）の続き。
    # 号の下の「イ」「ロ」と枝番号の「の二」も、並びの途中に挟まる番地の一部。
    joiners:
      - 及び
      - 並びに
      - 若しくは
      - 又は
      - から
      - まで
      - ただし書
      - 、
      - "[イロハニホヘトチリヌルヲワカヨタレソツネナラム]"
      - "の[〇一二三四五六七八九十百千]+"
    # 並びの途中に挟まる括弧書き。
    aside: { open: （, close: ） }

en:
  # A statute quotes a defined term to talk about the term itself ("controller" has the same meaning as in Part 3,
  # the definition of "the UK GDPR"), not to define it again (defined-term-form).
  quote_mentions_term: true
