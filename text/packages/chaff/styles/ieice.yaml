# 電子情報通信学会（IEICE）の和文論文誌の書き方。chaff.yaml に style: ieice と書くと使える。
# ここに置くのは、案内が言っていることだけ。案内に無いことは足さない。
#
# 投稿のしおり 2.4 (b) は、用語を文部省「学術用語集 電気工学編」などによるとする。学術用語集は、英語の語末の -er、-or、-ar
# など（ア列の長音）の「ー」を省く書き方をとる（JIS Z 8301:2011 G.6.2.2 の注記）。省くのは、語末の「ー」を除いて 3 音以上の語
# （コンピュータ、レーザ、プリンタ）。2 音以下の語（カー、カバー）は付ける。ュー・エー・イーで終わる語（メニュー、グレー）は見ない。
# 2.4 (d) は、句読点を全角の「．」「，」とする。句読点を見る rule が chaff にまだ無いので、ここでは決めない。
id: ieice

name:
  ja: 電子情報通信学会 和文論文誌
  en: IEICE Transactions (papers in Japanese)

summary:
  ja: 英語の -er、-or、-ar に当たる語末の「ー」を、「ー」を除いて 3 音以上の語では省きます（コンピュータ、プリンタ）。2 音以下の語（カー、カバー）と、ュー・エー・イーで終わる語（メニュー、グレー）は付けたままです。
  en: Drops the final ー that stands for English -er, -or, -ar on words of three morae or more before it (コンピュータ, プリンタ); shorter words (カー, カバー) and words ending in ュー, エー or イー (メニュー, グレー) keep it.

source:
  title:
    ja: 電子情報通信学会「和文論文誌 投稿のしおり」2.4 用字と用語について (b)。用語は文部省「学術用語集 電気工学編」による
    en: IEICE, 和文論文誌 投稿のしおり (submission guide for papers in Japanese), 2.4 (b); terms follow 学術用語集 電気工学編
  url: https://www.ieice.org/jpn/shiori/cs_2.html

rules:
  katakana-long-vowel: normal

options:
  katakana-long-vowel:
    ending: drop
    min_morae: 3
