# Every rule in packages/chaff/rules/, and whether `yarn bench` plants a mistake for it.
# planted: the languages the bench must plant it in, in at least one sample each. `yarn bench` fails when a run
#   plants it in none (no sample qualifies any more), and `yarn test` fails when no mutation plants it in a language.
# not_planted: why no single realistic edit to a sample makes the mistake. A new rule goes in one list or the other.
planted:
  agentless-passive: [ja, en]
  announced-count-mismatch: [ja, en]
  agreement-slip: [en]
  assistant-residue: [ja, en]
  bold-density: [ja, en]
  broken-link: [ja, en]
  closing-cliche: [ja, en]
  contraction-consistency: [en]
  dangling-figure-reference: [ja, en]
  dangling-reference: [ja, en]
  date-order: [ja, en]
  date-range-reversed: [ja, en]
  date-weekday-mismatch: [ja, en]
  double-keigo: [ja]
  double-negative: [ja, en]
  doubled-punctuation: [ja, en]
  doubled-word: [ja, en]
  duplicate-definition: [ja, en]
  duplicate-heading: [ja, en]
  emoji-density: [ja, en]
  fullwidth-alnum-consistency: [ja]
  empty-intensifier: [ja, en]
  empty-section: [ja, en]
  excessive-hedging: [ja, en]
  expletive-construction: [en]
  heading-echo: [ja, en]
  hankaku-kana: [ja]
  heading-level-skip: [ja, en]
  hiragana-fukushi: [ja]
  image-alt-text: [ja, en]
  internal-jargon: [ja, en]
  invisible-character: [ja, en]
  katakana-long-vowel: [ja]
  kutoten-consistency: [ja]
  latin-spacing: [ja]
  max-kanji-continuous: [ja]
  max-paragraph-length: [ja, en]
  max-sentence-length: [ja, en]
  ngram-repetition: [ja, en]
  no-doubled-joshi: [ja]
  no-em-dash: [ja, en]
  no-mixed-desumasu: [ja]
  no-nakaguro-parallel: [ja]
  numbering-gap: [ja, en]
  oxford-comma-consistency: [en]
  padded-intro: [ja, en]
  percent-sum-mismatch: [ja, en]
  preamble-length: [ja, en]
  preferred-term: [ja, en]
  ra-nuki: [ja]
  repeated-conjunction: [ja, en]
  required-sections: [ja, en]
  requirement-smell: [ja, en]
  sasete-itadaku: [ja]
  sentence-initial-conjunction-run: [en]
  space-before-punctuation: [en]
  stray-space: [ja]
  title-case-consistency: [en]
  total-mismatch: [ja, en]
  unbalanced-bracket: [ja, en]
  undefined-acronym: [ja, en]
  unfilled-placeholder: [ja, en]
  url-run-on: [ja]
  vague-figure-reference: [ja, en]
not_planted:
  adverb-overuse: a density over the whole document
  ai-generated-composite: a composite of other signals, with no detector of its own
  ai-tell: a density over the whole document
  announcing-opener: several announcing openers in one document; one is not a mistake
  colon-lead-in: a density over the whole document
  concrete-evidence-density: several sections with no number, code or link; the samples are written with figures
  contrast-framing: a density over the whole document
  cushion-phrase-density: a density over the whole document
  empty-conclusion: L4, judged by chaff test and never run by lint
  paragraph-length-variance: the shape of the whole document, not one mistake
  proper-noun-density: a density over the whole document
  repeated-sentence-head: a run of consecutive sentences sharing their opening words; forcing one changes what the samples say
  requirement-modal: checks nothing until options pick a house rule, and the bench runs with none
  risk-disclosure: L4, judged by chaff test and never run by lint
  rule-of-three: the shape of the whole document, not one mistake
  section-length-uniformity: the shape of the whole document, not one mistake
  sentence-rhythm: the shape of the whole document, not one mistake
  spelling-consistency: the English samples use at most one word with a British or American spelling, so no single edit mixes them
  stock-transition: a density over the whole document
  taigen-dome-in-prose: a count over the whole document; reaching it would rewrite the sample's register
  unqualified-superlative: more than one unqualified superlative in a document is several mistakes, not one
  unsourced-number: L4, judged by chaff test and never run by lint
